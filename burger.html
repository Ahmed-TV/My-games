<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>تحضير البرجر | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px; }
  
  .logo {
    width: 65px; height: 65px; flex-shrink: 0;
    background: linear-gradient(135deg, #f59e0b, #ef4444); 
    border: 4px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; line-height: 1;
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
  }
  .logo b { font-size: 13px; }
  .logo span { font-size: 8px; font-weight: 900; margin-top: 2px; }
  
  h1 { font-size: 22px; line-height: 1.2; color: #facc15;}
  h1 small { display: block; font-size: 11px; color: #fff; letter-spacing: 1px; margin-top: 2px; }
  
  .names { font-size: 15px; color: #cbd5e1; margin-bottom: 10px; font-weight: bold;}
  .names b { color: #facc15; font-size: 17px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin: 5px 0 10px; flex-wrap: wrap; }
  .stat {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 5px 15px; min-width: 80px; text-align: center;
  }
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 4px solid #f59e0b; border-radius: 16px;
    overflow: hidden;
    padding: 10px;
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255, 255, 255, 0.05);
    font-size: 40px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  .order-panel {
    background: #0f172a; border-radius: 12px; padding: 10px;
    text-align: center; margin-bottom: 10px; flex-shrink: 0; z-index: 1;
  }
  .order-title { font-size: 14px; color: #94a3b8; margin-bottom: 5px; }
  .order-items {
    display: flex; flex-direction: column-reverse; align-items: center; gap: 2px;
  }
  .order-item { font-size: 24px; }

  .build-area {
    flex-grow: 1; background: #e2e8f0; border-radius: 12px;
    display: flex; flex-direction: column-reverse; justify-content: center; align-items: center;
    margin-bottom: 10px; padding: 10px; position: relative; z-index: 1;
    border: 2px dashed #94a3b8;
  }
  .build-item { font-size: 35px; animation: pop 0.2s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  .ingredients {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
    z-index: 1; flex-shrink: 0;
  }
  .ing-btn {
    background: #334155; border-radius: 10px; padding: 10px;
    font-size: 30px; text-align: center; cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    user-select: none;
    border: 2px solid #475569;
  }
  .ing-btn:active { transform: scale(0.9); background: #475569; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 5px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>تحضير البرجر<small>AHMED TV BURGER</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div class="stats">
      <div class="stat"><b id="score">0</b><span>الطلبات</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    
    <div class="order-panel">
      <div class="order-title">اطلب البرجر ده:</div>
      <div class="order-items" id="orderItems"></div>
    </div>

    <div class="build-area" id="buildArea"></div>

    <div class="ingredients" id="ingredients"></div>

    <div id="overlay">
      <h2>لعبة تحضير البرجر</h2>
      <p>
        <b>Ahmed TV</b> - جهز البرجر بالترتيب!<br>
        شوف الطلب فوق، ودوس على المكونات بالترتيب
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ الطهي</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const orderItemsEl = document.getElementById('orderItems');
const buildArea = document.getElementById('buildArea');
const ingredientsEl = document.getElementById('ingredients');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let score = 0;
let best = parseInt(localStorage.getItem('burgerBest') || '0');
bestEl.textContent = best;

let currentOrder = [];
let currentBuild = [];
let isRunning = false;
let audioCtx = null;

const INGREDIENTS = {
  'خبز': '🍞',
  'لحمة': '🥩',
  'جبنة': '🧀',
  'خس': '🥬',
  'طماطم': '🍅'
};

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'click') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'success') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'fail') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }
}

function buildIngredients() {
  ingredientsEl.innerHTML = '';
  for (let key in INGREDIENTS) {
    let btn = document.createElement('div');
    btn.className = 'ing-btn';
    btn.textContent = INGREDIENTS[key];
    btn.onclick = () => addIngredient(key);
    ingredientsEl.appendChild(btn);
  }
}

function newOrder() {
  currentOrder = [];
  currentOrder.push('خبز');
  let middleKeys = Object.keys(INGREDIENTS).filter(k => k !== 'خبز');
  let count = 2 + Math.floor(Math.random() * 3);
  for(let i=0; i<count; i++) {
    currentOrder.push(middleKeys[Math.floor(Math.random() * middleKeys.length)]);
  }
  currentOrder.push('خبز');

  orderItemsEl.innerHTML = '';
  currentOrder.forEach(ing => {
    let span = document.createElement('div');
    span.className = 'order-item';
    span.textContent = INGREDIENTS[ing];
    orderItemsEl.appendChild(span);
  });

  currentBuild = [];
  buildArea.innerHTML = '';
}

function addIngredient(key) {
  if (!isRunning) return;
  
  playSound('click');
  
  currentBuild.push(key);
  let item = document.createElement('div');
  item.className = 'build-item';
  item.textContent = INGREDIENTS[key];
  buildArea.appendChild(item);

  let currentIndex = currentBuild.length - 1;
  if (currentBuild[currentIndex] !== currentOrder[currentIndex]) {
    playSound('fail');
    isRunning = false;
    setTimeout(() => {
      endGame("غلط! الترتيب مش صح");
    }, 500);
    return;
  }

  if (currentBuild.length === currentOrder.length) {
    playSound('success');
    score++;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('burgerBest', best);
      bestEl.textContent = best;
    }
    isRunning = false;
    setTimeout(() => {
      isRunning = true;
      newOrder();
    }, 800);
  }
}

function endGame(msg) {
  isRunning = false;
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">🍔</div>
    <h2>${msg}</h2>
    <p>جهزت <b style="color:#facc15;font-size:22px">${score}</b> طلب<br>
    أعلى نتيجة: ${best}<br>
    Ahmed TV بيقولك: حاول تاني!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  score = 0;
  scoreEl.textContent = score;
  isRunning = true;
  buildIngredients();
  newOrder();
}

startBtn.onclick = startGame;
document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
