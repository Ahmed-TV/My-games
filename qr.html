<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>باركود Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at center, #2a1b10 0%, #0a0a0a 100%);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    text-align: center;
    overflow: hidden;
    color: #fff;
  }

  /* عنوان فرعوني فوق */
  .title {
    color: #facc15;
    font-size: 24px;
    font-weight: 900;
    text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
    margin-top: 20px;
    border-bottom: 2px solid #facc15;
    padding-bottom: 10px;
    width: 80%;
  }

  /* الباركود */
  .qr-container {
    background: #fff;
    padding: 15px;
    border-radius: 20px;
    border: 5px solid #f59e0b;
    box-shadow: 0 0 40px rgba(245, 158, 11, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .qr-container img {
    width: 100%;
    max-width: 250px;
    height: auto;
    display: block;
    border-radius: 10px;
  }

  /* الجملة اللي تحت */
  .footer-text {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    line-height: 1.4;
    background: linear-gradient(135deg, #b45309, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    margin-bottom: 30px;
    padding: 0 10px;
  }
  
  .footer-text span {
    display: block;
    font-size: 18px;
    color: #cbd5e1;
    -webkit-text-fill-color: #cbd5e1;
    margin-top: 5px;
  }
</style>
</head>
<body>

  <div class="title">🏆 Ahmed TV 🏆</div>

  <div class="qr-container">
    <!-- الرابط المباشر للباركود اللي أنت رفعته -->
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://ahmed-tv.github.io/My-games/" alt="QR Code">
  </div>

  <div class="footer-text">
    مسابقة أبطال الألعاب<br>والجيمز والفراعنة
    <span>امسح الكود وابدأ التحدي</span>
  </div>

</body>
</html>
