<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة أبطال الألعاب والفراعنة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    /* خلفية فرعونية فخمة */
    background: radial-gradient(circle at center, #3d2b1f 0%, #1a0f0a 100%);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    text-align: center;
    overflow: hidden;
    color: #fff;
    position: relative;
  }

  /* أيقونات الروبوتات والتكنولوجيا المنتشرة في الخلفية */
  .bg-icon {
    position: absolute;
    font-size: 40px;
    opacity: 0.15;
    filter: grayscale(100%) sepia(100%) hue-rotate(350deg) saturate(300%);
    pointer-events: none;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* توزيع الأيقونات */
  .icon1 { top: 10%; left: 5%; animation-delay: 0s; }
  .icon2 { top: 20%; right: 5%; animation-delay: 1s; font-size: 50px;}
  .icon3 { bottom: 30%; left: 10%; animation-delay: 2s; font-size: 45px;}
  .icon4 { bottom: 15%; right: 8%; animation-delay: 0.5s; font-size: 55px;}
  .icon5 { top: 50%; left: 2%; animation-delay: 1.5s; font-size: 30px;}

  /* العنوان الرئيسي */
  .title {
    color: #facc15;
    font-size: 32px;
    font-weight: 900;
    text-shadow: 0 0 15px rgba(250, 204, 21, 0.7), 2px 2px 4px #000;
    margin-top: 20px;
    border: 2px solid #facc15;
    padding: 10px 20px;
    border-radius: 15px;
    background: rgba(0,0,0,0.5);
    box-shadow: inset 0 0 20px rgba(250, 204, 21, 0.2);
    z-index: 2;
  }

  /* حاوية الباركود */
  .qr-container {
    background: #fff;
    padding: 10px;
    border-radius: 25px;
    border: 6px solid #f59e0b;
    box-shadow: 0 0 50px rgba(245, 158, 11, 0.8), inset 0 0 20px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 2;
  }
  
  /* تأثير الإطار الفرعوني حول الباركود */
  .qr-container::before, .qr-container::after {
    content: '👑';
    position: absolute;
    font-size: 30px;
    top: -20px;
    filter: drop-shadow(0 0 10px #facc15);
  }
  .qr-container::before { left: -15px; transform: rotate(-30deg); }
  .qr-container::after { right: -15px; transform: rotate(30deg); }

  .qr-container img {
    width: 100%;
    max-width: 230px;
    height: auto;
    display: block;
    border-radius: 10px;
  }

  /* الكلام اللي تحت */
  .footer-text {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    line-height: 1.4;
    background: linear-gradient(135deg, #f59e0b, #facc15);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
    margin-bottom: 20px;
    padding: 10px;
    z-index: 2;
  }
  
  .footer-text span {
    display: block;
    font-size: 16px;
    color: #cbd5e1;
    -webkit-text-fill-color: #cbd5e1;
    margin-top: 8px;
    background: rgba(0,0,0,0.4);
    padding: 5px;
    border-radius: 10px;
  }
</style>
</head>
<body>

  <!-- أيقونات الروبوتات والتكنولوجيا في الخلفية -->
  <div class="bg-icon icon1">🤖</div>
  <div class="bg-icon icon2">👾</div>
  <div class="bg-icon icon3">🦾</div>
  <div class="bg-icon icon4">⚙️</div>
  <div class="bg-icon icon5">🔮</div>

  <!-- العنوان -->
  <div class="title">أبطال الألعاب والفراعنة</div>

  <!-- الباركود -->
  <div class="qr-container">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://ahmed-tv.github.io/My-games/" alt="QR Code">
  </div>

  <!-- الكلام التحتاني -->
  <div class="footer-text">
    امسح الكود وابدأ التحدي
    <span>عالم الألعاب والروبوتات في انتظارك! 🚀</span>
  </div>

</body>
</html>
