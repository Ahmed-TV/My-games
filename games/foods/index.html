<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ahmed TV - لعبة الأكلات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-y:auto;overflow-x:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:#FFF3E0;display:flex;justify-content:center;padding:4px 8px}
.game{width:100%;max-width:500px;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 18%, #FFF8E1 0%, #FFECB3 28%, #FFE0B2 52%, #FFF3E0 100%);border:4px solid #FF6D00;border-radius:50px 50px 20px 20px;padding:8px;position:relative;box-shadow:0 0 0 6px #FFE0B2, 0 0 0 9px #FF6D00, 0 10px 30px rgba(0,0,0,.25)}
.food-bg{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.food-bg span{position:absolute;font-size:34px;opacity:.22;transform:rotate(-12deg)}
.game>*:not(.food-bg){position:relative;z-index:1}
header{padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.logo-img{width:88px;height:88px;border-radius:50%;border:4px solid #D32F2F;object-fit:cover;background:#fff;margin-bottom:4px}
.brand{font-size:22px;font-weight:900;color:#B71C1C}
.names{font-size:22px;font-weight:900;color:#B71C1C}
.names small{display:block;font-size:16px;color:#D32F2F;font-weight:900}
.type-row{display:flex;gap:5px;width:100%;margin:6px 0;flex-shrink:0}
.type-btn{flex:1;padding:8px 2px;border-radius:10px;border:2px solid #D32F2F;background:#fff;color:#B71C1C;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit}
.type-btn.active{background:#D32F2F;color:#fff}
.progress-wrap{width:100%;height:8px;background:#FFCDD2;border-radius:10px;margin:2px 0;overflow:hidden;flex-shrink:0}
.progress{height:100%;background:linear-gradient(90deg,#D32F2F,#FF8A65);width:0%;transition:width .3s}
.prog-text{text-align:center;font-size:12px;font-weight:800;color:#B71C1C;margin-bottom:4px;flex-shrink:0}
.qbox{background:rgba(255,255,255,.92);border:2px dashed #FF6D00;border-radius:14px;padding:8px;text-align:center;flex-shrink:0;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qicon{font-size:52px}
.qtext{font-size:19px;font-weight:800;color:#B71C1C;margin-top:6px;line-height:1.4}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex-shrink:0;min-height:102px}
.answer{font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#D32F2F,#FF8A65);border:0;border-radius:12px;padding:10px 5px;min-height:44px;cursor:pointer}
.answer.correct{background:#2E7D32}
.answer.wrong{background:#333}
.answer:disabled{opacity:.9}
.feedback{min-height:20px;font-size:12px;font-weight:700;color:#B71C1C;text-align:center;margin:4px 0;flex-shrink:0}
.btn-row{display:flex;gap:7px;flex-shrink:0;background:rgba(255,243,224,.95);padding:6px 0;border-top:2px dashed #FF6D00;margin-top:6px}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:20px;padding:11px 10px;background:#D32F2F;color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:11px 6px;background:#fff;color:#B71C1C;cursor:pointer;font-size:13px}
footer{text-align:center;color:#D32F2F;font-size:11px;margin-top:4px;padding-bottom:4px;flex-shrink:0}
footer a{color:#D32F2F;text-decoration:none;font-weight:700}
</style></head>
<body><div class="game"><div class="food-bg">
<span style="top:2%;left:4%">🍔</span><span style="top:3%;right:5%;font-size:28px">🍕</span><span style="top:14%;left:1%;font-size:26px">🌮</span><span style="top:16%;right:2%">🍟</span><span style="top:32%;left:2%;font-size:30px">🥙</span><span style="top:34%;right:1%;font-size:26px">🍩</span><span style="top:52%;left:1%">🍗</span><span style="top:54%;right:2%;font-size:30px">🌯</span><span style="top:72%;left:2%;font-size:26px">🍰</span><span style="top:74%;right:1%">🍦</span><span style="bottom:12%;left:6%;font-size:28px">🥐</span><span style="bottom:13%;right:6%">🍿</span><span style="bottom:2%;left:38%;font-size:26px">🍪</span><span style="top:8%;left:42%;font-size:24px">🥟</span><span style="top:44%;left:44%;font-size:22px;opacity:.14">🍔</span>
</div>
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">لعبة الأكلات</div><div class="names">أحمد عبدالعزيز<small>Ahmed TV</small></div><button id="soundBtn" style="margin:5px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:6px 18px;background:#fff;color:#B71C1C;cursor:pointer;font-size:12px">الصوت: شغال</button></header>
<div style="display:flex;flex-direction:column">
<div class="type-row"><button class="type-btn active" onclick="setType('الكل',this)">الكل</button><button class="type-btn" onclick="setType('مكون',this)">المكون</button><button class="type-btn" onclick="setType('مدينة',this)">المدينة</button><button class="type-btn" onclick="setType('مع',this)">بيتاكل مع إيه</button></div>
<div class="progress-wrap"><div class="progress" id="prog"></div></div>
<div class="prog-text" id="progText">السؤال 1</div>
<div class="qbox"><div class="qicon" id="qicon">🍔</div><div class="qtext" id="qText">الممبار مكونه الرئيسي إيه؟</div></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback">يلا! اختر الصح</div>
<div class="btn-row"><button class="skipbtn" onclick="skipQ()">تخطي</button><button class="mainbtn" id="nextBtn" disabled>السؤال التالي</button></div>
</div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
const DATA=[{n:"كشري",country:"مصري",ing:"مكرونة وعدس",city:"القاهرة",side:"دقة وشطة"},{n:"فول مدمس",country:"مصري",ing:"فول",city:"القاهرة",side:"عيش بلدي وبيض"},{n:"طعمية",country:"مصري",ing:"فول مدشوش",city:"اسكندرية",side:"عيش بلدي ومخلل"},{n:"ملوخية",country:"مصري",ing:"ملوخية",city:"الصعيد",side:"عيش وفراخ"},{n:"محشي كرنب",country:"مصري",ing:"كرنب ورز",city:"الدلتا",side:"فراخ محمرة"},{n:"محشي ورق عنب",country:"مصري",ing:"ورق عنب ورز",city:"القاهرة",side:"زبادي"},{n:"فتة",country:"مصري",ing:"عيش ولحمة",city:"القاهرة",side:"خل وتوم"},{n:"مسقعة",country:"مصري",ing:"باذنجان",city:"القاهرة",side:"عيش بلدي"},{n:"كبدة اسكندراني",country:"مصري",ing:"كبدة",city:"اسكندرية",side:"عيش فينو وفلفل"},{n:"سجق",country:"مصري",ing:"لحمة مفرومة",city:"القاهرة",side:"عيش وطحينة"},{n:"حواوشي",country:"مصري",ing:"عيش ولحمة",city:"القاهرة",side:"مخلل"},{n:"فسيخ",country:"مصري",ing:"سمك مملح",city:"نبروه",side:"بصل أخضر وليمون"},{n:"رنجة",country:"مصري",ing:"سمك مدخن",city:"القاهرة",side:"بطاطس وليمون"},{n:"بامية",country:"مصري",ing:"بامية",city:"الصعيد",side:"رز وعيش"},{n:"فتير مشلتت",country:"مصري",ing:"دقيق وسمنة",city:"الفيوم",side:"عسل وقشطة"},{n:"أم علي",country:"مصري",ing:"رقاق ولبن",city:"القاهرة",side:"مكسرات وقشطة"},{n:"كنافة",country:"مصري",ing:"كنافة وجبنة",city:"نابلس",side:"شربات"},{n:"بسبوسة",country:"مصري",ing:"سميد",city:"دمياط",side:"شربات وجوز هند"},{n:"قطايف",country:"مصري",ing:"دقيق ومكسرات",city:"القاهرة",side:"شربات"},{n:"زلابية",country:"مصري",ing:"دقيق وعسل",city:"القاهرة",side:"سكر بودرة"},{n:"بلح الشام",country:"مصري",ing:"دقيق وشربات",city:"دمشق",side:"شربات"},{n:"شوربة عدس",country:"مصري",ing:"عدس",city:"القاهرة",side:"عيش محمص وليمون"},{n:"بصارة",country:"مصري",ing:"فول مدشوش",city:"الصعيد",side:"بصل محمر وزيت"},{n:"طاجن بامية",country:"مصري",ing:"بامية ولحمة",city:"الصعيد",side:"رز"},{n:"فراخ مشوية",country:"مصري",ing:"فراخ",city:"القاهرة",side:"طحينة وسلطة"},{n:"حمام محشي",country:"مصري",ing:"حمام وفريك",city:"الدلتا",side:"شوربة"},{n:"مكرونة بشاميل",country:"مصري",ing:"مكرونة ولبن",city:"القاهرة",side:"سلطة"},{n:"جلاش باللحمة",country:"مصري",ing:"جلاش ولحمة",city:"القاهرة",side:"شوربة"},{n:"رقاق باللحمة",country:"مصري",ing:"رقاق ولحمة",city:"القاهرة",side:"شوربة"},{n:"ممبار",country:"مصري",ing:"ممبار ورز",city:"القاهرة",side:"خل ومخلل"},{n:"كرشة",country:"مصري",ing:"كرشة",city:"القاهرة",side:"فتة وخل"},{n:"كشك",country:"مصري",ing:"لبن ودقيق",city:"الصعيد",side:"بصل محمر"},{n:"شوربة لسان عصفور",country:"مصري",ing:"مكرونة وشوربة",city:"القاهرة",side:"ليمون"},{n:"بابا غنوج",country:"مصري",ing:"باذنجان",city:"الشام",side:"عيش بلدي"},{n:"طحينة",country:"مصري",ing:"سمسم",city:"القاهرة",side:"مشويات"},{n:"عجة",country:"مصري",ing:"بيض",city:"القاهرة",side:"عيش وجبنة"},{n:"بيض بالبسطرمة",country:"مصري",ing:"بيض وبسطرمة",city:"القاهرة",side:"عيش بلدي"},{n:"جبنة قديمة",country:"مصري",ing:"جبنة",city:"الصعيد",side:"عيش وطماطم"},{n:"عسل وقشطة",country:"مصري",ing:"عسل وقشطة",city:"الفيوم",side:"فتير"},{n:"بط محمر",country:"مصري",ing:"بط",city:"الدلتا",side:"محشي ورقاق"},{n:"بيتزا",country:"إيطالي",ing:"عجين وجبنة",city:"نابولي",side:"كاتشب"},{n:"برجر",country:"أمريكي",ing:"لحمة وعيش",city:"نيويورك",side:"بطاطس"},{n:"شاورما",country:"سوري",ing:"فراخ وعيش",city:"دمشق",side:"تومية"},{n:"سوشي",country:"ياباني",ing:"رز وسمك",city:"طوكيو",side:"صويا صوص"},{n:"باستا",country:"إيطالي",ing:"مكرونة",city:"روما",side:"جبنة بارميزان"},{n:"كبسة",country:"سعودي",ing:"رز وفراخ",city:"الرياض",side:"سلطة حارة"},{n:"مندي",country:"يمني",ing:"رز ولحمة",city:"حضرموت",side:"شطة"},{n:"طاجين",country:"مغربي",ing:"لحمة وخضار",city:"فاس",side:"خبز"},{n:"فلافل",country:"شامي",ing:"حمص",city:"بيروت",side:"طحينة"},{n:"حمص بالطحينة",country:"شامي",ing:"حمص",city:"بيروت",side:"زيت زيتون"}];
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
let soundOn=true,audioCtx=null;
var _ac={};
function voice(k){if(!soundOn)return;try{if(!_ac[k]){_ac[k]=new Audio('../../sounds/'+k+'.mp3');_ac[k].preload='auto';}var a=_ac[k];a.currentTime=0;var pr=a.play();if(pr)pr.catch(function(){});}catch(e){}}
audioCtx=null;
function getCtx(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
document.addEventListener('pointerdown',()=>{getCtx();});
document.addEventListener('touchstart',()=>{getCtx();});
function tone(f,dur,vol,type,delay,slideTo){if(!soundOn)return;const ctx=getCtx();if(!ctx)return;try{const t0=ctx.currentTime+(delay||0);const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.02);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.08);}catch(e){}}
function noise(dur,vol,delay){if(!soundOn)return;const ctx=getCtx();if(!ctx)return;try{const t0=ctx.currentTime+(delay||0);const len=ctx.sampleRate*dur;const buf=ctx.createBuffer(1,len,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;const g=ctx.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);src.connect(f);f.connect(g);g.connect(ctx.destination);src.start(t0);}catch(e){}}
function playCorrect(){voice('sah');}
function playWrong(){voice('ghalat');}
function playSkip(){tone(600,0.2,0.2,'sine',0,900);}
let curType='الكل',qs=[],idx=0,score=0,correct=0,locked=false;
const HARD_EGYPTIAN=["ممبار","كرشة","فسيخ","بصارة","كشك","حمام محشي","فتير مشلتت","أم علي","بلح الشام","رنجة","كبدة اسكندراني","حواوشي","مسقعة","محشي ورق عنب","طاجن بامية","بط محمر","جبنة قديمة","بيض بالبسطرمة"];
function build(){voice('ebda');qs=[];let seen=new Set();DATA.forEach((c,ci)=>{let allTypes=['مكون','مدينة','مع','عكس'];let types=curType==='الكل'?allTypes:[curType];types.forEach(t=>{let q='',corr='',pool=[],icon='';if(t==='مكون'){q='أكلة '+c.n+' مكونها الرئيسي إيه؟';corr=c.ing;pool=DATA.map(x=>x.ing);icon='🥣';}if(t==='مدينة'){q='أكلة '+c.n+' مشهورة في مدينة إيه؟';corr=c.city;pool=DATA.map(x=>x.city);icon='🏙️';}if(t==='مع'){q='أكلة '+c.n+' بتتاكل مع إيه؟';corr=c.side;pool=DATA.map(x=>x.side);icon='🍽️';}if(t==='عكس'){q='أكلة مكونها الرئيسي '+c.ing+' وبتتاكل مع '+c.side+' تبقى إيه؟';corr=c.n;pool=DATA.map(x=>x.n);icon='🍔';}let key=q+'|'+corr;if(seen.has(key))return;seen.add(key);let others=shuffle([...new Set(pool.filter(x=>x!==corr))]).slice(0,3);if(new Set([corr,...others]).size<4)return;qs.push({q:q,correct:corr,opts:shuffle([corr,...others]),icon:icon,food:c.n});});});let hard=[],egy=[],other=[];qs.forEach(q=>{let isHard=HARD_EGYPTIAN.some(h=>q.q.includes(h)||q.food===h);let foodObj=DATA.find(d=>d.n===q.food);let isEgy=foodObj&&foodObj.country==='مصري';if(isHard)hard.push(q);else if(isEgy)egy.push(q);else other.push(q);});qs=[...shuffle(hard),...shuffle(egy),...shuffle(other)];}
function loadQ(){if(idx>=qs.length){voice(correct>=Math.ceil(qs.length*0.6)?'kesebt':'khesert');document.getElementById('qText').textContent='خلصت الـ '+qs.length+' سؤال!';document.getElementById('feedback').textContent='نتيجتك: '+score+' - صح: '+correct;document.getElementById('answers').innerHTML='';return;}locked=false;let it=qs[idx];document.getElementById('qicon').textContent=it.icon;document.getElementById('qText').textContent=it.q;document.getElementById('prog').style.width=((idx+1)/qs.length*100)+'%';document.getElementById('progText').textContent='السؤال '+(idx+1)+' / '+qs.length;document.getElementById('feedback').textContent='السؤال '+(idx+1)+' من '+qs.length;let ans=document.getElementById('answers');ans.innerHTML='';it.opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>choose(o===it.correct,b,it);ans.appendChild(b);});document.getElementById('nextBtn').disabled=true;}
function choose(ok,btn,it){if(locked)return;locked=true;[...document.getElementById('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===it.correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');});if(ok){playCorrect();score+=10;correct++;document.getElementById('feedback').textContent='صح! +10';}else{playWrong();document.getElementById('feedback').textContent='غلط - الصح: '+it.correct;}document.getElementById('nextBtn').disabled=false;}
function skipQ(){playSkip();if(idx>=qs.length){build();idx=0;loadQ();return;}document.getElementById('feedback').textContent='تخطيت - الصح: '+qs[idx].correct;idx++;setTimeout(loadQ,600);}
function setType(t,btn){document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');curType=t;idx=0;score=0;correct=0;build();loadQ();}
document.getElementById('nextBtn').onclick=()=>{if(!locked&&idx<qs.length)return;idx++;loadQ();};
document.getElementById('soundBtn').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'الصوت: شغال':'الصوت: مطفي';if(soundOn)getCtx();};
build();loadQ();
</script>

</body></html>
