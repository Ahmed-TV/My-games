<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>القطط بتجري ورا بعض | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
    position: fixed; 
    width: 100%;
  }
  
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 5px) 5px env(safe-area-inset-bottom, 5px) 5px;
  }

  .header { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; flex-shrink: 0; padding-bottom: 3px;}
  .logo-img { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #facc15; object-fit: cover; box-shadow: 0 0 10px rgba(250,204,21,0.5);}
  .header-text { text-align: center; }
  .header-text h1 { font-size: 16px; color: #facc15; margin: 0;}
  .header-text .names { font-size: 11px; color: #cbd5e1; font-weight: bold; margin-top: 2px;}
  .header-text .names b { color: #facc15; font-size: 13px;}

  .stats { display: flex; gap: 8px; justify-content: center; margin-bottom: 3px;}
  .stat { background: #1e293b; border-radius: 6px; padding: 1px 8px; min-width: 50px; text-align: center; border: 1px solid #334155;}
  .stat b { display: block; font-size: 12px; color: #facc15; }
  .stat span { font-size: 8px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 600px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 3px solid #f59e0b; border-radius: 12px;
    overflow: hidden;
    padding: 5px;
  }

  .watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255, 255, 255, 0.1); font-size: 40px; font-weight: 900;
    pointer-events: none; z-index: 0; white-space: nowrap;
    letter-spacing: 2px;
  }

  canvas { 
    width: 100%; 
    flex-grow: 1; 
    display: block; 
    z-index: 1; 
    min-height: 0;
    border-radius: 8px;
    background: #a7f3d0; /* لون نعناعي */
  }

  .controls {
    display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; padding: 5px 0 0 0;
    z-index: 3; flex-shrink: 0;
  }
  .ctrl-btn {
    background: #f59e0b; color: #fff; border: 2px solid #b45309; border-radius: 10px;
    font-size: 25px; width: 60px; height: 50px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; user-select: none;
    box-shadow: 0 3px 0 #b45309;
  }
  .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #b45309; background: #d97706; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 8px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <div class="header-text">
        <h1>القطط بتجري ورا بعض</h1>
        <div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>القطط</span></div>
    <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
      <button class="ctrl-btn" id="upBtn">⬆️</button>
      <button class="ctrl-btn" id="downBtn">⬇️</button>
      <button class="ctrl-btn" id="leftBtn">⬅️</button>
      <button class="ctrl-btn" id="rightBtn">➡️</button>
    </div>

    <div id="overlay">
      <h2>القطط بتجري ورا بعض</h2>
      <p>
        <b>Ahmed TV</b> - اجمع القطط!<br>
        كل ما تلمس قطة، هتجري وراك
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ الجري</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let W = 0, H = 0;
let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('catQueueBest') || '0');
bestEl.textContent = best;
let audioCtx = null;

// إعدادات اللعبة
const GRID_SIZE = 20;
let cols, rows;
let catQueue = []; // الصف
let dx = 0, dy = 0;
let food = { x: 0, y: 0 };
let gameSpeed = 150; // سرعة بطيئة
let gameLoop;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'eat') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
  
  cols = Math.floor(W / GRID_SIZE);
  rows = Math.floor(H / GRID_SIZE);
  
  if (!running) {
    draw();
  }
}

function resetGame() {
  catQueue = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}];
  dx = 0; dy = 0;
  score = 0;
  scoreEl.textContent = 0;
  gameSpeed = 150;
  generateFood();
  running = true;
  overlay.style.display = 'none';
  
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, gameSpeed);
}

function generateFood() {
  food = {
    x: Math.floor(Math.random() * cols),
    y: Math.floor(Math.random() * rows)
  };
  
  // تأكد إن الأكل مش على القطة
  if (catQueue.some(c => c.x === food.x && c.y === food.y)) {
    generateFood();
  }
}

function update() {
  if (!running) return;
  
  // حركة القطة الأولى
  if (dx === 0 && dy === 0) return; // واقف لحد ما اللاعب يتحرك
  
  let head = { x: catQueue[0].x + dx, y: catQueue[0].y + dy };
  
  // التحقق من الاصطدام بالحوائط
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
    return endGame();
  }
  
  // التحقق من الاصطدام بنفسه
  if (catQueue.some(c => c.x === head.x && c.y === head.y)) {
    return endGame();
  }
  
  catQueue.unshift(head);
  
  // لو أكل
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    playSound('eat');
    generateFood();
    
    // تسريع بسيط جداً
    if (score % 5 === 0) {
      gameSpeed = Math.max(70, gameSpeed - 10);
      clearInterval(gameLoop);
      gameLoop = setInterval(update, gameSpeed);
    }
  } else {
    catQueue.pop();
  }
  
  draw();
}

function draw() {
  // خلفية
  ctx.fillStyle = '#a7f3d0';
  ctx.fillRect(0, 0, W, H);
  
  // شبكة خفيفة
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  for(let i = 0; i <= cols; i++) {
    ctx.beginPath(); ctx.moveTo(i*GRID_SIZE, 0); ctx.lineTo(i*GRID_SIZE, H); ctx.stroke();
  }
  for(let j = 0; j <= rows; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*GRID_SIZE); ctx.lineTo(W, j*GRID_SIZE); ctx.stroke();
  }

  // القطط
  catQueue.forEach((c, index) => {
    ctx.font = '18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // القطة الأولى أكبر شوية
    let size = index === 0 ? 22 : 18;
    ctx.font = size + 'px Arial';
    ctx.fillText('🐱', c.x * GRID_SIZE + GRID_SIZE/2, c.y * GRID_SIZE + GRID_SIZE/2);
  });

  // الأكل
  ctx.font = '18px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐟', food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2);
}

function endGame() {
  running = false;
  clearInterval(gameLoop);
  playSound('crash');
  
  if (score > best) {
    best = score;
    localStorage.setItem('catQueueBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">💥</div>
    <h2>خبطت!</h2>
    <p>جمعت <b style="color:#facc15;font-size:22px">${score} قطة</b><br>
    أعلى نتيجة: ${best}<br>
    أحمد TV بيقولك: حاول تاني!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = resetGame;
}

// التحكم
document.getElementById('upBtn').addEventListener('click', () => { if(running && dy === 0) { dx = 0; dy = -1; } });
document.getElementById('downBtn').addEventListener('click', () => { if(running && dy === 0) { dx = 0; dy = 1; } });
document.getElementById('leftBtn').addEventListener('click', () => { if(running && dx === 0) { dx = -1; dy = 0; } });
document.getElementById('rightBtn').addEventListener('click', () => { if(running && dx === 0) { dx = 1; dy = 0; } });

document.addEventListener('keydown', (e) => {
  if (!running) return;
  if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
  if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
  if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
  if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
});

startBtn.onclick = resetGame;

window.addEventListener('resize', () => { resize(); if(!running) draw(); });

resize();
draw();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
