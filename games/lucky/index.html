<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حظك اليوم - Ahmed TV</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #080808;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh; /* لحل مشكلة شريط التنقل في الموبايل */
    overflow: hidden;
  }

  #lucky-game {
    width: 100vw;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 15px 10px 25px 10px; /* زيادة المسافة تحت */
    background: radial-gradient(circle, #1a1a1a 0%, #000 80%);
  }

  h2 {
    font-size: 22px;
    text-shadow: 0 0 10px #e040fb, 0 0 20px #00e5ff;
    border: 2px solid #00e5ff;
    border-radius: 12px;
    padding: 6px 15px;
    width: 95%;
    max-width: 400px;
    text-align: center;
  }

  p {
    font-size: 14px;
    color: #e0f7fa;
    margin-top: -5px;
  }

  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 95vw;
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  canvas {
    width: 100%;
    height: auto;
    max-height: 100%;
    object-fit: contain;
  }

  .pointer {
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 30px solid #fff;
    filter: drop-shadow(0 0 10px #00e5ff);
    z-index: 2;
  }

  .bottom-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -10px;
  }

  button {
    background: linear-gradient(#333, #050505);
    color: #fff;
    border: 3px solid #00e5ff;
    border-radius: 25px;
    padding: 12px 20px;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 0 15px #00e5ff;
    cursor: pointer;
    width: 85%;
    max-width: 300px;
    margin-bottom: 5px;
  }

  button:disabled {
    opacity: 0.6;
  }

  #lucky-result {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 10px #e040fb;
    min-height: 25px;
    text-align: center;
    padding: 5px;
    width: 100%;
  }
</style>
</head>
<body>

<div id="lucky-game" dir="rtl">
  <h2>🍀 حظك اليوم 🍀</h2>
  <p>لف العجلة واكتشف بختك!</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="lucky-wheel" width="800" height="800"></canvas>
  </div>

  <div class="bottom-area">
    <button id="lucky-spin">لف العجلة ✨</button>
    <div id="lucky-result">جاهز؟ يلا بينا!</div>
  </div>
</div>

<script>
(function(){
  const root = document.getElementById("lucky-game");
  const canvas = root.querySelector("#lucky-wheel");
  const ctx = canvas.getContext("2d");
  const button = root.querySelector("#lucky-spin");
  const result = root.querySelector("#lucky-result");

  const items = [
    "حظ سعيد اليوم","بختك حلو","يومك جميل","فرحة قريبة",
    "خبر سعيد","مفاجأة حلوة","رزق واسع","بداية جديدة",
    "نجاح وتوفيق","راحة بال","طاقة إيجابية","ضحكة من القلب",
    "فرصة مميزة","أيام أجمل","حظك مبتسم","تفاؤل دائم",
    "مكسب معنوي","صديق مخلص","حب وود","أمل جديد",
    "خطوة ناجحة","راحة نفسية","يوم مميز","بخت سعيد",
    "مفاجأة جميلة","تحقيق أمنية","سعادة قريبة","حظ رائع",
    "تقدم ونجاح","فرحة كبيرة","أخبار حلوة","قلب مرتاح",
    "ابتسامة جميلة","طريق مفتوح","بداية موفقة","يوم مليان خير",
    "فرصة جديدة","توفيق في القادم","راحة وهدوء","أمل وتفاؤل",
    "حظك منور","ضحكة حلوة","لحظة سعيدة","نجمة حظ",
    "صباح جميل","مساء سعيد","خير وبركة","أيام وردية",
    "طاقة حلوة","بختك منور","قوة وإصرار","نجاح قريب",
    "أمنية تتحقق","مفاجأة اليوم","فرحة منتظرة","حظ مضاعف",
    "أحلى الأيام","تفاؤل وسعادة","يوم مشرق","بختك اليوم"
  ];

  const colors = [
    "#9ed9f7","#c5b5f5","#f5b8d1","#b9e6cf",
    "#f8df9b","#a9d9e8","#e2c5f4","#c4dcae"
  ];

  const center = 400, radius = 370;
  const slice = 2 * Math.PI / items.length;
  let rotation = 0, spinning = false;

  function draw() {
    ctx.clearRect(0, 0, 800, 800);

    items.forEach((item, i) => {
      const start = rotation + i * slice - Math.PI / 2;

      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, start + slice);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, 0, 800, 800);
      grad.addColorStop(0, colors[i % colors.length]);
      grad.addColorStop(1, "#252525");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = "#111";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(start + slice / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#111";
      ctx.font = "bold 16px Arial";
      ctx.fillText(item, radius - 15, 0, 180);
      ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(center, center, 382, 0, Math.PI * 2);
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 20;
    ctx.stroke();

    const lights = ["#00e5ff", "#ff4dff", "#fff176", "#69f0ae"];
    for (let i = 0; i < 48; i++) {
      const a = i * Math.PI * 2 / 48;
      const x = center + 380 * Math.cos(a);
      const y = center + 380 * Math.sin(a);

      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fillStyle = lights[i % lights.length];
      ctx.shadowColor = lights[i % lights.length];
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.beginPath();
    ctx.arc(center, center, 110, 0, Math.PI * 2);
    ctx.fillStyle = "#050505";
    ctx.fill();
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 10;
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 20;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 35px Arial";
    ctx.fillText("TV", center, center - 12);
    ctx.fillText("AHMED", center, center + 28);
  }

  draw();

  button.onclick = function() {
    if (spinning) return;
    spinning = true;
    button.disabled = true;
    result.textContent = "العجلة بتلف...";

    const start = rotation;
    const target = start + Math.PI * 2 * (8 + Math.random() * 5);
    const startTime = performance.now();

    function animate(now) {
      const progress = Math.min((now - startTime) / 5500, 1);
      const eased = 1 - Math.pow(1 - progress, 4);
      rotation = start + (target - start) * eased;
      draw();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        const angle = ((rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        const index = Math.floor(((Math.PI * 2 - angle) % (Math.PI * 2)) / slice);

        result.textContent = "🍀 بختك اليوم: " + items[index];
        spinning = false;
        button.disabled = false;
      }
    }
    requestAnimationFrame(animate);
  };
})();
</script>
</body>
</html>
