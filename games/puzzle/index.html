<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لعبة البازل | Ahmed TV</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100svh!important; max-height: 100svh!important; overflow: hidden!important; position: fixed!important; width: 100%; }
  body { font-family: Tahoma, Arial, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 8px 8px 8px 8px; }
  .header { width: 100%; max-width: 450px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
  .logo { width: 55px; height: 55px; flex-shrink: 0; border: 3px solid #fff; border-radius: 50%; display: block; object-fit: cover; }
  h1 { font-size: 22px; line-height: 1.2; }
  h1 small { display: block; font-size: 11px; color: #facc15; letter-spacing: 1px; margin-top: 2px; }
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 10px; }
  .names b { color: #fff; }
  .stats { display: flex; gap: 15px; justify-content: center; margin-bottom: 10px; }
  .stat { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 5px 15px; text-align: center; }
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }
  #game-container { width: 100%; max-width: 350px; aspect-ratio: 1/1; position: relative; background: #1e293b; border: 4px solid #f59e0b; border-radius: 16px; padding: 5px; margin-top: 10px; }
  .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: rgba(255, 255, 255, 0.05); font-size: 30px; font-weight: 900; pointer-events: none; z-index: 0; white-space: nowrap; }
  #board { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; width: 100%; height: 100%; position: relative; z-index: 1; }
  .tile { background: linear-gradient(135deg, #334155, #1e293b); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: 900; color: #facc15; cursor: pointer; transition: transform 0.2s, background 0.2s; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .tile:active { transform: scale(0.95); }
  .tile.empty { background: #0f172a; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); cursor: default; }
  .tile.moving { animation: pop 0.2s ease-out; }
  @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
  #overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 15px; gap: 10px; border-radius: 12px; z-index: 10; }
  #overlay h2 { font-size: 22px; margin-bottom: 5px; }
  #overlay p { line-height: 1.6; font-size: 13px; color: #e2e8f0; margin-bottom: 10px;}
  .btn { background: #f59e0b; color: #000; border: none; padding: 12px 25px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 200px; margin-bottom: 5px; }
  .btn:active { transform: scale(0.95); }
  .btn:hover { background: #d97706; }
  .btn-sec { background: #334155; color: #fff; }
  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 15px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>
  <div class="header">
    <div class="top-row">
      <img src="../../logo.png" alt="Ahmed TV Logo" class="logo">
      <h1>لعبة البازل<small>AHMED TV PUZZLE</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>
    <div class="stats">
      <div class="stat"><b id="moves">0</b><span>الحركات</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>
  <div id="game-container">
    <div class="watermark">أحمد عبدالعزيز<br>Ahmed TV</div>
    <div id="board"></div>
    <div id="overlay">
      <h2>أهلاً بك يا بطل!</h2>
      <p><b>Ahmed TV</b> - رتب الأرقام بالترتيب<br>من 1 لـ 8، وخلي الفراغ في الآخر</p>
      <button class="btn" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>
  <div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a></div>
<script>
function playAhmedVoice(t){ try{ if(!t) return; var file=''; if(t.indexOf('صح')>=0) file='sah.mp3'; else if(t.indexOf('غلط')>=0) file='ghalat.mp3'; else if(t.indexOf('حاول')>=0) file='hawel.mp3'; else if(t.indexOf('كسبت')>=0) file='kesebt.mp3'; else if(t.indexOf('ابدأ')>=0) file='ebda.mp3'; else if(t.indexOf('عاش')>=0) file='ash.mp3'; if(!file) return; var a=new Audio('https://ahmed-tv.github.io/My-games/sounds/'+file); a.play().catch(function(){ var b=new Audio('../../sounds/'+file); b.play().catch(function(){}); }); }catch(e){} }
function speak(t){ try{ playAhmedVoice(t); }catch(e){} }
const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
let tiles = [];
let moves = 0;
let gameActive = false;
let best = parseInt(localStorage.getItem('puzzleBest') || '0');
bestEl.textContent = best;
const solvedState = [1, 2, 3, 4, 5, 6, 7, 8, 0];
function playSound(type) {
  if(type === 'move'){ speak('عاش'); }
  else if(type === 'win'){ speak('كسبت'); }
}
 function renderBoard() {
  boardEl.innerHTML = '';
  tiles.forEach((val, i) => {
    let tile = document.createElement('div');
    tile.className = 'tile' + (val === 0 ? ' empty' : '');
    tile.textContent = val === 0 ? '' : val;
    tile.dataset.index = i;
    tile.addEventListener('click', () => handleTileClick(i, tile));
    boardEl.appendChild(tile);
  });
}
function handleTileClick(index, tileEl) {
  if (!gameActive) return;
  const emptyIndex = tiles.indexOf(0);
  const isAdjacent =
    (index === emptyIndex - 1 && index % 3 !== 2) ||
    (index === emptyIndex + 1 && index % 3 !== 0) ||
    (index === emptyIndex - 3) ||
    (index === emptyIndex + 3);
  if (isAdjacent) {
    tiles[emptyIndex] = tiles[index];
    tiles[index] = 0;
    moves++;
    movesEl.textContent = moves;
    playSound('move');
    renderBoard();
    checkWin();
  }
}
function shuffle() {
  do {
    tiles = [...Array(9).keys()];
    for (let i = tiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
  } while (!isSolvable(tiles) || isSolved());
}
function isSolvable(arr) {
  let inversions = 0;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === 0) continue;
    for (let j = i + 1; j < arr.length; j++) {
      if (arr[j] !== 0 && arr[i] > arr[j]) inversions++;
    }
  }
  return inversions % 2 === 0;
}
function isSolved() {
  return tiles.every((val, i) => val === solvedState[i]);
}
function checkWin() {
  if (isSolved()) {
    gameActive = false;
    playSound('win');
    if (best === 0 || moves < best) {
      best = moves;
      localStorage.setItem('puzzleBest', best);
      bestEl.textContent = best;
    }
    setTimeout(() => {
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div style="font-size:35px">🏆</div>
        <h2 style="color:#10b981">مبروك! رتبت البازل!</h2>
        <p>خلصتها في <b style="color:#facc15;font-size:20px">${moves}</b> حركة<br>
        أحمد TV بيقولك: إنت بطل!</p>
        <button class="btn" id="againBtn">🔄 العب تاني</button>
      `;
      document.getElementById('againBtn').onclick = startGame;
    }, 500);
  }
}
function startGame() {
  overlay.style.display = 'none';
  moves = 0;
  movesEl.textContent = moves;
  gameActive = true;
  shuffle();
  renderBoard();
  speak('ابدأ');
}
startBtn.onclick = startGame;
</script>
</body>
</html>
