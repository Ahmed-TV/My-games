<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لعبة البازل | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 450px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
  
  .logo {
    width: 55px; height: 55px; flex-shrink: 0;
    background: radial-gradient(circle, #fde047, #f59e0b 55%, #b45309);
    border: 3px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #111; line-height: 1;
  }
  .logo b { font-size: 12px; }
  .logo span { font-size: 8px; font-weight: 900; margin-top: 2px; }
  
  h1 { font-size: 22px; line-height: 1.2; }
  h1 small { display: block; font-size: 11px; color: #facc15; letter-spacing: 1px; margin-top: 2px; }
  
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 10px; }
  .names b { color: #fff; }

  .stats { display: flex; gap: 15px; justify-content: center; margin-bottom: 10px; }
  .stat {
    background: #1e293b; border: 2px solid #334155; border-radius: 12px;
    padding: 5px 15px; text-align: center;
  }
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 350px; aspect-ratio: 1/1;
    position: relative; 
    background: #1e293b; border: 4px solid #f59e0b; border-radius: 16px;
    padding: 5px; margin-top: 10px;
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255, 255, 255, 0.05);
    font-size: 30px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    width: 100%; height: 100%;
    position: relative; z-index: 1;
  }

  .tile {
    background: linear-gradient(135deg, #334155, #1e293b);
    border-radius: 12px;
    display: flex; justify-content: center; align-items: center;
    font-size: 40px; font-weight: 900; color: #facc15;
    cursor: pointer; transition: transform 0.2s, background 0.2s;
    user-select: none;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  .tile:active { transform: scale(0.95); }
  
  .tile.empty {
    background: #0f172a;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    cursor: default;
  }

  /* تأثير الحركة */
  .tile.moving { animation: pop 0.2s ease-out; }
  @keyframes pop {
    0% { transform: scale(0.8); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; border-radius: 12px; z-index: 10;
  }
  #overlay h2 { font-size: 22px; margin-bottom: 5px; }
  #overlay p { line-height: 1.6; font-size: 13px; color: #e2e8f0; margin-bottom: 10px;}
  .btn {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px; margin-bottom: 5px;
  }
  .btn:active { transform: scale(0.95); }
  .btn:hover { background: #d97706; }
  .btn-sec { background: #334155; color: #fff; }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 15px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>لعبة البازل<small>AHMED TV PUZZLE</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div class="stats">
      <div class="stat"><b id="moves">0</b><span>الحركات</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">أحمد عبدالعزيز<br>Ahmed TV</div>
    <div id="board"></div>

    <div id="overlay">
      <h2>أهلاً بك يا بطل!</h2>
      <p>
        <b>Ahmed TV</b> - رتب الأرقام بالترتيب<br>
        من 1 لـ 8، وخلي الفراغ في الآخر
      </p>
      <button class="btn" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let tiles = [];
let moves = 0;
let gameActive = false;
let best = parseInt(localStorage.getItem('puzzleBest') || '0');
let audioCtx = null;
bestEl.textContent = best;

const solvedState = [1, 2, 3, 4, 5, 6, 7, 8, 0]; // 0 هو الفراغ

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'move') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'win') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}

// رسم اللوحة
function renderBoard() {
  boardEl.innerHTML = '';
  tiles.forEach((val, i) => {
    let tile = document.createElement('div');
    tile.className = 'tile' + (val === 0 ? ' empty' : '');
    tile.textContent = val === 0 ? '' : val;
    tile.dataset.index = i;
    tile.addEventListener('click', () => handleTileClick(i, tile));
    boardEl.appendChild(tile);
  });
}

// حركة المربع
function handleTileClick(index, tileEl) {
  if (!gameActive) return;
  
  const emptyIndex = tiles.indexOf(0);
  
  // التحقق من إن المربع جوه حدود الحركة (فوق، تحت، يمين، شمال)
  const isAdjacent = 
    (index === emptyIndex - 1 && index % 3 !== 2) || // شمال
    (index === emptyIndex + 1 && index % 3 !== 0) || // يمين
    (index === emptyIndex - 3) ||                   // فوق
    (index === emptyIndex + 3);                     // تحت

  if (isAdjacent) {
    // تبديل الأماكن
    tiles[emptyIndex] = tiles[index];
    tiles[index] = 0;
    moves++;
    movesEl.textContent = moves;
    playSound('move');
    renderBoard();
    checkWin();
  }
}

// خلط الأرقام
function shuffle() {
  do {
    tiles = [...Array(9).keys()]; // 0 to 8
    for (let i = tiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
  } while (!isSolvable(tiles) || isSolved());
}

// التحقق من إمكانية الحل
function isSolvable(arr) {
  let inversions = 0;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === 0) continue;
    for (let j = i + 1; j < arr.length; j++) {
      if (arr[j] !== 0 && arr[i] > arr[j]) inversions++;
    }
  }
  return inversions % 2 === 0;
}

function isSolved() {
  return tiles.every((val, i) => val === solvedState[i]);
}

function checkWin() {
  if (isSolved()) {
    gameActive = false;
    playSound('win');
    
    if (best === 0 || moves < best) {
      best = moves;
      localStorage.setItem('puzzleBest', best);
      bestEl.textContent = best;
    }

    setTimeout(() => {
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div style="font-size:35px">🏆</div>
        <h2 style="color:#10b981">مبروك! رتبت البازل!</h2>
        <p>خلصتها في <b style="color:#facc15;font-size:20px">${moves}</b> حركة<br>
        أحمد TV بيقولك: إنت بطل!</p>
        <button class="btn" id="againBtn">🔄 العب تاني</button>
      `;
      document.getElementById('againBtn').onclick = startGame;
    }, 500);
  }
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  moves = 0;
  movesEl.textContent = moves;
  gameActive = true;
  shuffle();
  renderBoard();
}

startBtn.onclick = startGame;

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });

</script>
</body>
</html>
