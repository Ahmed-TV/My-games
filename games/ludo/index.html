<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اللودو - بنك الألعاب</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none !important;user-select:none !important;-webkit-touch-callout:none !important;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(to bottom,#00c853 0%,#ffe600 20%,#ff9600 40%,#ff0000 60%,#0064ff 80%,#9600ff 100%);background-attachment:fixed;font-family:'Segoe UI',Tahoma,sans-serif;text-align:center;color:#fff;padding:8px 8px 20px 8px;touch-action:manipulation;overflow-x:hidden}
  .top-box{background:#fff;border:3px solid #c40000;border-radius:18px;max-width:520px;margin:0 auto;padding:6px 6px 7px;box-shadow:0 0 15px rgba(0,0,0,.4)}
  .logo{width:62px;height:62px;border-radius:50%;border:3px solid #c40000;object-fit:cover}
  .game-title{font-size:22px;font-weight:900;color:#c40000;margin:2px 0 1px}
  .my-name{font-size:15px;font-weight:900;color:#c40000}
  .bank{font-size:18px;font-weight:900;color:#FF0000;-webkit-text-stroke:1px #FFD700;text-shadow:0 0 8px rgba(255,215,0,.8);margin:1px 0 0}
  .board{background:rgba(255,0,0,0.45);border:3px solid #FFD700;border-radius:16px;max-width:520px;margin:8px auto 0;padding:12px;width:100%}
  .track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:10px 0}
  .cell{aspect-ratio:1;background:rgba(255,255,255,.9);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#333;position:relative;border:2px solid #FFD700;min-height:38px}
  .cell.start{background:#FFD700}
  .cell.home{background:#00c853;color:#fff}
  .cell.finish{background:#c40000;color:#fff}
  .tok{width:26px;height:26px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:14px;position:absolute}
  .tok.my{background:#FF0000;left:2px;top:2px}
  .tok.pc{background:#0064ff;right:2px;bottom:2px}
  .dice{font-size:32px;margin:8px 0;color:#fff}
  .btn{background:#FFD700;color:#000;border:none;padding:13px 22px;font-size:18px;font-weight:900;border-radius:10px;cursor:pointer;margin:5px}
  #msg{font-size:17px;font-weight:900;min-height:24px;margin:6px 0;color:#fff}
  .score{font-weight:bold;font-size:15px;margin-top:6px;color:#fff}
  .sound-btn{background:#fff;color:#c40000;border:2px solid #c40000;padding:8px 14px;font-size:14px;font-weight:900;border-radius:20px;cursor:pointer;margin:4px}
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false">
<div class="top-box">
  <img class="logo" src="../../logo.png">
  <div class="game-title">🎲 اللودو 🎲</div>
  <div class="my-name">Ahmed TV • أحمد عبدالعزيز</div>
  <div class="bank">بنك الألعاب</div>
</div>
<div class="board">
  <div id="msg">دوس ارمي الزهر - انت الأحمر 🔴</div>
  <div class="dice" id="dice">🎲 🎲</div>
  <button class="btn" onclick="roll()">ارمي الزهر 🎲</button>
  <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊 الصوت: شغال</button>
  <div class="track" id="track"></div>
  <div class="score">مكانك: <span id="myPos">البداية</span> | الكمبيوتر: <span id="pcPos">البداية</span> | الدور: <span id="turn">انت</span></div>
  <button class="btn" onclick="location.reload()">لعبة جديدة 🔁</button>
  <div style="font-size:13px;margin-top:6px;">وصل للنهاية الأول عشان تكسب! لو وقفت على نفس مكان الكمبيوتر - هترجعه للبداية!</div>
</div>

<script>
// ===== الأصوات =====
var audioCtx = null;
var soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊 الصوت: شغال' : '🔇 الصوت: مقفول';
}
function beep(freq, dur, type){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = 0.3;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function soundDice(){ beep(300, 0.1, 'square'); setTimeout(function(){ beep(400, 0.1, 'square'); }, 100); setTimeout(function(){ beep(500, 0.15, 'square'); }, 200); }
function soundMove(){ beep(600, 0.15, 'sine'); }
function soundEat(){ beep(800, 0.1, 'sawtooth'); setTimeout(function(){ beep(1000, 0.2, 'sawtooth'); }, 100); }
function soundWin(){ beep(523, 0.2, 'sine'); setTimeout(function(){ beep(659, 0.2, 'sine'); }, 200); setTimeout(function(){ beep(784, 0.2, 'sine'); }, 400); setTimeout(function(){ beep(1046, 0.4, 'sine'); }, 600); }
function soundLose(){ beep(400, 0.2, 'sawtooth'); setTimeout(function(){ beep(300, 0.3, 'sawtooth'); }, 200); }
</script>

<script>
var TOTAL=32, myPos=-1, pcPos=-1, myTurn=true, diceVal=0, canMove=false;
function render(){
  var t=document.getElementById('track'); t.innerHTML='';
  for(var i=0;i<TOTAL;i++){
    var c=document.createElement('div'); c.className='cell';
    if(i===0) c.classList.add('start');
    if(i===TOTAL-1) c.classList.add('finish');
    if(i===16) c.classList.add('home');
    c.textContent = i===0?'ابدأ':i===TOTAL-1?'🏁':i+1;
    if(myPos===i){ var m=document.createElement('div'); m.className='tok my'; m.textContent='🔴'; c.appendChild(m); }
    if(pcPos===i){ var p=document.createElement('div'); p.className='tok pc'; p.textContent='🔵'; c.appendChild(p); }
    c.onclick=function(idx){ return function(){ if(myTurn && canMove) moveMy(idx); }; }(i);
    t.appendChild(c);
  }
  document.getElementById('myPos').textContent = myPos===-1?'البداية':myPos===TOTAL-1?'النهاية 🏁':(myPos+1);
  document.getElementById('pcPos').textContent = pcPos===-1?'البداية':pcPos===TOTAL-1?'النهاية 🏁':(pcPos+1);
  document.getElementById('turn').textContent = myTurn?'انت':'الكمبيوتر';
}
function roll(){
  if(canMove){ document.getElementById('msg').textContent='العب الزهر اللي معاك الأول - دوس على مكانك!'; return; }
  soundDice();
  var d1=Math.floor(Math.random()*6)+1, d2=Math.floor(Math.random()*6)+1;
  diceVal=d1+d2;
  document.getElementById('dice').textContent='🎲 '+d1+'  🎲 '+d2+' = '+diceVal;
  if(myTurn){
    document.getElementById('msg').textContent='طلعلك '+diceVal+' - دوس على مكانك عشان تتحرك';
    canMove=true;
  } else {
    setTimeout(pcMove,800);
  }
  render();
}
function moveMy(idx){
  if(!canMove) return;
  var target = myPos===-1 ? diceVal-1 : myPos+diceVal;
  if(target>=TOTAL) target=TOTAL-1;
  if(myPos!==-1 && idx!==myPos) { document.getElementById('msg').textContent='دوس على مكانك الحالي - العلامة الحمرا!'; return; }
  var oldPc = pcPos;
  myPos=target;
  if(myPos===pcPos && pcPos!==-1){ pcPos=-1; soundEat(); document.getElementById('msg').textContent='أكلت الكمبيوتر ورجعته للبداية! 😍'; }
  else { soundMove(); document.getElementById('msg').textContent='اتحركت '+diceVal+' - دور الكمبيوتر...'; }
  canMove=false;
  if(myPos===TOTAL-1){ soundWin(); document.getElementById('msg').textContent='كسبت يا بطل! 🏆'; render(); return; }
  myTurn=false; render();
  setTimeout(function(){ var d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1; diceVal=d1+d2; soundDice(); document.getElementById('dice').textContent='🎲 '+d1+'  🎲 '+d2+' = '+diceVal; setTimeout(pcMove,600); },700);
}
function pcMove(){
  var target = pcPos===-1 ? diceVal-1 : pcPos+diceVal;
  if(target>=TOTAL) target=TOTAL-1;
  pcPos=target;
  if(pcPos===myPos && myPos!==-1){ myPos=-1; soundEat(); document.getElementById('msg').textContent='الكمبيوتر أكلك ورجعك للبداية! 😢'; }
  else { soundMove(); document.getElementById('msg').textContent='الكمبيوتر اتحرك '+diceVal+' - دورك انت!'; }
  if(pcPos===TOTAL-1){ soundLose(); document.getElementById('msg').textContent='الكمبيوتر كسب - حاول تاني!'; render(); return; }
  myTurn=true; canMove=false; render();
}
render();
</script>
 <div id="waBox" style="position:fixed; top:10px; left:10px; z-index:999999; text-align:center; touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none;">
  <div id="waDrag" style="width:60px; height:60px; background:#25D366; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 15px rgba(0,0,0,.5);">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" style="width:35px; height:35px; pointer-events:none;">
  </div>
  <div style="font-size:12px; font-weight:900; color:#fff; text-shadow:0 1px 4px #000; margin-top:2px; pointer-events:none;">كلمنا واتساب</div>
</div>
<script>
(function(){
  var box = document.getElementById('waBox');
  var startX=0, startY=0, origX=0, origY=0, moved=false, down=false, pid=null;
  function pos(e){ return {x:e.clientX, y:e.clientY}; }
  function downFn(e){ down=true; moved=false; pid=e.pointerId; var p=pos(e); startX=p.x; startY=p.y; origX=box.offsetLeft; origY=box.offsetTop; try{ box.setPointerCapture(pid); }catch(err){} e.preventDefault(); }
  function moveFn(e){ if(!down || e.pointerId!==pid) return; var p=pos(e); var dx=p.x-startX, dy=p.y-startY; if(Math.abs(dx)>6 || Math.abs(dy)>6) moved=true; if(!moved) return; var nx=origX+dx, ny=origY+dy; nx=Math.max(0, Math.min(window.innerWidth-65, nx)); ny=Math.max(0, Math.min(window.innerHeight-85, ny)); box.style.left=nx+'px'; box.style.top=ny+'px'; e.preventDefault(); }
  function upFn(e){ if(!down) return; down=false; var wasMoved=moved; setTimeout(function(){ moved=false; }, 200); if(!wasMoved){ window.open('https://wa.me/201551668092','_blank'); } }
  box.addEventListener('pointerdown', downFn);
  box.addEventListener('pointermove', moveFn);
  box.addEventListener('pointerup', upFn);
  box.addEventListener('pointercancel', function(){ down=false; });
})();
</script>
</body>
</html>
