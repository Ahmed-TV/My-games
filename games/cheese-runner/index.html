<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>الفأر والجبنة | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
    position: fixed; 
    width: 100%;
  }
  
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 5px) 5px env(safe-area-inset-bottom, 5px) 5px;
  }

  .header { width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; padding-bottom: 5px;}
  .logo-img { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #facc15; object-fit: cover; box-shadow: 0 0 10px rgba(250,204,21,0.5);}
  .header-text { text-align: right; }
  .header-text h1 { font-size: 18px; color: #facc15; margin: 0;}
  .header-text .names { font-size: 11px; color: #cbd5e1; font-weight: bold; margin-top: 2px;}
  .header-text .names b { color: #facc15; font-size: 13px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px;}
  .stat { background: #1e293b; border-radius: 6px; padding: 2px 15px; min-width: 80px; text-align: center; border: 1px solid #334155;}
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 3px solid #f59e0b; border-radius: 12px;
    overflow: hidden;
    padding: 5px;
  }

  .watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255, 255, 255, 0.1); font-size: 40px; font-weight: 900;
    pointer-events: none; z-index: 0; white-space: nowrap;
    letter-spacing: 2px;
  }

  canvas { 
    width: 100%; 
    flex-grow: 1; 
    display: block; 
    z-index: 1; 
    min-height: 0;
    border-radius: 8px;
    background: #fef3c7; 
    touch-action: none;
  }

  .controls {
    display: flex; gap: 10px; justify-content: center; padding: 8px 0 0 0;
    z-index: 3; flex-shrink: 0;
  }
  .ctrl-btn {
    background: #f59e0b; color: #fff; border: 2px solid #b45309; border-radius: 12px;
    font-size: 35px; width: 100px; height: 60px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; user-select: none;
    box-shadow: 0 4px 0 #b45309;
  }
  .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b45309; background: #d97706; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 8px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <div class="header-text">
        <h1>الفأر والجبنة</h1>
        <div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>الجبنة</span></div>
    <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
      <button class="ctrl-btn" id="leftBtn">⬅️</button>
      <button class="ctrl-btn" id="rightBtn">➡️</button>
    </div>

    <div id="overlay">
      <h2>🐭 الفأر والجبنة</h2>
      <p>
        <b>Ahmed TV</b> - اجمع الجبنة وابعد عن القطط!<br>
        استخدم الأزرار عشان تتحرك
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ الجري</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');

let W = 0, H = 0;
let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('cheeseBest') || '0');
bestEl.textContent = best;
let audioCtx = null;

let mouse = { x: 0, y: 0, size: 40, speed: 8 };
let cheese = { x: 0, y: 0, size: 35 };
let cats = [];
let moveLeft = false;
let moveRight = false;
let spawnTimer = 0;
let animFrame;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'eat') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
  
  if (!running) {
    mouse.x = W / 2 - mouse.size / 2;
    mouse.y = H - mouse.size - 20; // الفأر في الأسفل
    draw();
  }
}

function spawnCheese() {
  // هنا التعديل: الجبنة بتظهر على نفس ارتفاع الفأر (عشان يسهل عليه يوصلها)
  cheese.x = Math.random() * (W - cheese.size);
  cheese.y = mouse.y + (mouse.size/2) - (cheese.size/2); // نفس المستوى
  draw();
}

function spawnCat() {
  const size = 40;
  const x = Math.random() * (W - size);
  cats.push({
    x: x,
    y: -50,
    size: size,
    speed: 1.5 + Math.random() * 1.5 // سرعة القطط
  });
}

function draw() {
  ctx.fillStyle = '#fef3c7'; 
  ctx.fillRect(0, 0, W, H);
  
  ctx.strokeStyle = 'rgba(180, 83, 9, 0.2)';
  for(let i = 0; i < W; i += 40) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
  }
  for(let j = 0; j < H; j += 40) {
    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(W, j); ctx.stroke();
  }

  // الجبنة
  ctx.font = cheese.size + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🧀', cheese.x + cheese.size/2, cheese.y + cheese.size/2);

  // القطط
  cats.forEach(c => {
    ctx.font = c.size + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐱', c.x + c.size/2, c.y + c.size/2);
  });

  // الفأر
  ctx.font = mouse.size + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐭', mouse.x + mouse.size/2, mouse.y + mouse.size/2);
}

function update() {
  if (!running) return;

  if (moveLeft) mouse.x -= mouse.speed;
  if (moveRight) mouse.x += mouse.speed;
  
  if (mouse.x < 0) mouse.x = 0;
  if (mouse.x + mouse.size > W) mouse.x = W - mouse.size;

  // التحقق من أكل الجبنة
  let dist = Math.hypot((mouse.x + mouse.size/2) - (cheese.x + cheese.size/2), 
                        (mouse.y + mouse.size/2) - (cheese.y + cheese.size/2));
  
  if (dist < (mouse.size + cheese.size) / 2) {
    score++;
    scoreEl.textContent = score;
    playSound('eat');
    spawnCheese();
  }

  // حركة القطط
  for (let i = cats.length - 1; i >= 0; i--) {
    let c = cats[i];
    c.y += c.speed;

    if (c.y > H) {
      cats.splice(i, 1);
      continue;
    }

    // تصادم
    let catDist = Math.hypot((mouse.x + mouse.size/2) - (c.x + c.size/2), 
                             (mouse.y + mouse.size/2) - (c.y + c.size/2));
    if (catDist < (mouse.size + c.size) / 2) {
      endGame();
      return;
    }
  }

  spawnTimer++;
  if (spawnTimer > 120) {
    spawnCat();
    spawnTimer = 0;
  }

  draw();
}

function loop() {
  update();
  animFrame = requestAnimationFrame(loop);
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  score = 0;
  scoreEl.textContent = 0;
  cats = [];
  mouse.x = W / 2 - mouse.size / 2;
  mouse.y = H - mouse.size - 20;
  running = true;
  spawnTimer = 0;
  
  spawnCheese();
  loop();
}

function endGame() {
  running = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  playSound('crash');
  
  if (score > best) {
    best = score;
    localStorage.setItem('cheeseBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">🐱</div>
    <h2>القطة مسكتك!</h2>
    <p>جمعت <b style="color:#facc15;font-size:22px">${score} جبنة</b><br>
    أعلى نتيجة: ${best}</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

leftBtn.addEventListener('mousedown', () => moveLeft = true);
leftBtn.addEventListener('mouseup', () => moveLeft = false);
leftBtn.addEventListener('mouseleave', () => moveLeft = false);
leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; }, {passive: false});
leftBtn.addEventListener('touchend', () => moveLeft = false);

rightBtn.addEventListener('mousedown', () => moveRight = true);
rightBtn.addEventListener('mouseup', () => moveRight = false);
rightBtn.addEventListener('mouseleave', () => moveRight = false);
rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; }, {passive: false});
rightBtn.addEventListener('touchend', () => moveRight = false);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') moveLeft = true;
  if (e.key === 'ArrowRight') moveRight = true;
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') moveLeft = false;
  if (e.key === 'ArrowRight') moveRight = false;
});

startBtn.onclick = startGame;

window.addEventListener('resize', () => { resize(); if(!running) draw(); });

resize();
draw();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
