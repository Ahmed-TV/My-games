<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>الفأر والجبنة | أحمد عبدالعزيز</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
html, body { overflow-y: auto; overflow-x: hidden; }
body { font-family: Tahoma, Arial, sans-serif; background: #0a001a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 4px 4px 4px 4px; }
.header { width: 100%; max-width: 500px; text-align: center; }
.top-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2px; }
.logo-wrap { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; border: 4px solid #facc15; background: #000; flex-shrink: 0; }
.logo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
h1 { font-size: 26px; color: #ff2d95; line-height: 1.2; }
h1 small { display: block; font-size: 13px; color: #00e5ff; }
.names { text-align: center; line-height: 1.3; margin-bottom: 6px; }
.names .ar { display: block; font-size: 22px; color: #facc15; font-weight: 900; }
.names .en { display: block; font-size: 16px; color: #fff; font-weight: 900; }
.stats { display: flex; gap: 8px; justify-content: center; margin: 4px 0 6px; }
.stat { background: #1a0033; border: 2px solid #ff2d95; border-radius: 10px; padding: 3px 12px; min-width: 85px; text-align: center; }
.stat b { display: block; font-size: 16px; color: #00e5ff; }
.stat span { font-size: 9px; color: #c4b5fd; }
.how { width: 100%; max-width: 500px; background: #facc15; color: #000; border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; font-weight: 900; line-height: 1.4; margin-bottom: 6px; }
#game-container { width: 100%; max-width: 500px; height: 320px; position: relative; background: #1e293b; border: 3px solid #f59e0b; border-radius: 16px; overflow: hidden; }
@media (max-width: 600px) {
  #game-container { height: 400px; }
}
.watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,0.04); font-size: 28px; font-weight: 900; pointer-events: none; white-space: nowrap; z-index: 0; }
canvas { width: 100%; height: 100%; display: block; touch-action: none; position: relative; z-index: 1; border-radius: 12px; }
.controls { display: flex; direction: ltr; gap: 6px; width: 100%; max-width: 500px; margin-top: 6px; }
.ctrl-btn { flex: 1; background: #1a0033; color: #fff; border: 2px solid #f59e0b; border-radius: 10px; padding: 10px 4px; font-size: 20px; font-weight: 900; cursor: pointer; }
.ctrl-btn:active { background: #ff2d95; }
#overlay { position: absolute; inset: 0; background: rgba(10,0,26,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px; gap: 8px; z-index: 10; }
#overlay h2 { font-size: 22px; color: #facc15; }
#overlay p { line-height: 1.5; font-size: 13px; color: #fff; }
.btn-start { background: linear-gradient(90deg,#f59e0b,#ff2d95); color: #fff; border: 2px solid #fff; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 200px; }
#game-wrap { position: relative; width: 100%; max-width: 500px; }
.footer { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 6px; }
.footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body oncontextmenu="return false">
<div class="header">
<div class="top-row"><div class="logo-wrap"><img src="../../logo.png" alt="أحمد عبدالعزيز"></div><h1>الفأر والجبنة<small>جبنة الأبطال</small></h1></div>
<div class="names"><span class="ar">أحمد عبدالعزيز</span><span class="en">Ahmed TV</span></div>
<div class="stats"><div class="stat"><b id="score">0</b><span>الجبنة 🧀</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div></div>
</div>
<div class="how">اجمع الجبنة اللي بتنزل 🧀 - حرّك الفأر يمين وشمال<br>الشمال شمال - واليمين يمين</div>
<div id="game-wrap"><div id="game-container"><div class="watermark">أحمد عبدالعزيز</div><canvas id="gameCanvas"></canvas><div id="overlay"><h2>🐭 الفأر والجبنة</h2><p><b>Ahmed TV</b> - اجمع الجبنة اللي بتنزل!<br>استخدم الأزرار عشان تتحرك</p><button class="btn-start" id="startBtn">▶ ابدأ الجري</button></div></div></div>
<div class="controls"><button class="ctrl-btn" id="leftBtn">◀ شمال</button><button class="ctrl-btn" id="rightBtn">يمين ▶</button></div>
<div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a></div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),leftBtn=document.getElementById('leftBtn'),rightBtn=document.getElementById('rightBtn');
let W=0,H=0,running=false,score=0;
let best=parseInt(localStorage.getItem('cheeseBest')||'0');bestEl.textContent=best;
let audioCtx=null;
let mouse={x:0,y:0,size:40,speed:8};
let fallingCheeses=[];
let moveLeft=false,moveRight=false,spawnTimer=0,animFrame;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function playSound(type){if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);if(type==='eat'){osc.type='sine';osc.frequency.setValueAtTime(600,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(1000,audioCtx.currentTime+0.1);gain.gain.setValueAtTime(0.15,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);osc.start();osc.stop(audioCtx.currentTime+0.15);}}
function resize(){const r=canvas.parentElement.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;if(!running){mouse.x=W/2-mouse.size/2;mouse.y=H-mouse.size-10;draw();}}
function spawnCheese(){fallingCheeses.push({x:Math.random()*(W-40),y:-50,size:35,speed:1.5+Math.random()*1.5});}
function draw(){
ctx.fillStyle='#fef3c7';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(180,83,9,0.2)';
for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
for(let j=0;j<H;j+=40){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke();}
fallingCheeses.forEach(c=>{ctx.font=c.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🧀',c.x+c.size/2,c.y+c.size/2);});
ctx.font=mouse.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐭',mouse.x+mouse.size/2,mouse.y+mouse.size/2);
}
function update(){
if(!running)return;
if(moveLeft)mouse.x-=mouse.speed;
if(moveRight)mouse.x+=mouse.speed;
if(mouse.x<0)mouse.x=0;
if(mouse.x+mouse.size>W)mouse.x=W-mouse.size;
for(let i=fallingCheeses.length-1;i>=0;i--){
let c=fallingCheeses[i];c.y+=c.speed;
let dist=Math.hypot((mouse.x+mouse.size/2)-(c.x+c.size/2),(mouse.y+mouse.size/2)-(c.y+c.size/2));
if(dist<(mouse.size+c.size)/2){score++;scoreEl.textContent=score;playSound('eat');fallingCheeses.splice(i,1);if(score>best){best=score;localStorage.setItem('cheeseBest',best);bestEl.textContent=best;}continue;}
if(c.y>H)fallingCheeses.splice(i,1);
}
spawnTimer++;
if(spawnTimer>80){spawnCheese();spawnTimer=0;}
draw();
}
function loop(){update();animFrame=requestAnimationFrame(loop);}
function startGame(){initAudio();overlay.style.display='none';score=0;scoreEl.textContent=0;fallingCheeses=[];mouse.x=W/2-mouse.size/2;mouse.y=H-mouse.size-10;running=true;spawnTimer=0;loop();}
leftBtn.addEventListener('mousedown',()=>moveLeft=true);
leftBtn.addEventListener('mouseup',()=>moveLeft=false);
leftBtn.addEventListener('mouseleave',()=>moveLeft=false);
leftBtn.addEventListener('touchstart',e=>{e.preventDefault();initAudio();moveLeft=true;},{passive:false});
leftBtn.addEventListener('touchend',()=>moveLeft=false);
rightBtn.addEventListener('mousedown',()=>moveRight=true);
rightBtn.addEventListener('mouseup',()=>moveRight=false);
rightBtn.addEventListener('mouseleave',()=>moveRight=false);
rightBtn.addEventListener('touchstart',e=>{e.preventDefault();initAudio();moveRight=true;},{passive:false});
rightBtn.addEventListener('touchend',()=>moveRight=false);
startBtn.onclick=startGame;
window.addEventListener('resize',()=>{resize();if(!running)draw();});
resize();draw();
document.body.addEventListener('touchstart',initAudio,{once:true});
document.body.addEventListener('click',initAudio,{once:true});
</script>

</body>
</html>
