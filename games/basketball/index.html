<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>رمي السلة | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
  
  .logo {
    width: 55px; height: 55px; flex-shrink: 0;
    background: radial-gradient(circle, #fde047, #f59e0b 55%, #b45309);
    border: 3px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #111; line-height: 1;
  }
  .logo b { font-size: 12px; }
  .logo span { font-size: 8px; font-weight: 900; margin-top: 2px; }
  
  h1 { font-size: 20px; line-height: 1.2; }
  h1 small { display: block; font-size: 11px; color: #facc15; letter-spacing: 1px; margin-top: 2px; }
  
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
  .names b { color: #fff; }

  .stats { display: flex; gap: 10px; justify-content: center; margin: 5px 0 10px; flex-wrap: wrap; }
  .stat {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 5px 15px; min-width: 80px; text-align: center;
  }
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #f59e0b; 
    border: 4px solid #f59e0b; border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255, 255, 255, 0.1);
    font-size: 30px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  canvas { width: 100%; height: 100%; display: block; z-index: 1; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; }
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 5px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>رمي السلة<small>AHMED TV BASKETBALL</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div class="stats">
      <div class="stat"><b id="score">0</b><span>أهداف</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">أحمد عبدالعزيز<br>Ahmed TV</div>
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
      <h2>رمي السلة السهلة</h2>
      <p>
        <b>Ahmed TV</b> - دوس عشان توقف السهم<br>
        لما يبقى في نص السلة، هتسجل هدف!
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let W = 0, H = 0;
let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('basketBest') || '0');
bestEl.textContent = best;
let audioCtx = null;

// إعدادات اللعبة
let ball = { x: 0, y: 0, radius: 15, isShot: false };
let hoop = { x: 0, y: 0, w: 100, h: 15 }; 
let arrowX = 0; 
let arrowDir = 1; 
let isStopped = false;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'shoot') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'score') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'miss') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;

  // السلة في النص بالظبط، وقريبة من فوق عشان سهلة
  hoop.w = W * 0.4; 
  hoop.x = (W - hoop.w) / 2; 
  hoop.y = H * 0.25; 
  
  resetShot();
}

function resetShot() {
  ball.x = W / 2;
  ball.y = H - 40;
  ball.isShot = false;
  
  arrowX = 0;
  arrowDir = 1;
  isStopped = false;
}

function draw() {
  // خلفية
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(0, 0, W, H);

  // السلة (اللوحة والحلقة)
  ctx.fillStyle = '#fff';
  ctx.fillRect(hoop.x, hoop.y, hoop.w, hoop.h); 
  
  ctx.strokeStyle = '#ef4444'; 
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(hoop.x, hoop.y + hoop.h);
  ctx.lineTo(hoop.x + hoop.w, hoop.y + hoop.h);
  ctx.stroke();

  // شبكة بسيطة
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  for(let i=0; i<=hoop.w; i+=20){
      ctx.beginPath(); 
      ctx.moveTo(hoop.x + i, hoop.y + hoop.h); 
      ctx.lineTo(hoop.x + i - 10, hoop.y + hoop.h + 30); 
      ctx.stroke();
  }

  // الكرة
  ctx.fillStyle = '#ea580c';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#7c2d12';
  ctx.lineWidth = 2;
  ctx.stroke();

  // السهم اللي بيتحرك (تحت الكرة)
  if (!ball.isShot && running) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px Arial';
    ctx.textAlign = 'center';
    // بنرسم سهم فوق الكرة شوية
    let displayX = W/2 + (arrowX * (W/2 - 30));
    ctx.fillText('⬆️', displayX, H - 80);
  }

  // تأثير التسجيل
  if (ball.isShot) {
      // الكرة بتطير لفوق
      ctx.fillStyle = '#22c55e';
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      // لو الهدف في نص السلة
      let tolerance = 25; 
      let hoopCenter = hoop.x + hoop.w/2;
      let ballHitX = W/2 + (arrowX * (W/2 - 30)); // نفس مكان السهم

      if (Math.abs(ballHitX - hoopCenter) < tolerance) {
          ctx.fillText('✅', W/2, H/2);
      } else {
          ctx.fillText('❌', W/2, H/2);
      }
  }
}

function update() {
  if (!running) return;

  // حركة السهم
  if (!ball.isShot) {
    arrowX += arrowDir * 0.04; // سرعة السهم (بطيئة للأطفال)
    if (arrowX > 1) { arrowX = 1; arrowDir = -1; }
    if (arrowX < -1) { arrowX = -1; arrowDir = 1; }
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function shoot() {
  if (!running || ball.isShot) return;
  
  ball.isShot = true;
  playSound('shoot');

  // حساب النتيجة
  setTimeout(() => {
    let hoopCenter = hoop.x + hoop.w/2;
    let ballHitX = W/2 + (arrowX * (W/2 - 30)); // مكان السهم
    let tolerance = 30; // مسامحة 30 بكسل

    if (Math.abs(ballHitX - hoopCenter) < tolerance) {
      score++;
      scoreEl.textContent = score;
      playSound('score');
    } else {
      playSound('miss');
    }

    // إعادة اللعب بعد ثانية
    setTimeout(resetShot, 1000);
  }, 500);
}

// تشغيل اللعبة
function startGame() {
  initAudio();
  overlay.style.display = 'none';
  score = 0;
  scoreEl.textContent = score;
  running = true;
  resetShot();
  loop();
}

// التحكم (ماوس ولمس)
canvas.addEventListener('mousedown', shoot);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); }, {passive: false});

startBtn.onclick = startGame;

window.addEventListener('resize', () => { resize(); if(!running) draw(); });

// بدء التشغيل
resize();
draw();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
