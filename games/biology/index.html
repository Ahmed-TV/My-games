function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function show(s){["start","play","result"].forEach(x=>$(x).classList.toggle("hidden",x!==s))}
function startGame(){order=shuffle(questions);idx=0;score=0;correct=0;show("play");loadQ()}
function loadQ(){locked=false;const it=order[idx];$("count").textContent=`السؤال ${idx+1} من ${order.length}`;$("score").textContent=score;$("bar").style.width=(idx/order.length*100)+"%";$("question").textContent=it.q;$("feedback").textContent="اختبر معلوماتك! اختر إجابتك!";$("answers").innerHTML="";it.a.forEach((ans,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=ans;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("nextBtn").disabled=true;$("nextBtn").textContent=idx===order.length-1?"عرض النتيجة ←":"السؤال التالي ←"}
function choose(ch){if(locked)return;locked=true;const it=order[idx];const btns=[...$("answers").children];btns.forEach((b,i)=>{b.disabled=true;if(i===it.c)b.classList.add("correct");else if(i===ch)b.classList.add("wrong")});if(ch===it.c){score+=10;correct++;playCorrect();$("feedback").textContent="✅ إجابة صحيحة! برافو 👏 🔊"}else{playWrong();$("feedback").textContent="❌ إجابة خاطئة 🔊 - الصح: "+it.a[it.c]};$("score").textContent=score;$("nextBtn").disabled=false}
function next(){if(!locked)return;idx++;if(idx>=order.length){finish();return}loadQ()}
function finish(){show("result");$("finalScore").textContent=score;$("rightCount").textContent=correct;if(score>best){best=score;localStorage.setItem("biology_best",String(best));$("best").textContent=best}let t,m;if(correct>=160){t="عبقري الأحياء! 🏆";m="انت موسوعة أحياء! تستحق لقب بطل Ahmed TV."}else if(correct>=120){t="عالم الأحياء! 🧠";m="أداء ممتاز! قربت من القمة."}else if(correct>=60){t="بداية قوية! 💪";m="عندك أساس كويس، حاول تاني وحطم رقمك."}else{t="التحدي مستمر! 🔥";m="كل محاولة بتزود معلوماتك، العب تاني."}$("resultTitle").textContent=t;$("resultText").textContent=m}
