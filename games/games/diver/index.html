<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الغواص | أحمد عبدالعزيز Ahmed TV</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,Arial}
body{background:linear-gradient(180deg,#0ea5e9 0%,#0369a1 45%,#082f49 100%);display:flex;flex-direction:column;color:#fff}
.top{margin:10px 12px 0;background:rgba(255,255,255,.95);border-radius:20px;padding:8px 12px;display:flex;align-items:center;gap:10px;color:#0f172a}
.top img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #0ea5e9}
.top .t{flex:1;line-height:1.2}
.top .t .name{font-size:18px;font-weight:900}
.top .t .g{font-size:17px;font-weight:900;color:#0369a1}
.sound{width:44px;height:44px;border-radius:50%;border:none;background:#0ea5e9;color:#fff;font-size:20px;cursor:pointer}
.stats{display:flex;gap:6px;padding:8px;justify-content:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.92);color:#0f172a;border-radius:20px;padding:6px 10px;font-weight:900;font-size:13px}
.pill b{color:#0369a1}
.hint{text-align:center;background:rgba(255,255,255,.9);color:#0f172a;border-radius:16px;margin:0 12px;padding:7px;font-weight:900;font-size:13px}
#sea{flex:1;position:relative;overflow:hidden;margin:10px 12px 0;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(0,0,0,.25));border:3px solid rgba(255,255,255,.7);min-height:0;direction:ltr}
.cell{position:absolute;width:16.6%;height:16.6%;display:flex;align-items:center;justify-content:center;font-size:28px}
.msg{text-align:center;font-weight:900;padding:5px;min-height:24px;color:#fef9c3}
.controls{display:flex;justify-content:center;gap:6px;padding:4px;direction:ltr}
.controls button{width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:#0369a1;color:#fff;font-size:24px;cursor:pointer;line-height:1.1}
.controls button small{font-size:11px;display:block}
.btns{display:flex;justify-content:center;padding:5px}
.big{background:#f59e0b;color:#000;border:none;border-radius:30px;padding:12px 24px;font-weight:900;font-size:18px;cursor:pointer}
#overlay{position:fixed;inset:0;background:linear-gradient(180deg,#0ea5e9,#082f49);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:99}
#overlay img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #fff}
#overlay h2{font-size:26px;margin:0}
#overlay p{font-size:16px;color:#e0f2fe;margin:0;line-height:1.7}
</style></head>
<body>
<div class="top"><img src="../../logo.png"><div class="t"><div class="name">أحمد عبدالعزيز Ahmed TV</div><div class="g">🐳 الغواص</div></div><button class="sound" id="soundBtn">🔊</button></div>
<div class="stats"><div class="pill">🦪 لولي: <b id="pearls">0</b></div><div class="pill">🦈 القرش مسكك: <b id="hits">0</b></div><div class="pill">🏆 مرحلة: <b id="level">1</b>/20</div><div class="pill">⏰ وقت: <b id="time">60</b></div><div class="pill">❤️ حياة: <b id="lives">3</b></div></div>
<div class="hint">حرك الغواص بالأسهم - اجمع اللولي وابعد عن القرش!</div>
<div id="sea"></div><div class="msg" id="msg">انزل المية!</div>
<div class="controls"><button id="up">⬆️<small>فوق</small></button></div>
<div class="controls"><button id="left">⬅️<small>شمال</small></button><button id="down">⬇️<small>تحت</small></button><button id="right">➡️<small>يمين</small></button></div>
<div class="btns"><button class="big" id="startBtn">🐳 ابدأ الغوص</button><button class="big" id="againBtn" style="background:#7c3aed;color:#fff;display:none">🔄 العب تاني</button></div>
<div id="overlay"><img src="../../logo.png"><h2>أهلاً بيك يا بطل! 🐳</h2><p>أنا أحمد عبدالعزيز Ahmed TV<br>أهلاً بيك في <b>الغواص</b><br>انزل تحت المية - اجمع اللولي<br>وابعد عن القرش - القرش بيجري وراك!<br>20 مرحلة</p><button class="big" id="playBtn">🐳 ابدأ الغوص</button></div>
<script>
var muted=false,started=false,level=1,pearls=0,hits=0,lives=3,timeLeft=60,timer=null,sharkTimer=null;
var px=0,py=5,sx=5,sy=0,need=6;
var sounds={sah:'../../sounds/sah.mp3',ghalat:'../../sounds/ghalat.mp3',kesebt:'../../sounds/kesebt.mp3',khesert:'../../sounds/khesert.mp3',ebda:'../../sounds/ebda.mp3',ahla:'../../sounds/ahla.mp3'};
function voice(k){if(muted)return;try{new Audio(sounds[k]||sounds.sah).play();}catch(e){}}
var sea=document.getElementById('sea'),msg=document.getElementById('msg'),cells=[];
for(var i=0;i<36;i++){var c=document.createElement('div');c.className='cell';c.style.left=(i%6)*16.6+'%';c.style.top=Math.floor(i/6)*16.6+'%';sea.appendChild(c);cells.push(c);}
var pearlCells=[];
function draw(){for(var i=0;i<36;i++){cells[i].innerHTML='🫧';cells[i].style.background='transparent';}pearlCells.forEach(function(p){cells[p.y*6+p.x].innerHTML='🦪';});cells[sy*6+sx].innerHTML='🦈';cells[py*6+px].innerHTML='🤿';}
function build(){px=0;py=5;sx=5;sy=0;pearls=0;hits=0;lives=3;need=Math.min(5+level,12);timeLeft=Math.max(60-(level-1)*1,45);document.getElementById('pearls').textContent=0;document.getElementById('hits').textContent=0;document.getElementById('level').textContent=level;document.getElementById('time').textContent=timeLeft;document.getElementById('lives').textContent=3;msg.textContent='اجمع '+need+' لولي!';pearlCells=[];while(pearlCells.length<need){var x=Math.floor(Math.random()*6),y=Math.floor(Math.random()*6);if((x==0&&y==5)||(x==5&&y==0))continue;if(!pearlCells.some(function(p){return p.x==x&&p.y==y;}))pearlCells.push({x:x,y:y});}draw();}
function start(){started=true;build();document.getElementById('overlay').style.display='none';document.getElementById('startBtn').style.display='none';document.getElementById('againBtn').style.display='none';voice('ebda');clearInterval(timer);clearInterval(sharkTimer);timer=setInterval(function(){timeLeft--;document.getElementById('time').textContent=timeLeft;if(timeLeft<=0)endGame();},1000);sharkTimer=setInterval(moveShark,1400-Math.min(level*25,500));}
function move(dx,dy){if(!started)return;var nx=px+dx,ny=py+dy;if(nx<0||nx>5||ny<0||ny>5)return;px=nx;py=ny;check();}
function check(){var idx=pearlCells.findIndex(function(p){return p.x==px&&p.y==py;});if(idx>=0){pearlCells.splice(idx,1);pearls++;document.getElementById('pearls').textContent=pearls;voice('sah');msg.textContent='🦪 الله! جمعت لولي! فاضل '+(need-pearls)+' لولي';if(pearls>=need){nextLevel();return;}}if(px==sx&&py==sy){hitShark();return;}draw();}
function hitShark(){hits++;lives--;document.getElementById('hits').textContent=hits;document.getElementById('lives').textContent=lives;voice('ghalat');msg.textContent='🦈 أوووه القرش مسكك! دي '+hits+' مرة - فاضل '+lives+' حياة';px=0;py=5;sx=5;sy=0;if(lives<=0){endGame();return;}draw();}
function moveShark(){if(!started)return;if(sx<px)sx++;else if(sx>px)sx--;if(sy<py)sy++;else if(sy>py)sy--;if(sx==px&&sy==py){hitShark();return;}draw();}
function nextLevel(){clearInterval(timer);clearInterval(sharkTimer);started=false;voice('kesebt');if(level>=20){msg.textContent='🏆 كسبت! خلصت الـ 20 مرحلة! جمعت '+pearls+' لولي - والقرش مسكك '+hits+' مرة بس!';document.getElementById('againBtn').style.display='inline-block';return;}level++;msg.textContent='🎉 المرحلة '+level+' من 20! القرش بقى أسرع!';setTimeout(function(){start();},1200);}
function endGame(){clearInterval(timer);clearInterval(sharkTimer);started=false;voice('khesert');msg.textContent='⏰ خلص الغوص! جمعت '+pearls+' لولي - والقرش مسكك '+hits+' مرة';document.getElementById('againBtn').style.display='inline-block';}
document.getElementById('playBtn').onclick=function(){voice('ahla');start();};
document.getElementById('startBtn').onclick=start;
document.getElementById('againBtn').onclick=function(){level=1;start();};
document.getElementById('up').onclick=function(){move(0,-1);};
document.getElementById('down').onclick=function(){move(0,1);};
document.getElementById('left').onclick=function(){move(-1,0);};
document.getElementById('right').onclick=function(){move(1,0);};
document.getElementById('soundBtn').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';if(!muted)voice('sah');};
</script></body></html>
