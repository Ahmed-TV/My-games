<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ahmed TV - لعبة المهن</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#004D40,#00897B);height:100vh;height:100dvh;display:flex;justify-content:center;padding:4px 8px;overflow:hidden}
.game{width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;background:#fff;border:3px solid #00897B;border-radius:20px;padding:8px;overflow:hidden;position:relative}
header{padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.logo-img{width:72px;height:72px;border-radius:50%;border:3px solid #00897B;object-fit:cover;background:#fff;margin-bottom:4px}
.brand{font-size:22px;font-weight:900;color:#00695C}
.names{font-size:13px;font-weight:700;color:#00897B}
.type-row{display:flex;gap:5px;width:100%;margin:6px 0;flex-shrink:0}
.type-btn{flex:1;padding:8px 2px;border-radius:10px;border:2px solid #00897B;background:#fff;color:#00695C;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit}
.type-btn.active{background:#00897B;color:#fff}
.progress-wrap{width:100%;height:8px;background:#B2DFDB;border-radius:10px;margin:2px 0;overflow:hidden;flex-shrink:0}
.progress{height:100%;background:linear-gradient(90deg,#00897B,#4DB6AC);width:0%;transition:width .3s}
.prog-text{text-align:center;font-size:12px;font-weight:800;color:#00695C;margin-bottom:4px;flex-shrink:0}
.qbox{background:linear-gradient(180deg,#E0F2F1,#fff);border:2px solid #80CBC4;border-radius:14px;padding:8px;text-align:center;flex-shrink:0;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.qicon{font-size:52px}
.qtext{font-size:19px;font-weight:800;color:#00695C;margin-top:6px;line-height:1.4}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex-shrink:0;height:102px}
.answer{font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#00897B,#4DB6AC);border:0;border-radius:12px;padding:10px 5px;min-height:44px;cursor:pointer;overflow:hidden}
.answer.correct{background:#2E7D32}
.answer.wrong{background:#333}
.answer:disabled{opacity:.9}
.feedback{height:20px;font-size:12px;font-weight:700;color:#00695C;text-align:center;margin:4px 0;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-row{display:flex;gap:7px;flex-shrink:0;position:absolute;bottom:0;left:0;right:0;background:#fff;padding:6px 8px;border-top:2px solid #80CBC4}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:20px;padding:11px 10px;background:#00897B;color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #00897B;border-radius:20px;padding:11px 6px;background:#fff;color:#00695C;cursor:pointer;font-size:13px}
footer{text-align:center;color:#00897B;font-size:11px;margin-top:4px;flex-shrink:0}
footer a{color:#00897B;text-decoration:none;font-weight:700}
</style></head>
<body><div class="game">
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">👨‍⚕️ لعبة المهن 👨‍⚕️</div><div class="names">أحمد عبدالعزيز • Ahmed TV</div><button id="soundBtn" style="margin:5px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #00897B;border-radius:20px;padding:6px 18px;background:#fff;color:#00695C;cursor:pointer;font-size:12px">🔊 الصوت: شغال</button></header>
<div style="flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:62px;position:relative">
<div class="type-row"><button class="type-btn active" onclick="setType('الكل',this)">👨‍⚕️ الكل - 200</button><button class="type-btn" onclick="setType('أداة',this)">🧰 الأداة</button><button class="type-btn" onclick="setType('مكان',this)">🏢 المكان</button><button class="type-btn" onclick="setType('مهمة',this)">⭐ المهمة</button></div>
<div class="progress-wrap"><div class="progress" id="prog"></div></div>
<div class="prog-text" id="progText">السؤال 1 / 200</div>
<div class="qbox"><div class="qicon" id="qicon">👨‍⚕️</div><div class="qtext" id="qText">الدكتور بيشتغل بأداة إيه؟</div></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback">👨‍⚕️ يلا! اختر الصح</div>
<div class="btn-row"><button class="skipbtn" onclick="skipQ()">⏭️ تخطي</button><button class="mainbtn" id="nextBtn" disabled>السؤال التالي ←</button></div>
</div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
const DATA=[{n:"دكتور",tool:"سماعة",place:"مستشفى",job:"بيعالج المرضى"},{n:"مهندس",tool:"مسطرة",place:"موقع بناء",job:"بيصمم المباني"},{n:"معلم",tool:"سبورة",place:"مدرسة",job:"بيعلم الطلبة"},{n:"محامي",tool:"ملف قضية",place:"محكمة",job:"بيدافع عن الناس"},{n:"طباخ",tool:"طاسة",place:"مطبخ",job:"بيطبخ الأكل"},{n:"نجار",tool:"منشار",place:"ورشة نجارة",job:"بيعمل الخشب"},{n:"سباك",tool:"مفتاح إنجليزي",place:"بيوت الناس",job:"بيصلح المواسير"},{n:"كهربائي",tool:"مفك",place:"بيوت الناس",job:"بيصلح الكهربا"},{n:"مزارع",tool:"فاس",place:"حقل",job:"بيزرع الأرض"},{n:"صيدلي",tool:"دواء",place:"صيدلية",job:"بيصرف الدواء"},{n:"ممرض",tool:"حقنة",place:"مستشفى",job:"بيساعد الدكتور"},{n:"طيار",tool:"طيارة",place:"مطار",job:"بيسوق الطيارة"},{n:"سائق",tool:"عربية",place:"شارع",job:"بيوصل الناس"},{n:"شرطي",tool:"طبنجة",place:"قسم شرطة",job:"بيحمي الناس"},{n:"جندي",tool:"بندقية",place:"جيش",job:"بيدافع عن الوطن"},{n:"صحفي",tool:"قلم",place:"جريدة",job:"بيكتب الأخبار"},{n:"مصور",tool:"كاميرا",place:"ستوديو",job:"بيصور الصور"},{n:"رسام",tool:"فرشة",place:"مرسم",job:"بيرسم لوحات"},{n:"مغني",tool:"ميكروفون",place:"مسرح",job:"بيغني أغاني"},{n:"ممثل",tool:"سيناريو",place:"مسرح",job:"بيمثل أدوار"},{n:"لاعب كورة",tool:"كورة",place:"ملعب",job:"بيلعب ماتشات"},{n:"محاسب",tool:"آلة حاسبة",place:"شركة",job:"بيحسب الفلوس"},{n:"خياط",tool:"مقص",place:"مشغل",job:"بيفصل هدوم"},{n:"حلاق",tool:"مقص",place:"صالون",job:"بيحلق الشعر"},{n:"ميكانيكي",tool:"مفتاح",place:"ورشة",job:"بيصلح العربيات"},{n:"حداد",tool:"شاكوش",place:"ورشة حدادة",job:"بيشكل الحديد"},{n:"بناء",tool:"طوب",place:"موقع بناء",job:"بيبني البيوت"},{n:"بحار",tool:"سفينة",place:"بحر",job:"بيسافر بالسفينة"},{n:"صياد",tool:"شبكة",place:"بحر",job:"بيصطاد سمك"},{n:"خباز",tool:"فرن",place:"مخبز",job:"بيخبز العيش"},{n:"جزار",tool:"سكينة",place:"جزارة",job:"بيقطع اللحمة"},{n:"بائع",tool:"ميزان",place:"محل",job:"بيبيع للناس"},{n:"مدير",tool:"لابتوب",place:"مكتب",job:"بيدير الشركة"},{n:"سكرتير",tool:"تليفون",place:"مكتب",job:"بينظم المواعيد"},{n:"مترجم",tool:"قاموس",place:"مكتب",job:"بيترجم اللغات"},{n:"عالم",tool:"ميكروسكوب",place:"معمل",job:"بيعمل أبحاث"},{n:"رائد فضاء",tool:"بدلة فضاء",place:"محطة فضاء",job:"بيسافر الفضاء"},{n:"قاضي",tool:"مطرقة",place:"محكمة",job:"بيحكم بين الناس"},{n:"فلاح",tool:"محرات",place:"أرض",job:"بيزرع القمح"},{n:"نادل",tool:"صينية",place:"مطعم",job:"بيقدم الأكل"},{n:"عامل نظافة",tool:"مقشة",place:"شارع",job:"بينظف المكان"},{n:"ساعي بريد",tool:"شنطة",place:"مكتب بريد",job:"بيوصل الجوابات"},{n:"طبيب أسنان",tool:"كرسي أسنان",place:"عيادة",job:"بيعالج الأسنان"},{n:"طبيب بيطري",tool:"سماعة",place:"عيادة بيطرية",job:"بيعالج الحيوانات"},{n:"مدرب",tool:"صفارة",place:"ملعب",job:"بيدرب الفريق"},{n:"حكم",tool:"كارت أحمر",place:"ملعب",job:"بيحكم الماتش"},{n:"مذيع",tool:"ميكروفون",place:"استوديو",job:"بيقدم البرامج"},{n:"كاتب",tool:"قلم",place:"مكتب",job:"بيكتب قصص"},{n:"شاعر",tool:"قلم",place:"مكتب",job:"بيكتب شعر"},{n:"موسيقي",tool:"جيتار",place:"مسرح",job:"بيعزف مزيكا"}];
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
let soundOn=true, audioCtx=null;
function getCtx(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
document.addEventListener('pointerdown',()=>{ getCtx(); },{once:false});
document.addEventListener('touchstart',()=>{ getCtx(); },{once:false});
function tone(f,dur,vol,type,delay,slideTo){ if(!soundOn) return; const ctx=getCtx(); if(!ctx) return; try{ const t0=ctx.currentTime+(delay||0); const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t0); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur); g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol,t0+0.02); g.gain.exponentialRampToValueAtTime(0.001,t0+dur); o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+dur+0.08); }catch(e){} }
function noise(dur,vol,delay){ if(!soundOn) return; const ctx=getCtx(); if(!ctx) return; try{ const t0=ctx.currentTime+(delay||0); const len=ctx.sampleRate*dur; const buf=ctx.createBuffer(1,len,ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; const src=ctx.createBufferSource(); src.buffer=buf; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; const g=ctx.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur); src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t0); }catch(e){} }
function playCorrect(){ noise(0.3,0.12,0); noise(0.3,0.12,0.2); tone(523,0.15,0.25,'triangle',0); tone(659,0.15,0.25,'triangle',0.15); tone(784,0.4,0.28,'triangle',0.3); }
function playWrong(){ tone(220,0.35,0.25,'square',0); tone(180,0.5,0.25,'square',0.35); }
function playSkip(){ tone(600,0.2,0.2,'sine',0,900); }
let curType='الكل', qs=[], idx=0, score=0, correct=0, locked=false;
function build(){ qs=[]; DATA.forEach(c=>{ let types = curType==='الكل' ? ['أداة','مكان','مهمة','عكس'] : [curType]; types.forEach(t=>{ let q='', corr='', pool=[], icon=''; if(t==='أداة'){ q=c.n+' بيشتغل بأداة إيه؟'; corr=c.tool; pool=DATA.map(x=>x.tool); icon='🧰'; } if(t==='مكان'){ q=c.n+' بيشتغل فين؟'; corr=c.place; pool=DATA.map(x=>x.place); icon='🏢'; } if(t==='مهمة'){ q=c.n+' بيعمل إيه؟'; corr=c.job; pool=DATA.map(x=>x.job); icon='⭐'; } if(t==='عكس'){ q='مين اللي '+c.job+'؟'; corr=c.n; pool=DATA.map(x=>x.n); icon='👨‍⚕️'; } let others = shuffle([...new Set(pool.filter(x=>x!==corr))]).slice(0,3); qs.push({q:q, correct:corr, opts:shuffle([...new Set([corr,...others])]), icon:icon}); }); }); qs=shuffle(qs); }
function loadQ(){ if(idx>=qs.length){ document.getElementById('qText').textContent='خلصت الـ '+qs.length+' سؤال! 🏆'; document.getElementById('feedback').textContent='نتيجتك: '+score+' • صح: '+correct; document.getElementById('answers').innerHTML=''; return; } locked=false; let it=qs[idx]; document.getElementById('qicon').textContent=it.icon; document.getElementById('qText').textContent=it.q; document.getElementById('prog').style.width=((idx+1)/qs.length*100)+'%'; document.getElementById('progText').textContent='السؤال '+(idx+1)+' / '+qs.length; document.getElementById('feedback').textContent='👨‍⚕️ السؤال '+(idx+1)+' من '+qs.length; let ans=document.getElementById('answers'); ans.innerHTML=''; it.opts.forEach(o=>{ let b=document.createElement('button'); b.className='answer'; b.textContent=o; b.onclick=()=>choose(o===it.correct,b,it); ans.appendChild(b); }); document.getElementById('nextBtn').disabled=true; }
function choose(ok,btn,it){ if(locked) return; locked=true; [...document.getElementById('answers').children].forEach(b=>{ b.disabled=true; if(b.textContent===it.correct) b.classList.add('correct'); else if(b===btn) b.classList.add('wrong'); }); if(ok){ playCorrect(); score+=10; correct++; document.getElementById('feedback').textContent='✅ صح! +10 👨‍⚕️'; } else { playWrong(); document.getElementById('feedback').textContent='❌ غلط - الصح: '+it.correct; } document.getElementById('nextBtn').disabled=false; }
function skipQ(){ playSkip(); if(idx>=qs.length){ build(); idx=0; loadQ(); return; } document.getElementById('feedback').textContent='⏭️ تخطيت - الصح: '+qs[idx].correct; idx++; setTimeout(loadQ,600); }
function setType(t,btn){ document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); curType=t; idx=0; score=0; correct=0; build(); loadQ(); }
document.getElementById('nextBtn').onclick=()=>{ if(!locked && idx<qs.length) return; idx++; loadQ(); };
document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊 الصوت: شغال':'🔇 الصوت: مطفي'; if(soundOn) getCtx(); };
build(); loadQ();
</script></body></html>
