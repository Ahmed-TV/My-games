.answer{font-family:inherit;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1b7049,#10452f);border:1px solid #65bd87;border-radius:12px;padding:12px 6px;min-height:48px;cursor:pointer}
