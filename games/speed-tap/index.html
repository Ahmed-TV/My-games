<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>اختبر سرعتك | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout:none!important; -webkit-user-select:none!important; user-select:none!important; -moz-user-select:none!important; -ms-user-select:none!important; touch-action:manipulation; }
  html, body { height: 100%!important; height: 100svh!important; max-height:100svh!important; overflow: hidden!important; }
  body { font-family: Tahoma, Arial, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top, 4px) 8px env(safe-area-inset-bottom, 4px) 8px; overflow:hidden!important; }
  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 3px; }
  .logo-img{width:50px;height:50px;border-radius:50%;border:3px solid #facc15;object-fit:cover;background:#fff;flex-shrink:0;box-shadow:0 0 25px rgba(250,204,21,0.8)}
  h1 { font-size: 20px; line-height: 1.2; color: #facc15;}
  h1 small { display: block; font-size: 11px; color: #fff; letter-spacing: 1px; margin-top: 2px; }
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 4px; font-weight: bold;}
  .names b { color: #facc15; font-size: 14px;}
  .stats { display: flex; gap: 10px; justify-content: center; margin: 4px 0 6px; flex-wrap: wrap; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 4px 15px; min-width: 80px; text-align: center; }
  .stat b { display: block; font-size: 20px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }
  #game-container { width: 100%; max-width: 500px; flex:1; min-height: 0; position: relative; display: flex; flex-direction: column; background: #1e293b; border: 4px solid #f59e0b; border-radius: 16px; overflow: hidden; justify-content: center; align-items: center; }
  .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: rgba(255, 255, 255, 0.05); font-size: 40px; font-weight: 900; pointer-events: none; z-index: 0; white-space: nowrap; }
  #tapBtn { width: 80%; max-width: 280px; aspect-ratio: 1/1; border-radius: 50%; background: linear-gradient(135deg, #ef4444, #b91c1c); border: 8px solid #fff; box-shadow: 0 10px 0 #7f1d1d, 0 0 30px rgba(239, 68, 68, 0.6); color: #fff; font-size: 30px; font-weight: 900; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 1; transition: transform 0.05s, box-shadow 0.05s; }
  #tapBtn:active { transform: translateY(10px); box-shadow: 0 0 0 #7f1d1d, 0 0 30px rgba(239, 68, 68, 0.6); }
  #tapBtn:disabled { background: #475569; box-shadow: 0 10px 0 #1e293b, none; border-color: #64748b; cursor: not-allowed; }
  #overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 15px; gap: 10px; z-index: 10; pointer-events:auto; }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start { background: #f59e0b; color: #000; border: none; padding: 12px 25px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 200px; pointer-events:auto!important; position:relative; z-index:20; }
  .btn-start:active { transform: scale(0.95); }
  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 4px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body oncontextmenu="return false">
  <div class="header"><div class="top-row"><img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img"><h1>اختبر سرعتك<small>AHMED TV SPEED TAP</small></h1></div><div class="names">أحمد عبد العزيز • <b>Ahmed Abdelaziz</b></div><div class="stats"><div class="stat"><b id="score">0</b><span>الضغطات</span></div><div class="stat"><b id="time">10</b><span>ثواني</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div></div></div>
  <div id="game-container"><div class="watermark">Ahmed TV</div><button id="tapBtn" disabled>اضغط!</button><div id="overlay"><h2>اختبر سرعتك!</h2><p><b>Ahmed TV</b> - عندك 10 ثوان فقط!<br>اضغط على الزر أكبر عدد ممكن من المرات</p><button class="btn-start" id="startBtn">ابدأ التحدي</button></div></div>
  <div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">كل ألعابي</a></div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
var soundOn=true,_audioCache={},_ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
</script>
<script>
const tapBtn = document.getElementById('tapBtn');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
let score = 0;
let timeLeft = 10;
let gameActive = false;
let timerInterval = null;
let best = parseInt(localStorage.getItem('speedTapBest') || '0');
bestEl.textContent = best;
blockGoogle(tapBtn); blockGoogle(startBtn);
function playSound(type){ if(type==='tap') playAhmedVoice('hawel'); else if(type==='win') playAhmedVoice('kesebt'); }
function handleTap(e){ if(e) e.preventDefault(); if (!gameActive) return; score++; scoreEl.textContent = score; }
function startGame() {
  overlay.style.display = 'none';
  score = 0; timeLeft = 10;
  scoreEl.textContent = 0; timeEl.textContent = 10;
  gameActive = true;
  tapBtn.disabled = false;
  tapBtn.textContent = 'اضغط!';
  try{ playAhmedVoice('ebda'); }catch(e){}
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => { timeLeft--; timeEl.textContent = timeLeft; if (timeLeft <= 0) endGame(); }, 1000);
}
function endGame() {
  gameActive = false;
  clearInterval(timerInterval);
  tapBtn.disabled = true;
  tapBtn.textContent = 'انتهى الوقت!';
  playSound('win');
  if (score > best) { best = score; localStorage.setItem('speedTapBest', best); bestEl.textContent = best; }
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div style="font-size:35px">⚡</div><h2>سرعة مذهلة!</h2><p>ضغطت <b style="color:#facc15;font-size:22px">${score}</b> ضغطة في 10 ثوان<br>أعلى نتيجة: ${best}<br>أحمد TV يقول لك: ${score > 50 ? 'أنت صاروخ!' : 'حاول أسرع في المرة القادمة!'}</p><button class="btn-start" id="againBtn">العب مرة أخرى</button>`;
  var ab=document.getElementById('againBtn'); blockGoogle(ab);
  ab.addEventListener('click', onStartBtn); ab.addEventListener('pointerdown', onStartBtn, {passive:false}); ab.addEventListener('touchstart', onStartBtn, {passive:false});
}
var _starting=false;
function onStartBtn(e){ if(e){ try{ e.preventDefault(); }catch(err){} } if(_starting) return; _starting=true; startGame(); setTimeout(function(){ _starting=false; }, 800); }
// زرار الضغط: pointerdown واحد بس - mousedown + touchstart كانوا بيحسبوا الضغطة مرتين
tapBtn.addEventListener('pointerdown', handleTap, {passive:false});
startBtn.addEventListener('click', onStartBtn); startBtn.addEventListener('pointerdown', onStartBtn, {passive:false}); startBtn.addEventListener('touchstart', onStartBtn, {passive:false});
</script>
</body>
</html>
