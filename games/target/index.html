<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>التصويب على الأعداء | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px; }
  
  /* اللوجو الجديد */
  .logo {
    width: 75px; height: 75px; flex-shrink: 0;
    background: linear-gradient(135deg, #f43f5e, #f59e0b); 
    border: 4px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; line-height: 1;
    box-shadow: 0 0 20px rgba(244, 63, 94, 0.5);
  }
  .logo b { font-size: 15px; }
  .logo span { font-size: 9px; font-weight: 900; margin-top: 3px; }
  
  h1 { font-size: 24px; line-height: 1.2; color: #facc15;}
  h1 small { display: block; font-size: 12px; color: #fff; letter-spacing: 1px; margin-top: 2px; }
  
  .names { font-size: 18px; color: #cbd5e1; margin-bottom: 10px; font-weight: bold;}
  .names b { color: #facc15; font-size: 20px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin: 5px 0 10px; flex-wrap: wrap; }
  .stat {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 5px 15px; min-width: 80px; text-align: center;
  }
  .stat b { display: block; font-size: 20px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #38bdf8; /* سما */
    border: 4px solid #f59e0b; border-radius: 16px;
    overflow: hidden;
    cursor: crosshair;
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255, 255, 255, 0.2);
    font-size: 40px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  canvas { width: 100%; height: 100%; display: block; z-index: 1; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; }
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 15px 30px;
    border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 5px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>التصويب على الأعداء<small>AHMED TV SHOOTING</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div class="stats">
      <div class="stat"><b id="score">0</b><span>النقاط</span></div>
      <div class="stat"><b id="time">30</b><span>الوقت</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">أحمد عبدالعزيز<br>Ahmed TV</div>
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
      <h2>التصويب على الأعداء</h2>
      <p>
        <b>Ahmed TV</b> - دوس على البالونات!<br>
        عندك 30 ثانية .. اجمع أكتر نقاط!
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let W = 0, H = 0;
let running = false;
let score = 0;
let timeLeft = 30;
let best = parseInt(localStorage.getItem('targetBest') || '0');
bestEl.textContent = best;
let audioCtx = null;

let targets = [];
let timerInterval, spawnInterval, animFrame;

const EMOJIS = ['🎈', '👾', '🎯', '😈', '🦠'];
const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'hit') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'end') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
  
  if(!running) draw();
}

function createTarget() {
  if (!running) return;
  const radius = 25 + Math.random() * 15; // حجم واضح
  const x = radius + Math.random() * (W - radius * 2);
  const y = -radius; // يبدأ من فوق
  const speed = 1 + Math.random() * 1.5; // سرعة بطيئة
  const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  
  targets.push({ x, y, radius, speed, emoji, color, hit: false });
}

function draw() {
  // خلفية
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, 0, W, H);
  
  // سحاب
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(W*0.2, H*0.3, 40, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W*0.8, H*0.6, 50, 0, Math.PI*2); ctx.fill();

  // رسم الأهداف
  targets.forEach(t => {
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
    ctx.fillStyle = t.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    ctx.font = (t.radius * 1.2) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.emoji, t.x, t.y);
  });
}

function update() {
  if (!running) return;

  for (let i = targets.length - 1; i >= 0; i--) {
    let t = targets[i];
    t.y += t.speed;

    // لو خرج من الشاشة
    if (t.y - t.radius > H) {
      targets.splice(i, 1);
    }
  }
}

function loop() {
  update();
  draw();
  animFrame = requestAnimationFrame(loop);
}

function handleShoot(e) {
  if (!running) return;
  
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  
  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  
  // البحث عن هدف تم الضغط عليه
  for (let i = targets.length - 1; i >= 0; i--) {
    let t = targets[i];
    let dist = Math.hypot(x - t.x, y - t.y);
    
    if (dist <= t.radius) {
      // إصابة!
      score += 10;
      scoreEl.textContent = score;
      playSound('hit');
      
      // تأثير الانفجار
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(t.x, t.y, t.radius * 1.5, 0, Math.PI*2); ctx.fill();
      
      targets.splice(i, 1);
      break;
    }
  }
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  score = 0;
  timeLeft = 30;
  scoreEl.textContent = score;
  timeEl.textContent = timeLeft;
  targets = [];
  running = true;
  
  // توليد الأهداف كل 800 مللي ثانية
  if (spawnInterval) clearInterval(spawnInterval);
  spawnInterval = setInterval(createTarget, 800);
  
  // عداد الوقت
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);
  
  // بدء الحركة
  loop();
}

function endGame() {
  running = false;
  clearInterval(spawnInterval);
  clearInterval(timerInterval);
  cancelAnimationFrame(animFrame);
  playSound('end');
  
  if (score > best) {
    best = score;
    localStorage.setItem('targetBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">🏆</div>
    <h2>خلص الوقت!</h2>
    <p>جبت <b style="color:#facc15;font-size:24px">${score} نقطة</b><br>
    أعلى نتيجة: ${best}<br>
    ${score >= 100 ? 'ممتاز! إنت قناص محترف 🎯' : 'محاولة كويسة، حاول تاني!'}</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

canvas.addEventListener('mousedown', handleShoot);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleShoot(e); }, { passive: false });

startBtn.onclick = startGame;

window.addEventListener('resize', () => { resize(); if(!running) draw(); });

resize();
draw();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
