<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>الفرق بين الصورتين | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout:none!important; -webkit-user-select:none!important; user-select:none!important; -moz-user-select:none!important; -ms-user-select:none!important; touch-action:manipulation; }
  html, body { height: 100%!important; height: 100svh!important; max-height:100svh!important; overflow: hidden!important; }
  body { font-family: Tahoma, Arial, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top, 4px) 8px env(safe-area-inset-bottom, 4px) 8px; overflow:hidden!important; }
  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 3px; }
  .logo-img{width:50px;height:50px;border-radius:50%;border:3px solid #facc15;object-fit:cover;background:#000;flex-shrink:0}
  h1 { font-size: 20px; line-height: 1.2; }
  h1 small { display: block; font-size: 11px; color: #facc15; letter-spacing: 1px; margin-top: 2px; }
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
  .names b { color: #fff; }
  .stats { display: flex; gap: 15px; justify-content: center; margin-bottom: 6px; }
  .stat { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 4px 15px; min-width: 90px; text-align: center; }
  .stat b { display: block; font-size: 20px; color: #facc15; }
  .stat span { font-size: 11px; color: #94a3b8; }
  #game-container { width: 100%; max-width: 500px; flex:1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; position: relative; }
  .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: rgba(255, 255, 255, 0.03); font-size: 40px; font-weight: 900; pointer-events: none; z-index: 0; white-space: nowrap; }
  .image-box { width: 100%; flex:1; min-height:0; background: #1e293b; border: 3px solid #f59e0b; border-radius: 16px; position: relative; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; padding: 8px; gap: 4px; z-index: 1; overflow: hidden; }
  .image-box .item { font-size: 30px; transition: transform 0.2s; display: flex; justify-content: center; align-items: center; width: 15%; height: 25%; }
  .diff-spot { position: absolute; border: 3px solid #22c55e; border-radius: 50%; pointer-events: none; display: none; z-index: 5; animation: pop 0.4s ease-out; }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  #overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 15px; gap: 10px; border-radius: 16px; z-index: 10; pointer-events:auto; }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; }
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn { background: #f59e0b; color: #000; border: none; padding: 12px 25px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 250px; pointer-events:auto!important; position:relative; z-index:20; }
  .btn:active { transform: scale(0.95); }
  .btn:hover { background: #d97706; }
  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 6px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body oncontextmenu="return false">
  <div class="header">
    <div class="top-row"><img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img"><h1>الفرق بين الصورتين<small>AHMED TV SPOT THE DIFFERENCE</small></h1></div>
    <div class="names">أحمد عبد العزيز • <b>Ahmed Abdelaziz</b></div>
    <div class="stats"><div class="stat"><b id="score">0</b><span>المرحلة</span></div><div class="stat"><b id="found">0 / 3</b><span>الاختلافات</span></div></div>
  </div>
  <div id="game-container"><div class="watermark">أحمد عبد العزيز<br>Ahmed TV</div><div class="image-box" id="boxTop"></div><div class="image-box" id="boxBottom"></div><div id="overlay"><h2>لعبة الفرق بين الصورتين</h2><p><b>Ahmed TV</b> - ركز وابحث عن الفروق!<br>عندك صورتان، فيهما 3 اختلافات<br>اضغط على الاختلاف في أي صورة</p><button class="btn" id="startBtn">ابدأ اللعب</button></div></div>
  <div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">كل ألعابي</a></div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
var soundOn=true,_audioCache={},_ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
</script>
<script>
const boxTop = document.getElementById('boxTop');
const boxBottom = document.getElementById('boxBottom');
const scoreEl = document.getElementById('score');
const foundEl = document.getElementById('found');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
let level = 0;
let foundCount = 0;
let totalDiffs = 3;
let gameActive = false;
let currentTopItems = [];
let currentBottomItems = [];
let diffPositions = [];
const SHAPES = ['🍎','🍌','🍇','🍓','🍒','🥝','🍑','🍍','🍉','🥥','🍋','🍊','🍐','🫐','🍏'];
blockGoogle(startBtn); blockGoogle(boxTop); blockGoogle(boxBottom);
function playSound(type){ if(type==='click') playAhmedVoice('sah'); else if(type==='win') playAhmedVoice('kesebt'); else if(type==='wrong') playAhmedVoice('ghalat'); }
var _starting=false;
function onStartBtn(e){ if(e){ try{ e.preventDefault(); }catch(err){} } if(_starting) return; _starting=true; startGame(); setTimeout(function(){ _starting=false; }, 800); }
startBtn.addEventListener('click', onStartBtn);
startBtn.addEventListener('pointerdown', onStartBtn, {passive:false});
startBtn.addEventListener('touchstart', onStartBtn, {passive:false});
function startGame() {
  overlay.style.display = 'none';
  level = 1;
  scoreEl.textContent = level;
  try{ playAhmedVoice('ebda'); }catch(e){}
  startLevel();
  gameActive = true;
}
function startLevel() {
  foundCount = 0;
  foundEl.textContent = `0 / ${totalDiffs}`;
  boxTop.innerHTML = '';
  boxBottom.innerHTML = '';
  currentTopItems = [];
  currentBottomItems = [];
  diffPositions = [];
  for (let i = 0; i < 15; i++) {
    let randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    currentTopItems.push(randomShape);
    currentBottomItems.push(randomShape);
  }
  while (diffPositions.length < totalDiffs) {
    let r = Math.floor(Math.random() * 15);
    if (!diffPositions.includes(r)) diffPositions.push(r);
  }
  diffPositions.forEach(pos => {
    let newShape;
    do { newShape = SHAPES[Math.floor(Math.random() * SHAPES.length)]; } while (newShape === currentTopItems[pos]);
    currentBottomItems[pos] = newShape;
  });
  currentTopItems.forEach((shape, i) => {
    let el = document.createElement('div');
    el.className = 'item'; el.textContent = shape; el.dataset.index = i;
    blockGoogle(el);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); handleDiffClick(i, e, el); }, {passive:false});
    boxTop.appendChild(el);
  });
  currentBottomItems.forEach((shape, i) => {
    let el = document.createElement('div');
    el.className = 'item'; el.textContent = shape; el.dataset.index = i;
    blockGoogle(el);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); handleDiffClick(i, e, el); }, {passive:false});
    boxBottom.appendChild(el);
  });
}
function handleDiffClick(index, e, el) {
  if (!gameActive) return;
  if (diffPositions.includes(index)) {
    if (!el.classList.contains('found')) {
      el.classList.add('found');
      foundCount++;
      foundEl.textContent = `${foundCount} / ${totalDiffs}`;
      playSound('click');
      el.style.background = 'rgba(34, 197, 94, 0.3)';
      el.style.borderRadius = '50%';
      // علم على نفس المكان في الصورة التانية كمان - عشان الطفل يشوفه
      var otherBox = (el.parentElement === boxTop) ? boxBottom : boxTop;
      var otherEl = otherBox.children[index];
      if (otherEl && !otherEl.classList.contains('found')) { otherEl.classList.add('found'); otherEl.style.background = 'rgba(34, 197, 94, 0.3)'; otherEl.style.borderRadius = '50%'; }
      if (foundCount === totalDiffs) {
        gameActive = false;
        playSound('win');
        setTimeout(() => { level++; scoreEl.textContent = level; showLevelComplete(); }, 500);
      }
    }
  } else {
    playSound('wrong');
    el.style.background = 'rgba(239, 68, 68, 0.3)';
    setTimeout(() => { el.style.background = 'transparent'; }, 300);
  }
}
function showLevelComplete() {
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div style="font-size:35px">🎉</div><h2 style="color:#10b981">أحسنت! وجدت كل الفروق!</h2><p>الآن ستلعب مرحلة أصعب قليلا.</p><button class="btn" id="nextLevelBtn">المرحلة التالية</button>`;
  var nb=document.getElementById('nextLevelBtn'); blockGoogle(nb);
  function onNext(e){ if(e){ try{ e.preventDefault(); }catch(err){} } overlay.style.display='none'; startLevel(); gameActive=true; }
  nb.addEventListener('click', onNext); nb.addEventListener('pointerdown', onNext, {passive:false}); nb.addEventListener('touchstart', onNext, {passive:false});
}
</script>
</body>
</html>
