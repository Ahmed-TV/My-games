<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>الفرق بين الصورتين | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
  
  .logo {
    width: 55px; height: 55px; flex-shrink: 0;
    background: radial-gradient(circle, #fde047, #f59e0b 55%, #b45309);
    border: 3px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #111; line-height: 1;
  }
  .logo b { font-size: 12px; }
  .logo span { font-size: 8px; font-weight: 900; margin-top: 2px; }
  
  h1 { font-size: 20px; line-height: 1.2; }
  h1 small { display: block; font-size: 11px; color: #facc15; letter-spacing: 1px; margin-top: 2px; }
  
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 10px; }
  .names b { color: #fff; }

  .stats { display: flex; gap: 15px; justify-content: center; margin-bottom: 10px; }
  .stat {
    background: #1e293b; border: 2px solid #334155; border-radius: 12px;
    padding: 8px 15px; min-width: 90px; text-align: center;
  }
  .stat b { display: block; font-size: 20px; color: #facc15; }
  .stat span { font-size: 11px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
    position: relative;
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255, 255, 255, 0.03);
    font-size: 40px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  .image-box {
    width: 100%; aspect-ratio: 4/3;
    background: #1e293b; border: 3px solid #f59e0b; border-radius: 16px;
    position: relative; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    padding: 10px; gap: 5px; z-index: 1; overflow: hidden;
  }
  
  .image-box .item {
    font-size: 30px;
    transition: transform 0.2s;
    user-select: none;
    display: flex; justify-content: center; align-items: center;
    width: 15%; height: 25%;
  }

  /* التظليل على الأماكن اللي فيها فرق */
  .diff-spot {
    position: absolute;
    border: 3px solid #22c55e;
    border-radius: 50%;
    pointer-events: none;
    display: none; /* مخفي لحد ما يلاقيه */
    z-index: 5;
    animation: pop 0.4s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; border-radius: 16px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; }
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 250px;
  }
  .btn:active { transform: scale(0.95); }
  .btn:hover { background: #d97706; }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 10px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>الفرق بين الصورتين<small>AHMED TV SPOT THE DIFFERENCE</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div class="stats">
      <div class="stat"><b id="score">0</b><span>المرحلة</span></div>
      <div class="stat"><b id="found">0 / 3</b><span>الاختلافات</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">أحمد عبدالعزيز<br>Ahmed TV</div>
    
    <div class="image-box" id="boxTop"></div>
    <div class="image-box" id="boxBottom"></div>

    <div id="overlay">
      <h2>لعبة الفرق بين الصورتين</h2>
      <p>
        <b>Ahmed TV</b> - ركز وشوف الفروق!<br>
        عندك صورتين، فيهم 3 اختلافات<br>
        دوس على الاختلاف في أي صورة
      </p>
      <button class="btn" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const boxTop = document.getElementById('boxTop');
const boxBottom = document.getElementById('boxBottom');
const scoreEl = document.getElementById('score');
const foundEl = document.getElementById('found');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let level = 0;
let foundCount = 0;
let totalDiffs = 3;
let gameActive = false;
let audioCtx = null;
let currentTopItems = [];
let currentBottomItems = [];
let diffPositions = []; // الأماكن اللي فيها فرق (Index)

// الأشكال المتاحة
const SHAPES = ['🍎','🍌','🍇','🍓','🍒','🥝','🍑','🍍','🍉','🥥','🍋','🍊','🍐','🫐','🍏'];

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'click') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'win') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  level = 1;
  scoreEl.textContent = level;
  startLevel();
  gameActive = true;
}

function startLevel() {
  foundCount = 0;
  foundEl.textContent = `0 / ${totalDiffs}`;
  boxTop.innerHTML = '';
  boxBottom.innerHTML = '';
  
  // تجهيز الأشكال العشوائية (نفس الأشكال في اللوحتين)
  currentTopItems = [];
  currentBottomItems = [];
  diffPositions = [];
  
  // هنستخدم 15 مكان (5x3)
  for (let i = 0; i < 15; i++) {
    let randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    currentTopItems.push(randomShape);
    currentBottomItems.push(randomShape);
  }
  
  // اختيار 3 أماكن عشوائية للاختلاف
  while (diffPositions.length < totalDiffs) {
    let r = Math.floor(Math.random() * 15);
    if (!diffPositions.includes(r)) diffPositions.push(r);
  }
  
  // تغيير الأشكال في اللوحة السفلية في أماكن الاختلاف
  diffPositions.forEach(pos => {
    let newShape;
    do {
      newShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    } while (newShape === currentTopItems[pos]); // نتأكد إنه شكل مختلف
    currentBottomItems[pos] = newShape;
  });
  
  // رسم اللوحة العلوية
  currentTopItems.forEach((shape, i) => {
    let el = document.createElement('div');
    el.className = 'item';
    el.textContent = shape;
    el.dataset.index = i;
    el.addEventListener('click', (e) => handleDiffClick(i, e, el));
    boxTop.appendChild(el);
  });
  
  // رسم اللوحة السفلية
  currentBottomItems.forEach((shape, i) => {
    let el = document.createElement('div');
    el.className = 'item';
    el.textContent = shape;
    el.dataset.index = i;
    el.addEventListener('click', (e) => handleDiffClick(i, e, el));
    boxBottom.appendChild(el);
  });
}

function handleDiffClick(index, e, el) {
  if (!gameActive) return;
  
  if (diffPositions.includes(index)) {
    // لو داس على فرق صح
    if (!el.classList.contains('found')) {
      el.classList.add('found');
      foundCount++;
      foundEl.textContent = `${foundCount} / ${totalDiffs}`;
      playSound('click');
      
      // تلوين الخلية
      el.style.background = 'rgba(34, 197, 94, 0.3)';
      el.style.borderRadius = '50%';
      
      // لو خلص الفروق
      if (foundCount === totalDiffs) {
        gameActive = false;
        playSound('win');
        setTimeout(() => {
          level++;
          scoreEl.textContent = level;
          showLevelComplete();
        }, 500);
      }
    }
  } else {
    // لو داس على حتة غلط
    playSound('wrong');
    el.style.background = 'rgba(239, 68, 68, 0.3)';
    setTimeout(() => {
      el.style.background = 'transparent';
    }, 300);
  }
}

function showLevelComplete() {
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">🎉</div>
    <h2 style="color:#10b981">عاش! لقيت كل الفروق!</h2>
    <p>دلوقتي هتلعب مرحلة أصعب شوية.</p>
    <button class="btn" id="nextLevelBtn">▶ المرحلة التالية</button>
  `;
  document.getElementById('nextLevelBtn').onclick = () => {
    overlay.style.display = 'none';
    startLevel();
    gameActive = true;
  };
}

// ربط زرار البداية
startBtn.onclick = startGame;

// تشغيل الصوت لأول مرة
document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });

</script>
</body>
</html>
