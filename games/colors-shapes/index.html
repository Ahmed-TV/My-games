<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ahmed TV - لعبة الألوان والأشكال</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-y:auto;overflow-x:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#FF6B6B,#FFD93D,#6BCB77,#4D96FF,#9B5DE5);display:flex;justify-content:center;padding:4px 8px}
.game{width:100%;max-width:500px;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF9C4,#FFECB3,#E1BEE7,#BBDEFB);border:4px solid #7B1FA2;border-radius:50px 50px 20px 20px;padding:8px;position:relative;box-shadow:0 0 0 6px #fff, 0 0 0 9px #7B1FA2, 0 10px 30px rgba(0,0,0,.25)}
.food-bg{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.food-bg span{position:absolute;font-size:34px;opacity:.25;transform:rotate(-12deg)}
.game>*:not(.food-bg){position:relative;z-index:1}
header{padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.logo-img{width:88px;height:88px;border-radius:50%;border:4px solid #D32F2F;object-fit:cover;background:#fff;margin-bottom:4px}
.brand{font-size:22px;font-weight:900;color:#B71C1C}
.names{font-size:22px;font-weight:900;color:#B71C1C}
.names small{display:block;font-size:16px;color:#D32F2F;font-weight:900}
.type-row{display:flex;gap:5px;width:100%;margin:6px 0;flex-shrink:0}
.type-btn{flex:1;padding:8px 2px;border-radius:10px;border:2px solid #D32F2F;background:#fff;color:#B71C1C;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit}
.type-btn.active{background:#D32F2F;color:#fff}
.progress-wrap{width:100%;height:8px;background:#FFCDD2;border-radius:10px;margin:2px 0;overflow:hidden;flex-shrink:0}
.progress{height:100%;background:linear-gradient(90deg,#D32F2F,#FF8A65);width:0%;transition:width .3s}
.prog-text{text-align:center;font-size:12px;font-weight:800;color:#B71C1C;margin-bottom:4px;flex-shrink:0}
.qbox{background:rgba(255,255,255,.92);border:2px dashed #7B1FA2;border-radius:14px;padding:8px;text-align:center;flex-shrink:0;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qicon{font-size:52px}
.qtext{font-size:19px;font-weight:800;color:#B71C1C;margin-top:6px;line-height:1.4}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex-shrink:0;min-height:102px}
.answer{font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#D32F2F,#FF8A65);border:0;border-radius:12px;padding:10px 5px;min-height:44px;cursor:pointer}
.answer.correct{background:#2E7D32}
.answer.wrong{background:#333}
.answer:disabled{opacity:.9}
.feedback{min-height:20px;font-size:12px;font-weight:700;color:#B71C1C;text-align:center;margin:4px 0;flex-shrink:0}
.btn-row{display:flex;gap:7px;flex-shrink:0;background:rgba(255,255,255,.95);padding:6px 0;border-top:2px dashed #7B1FA2;margin-top:6px}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:20px;padding:11px 10px;background:#D32F2F;color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:11px 6px;background:#fff;color:#B71C1C;cursor:pointer;font-size:13px}
footer{text-align:center;color:#D32F2F;font-size:11px;margin-top:4px;padding-bottom:4px;flex-shrink:0}
footer a{color:#D32F2F;text-decoration:none;font-weight:700}
</style></head>
<body><div class="game"><div class="food-bg">
<span style="top:2%;left:4%">🔴</span><span style="top:3%;right:5%;font-size:28px">🟦</span><span style="top:14%;left:1%;font-size:26px">🔺</span><span style="top:16%;right:2%">🟡</span><span style="top:32%;left:2%;font-size:30px">🟥</span><span style="top:34%;right:1%;font-size:26px">⭐</span><span style="top:52%;left:1%">🟣</span><span style="top:54%;right:2%;font-size:30px">🟩</span><span style="top:72%;left:2%;font-size:26px">❤️</span><span style="top:74%;right:1%">🔷</span><span style="bottom:12%;left:6%;font-size:28px">🎨</span><span style="bottom:13%;right:6%">🌈</span><span style="bottom:2%;left:38%;font-size:26px">🟧</span><span style="top:8%;left:42%;font-size:24px">⬛</span><span style="top:44%;left:44%;font-size:22px;opacity:.14">🔶</span>
</div>
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">لعبة الألوان والأشكال</div><div class="names">أحمد عبدالعزيز<small>Ahmed TV</small></div><button id="soundBtn" style="margin:5px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:6px 18px;background:#fff;color:#B71C1C;cursor:pointer;font-size:12px">الصوت: شغال</button></header>
<div style="display:flex;flex-direction:column">
<div class="type-row"><button class="type-btn active" onclick="setType('الكل',this)">الكل</button><button class="type-btn" onclick="setType('لون',this)">اللون</button><button class="type-btn" onclick="setType('خلط',this)">الخلط</button><button class="type-btn" onclick="setType('شكل',this)">الشكل</button></div>
<div class="progress-wrap"><div class="progress" id="prog"></div></div>
<div class="prog-text" id="progText">السؤال 1</div>
<div class="qbox"><div class="qicon" id="qicon">🎨</div><div class="qtext" id="qText">اللون ده اسمه إيه؟</div></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback">يلا! اختر الصح</div>
<div class="btn-row"><button class="skipbtn" onclick="skipQ()">تخطي</button><button class="mainbtn" id="nextBtn" disabled>السؤال التالي</button></div>
</div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
const DATA=[{kind:"color",n:"أحمر",hex:"#E53935",mix:"أزرق + أصفر",ex:"تفاحة"},{kind:"color",n:"أزرق",hex:"#1E88E5",mix:"أحمر + أبيض",ex:"البحر"},{kind:"color",n:"أخضر",hex:"#43A047",mix:"أزرق + أصفر",ex:"ورق الشجر"},{kind:"color",n:"أصفر",hex:"#FDD835",mix:"أحمر + أبيض",ex:"الموز"},{kind:"color",n:"برتقالي",hex:"#FB8C00",mix:"أحمر + أصفر",ex:"البرتقال"},{kind:"color",n:"بنفسجي",hex:"#8E24AA",mix:"أزرق + أحمر",ex:"العنب"},{kind:"color",n:"وردي",hex:"#EC407A",mix:"أحمر + أبيض",ex:"الورد"},{kind:"color",n:"بني",hex:"#6D4C41",mix:"أحمر + أخضر",ex:"الشوكولاتة"},{kind:"color",n:"أسود",hex:"#212121",mix:"أحمر + أزرق + أصفر",ex:"الليل"},{kind:"color",n:"أبيض",hex:"#FAFAFA",mix:"أحمر + أخضر + أزرق",ex:"الثلج"},{kind:"color",n:"رمادي",hex:"#78909C",mix:"أسود + أبيض",ex:"السحاب"},{kind:"color",n:"ذهبي",hex:"#FFB300",mix:"أصفر + برتقالي",ex:"الذهب"},{kind:"color",n:"سماوي",hex:"#29B6F6",mix:"أزرق + أبيض",ex:"السماء"},{kind:"color",n:"زيتي",hex:"#558B2F",mix:"أخضر + بني",ex:"الزيتون"},{kind:"color",n:"كحلي",hex:"#283593",mix:"أزرق + أسود",ex:"بدلة"},{kind:"color",n:"بيج",hex:"#D7CCC8",mix:"بني + أبيض",ex:"الرمل"},{kind:"color",n:"تركوازي",hex:"#00ACC1",mix:"أزرق + أخضر",ex:"البحر"},{kind:"color",n:"فوشيا",hex:"#D81B60",mix:"وردي + بنفسجي",ex:"ورد"},{kind:"color",n:"ليموني",hex:"#C0CA33",mix:"أصفر + أخضر",ex:"الليمون"},{kind:"color",n:"نبيتي",hex:"#6A1B2A",mix:"أحمر + بني",ex:"عنب"},{kind:"color",n:"سيمون",hex:"#FF8A65",mix:"برتقالي + وردي",ex:"خوخ"},{kind:"color",n:"موف",hex:"#7E57C2",mix:"بنفسجي + أبيض",ex:"لافندر"},{kind:"color",n:"أخضر فاتح",hex:"#7CB342",mix:"أخضر + أصفر",ex:"نعناع"},{kind:"color",n:"أزرق غامق",hex:"#1565C0",mix:"أزرق + أسود",ex:"البحر بالليل"},{kind:"color",n:"أحمر فاتح",hex:"#EF5350",mix:"أحمر + وردي",ex:"فراولة"},{kind:"shape",n:"دايرة",sides:"0",ex:"عجلة العربية",icon:"🔴"},{kind:"shape",n:"مربع",sides:"4",ex:"علبة",icon:"🟥"},{kind:"shape",n:"مثلث",sides:"3",ex:"الهرم",icon:"🔺"},{kind:"shape",n:"مستطيل",sides:"4",ex:"الباب",icon:"▭"},{kind:"shape",n:"نجمة",sides:"5",ex:"نجمة البحر",icon:"⭐"},{kind:"shape",n:"قلب",sides:"0",ex:"قلب",icon:"❤️"},{kind:"shape",n:"سداسي",sides:"6",ex:"خلية النحل",icon:"⬡"},{kind:"shape",n:"خماسي",sides:"5",ex:"كورة",icon:"⬟"},{kind:"shape",n:"معين",sides:"4",ex:"طيارة ورق",icon:"◆"},{kind:"shape",n:"بيضاوي",sides:"0",ex:"البيضة",icon:"🥚"},{kind:"shape",n:"مكعب",sides:"6",ex:"مكعب روبيك",icon:"🧊"},{kind:"shape",n:"مخروط",sides:"1",ex:"آيس كريم",icon:"🍦"},{kind:"shape",n:"أسطوانة",sides:"0",ex:"علبة بيبسي",icon:"🥫"},{kind:"shape",n:"هرم",sides:"4",ex:"هرم الجيزة",icon:"🔺"},{kind:"shape",n:"هلال",sides:"0",ex:"الهلال",icon:"🌙"},{kind:"shape",n:"سهم",sides:"3",ex:"علامة الطريق",icon:"➡️"},{kind:"shape",n:"صليب",sides:"4",ex:"زائد",icon:"➕"},{kind:"shape",n:"مخمس",sides:"5",ex:"نجمة",icon:"⭐"},{kind:"shape",n:"مثمن",sides:"8",ex:"علامة قف",icon:"🛑"},{kind:"shape",n:"شبه منحرف",sides:"4",ex:"طاولة",icon:"⏢"},{kind:"shape",n:"نصف دايرة",sides:"1",ex:"قوس قزح",icon:"🌈"},{kind:"shape",n:"دمعة",sides:"0",ex:"قطرة مية",icon:"💧"},{kind:"shape",n:"فراشة",sides:"0",ex:"فراشة",icon:"🦋"},{kind:"shape",n:"ورقة شجر",sides:"0",ex:"ورقة",icon:"🍃"},{kind:"shape",n:"سحابة",sides:"0",ex:"سحابة",icon:"☁️"}];
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
let soundOn=true,audioCtx=null;
var _ac={};
function voice(k){if(!soundOn)return;try{if(!_ac[k]){_ac[k]=new Audio('../../sounds/'+k+'.mp3');_ac[k].preload='auto';}var a=_ac[k];a.currentTime=0;var pr=a.play();if(pr)pr.catch(function(){});}catch(e){}}

function getCtx(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
document.addEventListener('pointerdown',()=>{getCtx();});
document.addEventListener('touchstart',()=>{getCtx();});
function tone(f,dur,vol,type,delay,slideTo){if(!soundOn)return;const ctx=getCtx();if(!ctx)return;try{const t0=ctx.currentTime+(delay||0);const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.02);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.08);}catch(e){}}
function noise(dur,vol,delay){if(!soundOn)return;const ctx=getCtx();if(!ctx)return;try{const t0=ctx.currentTime+(delay||0);const len=ctx.sampleRate*dur;const buf=ctx.createBuffer(1,len,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;const g=ctx.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);src.connect(f);f.connect(g);g.connect(ctx.destination);src.start(t0);}catch(e){}}
function playCorrect(){voice('sah');}
function playWrong(){voice('ghalat');}
function playSkip(){tone(600,0.2,0.2,'sine',0,900);}
let curType='الكل',qs=[],idx=0,score=0,correct=0,locked=false;
const HARD=["بنفسجي","سداسي","مثمن","مخروط","خماسي","تركوازي","شبه منحرف","نبيتي","فوشيا","زيتي","كحلي","موف","سيمون","مخمس","هرم","مكعب"];
const EMOJI={"تفاحة":"🍎","البحر":"🌊","ورق الشجر":"🍃","الموز":"🍌","البرتقال":"🍊","العنب":"🍇","الورد":"🌹","الشوكولاتة":"🍫","الليل":"🌙","الثلج":"❄️","السحاب":"☁️","الذهب":"🥇","السماء":"☀️","الزيتون":"🫒","بدلة":"👔","الرمل":"🏖️","ورد":"🌹","الليمون":"🍋","عنب":"🍇","خوخ":"🍑","لافندر":"💜","نعناع":"🌿","البحر بالليل":"🌊","فراولة":"🍓"};
function build(){voice('ebda');qs=[];let seen=new Set();DATA.forEach(c=>{let allTypes=c.kind==="color"?['لون','خلط','مثال-لون','عكس-لون']:['شكل','اضلاع','مثال-شكل','عكس-شكل'];let types=curType==='الكل'?allTypes:(curType==='لون'||curType==='خلط'?(c.kind==="color"?[curType]:[]):(curType==='شكل'?(c.kind==="shape"?['شكل','اضلاع']:[]):[curType]));if(curType==='الكل'){types=allTypes;}types.forEach(t=>{let q='',corr='',pool=[],icon='',colorHex='',shapeIcon='';if(t==='لون'){q='اللون ده اسمه إيه؟';corr=c.n;pool=DATA.filter(x=>x.kind==="color").map(x=>x.n);icon='🎨';colorHex=c.hex;}if(t==='خلط'){q='لو خلطنا '+c.mix+' يطلع لون إيه؟';corr=c.n;pool=DATA.filter(x=>x.kind==="color").map(x=>x.n);icon='🎨';}if(t==='مثال-لون'){q='لون '+c.ex+' إيه؟';corr=c.n;pool=DATA.filter(x=>x.kind==="color").map(x=>x.n);icon=EMOJI[c.ex]||'🎨';}if(t==='عكس-لون'){q='اللون '+c.n+' بيتعمل من خلط إيه؟';corr=c.mix;pool=DATA.filter(x=>x.kind==="color").map(x=>x.mix);icon='🎨';}if(t==='شكل'){q='الشكل ده اسمه إيه؟';corr=c.n;pool=DATA.filter(x=>x.kind==="shape").map(x=>x.n);icon=c.icon;shapeIcon=c.icon;}if(t==='اضلاع'){q='شكل '+c.n+' ليه كام ضلع؟';corr=c.sides;pool=["0","1","3","4","5","6","8"];icon=c.icon;}if(t==='مثال-شكل'){q='إيه الحاجة اللي شكلها '+c.n+'؟';corr=c.ex;pool=DATA.filter(x=>x.kind==="shape").map(x=>x.ex);icon=c.icon;}if(t==='عكس-شكل'){q='الحاجة اللي هي '+c.ex+' شكلها إيه؟';corr=c.n;pool=DATA.filter(x=>x.kind==="shape").map(x=>x.n);icon=c.icon;}let key=q+'|'+corr;if(seen.has(key))return;seen.add(key);let others=shuffle([...new Set(pool.filter(x=>x!==corr))]).slice(0,3);if(new Set([corr,...others]).size<4)return;qs.push({q:q,correct:corr,opts:shuffle([corr,...others]),icon:icon,colorHex:colorHex,shapeIcon:shapeIcon,name:c.n});});});let hard=[],other=[];qs.forEach(q=>{let isHard=HARD.some(h=>q.q.includes(h)||q.name===h);if(isHard)hard.push(q);else other.push(q);});qs=[...shuffle(hard),...shuffle(other)];}
function loadQ(){if(idx>=qs.length){voice(correct>=Math.ceil(qs.length*0.6)?'kesebt':'khesert');document.getElementById('qText').textContent='خلصت الـ '+qs.length+' سؤال!';document.getElementById('feedback').textContent='نتيجتك: '+score+' - صح: '+correct;document.getElementById('answers').innerHTML='';return;}locked=false;let it=qs[idx];let qi=document.getElementById('qicon');if(it.colorHex){qi.innerHTML='<div style="width:72px;height:72px;border-radius:16px;border:3px solid #333;background:'+it.colorHex+';margin:0 auto"></div>';}else{qi.textContent=it.icon;}document.getElementById('qText').textContent=it.q;document.getElementById('prog').style.width=((idx+1)/qs.length*100)+'%';document.getElementById('progText').textContent='السؤال '+(idx+1)+' / '+qs.length;document.getElementById('feedback').textContent='السؤال '+(idx+1)+' من '+qs.length;let ans=document.getElementById('answers');ans.innerHTML='';it.opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>choose(o===it.correct,b,it);ans.appendChild(b);});document.getElementById('nextBtn').disabled=true;}
function choose(ok,btn,it){if(locked)return;locked=true;[...document.getElementById('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===it.correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');});if(ok){playCorrect();score+=10;correct++;document.getElementById('feedback').textContent='صح! +10';}else{playWrong();document.getElementById('feedback').textContent='غلط - الصح: '+it.correct;}document.getElementById('nextBtn').disabled=false;}
function skipQ(){playSkip();if(idx>=qs.length){build();idx=0;loadQ();return;}document.getElementById('feedback').textContent='تخطيت - الصح: '+qs[idx].correct;idx++;setTimeout(loadQ,600);}
function setType(t,btn){document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');curType=t;idx=0;score=0;correct=0;build();loadQ();}
document.getElementById('nextBtn').onclick=()=>{if(!locked&&idx<qs.length)return;idx++;loadQ();};
document.getElementById('soundBtn').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'الصوت: شغال':'الصوت: مطفي';if(soundOn)getCtx();};
build();loadQ();
</script>

</body></html>
