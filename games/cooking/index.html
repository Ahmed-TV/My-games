<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لعبة الطبخ | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px;}
  
  .logo-img {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 3px solid #facc15;
    object-fit: cover;
    box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
    margin-bottom: 2px;
  }
  
  h1 { font-size: 18px; line-height: 1.2; color: #facc15; margin: 0;}
  .names { font-size: 12px; color: #cbd5e1; margin-bottom: 2px; font-weight: bold;}
  .names b { color: #facc15; font-size: 14px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin: 2px 0; flex-wrap: wrap; }
  .stat {
    background: #1e293b; border: 1px solid #334155; border-radius: 8px;
    padding: 2px 10px; min-width: 70px; text-align: center;
  }
  .stat b { display: block; font-size: 16px; color: #facc15; }
  .stat span { font-size: 9px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #fef3c7; 
    border: 4px solid #f59e0b; border-radius: 16px;
    overflow: hidden;
    padding: 8px;
    gap: 8px; /* مسافة بين الأقسام */
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(0, 0, 0, 0.05);
    font-size: 40px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  /* لوحة الطلب */
  .order-panel {
    background: #fff; border-radius: 10px; padding: 5px;
    text-align: center; flex-shrink: 0; z-index: 1;
    border: 2px solid #f59e0b;
    max-height: 25%; /* حد أقصى لارتفاع الطلب */
    overflow-y: auto;
  }
  .order-title { font-size: 12px; color: #b45309; margin-bottom: 2px; font-weight: bold;}
  .order-items {
    display: flex; flex-direction: column-reverse; align-items: center; gap: 0px;
  }
  .order-item { font-size: 24px; line-height: 1;}

  /* ساحة التجميع */
  .build-area {
    flex-grow: 1; background: #fff7ed; border-radius: 10px;
    display: flex; flex-direction: column-reverse; justify-content: flex-start; align-items: center;
    padding: 5px; position: relative; z-index: 1;
    border: 2px dashed #d97706;
    overflow-y: auto; /* لو كترت المكونات تتحرك جوه بس */
  }
  .build-item { font-size: 30px; line-height: 1; animation: pop 0.2s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  /* المكونات */
  .ingredients {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
    z-index: 1; flex-shrink: 0;
  }
  .ing-btn {
    background: #f59e0b; border-radius: 8px; padding: 5px;
    font-size: 26px; text-align: center; cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    user-select: none;
    border: 2px solid #b45309;
    color: #fff;
    height: 50px; /* ارتفاع ثابت */
    display: flex; justify-content: center; align-items: center;
  }
  .ing-btn:active { transform: scale(0.9); background: #d97706; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <h1>لعبة الطبخ</h1>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>الأطباق</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    
    <div class="order-panel">
      <div class="order-title">جهز الطبق ده:</div>
      <div class="order-items" id="orderItems"></div>
    </div>

    <div class="build-area" id="buildArea"></div>

    <div class="ingredients" id="ingredients"></div>

    <div id="overlay">
      <h2>لعبة الطبخ</h2>
      <p>
        <b>Ahmed TV</b> - جهز الأطباق بالترتيب!
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ الطبخ</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const orderItemsEl = document.getElementById('orderItems');
const buildArea = document.getElementById('buildArea');
const ingredientsEl = document.getElementById('ingredients');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let score = 0;
let best = parseInt(localStorage.getItem('cookingBest') || '0');
bestEl.textContent = best;

let currentOrder = [];
let currentBuild = [];
let isRunning = false;
let audioCtx = null;

const INGREDIENTS = {
  'مكرونة': '🍝',
  'صوص': '🍅',
  'جبنة': '🧀',
  'لحمة': '🥩',
  'خضار': '🥦',
  'بيض': '🥚',
  'خبز': '🍞',
  'طبق': '🍽️'
};

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'click') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'success') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'fail') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }
}

function buildIngredients() {
  ingredientsEl.innerHTML = '';
  for (let key in INGREDIENTS) {
    let btn = document.createElement('div');
    btn.className = 'ing-btn';
    btn.textContent = INGREDIENTS[key];
    btn.onclick = () => addIngredient(key);
    ingredientsEl.appendChild(btn);
  }
}

function newOrder() {
  currentOrder = [];
  let keys = Object.keys(INGREDIENTS).filter(k => k !== 'طبق');
  let count = 2 + Math.floor(Math.random() * 2); // 2 أو 3 مكونات عشان ميكبرش أوي
  
  for(let i=0; i<count; i++) {
    currentOrder.push(keys[Math.floor(Math.random() * keys.length)]);
  }
  currentOrder.push('طبق'); 

  orderItemsEl.innerHTML = '';
  currentOrder.forEach(ing => {
    let span = document.createElement('div');
    span.className = 'order-item';
    span.textContent = INGREDIENTS[ing];
    orderItemsEl.appendChild(span);
  });

  currentBuild = [];
  buildArea.innerHTML = '';
}

function addIngredient(key) {
  if (!isRunning) return;
  
  playSound('click');
  
  currentBuild.push(key);
  let item = document.createElement('div');
  item.className = 'build-item';
  item.textContent = INGREDIENTS[key];
  buildArea.appendChild(item);
  
  // سكرول لآخر عنصر عشان يبان
  buildArea.scrollTop = buildArea.scrollHeight;

  let currentIndex = currentBuild.length - 1;
  if (currentBuild[currentIndex] !== currentOrder[currentIndex]) {
    playSound('fail');
    isRunning = false;
    setTimeout(() => {
      endGame("غلط! الترتيب مش صح");
    }, 500);
    return;
  }

  if (currentBuild.length === currentOrder.length) {
    playSound('success');
    score++;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('cookingBest', best);
      bestEl.textContent = best;
    }
    isRunning = false;
    setTimeout(() => {
      isRunning = true;
      newOrder();
    }, 800);
  }
}

function endGame(msg) {
  isRunning = false;
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">🍳</div>
    <h2>${msg}</h2>
    <p>جهزت <b style="color:#facc15;font-size:22px">${score}</b> طبق<br>
    أعلى نتيجة: ${best}</p>
    <button class="btn-start" id="againBtn">🔄 اطبخ تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  score = 0;
  scoreEl.textContent = score;
  isRunning = true;
  buildIngredients();
  newOrder();
}

startBtn.onclick = startGame;
document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
