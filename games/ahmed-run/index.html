<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>Ahmed TV - لعبة الجري والمغامرة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%!important;height:100svh!important;max-height:100svh!important;overflow:hidden!important;overscroll-behavior:none}
body{font-family:Tahoma,Arial,sans-serif;background:#FFD93D;display:flex;justify-content:center;padding:3px 6px env(safe-area-inset-bottom,3px) 6px}
.game{width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFE066 0%,#FFF3B0 25%,#A7F3D0 55%,#7DD3FC 100%);border:4px solid #FF6B35;border-radius:38px 38px 18px 18px;padding:5px 7px;position:relative}
header{padding:1px 0 2px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0;position:relative;z-index:2}
.logo-img{width:52px;height:52px;border-radius:50%;border:3px solid #FF6B35;object-fit:cover;background:#fff;margin-bottom:1px}
.brand{font-size:19px;font-weight:900;color:#C2410C}
.names{font-size:19px;font-weight:900;color:#C2410C}
.names small{display:block;font-size:13px;color:#EA580C;font-weight:900}
.stats{display:flex;gap:4px;width:100%;margin:3px 0;position:relative;z-index:2;flex-shrink:0}
.stat{flex:1;background:#fff;border:1.5px solid #FF6B35;border-radius:9px;padding:2px 1px;text-align:center;line-height:1.1}
.stat b{display:block;font-size:13px;color:#C2410C}
.stat span{font-size:9px;font-weight:800;color:#666}
#view{width:100%;flex-grow:1;min-height:0;background:linear-gradient(180deg,#87CEEB 0%,#BFEFFF 35%,#7ED957 70%,#4CAF50 100%);border:2px solid #FF6B35;border-radius:16px;overflow:hidden;position:relative;flex-shrink:0}
#view canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,107,53,.55);color:#fff;text-align:center;padding:12px;z-index:5}
#overlay h2{font-size:24px;margin-bottom:6px}
#overlay p{font-size:13px;line-height:1.6;font-weight:800}
#overlay button{margin-top:10px;font-family:inherit;font-weight:900;border:0;border-radius:20px;padding:11px 24px;background:#FFD600;color:#C2410C;font-size:16px;cursor:pointer}
.feedback{min-height:16px;font-size:11px;font-weight:800;color:#C2410C;text-align:center;margin:3px 0 2px 0;flex-shrink:0}
.controls{direction:ltr!important;display:flex;flex-direction:row!important;gap:6px;width:100%;margin-top:2px;flex-shrink:0}
.cbtn{flex:1;font-family:inherit;font-weight:900;border:2px solid #FF6B35;border-radius:16px;padding:11px 2px;background:#fff;color:#C2410C;font-size:16px;cursor:pointer}
.cbtn.jump{flex:1.2;background:#FFD600}
.btn-row{display:flex;gap:6px;width:100%;margin-top:4px;flex-shrink:0}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:18px;padding:7px 10px;background:#FF6B35;color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #FF6B35;border-radius:18px;padding:7px 6px;background:#fff;color:#C2410C;cursor:pointer;font-size:13px}
footer{text-align:center;color:#C2410C;font-size:10px;margin-top:2px;padding-bottom:2px;flex-shrink:0}
footer a{color:#C2410C;text-decoration:none;font-weight:700}
</style></head>
<body><div class="game">
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">لعبة الجري والمغامرة</div><div class="names">أحمد عبدالعزيز<small>Ahmed TV</small></div><button id="soundBtn" style="margin:3px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #FF6B35;border-radius:20px;padding:3px 14px;background:#fff;color:#C2410C;cursor:pointer;font-size:11px">الصوت: شغال</button></header>
<div class="stats"><div class="stat"><b id="score">0</b><span>النقط</span></div><div class="stat"><b id="coins">0</b><span>عملات</span></div><div class="stat"><b id="best">0</b><span>أعلى سكور</span></div></div>
<div id="view"><canvas id="cv"></canvas><div id="overlay"><h2>جاهز تجري؟</h2><p>حرك البطل يمين وشمال<br>نط من فوق الحواجز<br>ولم العملات الدهبية</p><button onclick="startGame()">ابدأ اللعب</button></div></div>
<div class="feedback" id="feedback">على مهلك خالص - الحاجات بتنزل ببطء قوي!</div>
<div class="controls" dir="ltr"><button class="cbtn" id="btnLeft">◀ شمال</button><button class="cbtn jump" id="btnJump">نط!</button><button class="cbtn" id="btnRight">يمين ▶</button></div>
<div class="btn-row"><button class="skipbtn" onclick="location.reload()">من الأول</button><button class="mainbtn" onclick="startGame()">لعبة جديدة</button></div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
const cv=document.getElementById('cv'),ctx2=cv.getContext('2d');
let W=0,H=0,score=0,coins=0,best=+(localStorage.getItem('ahmed_run_best')||0);
document.getElementById('best').textContent=best;
let playing=false,over=false,px=0.5,py=0,vy=0,speed=1.2,tick=0,objs=[],clouds=[],trees=[],flowers=[];
let soundOn=true;
var _ahmedAudio=null;
var _ahlaPlayed=false;
function getAhmedAudio(){ if(!_ahmedAudio){ _ahmedAudio=new Audio(); _ahmedAudio.preload='auto'; } return _ahmedAudio; }
function playAhmedVoice(name){ try{ if(!soundOn) return; var a=getAhmedAudio(); try{a.pause();}catch(e){} a.src='../../sounds/'+name+'.mp3'; a.currentTime=0; a.volume=1; var pr=a.play(); if(pr) pr.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
function sndCoin(){playAhmedVoice('sah');}
function sndJump(){}
function sndHit(){playAhmedVoice('khesert');}
document.getElementById('soundBtn').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'الصوت: شغال':'الصوت: مطفي';};
function resize(){let r=cv.parentElement.getBoundingClientRect();W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio;cv.style.width=r.width+'px';cv.style.height=r.height+'px';}
window.addEventListener('resize',resize);resize();
for(let i=0;i<5;i++)clouds.push({x:Math.random(),y:Math.random()*0.25,s:0.6+Math.random()*0.7,v:0.00015+Math.random()*0.0002});
for(let i=0;i<8;i++)trees.push({x:i/8+Math.random()*0.08,y:0.62+Math.random()*0.08});
for(let i=0;i<14;i++)flowers.push({x:Math.random(),y:0.85+Math.random()*0.12,c:['🌷','🌻','🌸','🌼','🍄'][i%5]});
function spawn(){let lane=Math.random();let isCoin=Math.random()<0.5;objs.push({x:0.15+lane*0.7,y:-0.1,isCoin:isCoin,h:isCoin?0.5:0.7,taken:false});}
function draw(){
let w=W,h=H;
let g=ctx2.createLinearGradient(0,0,0,h);g.addColorStop(0,'#FFD93D');g.addColorStop(0.25,'#87CEEB');g.addColorStop(0.55,'#A7F3D0');g.addColorStop(1,'#4ADE80');ctx2.fillStyle=g;ctx2.fillRect(0,0,w,h);
let sx=w*0.82,sy=h*0.16,sr=h*0.09;
ctx2.fillStyle='#FFD600';ctx2.beginPath();ctx2.arc(sx,sy,sr,0,7);ctx2.fill();
ctx2.strokeStyle='#FFA500';ctx2.lineWidth=3*devicePixelRatio;for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx2.beginPath();ctx2.moveTo(sx+Math.cos(a)*(sr+4),sy+Math.sin(a)*(sr+4));ctx2.lineTo(sx+Math.cos(a)*(sr+14),sy+Math.sin(a)*(sr+14));ctx2.stroke();}
ctx2.fillStyle='#000';ctx2.font=(h*0.03)+'px Arial';ctx2.textAlign='center';ctx2.fillText('◕‿◕',sx,sy+h*0.01);
ctx2.lineWidth=h*0.015;let cols=['#FF0000','#FF7F00','#FFFF00','#00FF00','#0000FF','#8B00FF'];
cols.forEach((c,i)=>{ctx2.strokeStyle=c;ctx2.globalAlpha=0.6;ctx2.beginPath();ctx2.arc(w*0.18,h*0.52,h*0.32+i*h*0.015,Math.PI,Math.PI*1.9);ctx2.stroke();});ctx2.globalAlpha=1;
clouds.forEach(cl=>{cl.x+=cl.v;if(cl.x>1.2)cl.x=-0.2;let cx=cl.x*w,cy=cl.y*h,cs=cl.s*h*0.12;ctx2.fillStyle='rgba(255,255,255,.95)';ctx2.beginPath();ctx2.arc(cx,cy,cs,0,7);ctx2.arc(cx+cs*0.8,cy+cs*0.2,cs*0.8,0,7);ctx2.arc(cx-cs*0.8,cy+cs*0.2,cs*0.7,0,7);ctx2.fill();});
ctx2.fillStyle='#34D399';ctx2.beginPath();ctx2.moveTo(0,h*0.62);ctx2.lineTo(w*0.2,h*0.42);ctx2.lineTo(w*0.4,h*0.62);ctx2.lineTo(w*0.6,h*0.38);ctx2.lineTo(w*0.8,h*0.62);ctx2.lineTo(w,h*0.5);ctx2.lineTo(w,h*0.62);ctx2.closePath();ctx2.fill();
ctx2.fillStyle='#8D6E63';ctx2.beginPath();ctx2.moveTo(w*0.08,h);ctx2.lineTo(w*0.42,h*0.62);ctx2.lineTo(w*0.58,h*0.62);ctx2.lineTo(w*0.92,h);ctx2.closePath();ctx2.fill();
ctx2.strokeStyle='#fff';ctx2.lineWidth=4*devicePixelRatio;ctx2.setLineDash([18*devicePixelRatio,14*devicePixelRatio]);ctx2.lineDashOffset=-(tick*2)%32;ctx2.beginPath();ctx2.moveTo(w*0.5,h*0.62);ctx2.lineTo(w*0.5,h);ctx2.stroke();ctx2.setLineDash([]);
trees.forEach(t=>{t.y+=0.002;if(t.y>1.05)t.y=0.62;let ty=t.y*h;let s=(t.y-0.6)*2+0.4;ctx2.font=(h*0.08*s)+'px Arial';ctx2.fillText(t.x<0.5?'🌳':'🌴',t.x*w,ty);});
flowers.forEach(f=>{ctx2.font=(h*0.04)+'px Arial';ctx2.fillText(f.c,f.x*w,f.y*h);});
objs.forEach(o=>{let oy=o.y*h,sc=0.5+o.y*0.8;if(o.isCoin){ctx2.font=(h*0.07*sc)+'px Arial';ctx2.fillText('🪙',o.x*w,oy);}else{ctx2.font=(h*0.09*sc)+'px Arial';ctx2.fillText('🧱',o.x*w,oy);}});
let bx=px*w,by=h*0.88-py*h*0.35,bs=1+py*0.2;
let runFrame=Math.floor(tick/6)%2===0?'🏃':'🏃‍♂️';
ctx2.font=(h*0.11*bs)+'px Arial';ctx2.fillText(runFrame,bx,by);
ctx2.fillStyle='rgba(0,0,0,.2)';ctx2.beginPath();ctx2.ellipse(bx,h*0.9,w*0.06*bs,h*0.01,0,0,7);ctx2.fill();
if(over){ctx2.fillStyle='rgba(0,0,0,.3)';ctx2.fillRect(0,0,w,h);}
}
function update(){
tick++;
if(playing&&!over){
if(moveL)px=Math.max(0.15,px-0.02);
if(moveR)px=Math.min(0.85,px+0.02);
if(vy!==0||py>0){py+=vy;vy-=0.008;if(py<=0){py=0;vy=0;}}
if(tick%140===0)spawn();
speed=Math.min(2.2,1.2+score/4000);
for(let i=objs.length-1;i>=0;i--){let o=objs[i];o.y+=0.0016+speed*0.0003;if(o.y>1){objs.splice(i,1);continue;}
let dx=Math.abs(o.x-px),dy=Math.abs(o.y-0.88+py*0.35);
if(dx<0.09&&dy<0.12){if(o.isCoin){objs.splice(i,1);coins++;score+=50;sndCoin();updateHUD();}else if(py<0.25){gameOver();}}}
score+=1;updateHUD();
}else{
if(tick%160===0)spawn();
for(let i=objs.length-1;i>=0;i--){objs[i].y+=0.0012;if(objs[i].y>1)objs.splice(i,1);}
}
draw();requestAnimationFrame(update);
}
function updateHUD(){document.getElementById('score').textContent=score;document.getElementById('coins').textContent=coins;}
function gameOver(){
over=true;playing=false;sndHit();
if(score>best){best=score;localStorage.setItem('ahmed_run_best',best);document.getElementById('best').textContent=best;}
let ov=document.getElementById('overlay');ov.style.display='flex';
ov.innerHTML='<h2>خبطت!</h2><p>سكورك: '+score+'<br>عملات: '+coins+'<br>أعلى سكور: '+best+'</p><button onclick="startGame()">العب تاني</button>';
}
function startGame(){
playAhmedVoice('ebda');
objs=[];score=0;coins=0;px=0.5;py=0;vy=0;speed=1.2;over=false;playing=true;
document.getElementById('overlay').style.display='none';
document.getElementById('feedback').textContent='اجري! نط من الحواجز ولم العملات!';
updateHUD();
}
function jump(){if(!playing||over)return;if(py===0){vy=0.18;sndJump();}}
let moveL=false,moveR=false;
document.getElementById('btnLeft').addEventListener('pointerdown',()=>moveL=true);
document.getElementById('btnLeft').addEventListener('pointerup',()=>moveL=false);
document.getElementById('btnLeft').addEventListener('pointerleave',()=>moveL=false);
document.getElementById('btnRight').addEventListener('pointerdown',()=>moveR=true);
document.getElementById('btnRight').addEventListener('pointerup',()=>moveR=false);
document.getElementById('btnRight').addEventListener('pointerleave',()=>moveR=false);
document.getElementById('btnJump').addEventListener('pointerdown',()=>jump());
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')moveL=true;if(e.key==='ArrowRight')moveR=true;if(e.key===' '||e.key==='ArrowUp')jump();});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')moveL=false;if(e.key==='ArrowRight')moveR=false;});
let sx=0;
cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
cv.addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-sx;if(dx>20){px=Math.min(0.85,px+0.3);sx=e.touches[0].clientX;}if(dx<-20){px=Math.max(0.15,px-0.3);sx=e.touches[0].clientX;}},{passive:true});
cv.addEventListener('touchend',()=>{if(playing)jump();});
update();
</script>
</body></html>
