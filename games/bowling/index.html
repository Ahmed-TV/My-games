<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>البولينج | أحمد عبدالعزيز</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
html, body { overflow-y: auto; overflow-x: hidden; }
body { font-family: Tahoma, Arial, sans-serif; background: #0a001a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 4px 4px 4px 4px; }
.header { width: 100%; max-width: 500px; text-align: center; }
.top-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2px; }
.logo-wrap { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; border: 4px solid #facc15; background: #000; flex-shrink: 0; }
.logo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
h1 { font-size: 26px; color: #ff2d95; line-height: 1.2; }
h1 small { display: block; font-size: 13px; color: #00e5ff; }
.names { text-align: center; line-height: 1.3; margin-bottom: 6px; }
.names .ar { display: block; font-size: 22px; color: #facc15; font-weight: 900; }
.names .en { display: block; font-size: 16px; color: #fff; font-weight: 900; }
.stats { display: flex; gap: 8px; justify-content: center; margin: 4px 0 6px; }
.stat { background: #1a0033; border: 2px solid #ff2d95; border-radius: 10px; padding: 3px 12px; min-width: 85px; text-align: center; }
.stat b { display: block; font-size: 16px; color: #00e5ff; }
.stat span { font-size: 9px; color: #c4b5fd; }
.how { width: 100%; max-width: 500px; background: #facc15; color: #000; border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; font-weight: 900; line-height: 1.4; margin-bottom: 6px; }
#game-container { width: 100%; max-width: 500px; height: 320px; position: relative; background: #fef3c7; border: 3px solid #f59e0b; border-radius: 16px; overflow: hidden; touch-action: none; }
@media (max-width: 600px) {
  #game-container { height: 400px; }
}
.watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(0,0,0,0.04); font-size: 28px; font-weight: 900; pointer-events: none; white-space: nowrap; z-index: 1; }
canvas { width: 100%; height: 100%; display: block; touch-action: none; position: relative; z-index: 2; }
.controls { display: flex; direction: ltr; gap: 6px; width: 100%; max-width: 500px; margin-top: 6px; }
.ctrl-btn { flex: 1; background: #1a0033; color: #fff; border: 2px solid #f59e0b; border-radius: 10px; padding: 10px 4px; font-size: 18px; font-weight: 900; cursor: pointer; }
.ctrl-btn:active { background: #ff2d95; }
#throwBtn { width: 100%; max-width: 500px; margin-top: 6px; background: linear-gradient(90deg,#f59e0b,#ff2d95,#7c3aed); color: #fff; border: 2px solid #fff; border-radius: 10px; padding: 8px; font-size: 20px; font-weight: 900; cursor: pointer; }
#overlay { position: absolute; inset: 0; background: rgba(10,0,26,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px; gap: 8px; z-index: 10; }
#overlay h2 { font-size: 22px; color: #f59e0b; }
#overlay p { line-height: 1.5; font-size: 13px; color: #fff; }
.btn-start { background: linear-gradient(90deg,#f59e0b,#ff2d95); color: #fff; border: 2px solid #fff; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 200px; }
#game-wrap { position: relative; width: 100%; max-width: 500px; }
</style>
</head>
<body oncontextmenu="return false">
<div class="header">
<div class="top-row"><div class="logo-wrap"><img src="../../logo.png" alt="أحمد عبدالعزيز"></div><h1>البولينج<small>بولينج الأبطال</small></h1></div>
<div class="names"><span class="ar">أحمد عبدالعزيز</span><span class="en">Ahmed TV</span></div>
<div class="stats"><div class="stat"><b id="score">0</b><span>النقاط 🎳</span></div><div class="stat"><b id="throws">0</b><span>الرميات</span></div><div class="stat"><b id="strikes">0</b><span>سترايك 🔥</span></div></div>
</div>
<div class="how">حرّك الكورة يمين وشمال - ودوس ارمي 🎳<br>وقّع الـ 10 قوارير = سترايك!</div>
<div id="game-wrap"><div id="game-container"><div class="watermark">أحمد عبدالعزيز</div><canvas id="gameCanvas"></canvas><div id="overlay"><h2>🎳 البولينج</h2><p>حرّك الكورة بالزراير اللي تحت<br>ودوس ارمي - حاول توقّع كل القوارير<br>يلا يا بطل!</p><button class="btn-start" id="startBtn">▶ ابدأ اللعب</button></div></div></div>
<div class="controls"><button class="ctrl-btn" id="leftBtn">◀ شمال</button><button class="ctrl-btn" id="rightBtn">يمين ▶</button></div>
<button id="throwBtn">🎳 ارمي الكورة</button>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),throwsEl=document.getElementById('throws'),strikesEl=document.getElementById('strikes'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),throwBtn=document.getElementById('throwBtn'),leftBtn=document.getElementById('leftBtn'),rightBtn=document.getElementById('rightBtn');
let W=0,H=0,started=false,score=0,throws=0,strikes=0,ballX=0,ballY=0,rolling=false,pins=[],msg='';
let audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function beep(f,d=0.1,type='square',v=0.1){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d);}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
function setupPins(){
pins=[];
let rows=[[0],[ -32,32],[ -64,0,64],[ -96,-32,32,96]];
let baseY=58;
rows.forEach((row,ri)=>{
let y=baseY+ri*36;
row.forEach(dx=>{pins.push({x:W/2+dx,y:y,down:false,rx:0,ry:0,rot:0});});
});
}
function resize(){const r=canvas.parentElement.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;ballX=W/2;ballY=H-46;setupPins();draw();}
function drawPin(x,y,rot){
ctx.save();ctx.translate(x,y);ctx.rotate(rot);
ctx.fillStyle='#ffffff';ctx.strokeStyle='#1f2937';ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(-6,-18);
ctx.bezierCurveTo(-7,-12,-10,-8,-11,0);
ctx.bezierCurveTo(-12,8,-10,14,-7,18);
ctx.lineTo(7,18);
ctx.bezierCurveTo(10,14,12,8,11,0);
ctx.bezierCurveTo(10,-8,7,-12,6,-18);
ctx.closePath();ctx.fill();ctx.stroke();
ctx.beginPath();ctx.arc(0,-20,7,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle='#dc2626';
ctx.fillRect(-7,-10,14,3);
ctx.fillRect(-8,-5,16,2);
ctx.restore();
}
function drawBall(x,y){
ctx.save();
let g=ctx.createRadialGradient(x-8,y-8,4,x,y,26);
g.addColorStop(0,'#4b5563');g.addColorStop(0.5,'#111827');g.addColorStop(1,'#000000');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#e5e7eb';
ctx.beginPath();ctx.arc(x-6,y-7,3.2,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(x+4,y-9,3.2,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(x-1,y-1,3.2,0,Math.PI*2);ctx.fill();
ctx.restore();
}
function draw(){
ctx.fillStyle='#fef3c7';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fde68a';ctx.fillRect(W/2-125,8,250,H-16);
ctx.strokeStyle='#92400e';ctx.lineWidth=3;ctx.strokeRect(W/2-125,8,250,H-16);
ctx.strokeStyle='rgba(146,64,14,0.25)';ctx.lineWidth=1;
for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(W/2-125+i*62,8);ctx.lineTo(W/2-125+i*62,H-8);ctx.stroke();}
pins.forEach(p=>{
if(p.down){drawPin(p.x+p.rx,p.y+p.ry,p.rot);}
else {drawPin(p.x,p.y,0);}
});
drawBall(ballX,ballY);
ctx.fillStyle='#000';ctx.font='900 18px Tahoma';ctx.textAlign='center';
if(msg)ctx.fillText(msg,W/2,26);
}
function moveLeft(){if(rolling)return;ballX=Math.max(W/2-85,ballX-22);draw();}
function moveRight(){if(rolling)return;ballX=Math.min(W/2+85,ballX+22);draw();}
function throwBall(){
if(!started||rolling)return;initAudio();rolling=true;throws++;throwsEl.textContent=throws;beep(400,0.1);msg='';
let startY=ballY;let step=0;
let iv=setInterval(()=>{
step++;ballY-=13;beep(300+step*5,0.02,'sine',0.03);draw();
if(ballY<=108){
clearInterval(iv);
let knocked=0;
pins.forEach(p=>{
let dist=Math.abs(p.x-ballX);
let chance=dist<16?0.95:dist<36?0.8:dist<60?0.55:dist<90?0.3:0.1;
if(Math.random()<chance){p.down=true;p.rx=(Math.random()-0.5)*50;p.ry=Math.random()*22;p.rot=(Math.random()-0.5)*1.6;knocked++;}
});
score+=knocked*10;scoreEl.textContent=score;
if(knocked===10){strikes++;strikesEl.textContent=strikes;msg='🔥 سترايك! +100';score+=100;scoreEl.textContent=score;beep(600,0.1);setTimeout(()=>beep(800,0.1),100);setTimeout(()=>beep(1000,0.2),200);}
else if(knocked>=7){msg='🎉 برافو! وقّعت '+knocked+' !';beep(700,0.12);}
else if(knocked>=4){msg='👏 كويس! وقّعت '+knocked;beep(500,0.1);}
else if(knocked>0){msg='وقّعت '+knocked+' - حاول تاني';beep(400,0.1);}
else {msg='😢 مفيش ولا واحدة - حاول تاني';beep(150,0.2,'sawtooth');}
draw();
setTimeout(()=>{ballY=startY;ballX=W/2;rolling=false;msg='';if(knocked===10||throws%3===0){setupPins();}draw();},1200);
}
},30);
}
function startGame(){initAudio();started=true;score=0;throws=0;strikes=0;scoreEl.textContent=0;throwsEl.textContent=0;strikesEl.textContent=0;overlay.style.display='none';ballX=W/2;ballY=H-46;setupPins();draw();}
leftBtn.addEventListener('touchstart',e=>{e.preventDefault();initAudio();moveLeft();},{passive:false});
rightBtn.addEventListener('touchstart',e=>{e.preventDefault();initAudio();moveRight();},{passive:false});
leftBtn.addEventListener('click',()=>{initAudio();moveLeft();});
rightBtn.addEventListener('click',()=>{initAudio();moveRight();});
throwBtn.addEventListener('touchstart',e=>{e.preventDefault();throwBall();},{passive:false});
throwBtn.addEventListener('click',()=>throwBall());
canvas.addEventListener('touchstart',e=>{e.preventDefault();initAudio();let x=e.touches[0].clientX-canvas.getBoundingClientRect().left;ballX=Math.max(W/2-85,Math.min(W/2+85,x));draw();},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')moveLeft();if(e.code==='ArrowRight')moveRight();if(e.code==='Space'){e.preventDefault();throwBall();}});
startBtn.addEventListener('click',()=>startGame());
window.addEventListener('resize',()=>resize());
resize();draw();
</script>
</body>
</html>
