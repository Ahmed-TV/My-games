<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ahmed TV - تحدي الأذكياء 200 سؤال</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at top,#0a0a0a 0%,#111 50%,#000 100%);color:#fff;font-family:'Segoe UI',Tahoma,system-ui;height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;overflow-y:auto;overflow-x:hidden}
.container{width:100%;max-width:680px;background:linear-gradient(145deg,#111,#0a0a0a);border-radius:24px;border:3px solid #7ED321;box-shadow:0 0 40px rgba(126,211,33,.3);margin:0 auto;overflow:visible}
.header{background:linear-gradient(135deg,#8FFF00,#00E676,#4CAF50);padding:24px 16px;text-align:center;border-bottom:4px solid #000;border-radius:21px 21px 0 0}
.logo{width:95px;height:95px;margin:0 auto 12px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid #fff;color:#7ED321;font-weight:900;font-size:14px;line-height:1.1;text-align:center;box-shadow:0 0 20px rgba(126,211,33,.5)}
.title{color:#000;font-weight:900;font-size:34px;letter-spacing:1px;text-shadow:1px 1px 0 rgba(255,255,255,.5)}
.subtitle{color:#000;font-weight:900;font-size:24px;margin-top:8px}
.info-box{background:#fff;color:#111;font-weight:800;padding:10px 18px;border-radius:20px;display:inline-block;margin-top:12px;font-size:16px;line-height:1.5}
.cats-bar{margin-top:10px;background:rgba(0,0,0,.85);color:#8FFF00;padding:8px 14px;border-radius:18px;font-size:12px;display:inline-block;font-weight:800}
.progress{padding:14px 18px;background:#1a1a1a;display:flex;justify-content:space-between;color:#aaa;font-weight:800;font-size:15px;border-bottom:2px solid #222}
.bar{height:14px;background:#000;border-bottom:3px solid #222}
.fill{height:100%;background:linear-gradient(90deg,#7ED321,#00E676);width:0%;transition:.4s;box-shadow:0 0 15px rgba(126,211,33,.5)}
.card{padding:20px 16px 24px}
.cat-badge{display:inline-block;background:linear-gradient(135deg,#7ED321,#00E676);color:#000;padding:6px 16px;border-radius:16px;margin-bottom:14px;font-weight:900;font-size:15px;border:2px solid #fff}
.q{font-size:24px;font-weight:900;text-align:center;background:linear-gradient(145deg,#1e1e1e,#111);padding:20px 16px;border-radius:18px;border:2px solid #333;margin-bottom:16px;min-height:90px;display:flex;align-items:center;justify-content:center;line-height:1.5;color:#FFF8E1}
.opts{display:grid;gap:12px}
.opt{background:linear-gradient(145deg,#222,#1a1a1a);border:2px solid #333;border-radius:16px;padding:16px 12px;text-align:center;font-size:20px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;transition:transform .1s,background .2s}
.opt:hover{border-color:#7ED321;background:rgba(126,211,33,.1)}
.opt:active{transform:scale(.97)}
.opt.correct{background:linear-gradient(135deg,#00C853,#00E676)!important;color:#000!important;border-color:#fff!important;animation:pop .4s}
.opt.wrong{background:linear-gradient(135deg,#B71C1C,#EF5350)!important;color:#fff!important;border-color:#ff4444!important;animation:shake .4s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;font-weight:900;pointer-events:none;z-index:999;animation:fbPop .8s ease-out forwards}
@keyframes fbPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}50%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.skip-wrap{text-align:center;padding:14px;background:rgba(0,0,0,.6)}
.skip-btn{background:linear-gradient(135deg,#444,#222);color:#ccc;border:2px solid #555;padding:11px 26px;border-radius:24px;font-weight:900;font-size:16px;font-family:inherit;cursor:pointer}
.footer{text-align:center;padding:10px;font-size:12px;color:#7ED321;background:#000;font-weight:700;border-radius:0 0 21px 21px}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(160deg,rgba(10,10,10,.98),rgba(0,0,0,.99));display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;z-index:1000;text-align:center;overflow-y:auto}
.screen h2{color:#7ED321;font-size:32px;margin-bottom:12px;font-weight:900}
.screen p{font-size:16px;line-height:1.7;background:rgba(255,255,255,.05);padding:14px 20px;border-radius:14px;border:1px solid #333;max-width:92%;margin-bottom:16px;color:#ddd}
.screen button{background:linear-gradient(135deg,#7ED321,#00E676);color:#000;border:3px solid #fff;padding:14px 38px;border-radius:50px;font-weight:900;font-size:20px;cursor:pointer;font-family:inherit;box-shadow:0 8px 25px rgba(126,211,33,.5)}
.hide{display:none!important}
@media(max-width:500px){.header{padding:18px 12px}.logo{width:80px;height:80px;font-size:12px}.title{font-size:26px}.subtitle{font-size:18px}.info-box{font-size:14px;padding:8px 14px}.cats-bar{font-size:10px}.progress{font-size:13px}.q{font-size:19px;padding:16px 12px}.opt{font-size:17px;padding:14px 10px}.cat-badge{font-size:13px}.screen h2{font-size:24px}.screen p{font-size:13px;padding:10px 14px}.screen button{font-size:16px;padding:12px 30px}}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">TV<br>AHMED</div>
    <div class="title">AHMED TV</div>
    <div class="subtitle">🌟 تحدي الأذكياء 🌟</div>
    <div class="info-box">200 سؤال ممتع<br>اختبر معلوماتك</div>
    <div class="cats-bar">⚽ رياضة • 🌍 جغرافيا • 📜 تاريخ • 🚗 سيارات • 🧠 جسم • 🔬 علوم</div>
  </div>

  <div class="progress">
    <span id="qn">1 / 200</span>
    <span id="sc">0 نقطة</span>
  </div>
  <div class="bar"><div class="fill" id="fill"></div></div>

  <div class="card">
    <div style="text-align:center">
      <span class="cat-badge" id="cat">⚽ رياضة</span>
    </div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
  </div>

  <div class="skip-wrap">
    <button class="skip-btn" onclick="skip()">تخطي ⏭️</button>
  </div>

  <div class="footer">Ahmed TV - تحدي الأذكياء 200 سؤال 🏆</div>
</div>

<div class="screen hide" id="endScreen">
  <h2 id="endTitle">🏆 النتيجة</h2>
  <p id="endMessage"></p>
  <button onclick="location.reload()">🔄 العب تاني</button>
</div>

<script>
var score = 0, correctCount = 0, idx = 0;
var playing = true, canAnswer = true;

var qs=[
{"q":"نادي الأهلي المصري من أي بلد؟","o":["المغرب","السعودية","مصر","تونس"],"a":2,"c":"رياضة"},
{"q":"ما عاصمة مصر؟","o":["القاهرة","أسوان","الجيزة","الإسكندرية"],"a":0,"c":"جغرافيا"},
{"q":"متى بدأت الثورة الفرنسية؟","o":["1914","1789","1492","1939"],"a":1,"c":"تاريخ"},
{"q":"ما شركة سيارة كورولا؟","o":["تويوتا","مرسيدس","هوندا","فورد"],"a":0,"c":"سيارات"},
{"q":"كم حجرة للقلب؟","o":["4","3","5","2"],"a":0,"c":"جسم"},
{"q":"كم كوكب في المجموعة الشمسية؟","o":["9","10","7","8"],"a":3,"c":"علوم"},
{"q":"نادي الزمالك من أي بلد؟","o":["السعودية","مصر","الجزائر","المغرب"],"a":1,"c":"رياضة"},
{"q":"ما عاصمة السعودية؟","o":["مكة","الرياض","الدمام","جدة"],"a":1,"c":"جغرافيا"},
{"q":"متى بدأت الحرب العالمية الأولى؟","o":["1914","1789","1945","1939"],"a":0,"c":"تاريخ"},
{"q":"ما شركة سيارة كامري؟","o":["هوندا","نيسان","تويوتا","هيونداي"],"a":2,"c":"سيارات"},
{"q":"ما أكبر عضو في الجسم؟","o":["الجلد","المخ","الكبد","القلب"],"a":0,"c":"جسم"},
{"q":"ما أقرب كوكب للشمس؟","o":["المريخ","الزهرة","عطارد","الأرض"],"a":2,"c":"علوم"},
{"q":"نادي بيراميدز من أي بلد؟","o":["مصر","الإمارات","السعودية","قطر"],"a":0,"c":"رياضة"},
{"q":"ما عاصمة الإمارات؟","o":["الشارقة","أبو ظبي","العين","دبي"],"a":1,"c":"جغرافيا"},
{"q":"متى بدأت الحرب العالمية الثانية؟","o":["1967","1789","1939","1914"],"a":2,"c":"تاريخ"},
{"q":"ما شركة سيارة لاند كروزر؟","o":["فورد","مرسيدس","نيسان","تويوتا"],"a":3,"c":"سيارات"},
{"q":"ما لون الدم؟","o":["أزرق","أحمر","أخضر","أصفر"],"a":1,"c":"جسم"},
{"q":"ما أكبر كوكب؟","o":["زحل","المشتري","المريخ","الأرض"],"a":1,"c":"علوم"},
{"q":"نادي الهلال السعودي من أي بلد؟","o":["السعودية","قطر","الكويت","الإمارات"],"a":0,"c":"رياضة"},
{"q":"ما عاصمة قطر؟","o":["الريان","الخور","الدوحة","الوكرة"],"a":2,"c":"جغرافيا"},
{"q":"متى انتهت الحرب العالمية الثانية؟","o":["1918","1945","1939","1967"],"a":1,"c":"تاريخ"},
{"q":"ما شركة سيارة هايلوكس؟","o":["تويوتا","شيفروليه","نيسان","فورد"],"a":0,"c":"سيارات"},
{"q":"كم عظمة في الجسم؟","o":["206","150","100","300"],"a":0,"c":"جسم"},
{"q":"ما الكوكب الأحمر؟","o":["عطارد","المريخ","المشتري","الزهرة"],"a":1,"c":"علوم"},
{"q":"نادي النصر السعودي من أي بلد؟","o":["الإمارات","مصر","السعودية","قطر"],"a":2,"c":"رياضة"},
{"q":"ما عاصمة الكويت؟","o":["حولي","الأحمدي","الجهراء","الكويت"],"a":3,"c":"جغرافيا"},
{"q":"من اكتشف أمريكا؟","o":["فاسكو دا غاما","كولومبوس","ماركو بولو","ماجلان"],"a":1,"c":"تاريخ"},
{"q":"ما شركة سيارة سيفيك؟","o":["تويوتا","هيونداي","هوندا","نيسان"],"a":2,"c":"سيارات"},
{"q":"ما وظيفة القلب؟","o":["هضم الطعام","ضخ الدم","التنفس","تنقية الدم"],"a":1,"c":"جسم"},
{"q":"من اكتشف الجاذبية؟","o":["نيوتن","أينشتاين","غاليليو","إديسون"],"a":0,"c":"علوم"}
];

var CAT_EMOJI = {"رياضة":"⚽","جغرافيا":"🌍","تاريخ":"📜","سيارات":"🚗","جسم":"🧠","علوم":"🔬"};

var scoreEl = document.getElementById('sc');
var qnEl = document.getElementById('qn');
var fillEl = document.getElementById('fill');
var qEl = document.getElementById('q');
var optsEl = document.getElementById('opts');
var catEl = document.getElementById('cat');

function showFeedback(emoji){
  var fb = document.createElement('div');
  fb.className = 'feedback';
  fb.textContent = emoji;
  document.body.appendChild(fb);
  setTimeout(function(){ fb.remove(); }, 800);
}

function render(){
  var cur = qs[idx];
  qnEl.textContent = (idx+1) + ' / ' + qs.length;
  scoreEl.textContent = score + ' نقطة';
  fillEl.style.width = (idx / qs.length * 100) + '%';
  catEl.textContent = (CAT_EMOJI[cur.c] || '❓') + ' ' + cur.c;
  qEl.textContent = cur.q;
  optsEl.innerHTML = '';
  canAnswer = true;
  cur.o.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = t;
    b.onclick = function(){ handleAnswer(i, b); };
    optsEl.appendChild(b);
  });
}

function handleAnswer(i, btn){
  if(!playing || !canAnswer) return;
  canAnswer = false;
  var cur = qs[idx];
  if(i === cur.a){
    score += 10;
    correctCount++;
    scoreEl.textContent = score + ' نقطة';
    btn.classList.add('correct');
    showFeedback('✅');
    setTimeout(function(){ if(playing) nextQuestion(); }, 700);
  } else {
    btn.classList.add('wrong');
    optsEl.children[cur.a].classList.add('correct');
    showFeedback('❌');
    setTimeout(function(){ if(playing) nextQuestion(); }, 1100);
  }
}

function nextQuestion(){
  idx++;
  if(idx >= qs.length){ endGame(); return; }
  render();
}

function skip(){
  if(!playing) return;
  nextQuestion();
}

function endGame(){
  playing = false;
  var title, msg;
  if(score >= 300){
    title = '🏆 عبقري حقيقي!';
    msg = 'نقاطك: <b>' + score + '</b><br>إجابات صح: ' + correctCount + '<br>رائع يا صاحب Ahmed TV! 🎉';
  } else if(score >= 150){
    title = '🌟 ممتاز!';
    msg = 'نقاطك: <b>' + score + '</b><br>إجابات صح: ' + correctCount + '<br>أنت شاطر!';
  } else if(score >= 50){
    title = '👏 جيد!';
    msg = 'نقاطك: <b>' + score + '</b><br>إجابات صح: ' + correctCount + '<br>استمر في التدريب!';
  } else {
    title = '💪 حاول مرة أخرى';
    msg = 'نقاطك: <b>' + score + '</b><br>إجابات صح: ' + correctCount + '<br>تقدر توصل لأعلى!';
  }
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMessage').innerHTML = msg;
  document.getElementById('endScreen').classList.remove('hide');
}

render();
</script>
</body>
</html>
