<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px; }
  
  /* اللوجو - نيون بنفسجي */

    background: linear-gradient(135deg, #ff2d95, #7c3aed, #00e5ff); 
    border: 3px solid #ff2d95; border-radius: 50%;

    color: #fff; line-height: 1;

  }
  .logo b { font-size: 16px; text-shadow: 0 0 8px #fff; }
  .logo span { font-size: 10px; font-weight: 900; margin-top: 3px; }
  
  h1 { font-size: 24px; line-height: 1.2; color: #ff2d95; text-shadow: 0 0 12px #ff2d95, 0 0 20px #7c3aed;}
  h1 small { display: block; font-size: 12px; color: #00e5ff; letter-spacing: 2px; margin-top: 2px; }
  
  .names { font-size: 18px; color: #e0e7ff; margin-bottom: 10px; font-weight: bold;}
  .names b { color: #00e5ff; font-size: 20px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin: 5px 0 10px; flex-wrap: wrap; }
  .stat {
    background: #1a0033; border: 2px solid #ff2d95; border-radius: 12px;
    padding: 5px 15px; min-width: 80px; text-align: center;
    box-shadow: 0 0 15px rgba(255,45,149,0.4);
  }
  .stat b { display: block; font-size: 18px; color: #00e5ff; }
  .stat span { font-size: 10px; color: #c4b5fd; }
  
  #hearts { font-size: 24px; letter-spacing: 5px; text-align: center; margin-bottom: 5px; text-shadow: 0 0 10px #ff2d95; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #0f0529; 
    border: 3px solid #ff2d95; border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(255,45,149,0.5), 0 0 40px rgba(0,229,255,0.3);
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255,255,255,0.08);
    font-size: 38px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  canvas { width: 100%; height: 100%; display: block; z-index: 1; }

  /* زرار القفز - نيون */
  #jumpBtn {
    width: 100%; max-width: 500px;
    background: linear-gradient(90deg,#ff2d95,#7c3aed,#00e5ff); color: #fff;
    border: 2px solid #fff; border-radius: 16px;
    padding: 18px; font-size: 24px; font-weight: 900;
    cursor: pointer; margin-top: 10px;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(255,45,149,0.7);
    text-shadow: 0 2px 4px #000;
  }
  #jumpBtn:active { transform: scale(0.97); }

  #overlay {
    position: absolute; inset: 0; background: rgba(10,0,26,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 26px; margin-bottom: 5px; color: #ff2d95; text-shadow: 0 0 12px #ff2d95; }
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: linear-gradient(90deg,#ff2d95,#00e5ff); color: #fff; border: 2px solid #fff; padding: 15px 30px;
    border-radius: 14px; font-size: 18px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 220px; box-shadow: 0 0 20px rgba(0,229,255,0.6);
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 10px; color: #a78bfa; text-align: center; flex-shrink: 0; margin-top: 5px;}
  .footer a { color: #00e5ff; text-decoration: none; }
</style>

<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>الجري والقفز<small>NEON RUNNER • AHMED TV</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div id="hearts">❤️❤️❤️</div>

    <div class="stats">
      <div class="stat"><b id="score">0</b><span>النقاط</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">أحمد عبدالعزيز<br>Ahmed TV</div>
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
      <h2>🌃 الجري النيـون</h2>
      <p>
        <b>Ahmed TV</b> - اجري في مدينة النيون!<br>
        اقفز فوق الحواجز النيون 💎<br>
        عندك 3 محاولات .. يلا يا بطل!
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <button id="jumpBtn">🚀 اقفز - BOOST</button>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const heartsEl = document.getElementById('hearts');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const jumpBtn = document.getElementById('jumpBtn');

let W = 0, H = 0;
let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('runnerBest') || '0');
bestEl.textContent = best;
let audioCtx = null;
let gameSpeed = 3;

let lives = 3;
let isHit = false;
let stars = [];
let buildings = [];

let player = { x: 50, y: 0, w: 30, h: 40, vy: 0, gravity: 0.6, jumpForce: -12, isJumping: false };

let obstacles = [];
let obstacleTimer = 0;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'jump') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  } else if (type === 'score') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(700, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
  stars = [];
  for(let i=0;i<60;i++) stars.push({x:Math.random()*W, y:Math.random()*H*0.5, r:Math.random()*1.5+0.5});
  buildings = [];
  for(let i=0;i<10;i++) buildings.push({x:i*55, w:40+Math.random()*25, h:80+Math.random()*120});
  player.y = H - 60; 
  if(!running) draw();
}

function resetGame() {
  score = 0;
  scoreEl.textContent = score;
  gameSpeed = 3;
  lives = 3;
  updateHearts();
  player.y = H - 60;
  player.vy = 0;
  player.isJumping = false;
  obstacles = [];
  obstacleTimer = 0;
  isHit = false;
  running = true;
  overlay.style.display = 'none';
  jumpBtn.disabled = false;
  loop();
}

function updateHearts() {
  let heartsStr = "";
  for(let i=0; i<3; i++) {
    heartsStr += (i < lives) ? "💜" : "🖤";
  }
  heartsEl.textContent = heartsStr;
}

function jump() {
  if (!running || isHit) return;
  if (!player.isJumping) {
    player.vy = player.jumpForce;
    player.isJumping = true;
    playSound('jump');
  }
}

function spawnObstacle() {
  const w = 22 + Math.random() * 18;
  const h = 32 + Math.random() * 20;
  obstacles.push({ x: W, y: H - h - 20, w: w, h: h, passed: false, kind: Math.floor(Math.random()*3) });
}

function update() {
  if (!running) return;
  player.vy += player.gravity;
  player.y += player.vy;
  if (player.y > H - 60) {
    player.y = H - 60;
    player.vy = 0;
    player.isJumping = false;
  }
  if (!isHit) {
    obstacleTimer++;
    if (obstacleTimer > 180) {
      spawnObstacle();
      obstacleTimer = 0;
    }
  }
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    if (!isHit) obs.x -= gameSpeed;
    if (
      player.x < obs.x + obs.w &&
      player.x + player.w > obs.x &&
      player.y < obs.y + obs.h &&
      player.y + player.h > obs.y &&
      !obs.hit
    ) {
      obs.hit = true;
      loseLife();
      break;
    }
    if (obs.x + obs.w < player.x && !obs.passed) {
      obs.passed = true;
      score++;
      scoreEl.textContent = score;
      playSound('score');
    }
    if (obs.x + obs.w < 0) {
      obstacles.splice(i, 1);
    }
  }
}

function loseLife() {
  if (isHit) return;
  isHit = true;
  lives--;
  updateHearts();
  playSound('hit');
  canvas.style.opacity = '0.5';
  setTimeout(() => canvas.style.opacity = '1', 200);
  if (lives <= 0) {
    endGame();
  } else {
    setTimeout(() => {
      isHit = false;
      obstacles = obstacles.filter(o => o.x > player.x + 100);
    }, 1000);
  }
}

function draw() {
  // سماء ليل نيون
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a001a');
  grad.addColorStop(0.5, '#2a0a5e');
  grad.addColorStop(1, '#4c1d95');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // نجوم
  ctx.fillStyle = '#fff';
  stars.forEach(s=>{
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // قمر
  ctx.fillStyle = '#fef9c3';
  ctx.beginPath(); ctx.arc(W-70, 60, 28, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(254,249,195,0.3)';
  ctx.beginPath(); ctx.arc(W-70, 60, 40, 0, Math.PI*2); ctx.fill();

  // مباني المدينة
  buildings.forEach((b,i)=>{
    ctx.fillStyle = i%2==0 ? '#1e1b4b' : '#312e81';
    ctx.fillRect(b.x, H-20-b.h, b.w, b.h);
    // شبابيك مضيئة
    ctx.fillStyle = i%2==0 ? '#ff2d95' : '#00e5ff';
    for(let wy=H-20-b.h+8; wy<H-30; wy+=18){
      for(let wx=b.x+6; wx<b.x+b.w-8; wx+=14){
        if(Math.random()>0.6) ctx.fillRect(wx, wy, 5, 7);
      }
    }
  });

  // طريق نيون
  ctx.fillStyle = '#0f0529';
  ctx.fillRect(0, H - 20, W, 20);
  ctx.fillStyle = '#ff2d95';
  ctx.fillRect(0, H - 20, W, 3);
  ctx.fillStyle = '#00e5ff';
  ctx.fillRect(0, H - 4, W, 4);

  // اللاعب - بنت على سكيت بورد نيون
  const px = player.x, py = player.y;
  // توهج
  ctx.fillStyle = isHit ? 'rgba(255,0,0,0.6)' : 'rgba(0,229,255,0.4)';
  ctx.beginPath(); ctx.arc(px+15, py+20, 28, 0, Math.PI*2); ctx.fill();
  // سكيت بورد
  ctx.fillStyle = '#1e1b4b';
  ctx.fillRect(px-4, py+32, 38, 6);
  ctx.fillStyle = '#00e5ff';
  ctx.fillRect(px-4, py+32, 38, 2);
  // جسم البنت - هودي بينك
  ctx.fillStyle = '#ff2d95';
  ctx.fillRect(px+8, py+8, 16, 22);
  // رأس
  ctx.fillStyle = '#fcd7d7';
  ctx.beginPath(); ctx.arc(px+16, py+4, 9, 0, Math.PI*2); ctx.fill();
  // شعر
  ctx.fillStyle = '#1e1b4b';
  ctx.beginPath(); ctx.arc(px+13, py+2, 9, 0, Math.PI*2); ctx.fill();
  // كاب
  ctx.fillStyle = '#7c3aed';
  ctx.fillRect(px+7, py-4, 18, 5);
  // رجل
  ctx.fillStyle = '#0f0529';
  ctx.fillRect(px+10, py+28, 6, 8);
  ctx.fillRect(px+20, py+28, 6, 8);

  // العقبات - حواجز نيون مختلفة
  obstacles.forEach(obs => {
    if (!obs.hit) {
      if(obs.kind===0){
        ctx.fillStyle = '#ff2d95';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(obs.x+3, obs.y+5, obs.w-6, 3);
        ctx.fillRect(obs.x+3, obs.y+15, obs.w-6, 3);
      } else if(obs.kind===1){
        ctx.fillStyle = '#00e5ff';
        ctx.beginPath(); ctx.arc(obs.x+obs.w/2, obs.y+obs.h/2, obs.w/2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#0f0529';
        ctx.beginPath(); ctx.arc(obs.x+obs.w/2, obs.y+obs.h/2, obs.w/4, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = '#a855f7';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(obs.x+4, obs.y+4, obs.w-8, obs.h-8);
      }
    }
  });
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  if (score > best) {
    best = score;
    localStorage.setItem('runnerBest', best);
    bestEl.textContent = best;
  }
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">💔</div>
    <h2>خلصت المحاولات!</h2>
    <p>جبت <b style="color:#00e5ff;font-size:22px">${score} نقطة</b><br>
    أعلى نتيجة: ${best}<br>
    أحمد TV بيقولك: جرب تاني يا بطل!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = resetGame;
}

jumpBtn.addEventListener('click', jump);
jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive: false});
startBtn.onclick = resetGame;

window.addEventListener('resize', () => { resize(); if(!running) draw(); });

resize();
draw();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>

<script>
var wa = document.getElementById('waBtn');
var dragging = false, startX=0, startY=0, startLeft=0, startTop=0, moved=false;
function startDrag(x,y){ dragging=true; moved=false; startX=x; startY=y; startLeft=wa.offsetLeft; startTop=wa.offsetTop; }
function moveDrag(x,y){ if(!dragging) return; var dx=x-startX, dy=y-startY; if(Math.abs(dx)>5||Math.abs(dy)>5){ moved=true; } if(moved){ wa.style.left=(startLeft+dx)+'px'; wa.style.top=(startTop+dy)+'px'; wa.style.right='auto'; wa.style.bottom='auto'; } }
function endDrag(){ if(moved){ setTimeout(function(){moved=false},50); } dragging=false; }
wa.addEventListener('mousedown',function(e){ startDrag(e.clientX,e.clientY); });
document.addEventListener('mousemove',function(e){ moveDrag(e.clientX,e.clientY); });
document.addEventListener('mouseup',function(){ endDrag(); });
wa.addEventListener('touchstart',function(e){ startDrag(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
document.addEventListener('touchmove',function(e){ if(dragging){ moveDrag(e.touches[0].clientX,e.touches[0].clientY); } },{passive:true});
document.addEventListener('touchend',function(){ endDrag(); });
wa.addEventListener('click',function(e){ if(moved){ e.preventDefault(); } });
</script>
