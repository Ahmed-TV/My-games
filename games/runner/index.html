<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>الجري والقفز | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px; }
  
  /* الدائرة (اللوجو) الكبيرة واللون الجديد */
  .logo {
    width: 80px; height: 80px; flex-shrink: 0;
    background: linear-gradient(135deg, #ec4899, #8b5cf6); /* لون جديد ومميز */
    border: 4px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; line-height: 1;
    box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
  }
  .logo b { font-size: 16px; }
  .logo span { font-size: 10px; font-weight: 900; margin-top: 3px; }
  
  h1 { font-size: 24px; line-height: 1.2; color: #facc15;}
  h1 small { display: block; font-size: 12px; color: #fff; letter-spacing: 1px; margin-top: 2px; }
  
  /* الاسم بخط كبير جداً */
  .names { font-size: 18px; color: #cbd5e1; margin-bottom: 10px; font-weight: bold;}
  .names b { color: #facc15; font-size: 20px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin: 5px 0 10px; flex-wrap: wrap; }
  .stat {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 5px 15px; min-width: 80px; text-align: center;
  }
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #38bdf8; 
    border: 4px solid #f59e0b; border-radius: 16px;
    overflow: hidden;
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255, 255, 255, 0.15);
    font-size: 40px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  canvas { width: 100%; height: 100%; display: block; z-index: 1; }

  /* الزرار الكبير */
  #jumpBtn {
    width: 100%; max-width: 500px;
    background: #22c55e; color: #000;
    border: none; border-radius: 12px;
    padding: 20px; font-size: 24px; font-weight: 900;
    cursor: pointer; margin-top: 10px;
    flex-shrink: 0;
    box-shadow: 0 4px 0 #16a34a;
  }
  #jumpBtn:active { background: #16a34a; transform: translateY(4px); box-shadow: 0 0 0 #16a34a;}

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; }
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 15px 30px;
    border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 5px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>الجري والقفز<small>AHMED TV RUNNER</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div class="stats">
      <div class="stat"><b id="score">0</b><span>النقاط</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">أحمد عبدالعزيز<br>Ahmed TV</div>
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
      <h2>الجري والقفز</h2>
      <p>
        <b>Ahmed TV</b> - اقفز فوق الصبار!<br>
        دوس على الزرار الأخضر عشان تنط
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <!-- الزرار الكبير -->
  <button id="jumpBtn">⬆️ اقفز</button>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const jumpBtn = document.getElementById('jumpBtn');

let W = 0, H = 0;
let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('runnerBest') || '0');
bestEl.textContent = best;
let audioCtx = null;
let gameSpeed = 4; // سرعة بطيئة للأطفال

// اللاعب (شخصية)
let player = { x: 50, y: 0, w: 30, h: 40, vy: 0, gravity: 0.6, jumpForce: -12, isJumping: false };

// العقبات (الصبار)
let obstacles = [];
let obstacleTimer = 0;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'jump') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'score') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
  
  player.y = H - 60; // على الأرض
  if(!running) draw();
}

function resetGame() {
  score = 0;
  scoreEl.textContent = score;
  gameSpeed = 4;
  player.y = H - 60;
  player.vy = 0;
  player.isJumping = false;
  obstacles = [];
  obstacleTimer = 0;
  running = true;
  overlay.style.display = 'none';
  loop();
}

function jump() {
  if (!running) return;
  if (!player.isJumping) {
    player.vy = player.jumpForce;
    player.isJumping = true;
    playSound('jump');
  }
}

function spawnObstacle() {
  const w = 20 + Math.random() * 20; // عرض عشوائي
  const h = 30 + Math.random() * 20; // طول عشوائي
  obstacles.push({ x: W, y: H - h - 20, w: w, h: h });
}

function update() {
  if (!running) return;

  // الجاذبية
  player.vy += player.gravity;
  player.y += player.vy;

  if (player.y > H - 60) {
    player.y = H - 60;
    player.vy = 0;
    player.isJumping = false;
  }

  // توليد العقبات
  obstacleTimer++;
  // كل 150 فريم يظهر صبار جديد (وقت طويل للأطفال)
  if (obstacleTimer > 150) {
    spawnObstacle();
    obstacleTimer = 0;
  }

  // حركة العقبات
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= gameSpeed;

    // تصادم
    if (
      player.x < obs.x + obs.w &&
      player.x + player.w > obs.x &&
      player.y < obs.y + obs.h &&
      player.y + player.h > obs.y
    ) {
      endGame();
      return;
    }

    // حساب النقاط
    if (obs.x + obs.w < player.x && !obs.passed) {
      obs.passed = true;
      score++;
      scoreEl.textContent = score;
      playSound('score');
    }

    // مسح العقبات اللي خرجت من الشاشة
    if (obs.x + obs.w < 0) {
      obstacles.splice(i, 1);
    }
  }
}

function draw() {
  // خلفية
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#38bdf8');
  grad.addColorStop(1, '#0ea5e9');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // أرضية
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(0, H - 20, W, 20);
  ctx.fillStyle = '#16a34a';
  ctx.fillRect(0, H - 20, W, 5);

  // اللاعب (مربع بسيط)
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // العقبات (صبار)
  ctx.fillStyle = '#ef4444';
  obstacles.forEach(obs => {
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
  });
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  playSound('hit');
  
  if (score > best) {
    best = score;
    localStorage.setItem('runnerBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">💥</div>
    <h2>خبطت!</h2>
    <p>جبت <b style="color:#facc15;font-size:22px">${score} نقطة</b><br>
    أعلى نتيجة: ${best}<br>
    Ahmed TV بيقولك: حاول تاني!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = resetGame;
}

// ربط الزرار
jumpBtn.addEventListener('click', jump);
jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive: false});
startBtn.onclick = resetGame;

window.addEventListener('resize', () => { resize(); if(!running) draw(); });

resize();
draw();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
