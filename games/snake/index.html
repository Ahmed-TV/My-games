<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 الثعبان</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; color: #e94560; }
  .score { margin-bottom: 15px; font-size: 1.1rem; color: #a0a0b0; }
  canvas {
    background: #0f3460;
    border-radius: 12px;
    border: 3px solid #e94560;
    max-width: 100%;
  }
  .btn {
    margin-top: 15px; padding: 10px 26px;
    background: #e94560; color: #fff;
    border: none; border-radius: 10px;
    font-size: 1rem; cursor: pointer;
  }
  .hint { margin-top: 10px; color: #666; font-size: 0.85rem; }
  a.back { margin-top: 12px; color: #a0a0b0; text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>🐍 الثعبان</h1>
  <div class="score">النقاط: <span id="score">0</span> | أعلى نتيجة: <span id="best">0</span></div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <button class="btn" onclick="startGame()">لعبة جديدة</button>
  <div class="hint">استخدم الأسهم ⬆️⬇️⬅️➡️ أو اسحب بإصبعك</div>
  <a class="back" href="../../index.html">← رجوع للرئيسية</a>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const size = 20, cells = canvas.width / size;
let snake, dir, food, score, best = 0, loop;
let running = false;

best = Number(localStorage.getItem('snakeBest') || 0);
document.getElementById('best').textContent = best;

function startGame() {
  clearInterval(loop);
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  score = 0;
  document.getElementById('score').textContent = 0;
  placeFood();
  running = true;
  loop = setInterval(tick, 130);
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random()*cells), y: Math.floor(Math.random()*cells) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  if (!running) return;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    running = false;
    clearInterval(loop);
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      document.getElementById('best').textContent = best;
    }
    setTimeout(() => alert('💀 انتهت اللعبة! نقاطك: ' + score), 50);
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(food.x*size + size/2, food.y*size + size/2, size/2 - 2, 0, Math.PI*2);
  ctx.fill();
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
    ctx.fillRect(seg.x*size + 1, seg.y*size + 1, size - 2, size - 2);
  });
}

document.addEventListener('keydown', e => {
  if (!running) return;
  if (e.key === 'ArrowUp' && dir.y === 0) dir = {x:0, y:-1};
  if (e.key === 'ArrowDown' && dir.y === 0) dir = {x:0, y:1};
  if (e.key === 'ArrowLeft' && dir.x === 0) dir = {x:-1, y:0};
  if (e.key === 'ArrowRight' && dir.x === 0) dir = {x:1, y:0};
});

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
canvas.addEventListener('touchend', e => {
  if (!touchStart || !running) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x === 0) dir = {x:1, y:0};
    else if (dx < 0 && dir.x === 0) dir = {x:-1, y:0};
  } else {
    if (dy > 0 && dir.y === 0) dir = {x:0, y:1};
    else if (dy < 0 && dir.y === 0) dir = {x:0, y:-1};
  }
  touchStart = null;
});

startGame();
</script>
</body>
</html>
