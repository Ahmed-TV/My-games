<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ahmed TV - Snake Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: #050505;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(circle at center, #111 0%, #000 100%);
  }

  .header {
    width: 95vw;
    max-width: 500px; /* كبرنا عرض الهيدر */
    display: flex;
    justify-content: space-between;
    padding: 10px 15px;
    font-size: 20px;
    font-weight: 900;
    color: #00e5ff;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
  }

  .canvas-container {
    position: relative;
    width: 95vw;
    max-width: 500px; /* كبرنا عرض الشاشة */
    aspect-ratio: 1 / 1;
    background: #0a0a0a;
    border-radius: 20px;
    border: 3px solid #222; /* كبرنا الإطار */
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
    overflow: hidden;
    margin-top: 10px;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.05);
    font-size: 40px; /* كبرنا العلامة المائية */
    font-weight: 900;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 1;
    text-align: center;
    white-space: nowrap;
  }

  .btn {
    background: linear-gradient(135deg, #00e5ff, #0077ff);
    color: #000;
    border: none;
    border-radius: 30px;
    padding: 14px 35px;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    cursor: pointer;
    transition: transform 0.1s;
    margin-top: 15px;
  }
  .btn:active { transform: scale(0.95); }

  .back {
    margin-top: 15px;
    color: #666;
    text-decoration: none;
    font-size: 15px;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    border-radius: 20px;
  }
  .overlay h2 { color: #ff0055; font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 15px rgba(255,0,85,0.6); }
  .overlay p { color: #fff; font-size: 20px; margin-bottom: 20px; text-align: center; padding: 0 10px; }
  .hide { display: none !important; }
</style>
</head>
<body>

  <div class="header">
    <div>النقاط: <span id="score">0</span></div>
    <div>الأعلى: <span id="highScore">0</span></div>
  </div>

  <div class="canvas-container">
    <div class="watermark">AHMED TV<br>PRO</div>
    <!-- كبرنا حجم الكانفس لـ 600 عشان الشاشة تبقى أوضح -->
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    
    <div class="overlay" id="startScreen">
      <h2>🐍 ثعبان أحمد TV</h2>
      <p>استخدم الأسهم أو اسحب للعب<br>حرك الثعبان عشان يبدأ</p>
      <button class="btn" onclick="startGame()">ابدأ اللعب ▶️</button>
    </div>

    <div class="overlay hide" id="gameOverScreen">
      <h2>انتهت اللعبة!</h2>
      <p>نقاطك: <span id="finalScore">0</span></p>
      <button class="btn" onclick="startGame()">العب تاني 🔄</button>
    </div>
  </div>

  <a href="../../index.html" class="back">← رجوع للرئيسية</a>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const finalScoreEl = document.getElementById('finalScore');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');

// كبرنا حجم المربع لـ 30 بدل 20
const gridSize = 30; 
const tileCount = canvas.width / gridSize; // 600 / 30 = 20 مربع

let snake = [];
let food = {};
let dx = 0, dy = 0;
let score = 0;
let highScore = localStorage.getItem('snakeProHighScore') || 0;
let speed = 500; // سرعة بطيئة جداً
let gameLoop;
let isPlaying = false;
let changingDirection = false;

highScoreEl.textContent = highScore;

function startGame() {
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  dx = 0; dy = 0;
  score = 0;
  speed = 500;
  scoreEl.textContent = score;
  changingDirection = false;
  isPlaying = true;
  
  startScreen.classList.add('hide');
  gameOverScreen.classList.add('hide');
  
  generateFood();
  clearInterval(gameLoop);
  gameLoop = setInterval(drawGame, speed); 
}

function generateFood() {
  do {
    food = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
  } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
}

function drawGame() {
  if (!isPlaying) return;
  
  if (dx !== 0 || dy !== 0) {
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
      return endGame();
    }
    
    if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
      return endGame();
    }
    
    snake.unshift(head);
    
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      generateFood();
      
      if (score % 50 === 0 && speed > 250) {
        speed -= 20;
        clearInterval(gameLoop);
        gameLoop = setInterval(drawGame, speed);
      }
    } else {
      snake.pop();
    }
  }

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 2;
  for(let i = 0; i <= tileCount; i++) {
    ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
  }

  // رسم التفاحة (كبرناها)
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#ff0055';
  ctx.fillStyle = '#ff0055';
  ctx.beginPath();
  ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // رسم الثعبان (كبرناه)
  snake.forEach((segment, index) => {
    const isHead = index === 0;
    ctx.fillStyle = isHead ? '#00e5ff' : '#0077ff';
    ctx.shadowBlur = isHead ? 20 : 0;
    ctx.shadowColor = '#00e5ff';
    
    ctx.beginPath();
    ctx.roundRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2, isHead ? 12 : 6);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    if (isHead) {
      ctx.fillStyle = '#000';
      let eyeX1 = segment.x * gridSize + 8;
      let eyeY1 = segment.y * gridSize + 8;
      let eyeX2 = segment.x * gridSize + 20;
      let eyeY2 = segment.y * gridSize + 8;

      if (dx === 1) { eyeX1 = segment.x * gridSize + 18; eyeX2 = segment.x * gridSize + 18; eyeY1 = segment.y * gridSize + 8; eyeY2 = segment.y * gridSize + 20; }
      else if (dx === -1) { eyeX1 = segment.x * gridSize + 8; eyeX2 = segment.x * gridSize + 8; eyeY1 = segment.y * gridSize + 8; eyeY2 = segment.y * gridSize + 20; }
      else if (dy === 1) { eyeX1 = segment.x * gridSize + 8; eyeX2 = segment.x * gridSize + 20; eyeY1 = segment.y * gridSize + 18; eyeY2 = segment.y * gridSize + 18; }
      
      ctx.beginPath(); ctx.arc(eyeX1, eyeY1, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(eyeX2, eyeY2, 3, 0, Math.PI*2); ctx.fill();
    }
  });

  changingDirection = false;
}

function endGame() {
  isPlaying = false;
  clearInterval(gameLoop);
  
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeProHighScore', highScore);
    highScoreEl.textContent = highScore;
  }
  
  finalScoreEl.textContent = score;
  gameOverScreen.classList.remove('hide');
}

document.addEventListener('keydown', (e) => {
  if (!isPlaying || changingDirection) return;
  
  if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; changingDirection = true; }
  else if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; changingDirection = true; }
  else if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; changingDirection = true; }
  else if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; changingDirection = true; }
});

let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});

canvas.addEventListener('touchend', (e) => {
  if (!isPlaying || changingDirection) return;
  
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  
  const dxTouch = touchEndX - touchStartX;
  const dyTouch = touchEndY - touchStartY;
  
  if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
    if (dxTouch > 30 && dx === 0) { dx = 1; dy = 0; changingDirection = true; }
    else if (dxTouch < -30 && dx === 0) { dx = -1; dy = 0; changingDirection = true; }
  } else {
    if (dyTouch > 30 && dy === 0) { dx = 0; dy = 1; changingDirection = true; }
    else if (dyTouch < -30 && dy === 0) { dx = 0; dy = -1; changingDirection = true; }
  }
});

CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  this.beginPath();
  this.moveTo(x + r, y);
  this.arcTo(x + w, y, x + w, y + h, r);
  this.arcTo(x + w, y + h, x, y + h, r);
  this.arcTo(x, y + h, x, y, r);
  this.arcTo(x, y, x + w, y, r);
  this.closePath();
  return this;
};

ctx.fillStyle = '#0a0a0a';
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
</body>
</html>
