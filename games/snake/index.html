<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>القطة والسمكة | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
    position: fixed; 
    width: 100%;
  }
  
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 5px) 5px env(safe-area-inset-bottom, 5px) 5px;
  }

  .header { width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; padding-bottom: 5px;}
  .logo-img { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #facc15; object-fit: cover; box-shadow: 0 0 10px rgba(250,204,21,0.5);}
  .header-text { text-align: right; }
  .header-text h1 { font-size: 18px; color: #facc15; margin: 0;}
  .header-text .names { font-size: 11px; color: #cbd5e1; font-weight: bold; margin-top: 2px;}
  .header-text .names b { color: #facc15; font-size: 13px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px;}
  .stat { background: #1e293b; border-radius: 6px; padding: 2px 15px; min-width: 80px; text-align: center; border: 1px solid #334155;}
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 3px solid #f59e0b; border-radius: 12px;
    overflow: hidden;
    padding: 5px;
  }

  .watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255, 255, 255, 0.1); font-size: 40px; font-weight: 900;
    pointer-events: none; z-index: 0; white-space: nowrap;
    letter-spacing: 2px;
  }

  canvas { 
    width: 100%; 
    flex-grow: 1; 
    display: block; 
    z-index: 1; 
    min-height: 0;
    border-radius: 8px;
    background: #a7f3d0;
    touch-action: none;
  }

  /* التحكم 4 أزرار */
  .controls {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 5px 0 0 0;
    z-index: 3; flex-shrink: 0;
  }
  .ctrl-row { display: flex; gap: 60px; justify-content: center;}
  .ctrl-btn {
    background: #f59e0b; color: #fff; border: 2px solid #b45309; border-radius: 10px;
    font-size: 30px; width: 70px; height: 55px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; user-select: none;
    box-shadow: 0 4px 0 #b45309;
  }
  .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b45309; background: #d97706; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 8px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <div class="header-text">
        <h1>القطة والسمكة</h1>
        <div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>السمك</span></div>
    <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
      <div class="ctrl-row">
        <button class="ctrl-btn" id="upBtn">⬆️</button>
      </div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="leftBtn">⬅️</button>
        <button class="ctrl-btn" id="rightBtn">➡️</button>
      </div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="downBtn">⬇️</button>
      </div>
    </div>

    <div id="overlay">
      <h2>القطة والسمكة</h2>
      <p>
        <b>Ahmed TV</b> - اجمع السمك!<br>
        حرك القطة بصباعك أو بالأزرار
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let W = 0, H = 0;
let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('catFishBest') || '0');
bestEl.textContent = best;
let audioCtx = null;

let cat = { x: 0, y: 0, size: 50, speed: 5 };
let fish = { x: 0, y: 0, size: 40 };
let moveUp = false, moveDown = false, moveLeft = false, moveRight = false;
let animFrame;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'eat') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  }
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
  
  if (!running) {
    cat.x = W / 2 - cat.size / 2;
    cat.y = H / 2 - cat.size / 2; // في النص
    draw();
  }
}

function spawnFish() {
  // السمكة تظهر في أي مكان على الشاشة (بس مش تحت الأزرار)
  fish.x = Math.random() * (W - fish.size);
  fish.y = Math.random() * (H - fish.size - 60); 
  draw();
}

function draw() {
  // خلفية
  ctx.fillStyle = '#a7f3d0';
  ctx.fillRect(0, 0, W, H);
  
  // شبكة خفيفة
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  for(let i = 0; i < W; i += 40) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
  }
  for(let j = 0; j < H; j += 40) {
    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(W, j); ctx.stroke();
  }

  // السمكة
  ctx.font = fish.size + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐟', fish.x + fish.size/2, fish.y + fish.size/2);

  // القطة
  ctx.font = cat.size + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐱', cat.x + cat.size/2, cat.y + cat.size/2);
}

function update() {
  if (!running) return;

  // حركة القطة (كل الاتجاهات)
  if (moveUp) cat.y -= cat.speed;
  if (moveDown) cat.y += cat.speed;
  if (moveLeft) cat.x -= cat.speed;
  if (moveRight) cat.x += cat.speed;
  
  // حدود الشاشة
  if (cat.x < 0) cat.x = 0;
  if (cat.x + cat.size > W) cat.x = W - cat.size;
  if (cat.y < 0) cat.y = 0;
  if (cat.y + cat.size > H) cat.y = H - cat.size;

  // التحقق من أكل السمكة
  let dist = Math.hypot((cat.x + cat.size/2) - (fish.x + fish.size/2), 
                        (cat.y + cat.size/2) - (fish.y + fish.size/2));
  
  if (dist < (cat.size + fish.size) / 2) {
    score++;
    scoreEl.textContent = score;
    playSound('eat');
    spawnFish();
  }

  draw();
}

function loop() {
  update();
  animFrame = requestAnimationFrame(loop);
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  score = 0;
  scoreEl.textContent = 0;
  running = true;
  moveUp = false; moveDown = false; moveLeft = false; moveRight = false;
  
  cat.x = W / 2 - cat.size / 2;
  cat.y = H / 2 - cat.size / 2;
  
  spawnFish();
  loop();
}

function endGame() {
  running = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  
  if (score > best) {
    best = score;
    localStorage.setItem('catFishBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">🐱</div>
    <h2>خلصت اللعبة!</h2>
    <p>جمعت <b style="color:#facc15;font-size:22px">${score} سمكة</b><br>
    أعلى نتيجة: ${best}</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

// تحكم الأزرار الأربعة
function setupControl(btnId, moveVar) {
  const btn = document.getElementById(btnId);
  btn.addEventListener('mousedown', () => moveVar = true);
  btn.addEventListener('mouseup', () => moveVar = false);
  btn.addEventListener('mouseleave', () => moveVar = false);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveVar = true; }, {passive: false});
  btn.addEventListener('touchend', () => moveVar = false);
}

setupControl('upBtn', moveUp);
setupControl('downBtn', moveDown);
setupControl('leftBtn', moveLeft);
setupControl('rightBtn', moveRight);

// تحكم الكيبورد
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') moveUp = true;
  if (e.key === 'ArrowDown') moveDown = true;
  if (e.key === 'ArrowLeft') moveLeft = true;
  if (e.key === 'ArrowRight') moveRight = true;
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowUp') moveUp = false;
  if (e.key === 'ArrowDown') moveDown = false;
  if (e.key === 'ArrowLeft') moveLeft = false;
  if (e.key === 'ArrowRight') moveRight = false;
});

startBtn.onclick = startGame;

window.addEventListener('resize', () => { resize(); if(!running) draw(); });

resize();
draw();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
