<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>فوازير رمضان - عم فؤاد رابح | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
    position: fixed; 
    width: 100%;
  }
  
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 5px) 5px env(safe-area-inset-bottom, 5px) 5px;
  }

  .header { width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; padding-bottom: 5px;}
  .logo-img { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #facc15; object-fit: cover; box-shadow: 0 0 10px rgba(250,204,21,0.5);}
  .header-text { text-align: right; }
  .header-text h1 { font-size: 18px; color: #facc15; margin: 0;}
  .header-text .names { font-size: 11px; color: #cbd5e1; font-weight: bold; margin-top: 2px;}
  .header-text .names b { color: #facc15; font-size: 13px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px;}
  .stat { background: #1e293b; border-radius: 6px; padding: 2px 15px; min-width: 80px; text-align: center; border: 1px solid #334155;}
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%); /* ألوان بحرية */
    border: 3px solid #38bdf8; 
    border-radius: 12px;
    overflow-y: auto;
    padding: 15px;
    gap: 15px;
    justify-content: center;
  }

  .watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255, 255, 255, 0.05); font-size: 40px; font-weight: 900;
    pointer-events: none; z-index: 0; white-space: nowrap;
    letter-spacing: 2px;
  }

  .title-box {
    text-align: center;
    background: linear-gradient(135deg, #38bdf8, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 10px;
    z-index: 1;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
  }

  .question-box {
    background: #1e40af;
    border: 2px solid #38bdf8;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.6;
    color: #fff;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    z-index: 1;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    z-index: 1;
  }

  .opt-btn {
    background: #1e3a8a;
    border: 2px solid #38bdf8;
    border-radius: 10px;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  .opt-btn:hover { background: #2563eb; }
  .opt-btn:active { transform: scale(0.98); }

  .opt-btn.correct { background: #22c55e; border-color: #16a34a; }
  .opt-btn.wrong { background: #ef4444; border-color: #b91c1c; }

  .feedback {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    height: 25px;
    z-index: 1;
  }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
    border-radius: 10px;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #38bdf8;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #38bdf8; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 8px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <div class="header-text">
        <h1>فوازير رمضان - عم فؤاد</h1>
        <div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>النقاط</span></div>
    <div class="stat"><b id="round">1</b><span>الحلقة</span></div>
    <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    <div class="title-box">🎣 فوازير عم فؤاد 🎣</div>
    
    <div class="question-box" id="question">...</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>

    <div id="overlay">
      <h2>🎣 فوازير عم فؤاد 🎣</h2>
      <p>
        <b>Ahmed TV</b> - 30 فزورة عن الحيوانات والطيور!<br>
        ساعد عم فؤاد يصطاد الإجابات الصح
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ الصيد</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const scoreEl = document.getElementById('score');
const roundEl = document.getElementById('round');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let score = 0;
let currentRound = 0;
let best = parseInt(localStorage.getItem('ramadanFouadBest') || '0');
bestEl.textContent = best;
let isLocked = false;

// 30 فزورة عن الحيوانات والطيور
const QUESTIONS = [
  { q: "ما هو الحيوان الذي يُلقب بـ 'سفينة الصحراء'؟", o: ["الحصان", "الجمل", "الحمار الوحشي", "الفيل"], a: 1 },
  { q: "ما هو الطائر الذي لا يطير؟", o: ["البطريق", "النسر", "الصقر", "البومة"], a: 0 },
  { q: "ما هو أسرع حيوان بري في العالم؟", o: ["الأسد", "الفهد", "النمر", "الفيل"], a: 1 },
  { q: "ما هو أكبر حيوان على وجه الأرض؟", o: ["الفيل", "الحوت الأزرق", "الزرافة", "الديناصور"], a: 1 },
  { q: "ما هو الطائر الذي يُلقب بـ 'ملك الطيور'؟", o: ["الصقر", "النسر", "البومة", "الغراب"], a: 1 },
  { q: "ما هو الحيوان الذي ينام واقفاً؟", o: ["الكلب", "القط", "الحصان", "الأسد"], a: 2 },
  { q: "ما هو الحيوان الذي يغير لونه؟", o: ["الحرباء", "الأرنب", "الفأر", "الضفدع"], a: 0 },
  { q: "ما هو الطائر الذي يرى في الظلام؟", o: ["البومة", "الغراب", "الحمام", "العصفور"], a: 0 },
  { q: "ما هو الحيوان الذي يُلقب بـ 'ملك الغابة'؟", o: ["النمر", "الأسد", "الفيل", "الدب"], a: 1 },
  { q: "ما هو الحيوان الذي له أطول رقبة؟", o: ["الزرافة", "النعامة", "الجمل", "الفيل"], a: 0 },
  { q: "ما هو الطائر الذي يضع أكبر بيضة؟", o: ["الدجاجة", "النعامة", "البطريق", "البطة"], a: 1 },
  { q: "ما هو الحيوان الذي يعيش في الماء والبر؟", o: ["الضفدع", "السمكة", "السلحفاة", "التمساح"], a: 0 },
  { q: "ما هو الحيوان الذي يُلقب بـ 'أبو الحناء'؟", o: ["الحصان", "الأسد", "الثعلب", "الأرنب"], a: 2 },
  { q: "ما هو الطائر الذي يهاجر في الشتاء؟", o: ["اللقلق", "البومة", "الدجاجة", "النعامة"], a: 0 },
  { q: "ما هو الحيوان الذي له خرطوم؟", o: ["الفيل", "الزرافة", "وحيد القرن", "فرس النهر"], a: 0 },
  { q: "ما هو الحيوان الذي يستخدم ذيله للتوازن؟", o: ["الكلب", "القط", "الكنغر", "الحصان"], a: 2 },
  { q: "ما هو الطائر الذي يُلقب بـ 'أبو قردان'؟", o: ["البلشون", "البطريق", "الحمام", "الغراب"], a: 0 },
  { q: "ما هو الحيوان الذي ينام في النهار ويصحى في الليل؟", o: ["الأسد", "البومة", "الفأر", "الدجاجة"], a: 1 },
  { q: "ما هو الحيوان الذي يمشي على أطراف أصابعه؟", o: ["الكلب", "القط", "الفيل", "الدب"], a: 1 },
  { q: "ما هو الطائر الذي يبني عشه من الأغصان؟", o: ["الحمام", "البطريق", "النعامة", "الدجاجة"], a: 0 },
  { q: "ما هو الحيوان الذي يُلقب بـ 'ملك البحر'؟", o: ["الحوت", "القرش", "الدلفين", "الأخطبوط"], a: 1 },
  { q: "ما هو الحيوان الذي له 8 أذرع؟", o: ["الأخطبوط", "الحبار", "النجم البحري", "السلطعون"], a: 0 },
  { q: "ما هو الطائر الذي يعيش في القطب الجنوبي؟", o: ["البطريق", "الدب القطبي", "الفقمة", "النورس"], a: 0 },
  { q: "ما هو الحيوان الذي يخاف من الفأر؟", o: ["الكلب", "الفيل", "الأسد", "النمر"], a: 1 },
  { q: "ما هو الحيوان الذي ينام 20 ساعة في اليوم؟", o: ["القط", "الأسد", "الكسلان", "الكلب"], a: 2 },
  { q: "ما هو الطائر الذي يطير لمسافات طويلة بدون توقف؟", o: ["السنونو", "الحمام", "الدجاجة", "البطة"], a: 0 },
  { q: "ما هو الحيوان الذي يُلقب بـ 'الرجل العنكبوت' في الطبيعة؟", o: ["العنكبوت", "النمل", "النحلة", "الفراشة"], a: 0 },
  { q: "ما هو الحيوان الذي يعيش في الصحراء؟", o: ["الجمل", "الدب", "البطريق", "النمر"], a: 0 },
  { q: "ما هو الطائر الذي يقلد كلام الإنسان؟", o: ["الببغاء", "الغراب", "الحمام", "العصفور"], a: 0 },
  { q: "ما هو الحيوان الذي له أطول عمر؟", o: ["السلحفاة", "الفيل", "الببغاء", "الحوت"], a: 0 }
];

function renderQuestion() {
  isLocked = false;
  const q = QUESTIONS[currentRound];
  
  roundEl.textContent = currentRound + 1;
  questionEl.textContent = q.q;
  feedbackEl.textContent = '';
  optionsEl.innerHTML = '';

  q.o.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = option;
    btn.onclick = () => checkAnswer(index, btn);
    optionsEl.appendChild(btn);
  });
}

function checkAnswer(selected, btn) {
  if (isLocked) return;
  isLocked = true;

  const q = QUESTIONS[currentRound];
  const allBtns = optionsEl.querySelectorAll('.opt-btn');

  if (selected === q.a) {
    btn.classList.add('correct');
    score += 10;
    scoreEl.textContent = score;
    feedbackEl.textContent = "✅ إجابة صحيحة!";
    feedbackEl.style.color = "#22c55e";
  } else {
    btn.classList.add('wrong');
    allBtns[q.a].classList.add('correct');
    feedbackEl.textContent = "❌ الإجابة الصحيحة: " + q.o[q.a];
    feedbackEl.style.color = "#ef4444";
  }

  setTimeout(() => {
    currentRound++;
    if (currentRound < QUESTIONS.length) {
      renderQuestion();
    } else {
      endGame();
    }
  }, 1500);
}

function endGame() {
  if (score > best) {
    best = score;
    localStorage.setItem('ramadanFouadBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">🎣</div>
    <h2>خلصت الفوازير!</h2>
    <p>جمعت <b style="color:#facc15;font-size:22px">${score} نقطة</b><br>
    أعلى نتيجة: ${best}<br>
    أحمد TV بيقولك: صياد شاطر!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

function startGame() {
  overlay.style.display = 'none';
  score = 0;
  currentRound = 0;
  scoreEl.textContent = 0;
  renderQuestion();
}

startBtn.onclick = startGame;
</script>
</body>
</html>
