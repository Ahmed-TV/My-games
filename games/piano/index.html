<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لعبة البيانو</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:#16213e;color:#fff;display:flex;flex-direction:column;padding:6px;gap:6px}
.header{background:#fff;border-radius:16px;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0}
.header img{width:44px;height:44px;border-radius:50%;border:3px solid #FF006E;object-fit:cover}
.header h1{font-size:24px;color:#FF006E;line-height:1}
.header p{font-size:12px;font-weight:900;color:#333;line-height:1}
.controls{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;flex-shrink:0;overflow-x:auto;padding:2px}
.cbtn{background:#fff;color:#222;border:none;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cbtn.active{background:#FF006E;color:#fff}
.cbtn.red{background:#FF006E;color:#fff}
.noteBox{background:#fff;color:#222;border-radius:12px;padding:6px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px}
.noteBox .big{font-size:26px;font-weight:900;color:#FF006E}
.noteBox .sub{font-size:12px;color:#777}
.pianoWrap{background:#111;border-radius:14px;padding:8px 6px 6px;flex:1;display:flex;flex-direction:column;min-height:0}
.piano{position:relative;flex:1;display:flex;user-select:none;touch-action:none;min-height:140px}
.white{flex:1;background:#fff;border:2px solid #111;border-top:none;border-radius:0 0 10px 10px;cursor:pointer;z-index:1}
.white.hit{background:#FFBE0B}
.black{position:absolute;top:0;width:9%;max-width:52px;height:58%;background:#000;border-radius:0 0 10px 10px;z-index:2;cursor:pointer}
.black.hit{background:#FF006E}
.songs{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;flex-shrink:0;padding:2px}
.sbtn{background:#FFBE0B;color:#222;border:none;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap;flex-shrink:0}
.staff{background:#fff;border-radius:12px;padding:6px;text-align:center;color:#222;flex-shrink:0;font-size:15px;font-weight:900}
.staff span{color:#FF006E}
@media (orientation:portrait){ .rotateHint{display:flex !important} }
.rotateHint{display:none;background:#FF006E;color:#fff;border-radius:10px;padding:5px;text-align:center;font-size:12px;font-weight:900;flex-shrink:0}
</style>
</head>
<body>

<div class="header"><img src="../../logo.png" alt="Ahmed TV"><div><h1>لعبة البيانو</h1><p>أحمد عبدالعزيز • Ahmed TV</p></div></div>

<div class="rotateHint">📱 اقلب الموبايل بالعرض عشان البيانو يبان كله</div>

<div class="controls">
<button class="cbtn active" onclick="setSound(this,'piano')">بيانو</button>
<button class="cbtn" onclick="setSound(this,'organ')">أورج</button>
<button class="cbtn" onclick="setSound(this,'flute')">فلوت</button>
<button class="cbtn" onclick="setSound(this,'guitar')">جيتار</button>
<button class="cbtn red" id="recBtn" onclick="toggleRec()">تسجيل</button>
<button class="cbtn" onclick="playRec()">تشغيل التسجيل</button>
<button class="cbtn" onclick="clearRec()">مسح</button>
</div>

<div class="noteBox"><div class="big" id="curNote">دوس على أي زرار</div><div class="sub" id="curSub"></div></div>

<div class="pianoWrap"><div class="piano" id="piano"></div></div>

<div class="songs">
<button class="sbtn" onclick="playSong('twinkle')">توينكل</button>
<button class="sbtn" onclick="playSong('happy')">هابي بيرثداي</button>
<button class="sbtn" onclick="playSong('mary')">ماري</button>
<button class="sbtn" onclick="playSong('egypt')">أغنية مصرية</button>
<button class="sbtn" onclick="playSong('ode')">أغنية الفرح</button>
</div>

<div class="staff"><span>دو &nbsp; ري &nbsp; مي &nbsp; فا &nbsp; صول &nbsp; لا &nbsp; سي &nbsp; دو</span></div>

<a href="https://wa.me/201551668092" target="_blank" style="position:fixed;bottom:8px;left:8px;z-index:9999;display:flex;align-items:center;gap:6px;text-decoration:none;background:#25D366;border-radius:50px;padding:5px 12px 5px 5px;box-shadow:0 6px 20px rgba(0,0,0,.4);">
<span style="width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;">💬</span>
<span style="color:#fff;font-family:Tahoma,Arial;font-size:15px;font-weight:900;white-space:nowrap;">كلمنا واتساب</span>
</a>

<script>
var actx=null, soundType='piano', recording=false, recNotes=[], recStart=0;
function act(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
var whites=[
{ar:'دو',freq:261.63},{ar:'ري',freq:293.66},{ar:'مي',freq:329.63},{ar:'فا',freq:349.23},{ar:'صول',freq:392.00},{ar:'لا',freq:440.00},{ar:'سي',freq:493.88},
{ar:'دو',freq:523.25},{ar:'ري',freq:587.33},{ar:'مي',freq:659.25},{ar:'فا',freq:698.46},{ar:'صول',freq:783.99},{ar:'لا',freq:880.00},{ar:'سي',freq:987.77}
];
var blackAfter=[0,1,3,4,5, 7,8,10,11,12];
var blackNames=['دو','ري','فا','صول','لا','دو','ري','فا','صول','لا'];
var blackFreq=[277.18,311.13,369.99,415.30,466.16,554.37,622.25,739.99,830.61,932.33];
var piano=document.getElementById('piano');
whites.forEach(function(w){
  var el=document.createElement('div'); el.className='white';
  el.addEventListener('pointerdown',function(e){e.preventDefault(); playNote(w.freq,w.ar,el,false);});
  piano.appendChild(el);
});
blackAfter.forEach(function(wi,bi){
  var el=document.createElement('div'); el.className='black';
  el.style.left='calc('+(wi+1)*(100/14)+'% - 4.5%)';
  var f=blackFreq[bi], name=blackNames[bi];
  el.addEventListener('pointerdown',function(e){e.preventDefault(); e.stopPropagation(); playNote(f,name,el,true);});
  piano.appendChild(el);
});
function playFreq(freq,dur){
  var c=act(); if(!c) return;
  var o=c.createOscillator(), g=c.createGain();
  o.type = soundType==='piano'?'triangle': soundType==='organ'?'sawtooth': soundType==='flute'?'sine':'square';
  o.frequency.value=freq;
  g.gain.setValueAtTime(0.28,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+(dur||1.1));
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+(dur||1.1));
}
function playNote(freq,name,el,isBlack){
  playFreq(freq,1.1);
  document.getElementById('curNote').textContent=name;
  document.getElementById('curSub').textContent = isBlack ? 'زرار أسود' : 'زرار أبيض';
  if(el){ el.classList.add('hit'); setTimeout(function(){el.classList.remove('hit')},250); }
  if(recording){ recNotes.push({freq:freq,time:Date.now()-recStart}); }
}
function setSound(btn,s){ soundType=s; document.querySelectorAll('.controls .cbtn').forEach(function(x){ if(['بيانو','أورج','فلوت','جيتار'].indexOf(x.textContent)>-1) x.classList.remove('active'); }); btn.classList.add('active'); }
function toggleRec(){ recording=!recording; var b=document.getElementById('recBtn'); if(recording){ recNotes=[]; recStart=Date.now(); b.textContent='بيسجل...'; document.getElementById('curNote').textContent='بيسجل'; } else { b.textContent='تسجيل'; document.getElementById('curNote').textContent='خلص التسجيل'; } }
function playRec(){ if(!recNotes.length){ document.getElementById('curNote').textContent='سجل الأول'; return; } recNotes.forEach(function(n){ setTimeout(function(){ playFreq(n.freq,1); }, n.time); }); }
function clearRec(){ recNotes=[]; document.getElementById('curNote').textContent='اتمسح التسجيل'; }
var songs={ twinkle:[0,0,4,4,5,5,4,3,3,2,2,1,1,0], happy:[0,0,1,0,3,2,0,0,1,0,4,3], mary:[2,1,0,1,2,2,2,1,1,1,2,4,4], egypt:[0,1,2,3,4,3,2,1,0,1,2,4,5,4], ode:[2,2,3,4,4,3,2,1,0,0,1,2,2,1,1] };
function playSong(name){ var seq=songs[name]||[]; document.getElementById('curNote').textContent='بيعزف...'; seq.forEach(function(wi,i){ setTimeout(function(){ var w=whites[wi]; playNote(w.freq,w.ar,null,false); }, i*450); }); }
</script>
</body>
</html>
