<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لعبة الطائر | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
  
  .logo {
    width: 55px; height: 55px; flex-shrink: 0;
    background: radial-gradient(circle, #fde047, #f59e0b 55%, #b45309);
    border: 3px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #111; line-height: 1;
  }
  .logo b { font-size: 12px; }
  .logo span { font-size: 8px; font-weight: 900; margin-top: 2px; }
  
  h1 { font-size: 20px; line-height: 1.2; }
  h1 small { display: block; font-size: 11px; color: #facc15; letter-spacing: 1px; margin-top: 2px; }
  
  .names { font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
  .names b { color: #fff; }

  .stats { display: flex; gap: 10px; justify-content: center; margin: 5px 0; flex-wrap: wrap; }
  .stat {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 5px 15px; min-width: 80px; text-align: center;
  }
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }
  
  #soundBtn {
    background: #22c55e; color: #022c22; border: none;
    padding: 8px 15px; border-radius: 20px;
    font-weight: 900; font-size: 12px; cursor: pointer;
  }

  #wrap {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    background: #38bdf8; border: 3px solid #f59e0b; border-radius: 16px;
    overflow: hidden; position: relative; display: flex; cursor: pointer;
    margin-top: 5px; margin-bottom: 5px;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  
  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,.75);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 8px; pointer-events: none; /* عشان نمنع تداخل الزراير */
  }
  #overlay > * { pointer-events: auto; } /* نرجع الزراير تشتغل */
  
  #overlay h2 { font-size: 22px; }
  #overlay p { line-height: 1.6; font-size: 13px; color: #e2e8f0; }
  .btn-start {
    background: #f59e0b; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 10px;
    color: #000;
  }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; }
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>🐦 لعبة الطائر<small>AHMED TV FLAPPY BIRD</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div class="stats">
      <div class="stat"><b id="score">0</b><span>النقاط</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
      <button id="soundBtn">🔊 الصوت</button>
    </div>
  </div>

  <div id="wrap">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <div style="font-size:35px">🐦☁️</div>
      <h2>لعبة الطائر</h2>
      <p>
        <b>Ahmed TV</b> - طير بين الأنابيب!<br>
        دوس على الشاشة عشان تطير
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const soundBtn = document.getElementById('soundBtn');

let W = 0, H = 0;
let running = false;
let gameStarted = false;
let score = 0;
let best = parseInt(localStorage.getItem('flappyBest') || '0');
bestEl.textContent = best;

let soundOn = true;
let audioCtx = null;

let bird = { x: 50, y: 200, vy: 0, gravity: 0.5, jump: -8, radius: 15, rotation: 0 };
let pipes = [];
const PIPE_WIDTH = 60;
const GAP = 150;
const PIPE_SPEED = 2.5;
let pipeTimer = 0;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
  if(!running) {
    bird.y = H / 2;
  }
}

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

function playSound(type) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  if (type === 'jump') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'score') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

// الدالة دي هي اللي بتشغل اللعبة
function startGame() {
  initAudio();
  overlay.style.display = 'none';
  bird.y = H / 2;
  bird.vy = 0;
  bird.rotation = 0;
  score = 0;
  scoreEl.textContent = score;
  pipes = [];
  pipeTimer = 0;
  running = true;
  gameStarted = true;
  loop();
}

function jump() {
  if (!running) return;
  bird.vy = bird.jump;
  playSound('jump');
}

function spawnPipe() {
  const minHeight = 50;
  const maxHeight = H - GAP - minHeight;
  const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
  pipes.push({
    x: W,
    top: topHeight,
    bottom: H - topHeight - GAP,
    passed: false
  });
}

function update() {
  if (!running) return;

  bird.vy += bird.gravity;
  bird.y += bird.vy;

  if (bird.vy < 0) {
    bird.rotation = -0.5;
  } else {
    bird.rotation += 0.05;
    if (bird.rotation > 1.5) bird.rotation = 1.5;
  }

  if (bird.y + bird.radius > H) {
    bird.y = H - bird.radius;
    return endGame();
  }
  if (bird.y - bird.radius < 0) {
    bird.y = bird.radius;
    bird.vy = 0;
  }

  pipeTimer++;
  if (pipeTimer > 90) { 
    spawnPipe();
    pipeTimer = 0;
  }

  for (let i = pipes.length - 1; i >= 0; i--) {
    let p = pipes[i];
    p.x -= PIPE_SPEED;

    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
      playSound('score');
    }

    if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH) {
      if (bird.y - bird.radius < p.top || bird.y + bird.radius > H - p.bottom) {
        return endGame();
      }
    }

    if (p.x + PIPE_WIDTH < 0) {
      pipes.splice(i, 1);
    }
  }
}

function draw() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#38bdf8');
  grad.addColorStop(1, '#0ea5e9');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(W*0.2, H*0.2, 30, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W*0.8, H*0.4, 40, 0, Math.PI*2); ctx.fill();
  
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(0, H - 20, W, 20);
  ctx.fillStyle = '#16a34a';
  ctx.fillRect(0, H - 20, W, 5);

  pipes.forEach(p => {
    ctx.fillStyle = '#22c55e';
    ctx.strokeStyle = '#166534';
    ctx.lineWidth = 3;
    
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.strokeRect(p.x, -3, PIPE_WIDTH, p.top + 3);
    ctx.fillRect(p.x - 5, p.top - 20, PIPE_WIDTH + 10, 20);
    ctx.strokeRect(p.x - 5, p.top - 20, PIPE_WIDTH + 10, 20);
    
    ctx.fillRect(p.x, H - p.bottom, PIPE_WIDTH, p.bottom);
    ctx.strokeRect(p.x, H - p.bottom, PIPE_WIDTH, p.bottom + 3);
    ctx.fillRect(p.x - 5, H - p.bottom, PIPE_WIDTH + 10, 20);
    ctx.strokeRect(p.x - 5, H - p.bottom, PIPE_WIDTH + 10, 20);
  });

  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);
  
  ctx.fillStyle = '#facc15';
  ctx.strokeStyle = '#ca8a04';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, bird.radius, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(bird.radius/2, -bird.radius/3, bird.radius/2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(bird.radius/2 + 2, -bird.radius/3, bird.radius/5, 0, Math.PI*2); ctx.fill();
  
  ctx.fillStyle = '#f97316';
  ctx.beginPath();
  ctx.moveTo(bird.radius - 2, 0);
  ctx.lineTo(bird.radius + 8, 5);
  ctx.lineTo(bird.radius - 2, 10);
  ctx.fill();
  
  ctx.restore();
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  playSound('hit');
  
  if (score > best) {
    best = score;
    localStorage.setItem('flappyBest', best);
    bestEl.textContent = best;
  }
  
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">💥</div>
    <h2>خبطت!</h2>
    <p>جبت <b style="color:#facc15;font-size:22px">${score} نقطة</b><br>
    أعلى نتيجة: ${best}<br>
    Ahmed TV بيقولك: حاول تاني!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

// هنا السر: الاستماع لأي ضغطة على الشاشة أو الكيبورد
function handleInput(e) {
  if(e) e.preventDefault();
  if (running) {
    jump();
  }
}

canvas.addEventListener('mousedown', handleInput);
canvas.addEventListener('touchstart', handleInput, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') handleInput(e);
});

startBtn.onclick = startGame;

soundBtn.onclick = function() {
  soundOn = !soundOn;
  initAudio();
  this.textContent = soundOn ? '🔊 الصوت' : '🔇 مقفول';
  this.style.background = soundOn ? '#22c55e' : '#ef4444';
  this.style.color = '#fff';
};

window.addEventListener('resize', () => {
  resize();
  if (!running && !gameStarted) draw();
});

resize();
draw();
</script>
</body>
</html>
