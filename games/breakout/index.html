<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>لعبة تكسير الطوب | Ahmed TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;touch-action:manipulation}
html,body{height:100% !important;height:100svh !important;max-height:100svh !important;overflow:hidden !important}
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 8px;overflow:hidden !important}
.header{width:100%;max-width:500px;text-align:center;flex-shrink:0}
.top-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:3px}
.logo-img{width:68px;height:68px;flex-shrink:0;border-radius:50%;border:4px solid #facc15;object-fit:cover;background:#fff;box-shadow:0 0 22px rgba(250,204,21,.5)}
h1{font-size:22px;line-height:1.2}
h1 small{display:block;font-size:13px;color:#facc15;letter-spacing:1px;margin-top:2px}
.names{font-size:20px;color:#fff;margin-bottom:4px;font-weight:900}
.names small{display:block;font-size:14px;color:#facc15;font-weight:900}
.stats{display:flex;gap:8px;justify-content:center;margin:4px 0 6px;flex-wrap:wrap}
.stat{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:4px 12px;min-width:78px;text-align:center}
.stat b{display:block;font-size:17px;color:#facc15}
.stat span{font-size:10px;color:#94a3b8}
#wrap{width:100%;max-width:500px;flex:1;min-height:0;background:#1e293b;border:3px solid #f59e0b;border-radius:16px;overflow:hidden;position:relative;display:flex;margin-top:3px;margin-bottom:5px;flex-shrink:1;touch-action:none}
canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;gap:8px;z-index:5}
#overlay h2{font-size:22px}
#overlay p{line-height:1.6;font-size:13px;color:#e2e8f0}
.btn-start{background:#f59e0b;border:none;padding:12px 25px;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;margin-top:10px}
.controls{display:flex;gap:8px;justify-content:center;width:100%;max-width:500px;flex-shrink:0;direction:ltr}
.controls button{flex:1;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:12px;padding:12px 0;font-size:16px;font-weight:900;cursor:pointer;touch-action:manipulation}
.controls button:active{background:#f59e0b;color:#111}
.footer{font-size:11px;color:#94a3b8;text-align:center;flex-shrink:0;margin-top:4px;padding-bottom:4px}
.footer a{color:#facc15;text-decoration:none}
</style></head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false" onmousedown="return false">
<div class="header">
<div class="top-row">
<img src="../../logo.png" alt="Ahmed TV" class="logo-img">
<h1>لعبة تكسير الطوب<small>AHMED TV BREAKOUT</small></h1>
</div>
<div class="names">أحمد عبد العزيز<small>Ahmed TV</small></div>
<div class="stats">
<div class="stat"><b id="score">0</b><span>النقاط</span></div>
<div class="stat"><b id="best">0</b><span>الأفضل</span></div>
</div>
</div>
<div id="wrap">
<canvas id="gameCanvas"></canvas>
<div id="overlay"><div style="font-size:35px">🧱</div><h2>لعبة تكسير الطوب</h2><p><b>Ahmed TV</b> - كسّر كل الطوب!<br>حرّك المضرب بإصبعك أو بالفأرة أو بالزرين</p><button class="btn-start" id="startBtn">ابدأ اللعب</button></div>
</div>
<div class="controls"><button id="leftBtn">⬅ يسار</button><button id="rightBtn">يمين ➡</button></div>
<div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ جميع ألعابي</a></div>
<script>
// ===== منع بحث جوجل =====
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('mousedown',function(e){if(e.button===2)e.preventDefault();},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
// ===== صوتك بدل الصفافير =====
var soundOn=true,_audioCache={},_ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
function playSound(type){ if(type==='paddle'||type==='brick'||type==='wall') playAhmedVoice('sah'); else if(type==='win') playAhmedVoice('kesebt'); else if(type==='gameover') playAhmedVoice('khesert'); }
</script>
<script>
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');const overlay=document.getElementById('overlay');const startBtn=document.getElementById('startBtn');
let W=0,H=0;let running=false;let score=0;let best=parseInt(localStorage.getItem('breakoutBest')||'0');bestEl.textContent=best;
const PADDLE_WIDTH=100;const PADDLE_HEIGHT=15;let paddle={x:0,y:0};
const BALL_RADIUS=8;let ball={x:0,y:0,dx:3,dy:-3};
const BRICK_ROWS=4;const BRICK_COLS=6;const BRICK_HEIGHT=25;const BRICK_PADDING=5;const BRICK_OFFSET_TOP=40;const BRICK_OFFSET_LEFT=10;
let bricks=[];const COLORS=['#ef4444','#f59e0b','#10b981','#3b82f6'];
function brickW(){return (W-BRICK_OFFSET_LEFT*2-(BRICK_COLS-1)*BRICK_PADDING)/BRICK_COLS;}
function initBricks(){bricks=[];for(let c=0;c<BRICK_COLS;c++){bricks[c]=[];for(let r=0;r<BRICK_ROWS;r++){bricks[c][r]={x:0,y:0,status:1,color:COLORS[r]};}}}
function resize(){const rect=canvas.parentElement.getBoundingClientRect();canvas.width=rect.width;canvas.height=rect.height;W=canvas.width;H=canvas.height;paddle.y=H-PADDLE_HEIGHT-20;if(!running)paddle.x=(W-PADDLE_WIDTH)/2;if(!running){ball.x=W/2;ball.y=paddle.y-BALL_RADIUS-5;}}
function startGame(){playAhmedVoice('ebda');overlay.style.display='none';score=0;scoreEl.textContent=score;paddle.x=(W-PADDLE_WIDTH)/2;ball.x=W/2;ball.y=paddle.y-BALL_RADIUS-5;ball.dx=(Math.random()>0.5?1:-1)*2.5;ball.dy=-2.5;initBricks();running=true;loop();}
function draw(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f59e0b';ctx.fillRect(paddle.x,paddle.y,PADDLE_WIDTH,PADDLE_HEIGHT);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_RADIUS,0,Math.PI*2);ctx.fill();let bw=brickW();for(let c=0;c<BRICK_COLS;c++){for(let r=0;r<BRICK_ROWS;r++){if(bricks[c][r].status===1){const brickX=(c*(bw+BRICK_PADDING))+BRICK_OFFSET_LEFT;const brickY=(r*(BRICK_HEIGHT+BRICK_PADDING))+BRICK_OFFSET_TOP;bricks[c][r].x=brickX;bricks[c][r].y=brickY;ctx.fillStyle=bricks[c][r].color;ctx.fillRect(brickX,brickY,bw,BRICK_HEIGHT);}}}}
function update(){if(!running)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x+BALL_RADIUS>W||ball.x-BALL_RADIUS<0){ball.dx=-ball.dx;playSound('wall');}if(ball.y-BALL_RADIUS<0){ball.dy=-ball.dy;playSound('wall');}if(ball.y+BALL_RADIUS>paddle.y&&ball.y+BALL_RADIUS<paddle.y+PADDLE_HEIGHT){if(ball.x>paddle.x&&ball.x<paddle.x+PADDLE_WIDTH){let hitPos=(ball.x-paddle.x)/PADDLE_WIDTH;let angle=(hitPos-0.5)*Math.PI/1.5;let speed=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);ball.dx=speed*Math.sin(angle);ball.dy=-speed*Math.cos(angle);ball.y=paddle.y-BALL_RADIUS;playSound('paddle');}}if(ball.y+BALL_RADIUS>H){return endGame();}let bricksLeft=0;let bw=brickW();for(let c=0;c<BRICK_COLS;c++){for(let r=0;r<BRICK_ROWS;r++){let b=bricks[c][r];if(b.status===1){bricksLeft++;if(ball.x>b.x&&ball.x<b.x+bw&&ball.y>b.y&&ball.y<b.y+BRICK_HEIGHT){ball.dy=-ball.dy;b.status=0;score+=10;scoreEl.textContent=score;playSound('brick');}}}}if(bricksLeft===0){return endGame(true);}}
function loop(){if(!running)return;update();draw();requestAnimationFrame(loop);}
function endGame(isWin){running=false;playSound(isWin?'win':'gameover');if(score>best){best=score;localStorage.setItem('breakoutBest',best);bestEl.textContent=best;}overlay.style.display='flex';overlay.innerHTML='<div style="font-size:35px">'+(isWin?'🏆':'💔')+'</div><h2>'+(isWin?'مبروك! كسّرت كل الطوب!':'انتهت اللعبة!')+'</h2><p>حصلت على <b style="color:#facc15;font-size:22px">'+score+' نقطة</b><br>أعلى نتيجة: '+best+'<br>'+(isWin?'أنت بطل!':'حاول مرة أخرى!')+'</p><button class="btn-start" id="againBtn">العب مرة أخرى</button>';var ab=document.getElementById('againBtn'); blockGoogle(ab); ab.addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false});}
function movePaddle(dir){if(!running)return;paddle.x=Math.max(0,Math.min(W-PADDLE_WIDTH,paddle.x+dir*30));}
var leftBtn=document.getElementById('leftBtn'), rightBtn=document.getElementById('rightBtn');
[ leftBtn, rightBtn, startBtn ].forEach(function(b){ blockGoogle(b); });
leftBtn.addEventListener('pointerdown',function(e){e.preventDefault();movePaddle(-1);},{passive:false});
rightBtn.addEventListener('pointerdown',function(e){e.preventDefault();movePaddle(1);},{passive:false});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')movePaddle(-1);if(e.key==='ArrowRight')movePaddle(1);});
function handleMove(e){if(!running)return;const rect=canvas.getBoundingClientRect();let clientX=e.clientX;if(e.touches&&e.touches.length>0){clientX=e.touches[0].clientX;}let relativeX=clientX-rect.left;if(relativeX>0&&relativeX<W){paddle.x=Math.max(0,Math.min(W-PADDLE_WIDTH,relativeX-PADDLE_WIDTH/2));}if(e.cancelable)e.preventDefault();}
canvas.addEventListener('mousemove',handleMove);
canvas.addEventListener('touchmove',handleMove,{passive:false});
canvas.addEventListener('touchstart',handleMove,{passive:false});
startBtn.addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false});
window.addEventListener('resize',()=>{resize();if(!running)draw();});
resize();initBricks();draw();
</script>
</body></html>
