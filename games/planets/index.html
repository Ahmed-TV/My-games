<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ترتيب الكواكب | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 550px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px; }
  
  .logo {
    width: 65px; height: 65px; flex-shrink: 0;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
    border: 4px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; line-height: 1;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
  }
  .logo b { font-size: 13px; }
  .logo span { font-size: 8px; font-weight: 900; margin-top: 2px; }
  
  h1 { font-size: 20px; line-height: 1.2; color: #facc15;}
  h1 small { display: block; font-size: 11px; color: #fff; letter-spacing: 1px; margin-top: 2px; }
  
  .names { font-size: 14px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold;}
  .names b { color: #facc15; font-size: 16px;}

  #game-container {
    width: 100%; max-width: 550px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 4px solid #f59e0b; border-radius: 16px;
    overflow: hidden;
    padding: 10px;
    margin-top: 5px;
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255, 255, 255, 0.05);
    font-size: 40px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  /* ترتيب الكواكب */
  .slots-container {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 15px; z-index: 1; flex-shrink: 0;
  }
  .slot {
    background: #0f172a; border: 2px dashed #475569; border-radius: 10px;
    height: 70px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-size: 12px; color: #94a3b8; position: relative;
  }
  .slot .slot-num { position: absolute; top: 2px; right: 5px; font-size: 12px; font-weight: bold; color: #f59e0b;}
  .slot .slot-content { font-size: 30px; }
  .slot.correct { border: 2px solid #22c55e; background: #14532d; }
  .slot.wrong { border: 2px solid #ef4444; background: #7f1d1d; }

  /* الكواكب المتاحة */
  .planets-container {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding-top: 10px; border-top: 2px solid #334155; z-index: 1;
  }
  .planet {
    background: #334155; border-radius: 10px; padding: 10px 15px;
    font-size: 30px; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center;
    transition: transform 0.1s;
    border: 2px solid #475569;
  }
  .planet:active { transform: scale(0.9); }
  .planet.selected { border-color: #facc15; box-shadow: 0 0 15px #facc15; }
  .planet .p-name { font-size: 10px; margin-top: 2px; color: #cbd5e1;}

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 5px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>ترتيب الكواكب<small>AHMED TV PLANETS</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    
    <!-- أماكن الكواكب -->
    <div class="slots-container" id="slotsContainer"></div>

    <!-- الكواكب المتاحة -->
    <div class="planets-container" id="planetsContainer"></div>

    <div id="overlay">
      <h2>لعبة ترتيب الكواكب</h2>
      <p>
        <b>Ahmed TV</b> - رتب الكواكب من الشمس!<br>
        دوس على الكوكب، وبعدين دوس على المكان الصح
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ الترتيب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const slotsContainer = document.getElementById('slotsContainer');
const planetsContainer = document.getElementById('planetsContainer');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let selectedPlanet = null;
let correctCount = 0;
let audioCtx = null;

// بيانات الكواكب بالترتيب (من الشمس)
const PLANETS = [
  { id: 1, name: "عطارد", emoji: "🌑" },
  { id: 2, name: "الزهرة", emoji: "🟠" },
  { id: 3, name: "الأرض", emoji: "🌍" },
  { id: 4, name: "المريخ", emoji: "🔴" },
  { id: 5, name: "المشتري", emoji: "🟤" },
  { id: 6, name: "زحل", emoji: "🪐" },
  { id: 7, name: "أورانوس", emoji: "🔵" },
  { id: 8, name: "نبتون", emoji: "🌌" }
];

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'click') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'correct') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'win') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  }
}

// خلط الكواكب
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  selectedPlanet = null;
  correctCount = 0;
  
  // عمل الأماكن الفاضية
  slotsContainer.innerHTML = '';
  PLANETS.forEach((p, index) => {
    let slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.pos = index + 1;
    slot.innerHTML = `
      <div class="slot-num">${index + 1}</div>
      <div class="slot-content"></div>
    `;
    slot.onclick = () => placePlanetInSlot(slot);
    slotsContainer.appendChild(slot);
  });

  // عرض الكواكب المبعثرة
  planetsContainer.innerHTML = '';
  let shuffledPlanets = shuffle([...PLANETS]);
  
  shuffledPlanets.forEach(p => {
    let planetEl = document.createElement('div');
    planetEl.className = 'planet';
    planetEl.dataset.id = p.id;
    planetEl.dataset.name = p.name;
    planetEl.innerHTML = `
      <div>${p.emoji}</div>
      <div class="p-name">${p.name}</div>
    `;
    planetEl.onclick = () => selectPlanet(planetEl);
    planetsContainer.appendChild(planetEl);
  });
}

function selectPlanet(el) {
  if (!el) return;
  playSound('click');
  
  // إزالة التحديد القديم
  document.querySelectorAll('.planet').forEach(p => p.classList.remove('selected'));
  
  // تحديد الكوكب الجديد
  el.classList.add('selected');
  selectedPlanet = el;
}

function placePlanetInSlot(slot) {
  if (!selectedPlanet) return;
  if (slot.classList.contains('correct')) return; // لو المكان مليان صح
  
  let planetId = parseInt(selectedPlanet.dataset.id);
  let planetName = selectedPlanet.dataset.name;
  let planetEmoji = selectedPlanet.innerHTML;
  
  let slotPos = parseInt(slot.dataset.pos);
  
  // التحقق من الترتيب
  if (planetId === slotPos) {
    // صح
    playSound('correct');
    slot.classList.add('correct');
    slot.querySelector('.slot-content').innerHTML = planetEmoji;
    
    // إخفاء الكوكب من تحت
    selectedPlanet.style.display = 'none';
    selectedPlanet.classList.remove('selected');
    selectedPlanet = null;
    
    correctCount++;
    
    if (correctCount === 8) {
      playSound('win');
      setTimeout(() => {
        overlay.style.display = 'flex';
        overlay.innerHTML = `
          <div style="font-size:35px">🏆</div>
          <h2>مبروك! رتبت كل الكواكب!</h2>
          <p>أنت عبقري فضاء!<br>
          أحمد TV بيقولك: إنت بطل المجموعة الشمسية!</p>
          <button class="btn-start" id="againBtn">🔄 العب تاني</button>
        `;
        document.getElementById('againBtn').onclick = startGame;
      }, 500);
    }
  } else {
    // غلط
    playSound('wrong');
    slot.classList.add('wrong');
    setTimeout(() => {
      slot.classList.remove('wrong');
    }, 500);
  }
}

startBtn.onclick = startGame;
document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
