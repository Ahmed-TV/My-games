<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>ذاكرة القطط | Ahmed TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;touch-action:manipulation}
html,body{height:100%!important;height:100svh!important;max-height:100svh!important;overflow:hidden!important}
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 5px;overflow:hidden!important}
.header{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;padding-bottom:2px}
.logo-img{width:68px;height:68px;border-radius:50%;border:4px solid #facc15;object-fit:cover;background:#fff;box-shadow:0 0 22px rgba(250,204,21,.5)}
.header-text{text-align:center}
.header-text h1{font-size:22px;color:#facc15;margin:0}
.header-text .names{font-size:20px;color:#fff;font-weight:900;margin-top:1px}
.header-text .names small{display:block;font-size:14px;color:#facc15;font-weight:900}
.stats{display:flex;gap:8px;justify-content:center;margin-bottom:4px;flex-shrink:0}
.stat{background:#1e293b;border-radius:6px;padding:1px 8px;min-width:50px;text-align:center;border:1px solid #334155}
.stat b{display:block;font-size:12px;color:#facc15}
.stat span{font-size:8px;color:#94a3b8}
#game-container{width:100%;max-width:600px;flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:#1e293b;border:3px solid #f59e0b;border-radius:12px;overflow:hidden;padding:5px}
.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,0.1);font-size:40px;font-weight:900;pointer-events:none;z-index:0;white-space:nowrap;letter-spacing:2px}
#board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:5px;z-index:1}
.card{background:#f59e0b;border-radius:8px;display:flex;justify-content:center;align-items:center;cursor:pointer;user-select:none;transition:transform 0.3s,background 0.3s;position:relative;transform-style:preserve-3d;border:2px solid #b45309;overflow:hidden;min-height:0}
.card.flipped{background:#fff;border-color:#fff;transform:rotateY(180deg)}
.card.flipped::before{content:'';position:absolute;inset:0;background:#fff;border-radius:6px;z-index:1}
.card.matched{background:#22c55e;border-color:#16a34a;pointer-events:none;opacity:0.6}
.card .front{display:none;width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:2}
.card.flipped .front{display:block}
.card.flipped .back{display:none}
.card .back{font-size:28px;color:#fff;z-index:3}
#overlay{position:absolute;inset:0;background:rgba(15,23,42,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;gap:10px;z-index:10}
#overlay h2{font-size:24px;margin-bottom:5px;color:#facc15}
#overlay p{line-height:1.6;font-size:14px;color:#e2e8f0;margin-bottom:10px}
.btn-start{background:#f59e0b;color:#000;border:none;padding:12px 25px;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;width:80%;max-width:200px}
.btn-start:active{transform:scale(0.95)}
.footer{font-size:11px;color:#94a3b8;text-align:center;flex-shrink:0;margin-top:4px;padding-bottom:4px}
.footer a{color:#facc15;text-decoration:none}
</style></head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false" onmousedown="return false">
<div class="header">
<img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
<div class="header-text"><h1>ذاكرة القطط</h1><div class="names">أحمد عبد العزيز<small>Ahmed TV</small></div></div>
</div>
<div class="stats">
<div class="stat"><b id="moves">0</b><span>الحركات</span></div>
<div class="stat"><b id="best">0</b><span>الأفضل</span></div>
</div>
<div id="game-container">
<div class="watermark">Ahmed TV</div>
<div id="board"></div>
<div id="overlay"><h2>ذاكرة القطط</h2><p><b>Ahmed TV</b> - طابِق القطط!<br>افتح ورقتين .. إذا كان فيهما نفس القطة، ستتطابقان</p><button class="btn-start" id="startBtn">ابدأ اللعب</button></div>
</div>
<div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ جميع ألعابي</a></div>
<script>
// ===== منع بحث جوجل =====
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('mousedown',function(e){if(e.button===2)e.preventDefault();},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
// ===== صوتك بدل الصفافير =====
var soundOn=true,_audioCache={},_ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
function playMeow(){ playAhmedVoice('sah'); }
function playMatchSound(){ playAhmedVoice('sah'); }
function playWinSound(){ playAhmedVoice('kesebt'); }
</script>
<script>
const boardEl=document.getElementById('board');const movesEl=document.getElementById('moves');const bestEl=document.getElementById('best');const overlay=document.getElementById('overlay');const startBtn=document.getElementById('startBtn');
let cards=[];let flippedCards=[];let moves=0;let matchedPairs=0;let totalPairs=8;let lockBoard=false;let running=false;let best=parseInt(localStorage.getItem('catsBest')||'0');bestEl.textContent=best;
const CAT_IMAGES=['https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&h=200&fit=crop','https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=200&h=200&fit=crop','https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=200&h=200&fit=crop','https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=200&h=200&fit=crop','https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=200&h=200&fit=crop','https://images.unsplash.com/photo-1592194996308-7b43878e84a6?w=200&h=200&fit=crop','https://images.unsplash.com/photo-1574158622682-e40e69881006?w=200&h=200&fit=crop','https://images.unsplash.com/photo-1529778873920-4da4926a72c2?w=200&h=200&fit=crop'];
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}
function createBoard(){boardEl.innerHTML='';cards=[];flippedCards=[];moves=0;matchedPairs=0;lockBoard=false;movesEl.textContent=moves;let deck=[...CAT_IMAGES,...CAT_IMAGES];deck=shuffle(deck);deck.forEach((imgUrl,index)=>{let card=document.createElement('div');card.className='card';card.dataset.image=imgUrl;card.dataset.index=index;card.innerHTML='<span class="back">❓</span><img class="front" src="'+imgUrl+'" alt="قطة">';blockGoogle(card);card.addEventListener('pointerdown',function(e){e.preventDefault();flipCard(card);},{passive:false});boardEl.appendChild(card);cards.push(card);});}
function flipCard(card){if(!running||lockBoard||card.classList.contains('flipped')||card.classList.contains('matched'))return;playMeow();card.classList.add('flipped');flippedCards.push(card);if(flippedCards.length===2){moves++;movesEl.textContent=moves;lockBoard=true;checkMatch();}}
function checkMatch(){const [card1,card2]=flippedCards;const img1=card1.dataset.image;const img2=card2.dataset.image;if(img1===img2){playMatchSound();setTimeout(()=>{card1.classList.add('matched');card2.classList.add('matched');matchedPairs++;flippedCards=[];lockBoard=false;if(matchedPairs===totalPairs){endGame();}},300);}else{playAhmedVoice('ghalat');setTimeout(()=>{card1.classList.remove('flipped');card2.classList.remove('flipped');flippedCards=[];lockBoard=false;},1000);}}
function endGame(){running=false;playWinSound();if(best===0||moves<best){best=moves;localStorage.setItem('catsBest',best);bestEl.textContent=best;}overlay.style.display='flex';overlay.innerHTML='<div style="font-size:35px">🏆</div><h2>مبروك! طابَقت كل القطط!</h2><p>أنهيتها في <b style="color:#facc15;font-size:22px">'+moves+'</b> حركة<br>أفضل نتيجة: '+best+'<br>أنت خبير قطط!</p><button class="btn-start" id="againBtn">العب مرة أخرى</button>';var ab=document.getElementById('againBtn'); blockGoogle(ab); ab.addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false});}
function startGame(){playAhmedVoice('ebda');overlay.style.display='none';running=true;createBoard();}
blockGoogle(startBtn);
startBtn.addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false});
</script>
</body></html>
