<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ذاكرة القطط | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
    position: fixed; 
    width: 100%;
  }
  
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 5px) 5px env(safe-area-inset-bottom, 5px) 5px;
  }

  .header { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; flex-shrink: 0; padding-bottom: 3px;}
  .logo-img { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #facc15; object-fit: cover; box-shadow: 0 0 10px rgba(250,204,21,0.5);}
  .header-text { text-align: center; }
  .header-text h1 { font-size: 16px; color: #facc15; margin: 0;}
  .header-text .names { font-size: 11px; color: #cbd5e1; font-weight: bold; margin-top: 2px;}
  .header-text .names b { color: #facc15; font-size: 13px;}

  .stats { display: flex; gap: 8px; justify-content: center; margin-bottom: 3px;}
  .stat { background: #1e293b; border-radius: 6px; padding: 1px 8px; min-width: 50px; text-align: center; border: 1px solid #334155;}
  .stat b { display: block; font-size: 12px; color: #facc15; }
  .stat span { font-size: 8px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 600px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 3px solid #f59e0b; border-radius: 12px;
    overflow: hidden;
    padding: 5px;
  }

  .watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255, 255, 255, 0.1); font-size: 40px; font-weight: 900;
    pointer-events: none; z-index: 0; white-space: nowrap;
    letter-spacing: 2px;
  }

  #board {
    flex-grow: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 5px; z-index: 1;
  }

  .card {
    background: #f59e0b;
    border-radius: 8px;
    display: flex; justify-content: center; align-items: center;
    font-size: 30px; cursor: pointer; user-select: none;
    transition: transform 0.3s, background 0.3s;
    position: relative;
    transform-style: preserve-3d;
    border: 2px solid #b45309;
  }

  /* شكل الكارت المقلوب */
  .card.flipped { background: #fff; border-color: #fff; transform: rotateY(180deg); }
  .card.flipped::before { content: ''; position: absolute; inset: 0; background: #fff; border-radius: 6px; }
  
  /* الكارت اللي اتطابق */
  .card.matched { background: #22c55e; border-color: #16a34a; pointer-events: none; opacity: 0.6; }

  /* رسومات القطط */
  .card .front { display: none; font-size: 32px; }
  .card.flipped .front { display: block; }
  .card.flipped .back { display: none; }
  .card .back { font-size: 24px; color: #fff; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 8px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <div class="header-text">
        <h1>ذاكرة القطط</h1>
        <div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="moves">0</b><span>الحركات</span></div>
    <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    <div id="board"></div>

    <div id="overlay">
      <h2>ذاكرة القطط</h2>
      <p>
        <b>Ahmed TV</b> - طابق القطط!<br>
        افتح كرتين .. لو ليهم نفس القطة، هيتطابقوا
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let cards = [];
let flippedCards = [];
let moves = 0;
let matchedPairs = 0;
let totalPairs = 8;
let lockBoard = false;
let running = false;
let best = parseInt(localStorage.getItem('catsBest') || '0');
let audioCtx = null;
bestEl.textContent = best;

// رموز القطط
const CARD_SYMBOLS = ['🐱', '😺', '😸', '😹', '😻', '😼', '😽', '🙀'];

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

// دالة تشغيل صوت المواء
function playMeow() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  // صوت مواء تقريبي
  osc.type = 'sine';
  osc.frequency.setValueAtTime(600, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.2);
  osc.frequency.linearRampToValueAtTime(500, audioCtx.currentTime + 0.4);
  
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
  gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.2);
  gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
  
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

// دالة تشغيل صوت الخرخرة
function playPurr() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  // صوت خرخرة (تردد منخفض)
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  
  osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

// صوت الفوز
function playWin() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(600, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
  
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function createBoard() {
  boardEl.innerHTML = '';
  cards = [];
  flippedCards = [];
  moves = 0;
  matchedPairs = 0;
  lockBoard = false;
  movesEl.textContent = moves;

  let deck = [...CARD_SYMBOLS, ...CARD_SYMBOLS];
  deck = shuffle(deck);

  deck.forEach((symbol, index) => {
    let card = document.createElement('div');
    card.className = 'card';
    card.dataset.symbol = symbol;
    card.dataset.index = index;
    card.innerHTML = `
      <span class="back">❓</span>
      <span class="front">${symbol}</span>
    `;
    card.addEventListener('click', () => flipCard(card));
    boardEl.appendChild(card);
    cards.push(card);
  });
}

function flipCard(card) {
  if (!running || lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

  playMeow(); // صوت مواء لما تفتح كارت
  card.classList.add('flipped');
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    moves++;
    movesEl.textContent = moves;
    lockBoard = true;
    checkMatch();
  }
}

function checkMatch() {
  const [card1, card2] = flippedCards;
  const symbol1 = card1.dataset.symbol;
  const symbol2 = card2.dataset.symbol;

  if (symbol1 === symbol2) {
    playPurr(); // صوت خرخرة لما تتطابق
    setTimeout(() => {
      card1.classList.add('matched');
      card2.classList.add('matched');
      matchedPairs++;
      flippedCards = [];
      lockBoard = false;
      
      if (matchedPairs === totalPairs) {
        endGame();
      }
    }, 300);
  } else {
    setTimeout(() => {
      card1.classList.remove('flipped');
      card2.classList.remove('flipped');
      flippedCards = [];
      lockBoard = false;
    }, 1000);
  }
}

function endGame() {
  running = false;
  playWin();
  
  if (best === 0 || moves < best) {
    best = moves;
    localStorage.setItem('catsBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">🐱</div>
    <h2>مبروك! طابقت كل القطط!</h2>
    <p>خلصتها في <b style="color:#facc15;font-size:22px">${moves}</b> حركة<br>
    أعلى نتيجة: ${best}<br>
    أحمد TV بيقولك: القطط مبسوطة بيك!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  running = true;
  createBoard();
}

startBtn.onclick = startGame;

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
