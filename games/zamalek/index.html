<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>Ahmed TV - نادي الزمالك</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important}
html,body{overflow-y:auto;overflow-x:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#7f0000,#0F2A4A 50%,#0F2A4A);color:#fff;display:flex;justify-content:center;padding:4px 8px 4px 8px}
.game{width:100%;max-width:500px;display:flex;flex-direction:column;background:#fff;border:3px solid #0F2A4A;outline:2px solid #C62828;outline-offset:-6px;border-radius:20px;padding:8px;box-shadow:0 18px 50px #0008;position:relative;color:#0F2A4A}
header{padding:1px 0 3px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.header-top{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center}
.header-text{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.logo-img{width:88px;height:88px;box-shadow:0 0 22px rgba(15,42,74,.5);flex-shrink:0;border-radius:50%;border:4px solid #0F2A4A;object-fit:cover;background:#fff;margin-bottom:2px}
.brand{font-size:24px;text-align:center;font-weight:900;color:#0F2A4A}
.names{font-size:22px;text-align:center;font-weight:900;color:#0F2A4A}
.names small{display:block;font-size:16px;color:#0F2A4A;font-weight:900}
.slogan{background:#fff;color:#0F2A4A;border:2px solid #C62828;font-weight:900;font-size:14px;padding:4px 12px;text-align:center;width:100%;margin-top:6px;border-radius:20px}
.panel-container{position:relative;display:flex;flex-direction:column}
footer{text-align:center;color:#0F2A4A;font-size:11px;margin-top:6px;flex-shrink:0}
footer a{color:#0F2A4A;text-decoration:none;font-weight:700}
.watermark{text-align:center;font-size:10px;color:#0F2A4A;opacity:.25;font-weight:900;letter-spacing:2px;pointer-events:none;white-space:nowrap;margin-top:4px}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 4px;flex-shrink:0}
.score-box{background:linear-gradient(135deg,#0F2A4A,#0F2A4A);color:#fff;padding:9px 12px;border-radius:12px;font-weight:800;font-size:15px}
.cat-row{display:flex;gap:6px;padding:0 0 6px;flex-shrink:0}
.cat-btn{flex:1;padding:10px 4px;border-radius:12px;border:2px solid #0F2A4A;background:#fff;color:#0F2A4A;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.cat-btn.active{background:#0F2A4A;color:#fff}
.qbox{background:linear-gradient(180deg,#F2F6FF,#fff);border:2px solid #0F2A4A;border-radius:14px;padding:6px;text-align:center;flex-shrink:0;height:148px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.jersey-big{width:78px;height:76px;margin:2px auto;position:relative;background:linear-gradient(180deg,#ffffff 0%,#ffffff 42%,#C62828 42%,#C62828 58%,#ffffff 58%,#ffffff 100%);border:2px solid #0F2A4A;border-radius:10px 10px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding-top:6px;overflow:hidden}
.jersey-big::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:8px;background:#0F2A4A;border-radius:0 0 10px 10px}
.jersey-big .num{font-size:28px;font-weight:900;line-height:1;color:#0F2A4A;margin-top:2px}
.jersey-big .pos{font-size:9px;color:#0F2A4A;font-weight:900}
.qtext{font-size:17px;line-height:1.3;max-height:46px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0F2A4A;margin-top:4px;min-height:22px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px;flex-shrink:0;min-height:98px}
.answer{font-family:inherit;font-size:14px;overflow:hidden;text-overflow:ellipsis;font-weight:800;color:#fff;background:linear-gradient(135deg,#0F2A4A,#1A3A5C);border:1px solid #fff;border-radius:12px;padding:9px 5px;min-height:42px;cursor:pointer}
.answer.correct{background:#2E7D32}
.answer.wrong{background:#333}
.answer:disabled{opacity:.9}
.feedback{min-height:20px;margin:2px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#0F2A4A;font-weight:700;font-size:12px;text-align:center;flex-shrink:0}
.btn-row{display:flex;gap:7px;flex-shrink:0;background:#fff;padding:6px 2px 2px 2px;border-top:2px solid #0F2A4A}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:20px;padding:11px 10px;background:linear-gradient(135deg,#0F2A4A,#0F2A4A);color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #0F2A4A;border-radius:20px;padding:11px 6px;background:#fff;color:#0F2A4A;cursor:pointer;font-size:13px}
.hidden{display:none!important}
</style></head>
<body><div class="game">
<header>
<div class="header-top">
<img src="../../logo.png" alt="Ahmed TV" class="logo-img">
<div class="header-text">
<div class="brand">نادي الزمالك</div>
<div class="names">أحمد عبدالعزيز<small>Ahmed TV</small></div>
</div>
</div>
<div class="slogan">مدرسة الفن والهندسة</div><button id="soundBtn" style="margin:6px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #0F2A4A;border-radius:20px;padding:7px 20px;background:#fff;color:#0F2A4A;cursor:pointer;font-size:12px">الصوت: شغال</button>
</header>
<div class="panel-container">
<div id="viewGame" style="display:flex;flex-direction:column;gap:3px">
<div class="cat-row"><button class="cat-btn active" id="catAll" onclick="setCat('الكل',this)">الكل - 300 سؤال</button><button class="cat-btn" onclick="setCat('جدد',this)">الجدد</button><button class="cat-btn" onclick="setCat('قدامى',this)">القدامى</button></div>
<div class="top-bar"><div class="score-box"><span id="score">0</span> نقطة</div><div class="score-box">السؤال <span id="count">1</span> / <span id="totalQ">300</span></div><div class="score-box"><span id="correctCount">0</span></div></div>
<div class="qbox"><div class="jersey-big"><div class="num" id="qNum">1</div><div class="pos" id="qPos">حارس</div></div><div class="qtext" id="qText">مين اللاعب ده؟</div></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback">يلا يا زملكاوي! اختر الصح أو اعمل تخطي</div>
<div class="btn-row"><button class="skipbtn" onclick="skipQ()">تخطي</button><button class="mainbtn" id="nextBtn" disabled>السؤال التالي</button></div>
</div>
</div><div class="watermark">AHMED TV • ZAMALEK</div><footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
const NEW_PLAYERS=[{n:"محمد الصبحي",num:1,pos:"حارس",cat:"جدد"},{n:"محمد عوض",num:16,pos:"حارس",cat:"جدد"},{n:"مهدي سليمان",num:30,pos:"حارس",cat:"جدد"},{n:"محمود الونش",num:5,pos:"دفاع",cat:"جدد"},{n:"حسام عبد المجيد",num:2,pos:"دفاع",cat:"جدد"},{n:"عمر جابر",num:4,pos:"دفاع",cat:"جدد"},{n:"أحمد فتوح",num:13,pos:"دفاع",cat:"جدد"},{n:"محمود حمدي",num:3,pos:"دفاع",cat:"جدد"},{n:"بارون أوتشينج",num:20,pos:"دفاع",cat:"جدد"},{n:"أحمد حسام",num:6,pos:"دفاع",cat:"جدد"},{n:"نبيل عماد دونجا",num:8,pos:"وسط",cat:"جدد"},{n:"عبد الله السعيد",num:19,pos:"وسط",cat:"جدد"},{n:"ناصر ماهر",num:7,pos:"وسط",cat:"جدد"},{n:"محمد شحاتة",num:14,pos:"وسط",cat:"جدد"},{n:"أحمد حمدي",num:18,pos:"وسط",cat:"جدد"},{n:"سيف جعفر",num:22,pos:"وسط",cat:"جدد"},{n:"خوان بيزيرا",num:11,pos:"هجوم",cat:"جدد"},{n:"تشيكو بانزا",num:9,pos:"هجوم",cat:"جدد"},{n:"سيف الدين الجزيري",num:10,pos:"هجوم",cat:"جدد"},{n:"ناصر منسي",num:28,pos:"هجوم",cat:"جدد"},{n:"أحمد شريف",num:15,pos:"هجوم",cat:"جدد"},{n:"آدم كايد",num:21,pos:"هجوم",cat:"جدد"},{n:"عمرو ناصر",num:17,pos:"هجوم",cat:"جدد"},{n:"عدي الدباغ",num:23,pos:"هجوم",cat:"جدد"},{n:"أحمد عبد الرحيم إيشو",num:26,pos:"هجوم",cat:"جدد"}];
const OLD_PLAYERS=[{n:"حسن شحاتة",num:10,pos:"أسطورة",cat:"قدامى"},{n:"حازم إمام",num:14,pos:"أسطورة",cat:"قدامى"},{n:"عبد الحليم علي",num:13,pos:"أسطورة",cat:"قدامى"},{n:"شيكابالا",num:10,pos:"أسطورة",cat:"قدامى"},{n:"أحمد حسام ميدو",num:9,pos:"أسطورة",cat:"قدامى"},{n:"عمرو زكي",num:9,pos:"أسطورة",cat:"قدامى"},{n:"محمد عبد الشافي",num:13,pos:"أسطورة",cat:"قدامى"},{n:"طارق السيد",num:11,pos:"أسطورة",cat:"قدامى"},{n:"عبد الواحد السيد",num:1,pos:"أسطورة",cat:"قدامى"},{n:"أيمن عبد العزيز",num:8,pos:"أسطورة",cat:"قدامى"},{n:"تامر عبد الحميد",num:20,pos:"أسطورة",cat:"قدامى"},{n:"جمال حمزة",num:10,pos:"أسطورة",cat:"قدامى"},{n:"وليد صلاح عبد اللطيف",num:17,pos:"أسطورة",cat:"قدامى"},{n:"أحمد عبد الرؤوف",num:6,pos:"أسطورة",cat:"قدامى"},{n:"محمود محمود",num:5,pos:"أسطورة",cat:"قدامى"},{n:"إبراهيم يوسف",num:4,pos:"أسطورة",cat:"قدامى"},{n:"أحمد رمزي",num:7,pos:"أسطورة",cat:"قدامى"},{n:"حمادة عبد اللطيف",num:10,pos:"أسطورة",cat:"قدامى"},{n:"علي خليل",num:9,pos:"أسطورة",cat:"قدامى"},{n:"فاروق جعفر",num:20,pos:"أسطورة",cat:"قدامى"},{n:"طه بصري",num:8,pos:"أسطورة",cat:"قدامى"},{n:"سمير محمد علي",num:9,pos:"أسطورة",cat:"قدامى"},{n:"محمود أبو رجيلة",num:2,pos:"أسطورة",cat:"قدامى"},{n:"نبيل نصير",num:3,pos:"أسطورة",cat:"قدامى"},{n:"أحمد عبد الحليم",num:15,pos:"أسطورة",cat:"قدامى"}];
const ALL_PLAYERS=[...NEW_PLAYERS,...OLD_PLAYERS];
const HISTORY=[{q:"تأسس نادي الزمالك سنة كام؟",a:"1911",opts:["1911","1907","1920","1900"]},{q:"ما هو لقب نادي الزمالك؟",a:"مدرسة الفن والهندسة",opts:["مدرسة الفن والهندسة","المارد الأحمر","القلعة البيضاء","زعيم الثغر"]},{q:"ما هو لون تيشيرت الزمالك الأساسي؟",a:"أبيض",opts:["أبيض","أحمر","أزرق","أخضر"]},{q:"من هو الهداف التاريخي للزمالك؟",a:"عبد الحليم علي",opts:["عبد الحليم علي","حسن شحاتة","شيكابالا","عمرو زكي"]},{q:"أين يقع مقر نادي الزمالك؟",a:"ميت عقبة - الجيزة",opts:["ميت عقبة - الجيزة","الجزيرة - القاهرة","الإسكندرية","المنصورة"]},{q:"من هو اللاعب الملقب بالمعلم؟",a:"حسن شحاتة",opts:["حسن شحاتة","حازم إمام","شيكابالا","فاروق جعفر"]},{q:"من هو اللاعب الملقب بالاباتشي؟",a:"شيكابالا",opts:["شيكابالا","ميدو","عمرو زكي","حازم إمام"]},{q:"كم مرة فاز الزمالك بدوري أبطال أفريقيا؟",a:"5 مرات",opts:["5 مرات","3 مرات","7 مرات","10 مرات"]},{q:"ما هو شعار الزمالك؟",a:"الزمالك أولا",opts:["الزمالك أولا","الزمالك فوق الجميع","روح الفانلة البيضاء","كلهم صح"]},{q:"من هو الحارس الأسطوري للزمالك؟",a:"عبد الواحد السيد",opts:["عبد الواحد السيد","محمد صبحي","محمد عواد","نادر السيد"]},{q:"في أي سنة تأسس الزمالك؟",a:"1911",opts:["1911","1907","1915","1920"]},{q:"ما هو الطائر في شعار الزمالك؟",a:"رامي السهام",opts:["رامي السهام","النسر","الصقر","الحمامة"]},{q:"من هو اللاعب الملقب بالثعلب؟",a:"حازم إمام",opts:["حازم إمام","حسن شحاتة","شيكابالا","جمال حمزة"]},{q:"من هو مدرب الزمالك التاريخي أوتوفستر؟",a:"أوتوفستر",opts:["أوتوفستر","مانويل جوزيه","حسن شحاتة","جيسوالدو فيريرا"]},{q:"كم عدد بطولات الدوري المصري للزمالك تقريبا؟",a:"14 بطولة",opts:["14 بطولة","10 بطولات","20 بطولة","5 بطولات"]},{q:"من هو اللاعب الملقب بالبلدوزر؟",a:"عمرو زكي",opts:["عمرو زكي","ميدو","عبد الحليم علي","سيف الجزيري"]},{q:"ما هو اسم ملعب الزمالك؟",a:"ستاد القاهرة",opts:["ستاد القاهرة","ستاد برج العرب","ستاد الدفاع الجوي","ستاد السلام"]},{q:"من هو رئيس الزمالك الأسطوري؟",a:"محمد حسن حلمي",opts:["محمد حسن حلمي","مرتضى منصور","حسين لبيب","ممدوح عباس"]},{q:"من هو اللاعب الملقب بالعالمي؟",a:"أحمد حسام ميدو",opts:["أحمد حسام ميدو","شيكابالا","حازم إمام","عمرو زكي"]},{q:"ما هي ألوان الزمالك؟",a:"أبيض وأحمر",opts:["أبيض وأحمر","أحمر وأسود","أبيض وأزرق","أخضر وأبيض"]}];
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function buildQuestions(cat){voice('ebda');
let pool=cat==='الكل'?ALL_PLAYERS:cat==='جدد'?NEW_PLAYERS:OLD_PLAYERS;let qs=[];
pool.forEach(p=>{
let others=shuffle(ALL_PLAYERS.filter(x=>x!==p&&x.n!==p.n)).slice(0,3);
qs.push({type:'name',p:p,q:'مين اللاعب اللي رقمه '+p.num+' ومركزه '+p.pos+'؟',correct:p.n,opts:shuffle([...new Set([p.n,...others.map(o=>o.n)])])});
let others2=shuffle(ALL_PLAYERS.filter(x=>x!==p&&x.num!==p.num)).slice(0,10);
let uniqNums=[...new Set(others2.map(o=>o.num))].slice(0,3);
qs.push({type:'num',p:p,q:'اللاعب '+p.n+' رقمه كام؟',correct:'رقم '+p.num,opts:shuffle([...new Set(['رقم '+p.num,...uniqNums.map(n=>'رقم '+n)])])});
let posOpts=shuffle(['حارس','دفاع','وسط','هجوم','أسطورة'].filter(x=>x!==p.pos)).slice(0,3);
qs.push({type:'pos',p:p,q:'اللاعب '+p.n+' مركزه ايه؟',correct:p.pos,opts:shuffle([...new Set([p.pos,...posOpts])])});
});
pool.forEach(p=>{qs.push({type:'cat',p:p,q:'اللاعب '+p.n+' من فئة ايه؟',correct:p.cat,opts:shuffle([...new Set([p.cat,p.cat==='جدد'?'قدامى':'جدد','محترف','ناشئ'])])});});
let hIdx=0;while(qs.length<300){let h=HISTORY[hIdx%HISTORY.length];let opts=shuffle(h.opts);qs.push({type:'hist',p:ALL_PLAYERS[hIdx%ALL_PLAYERS.length],q:h.q,correct:h.a,opts:[...new Set(opts)]});hIdx++;if(hIdx>500)break;}
return shuffle(qs).slice(0,300);}
let soundOn=true,audioCtx=null;
var _ac={};
function voice(k){if(!soundOn)return;try{if(!_ac[k]){_ac[k]=new Audio('../../sounds/'+k+'.mp3');_ac[k].preload='auto';}var a=_ac[k];a.currentTime=0;var pr=a.play();if(pr)pr.catch(function(){});}catch(e){}}

function getCtx(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playTone(f,dur,vol,type,delay){if(!soundOn)return;const ctx=getCtx();if(!ctx)return;try{const t0=ctx.currentTime+delay;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.02);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur);}catch(e){}}
function playCorrect(){voice('sah');}
function playWrong(){voice('ghalat');}
function playSkip(){playTone(400,0.15,0.08,'sine',0);}
function playChant(){[523,523,659,784,784,659,523].forEach((f,i)=>playTone(f,0.22,0.07,'triangle',i*0.16));}
let currentCat='الكل',questions=[],idx=0,score=0,correctCount=0,locked=false,skipped=0;
function setCat(cat,btn){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=cat;startQuiz();}
function startQuiz(){playChant();questions=buildQuestions(currentCat);idx=0;score=0;correctCount=0;skipped=0;document.getElementById('totalQ').textContent=questions.length;document.getElementById('score').textContent=score;document.getElementById('correctCount').textContent=correctCount;loadQ();}
function loadQ(){
if(idx>=questions.length){voice(correctCount>=Math.ceil(questions.length*0.6)?'kesebt':'khesert');document.getElementById('qText').textContent='خلصت الـ 300 سؤال!';document.getElementById('feedback').textContent='نتيجتك: '+score+' نقطة • صح: '+correctCount+' • تخطي: '+skipped+' - دوس تخطي عشان تلعب تاني';document.getElementById('answers').innerHTML='';return;}
locked=false;const it=questions[idx];
document.getElementById('count').textContent=idx+1;
document.getElementById('qNum').textContent=it.p.num;
document.getElementById('qPos').textContent=it.p.pos+' • '+it.p.cat;
document.getElementById('qText').textContent=it.q;
document.getElementById('feedback').textContent='السؤال '+(idx+1)+' من 300 - اختر الصح أو اعمل تخطي';
const ans=document.getElementById('answers');ans.innerHTML='';
it.opts.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>choose(o===it.correct,b,it);ans.appendChild(b);});
document.getElementById('nextBtn').disabled=true;}
function choose(ok,btn,it){if(locked)return;locked=true;[...document.getElementById('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===it.correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');});if(ok){playCorrect();score+=10;correctCount++;document.getElementById('feedback').textContent='صح يا زملكاوي! +10';}else{playWrong();document.getElementById('feedback').textContent='غلط - الصح: '+it.correct;}document.getElementById('score').textContent=score;document.getElementById('correctCount').textContent=correctCount;document.getElementById('nextBtn').disabled=false;}
function skipQ(){playSkip();if(idx>=questions.length){startQuiz();return;}skipped++;document.getElementById('feedback').textContent='تخطيت السؤال - الصح كان: '+questions[idx].correct;idx++;setTimeout(loadQ,600);}
document.getElementById('nextBtn').onclick=()=>{if(!locked&&idx<questions.length)return;idx++;loadQ();};
document.getElementById('soundBtn').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?"الصوت: شغال":"الصوت: مطفي";if(soundOn)getCtx();};
startQuiz();
</script>

</body></html>
