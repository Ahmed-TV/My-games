<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>بينج بونج | أحمد عبدالعزيز</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
html, body { overflow-y: auto; overflow-x: hidden; }
body { font-family: Tahoma, Arial, sans-serif; background: #0a001a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 6px 6px 10px 6px; }
.header { width: 100%; max-width: 500px; text-align: center; }
.top-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2px; }
.logo-wrap { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; border: 4px solid #facc15; background: #000; flex-shrink: 0; }
.logo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
h1 { font-size: 26px; color: #ff2d95; line-height: 1.2; }
h1 small { display: block; font-size: 13px; color: #00e5ff; }
.names { text-align: center; line-height: 1.3; margin-bottom: 6px; }
.names .ar { display: block; font-size: 22px; color: #facc15; font-weight: 900; }
.names .en { display: block; font-size: 16px; color: #fff; font-weight: 900; }
.stats { display: flex; gap: 8px; justify-content: center; margin: 4px 0 6px; }
.stat { background: #1a0033; border: 2px solid #ff2d95; border-radius: 10px; padding: 3px 12px; min-width: 85px; text-align: center; }
.stat b { display: block; font-size: 16px; color: #00e5ff; }
.stat span { font-size: 9px; color: #c4b5fd; }
.how { width: 100%; max-width: 500px; background: #facc15; color: #000; border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; font-weight: 900; line-height: 1.4; margin-bottom: 6px; }
#game-container { width: 100%; max-width: 500px; height: 340px; position: relative; background: #0f0529; border: 3px solid #22c55e; border-radius: 16px; overflow: hidden; touch-action: none; }
.watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,0.07); font-size: 32px; font-weight: 900; pointer-events: none; white-space: nowrap; }
canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; direction: ltr; gap: 8px; width: 100%; max-width: 500px; margin-top: 8px; }
.ctrl-btn { flex: 1; background: #1a0033; color: #fff; border: 2px solid #22c55e; border-radius: 12px; padding: 12px; font-size: 20px; font-weight: 900; cursor: pointer; }
.ctrl-btn:active { background: #ff2d95; }
#startBtn2 { width: 100%; max-width: 500px; margin-top: 8px; background: linear-gradient(90deg,#22c55e,#00e5ff,#ff2d95); color: #fff; border: 2px solid #fff; border-radius: 12px; padding: 12px; font-size: 20px; font-weight: 900; cursor: pointer; }
#overlay { position: absolute; inset: 0; background: rgba(10,0,26,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px; gap: 8px; z-index: 10; }
#overlay h2 { font-size: 22px; color: #22c55e; }
#overlay p { line-height: 1.5; font-size: 13px; color: #e2e8f0; }
.btn-start { background: linear-gradient(90deg,#22c55e,#00e5ff); color: #fff; border: 2px solid #fff; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 200px; }
#game-wrap { position: relative; width: 100%; max-width: 500px; }
</style>
</head>
<body oncontextmenu="return false">
<div class="header">
<div class="top-row"><div class="logo-wrap"><img src="../../logo.png" alt="أحمد عبدالعزيز"></div><h1>بينج بونج<small>بينج بونج الأبطال</small></h1></div>
<div class="names"><span class="ar">أحمد عبدالعزيز</span><span class="en">Ahmed TV</span></div>
<div class="stats"><div class="stat"><b id="myScore">0</b><span>أنت 🏓</span></div><div class="stat"><b id="cpuScore">0</b><span>الكمبيوتر 🤖</span></div><div class="stat"><b id="best">0</b><span>أعلى فرق</span></div></div>
</div>
<div class="how">حرك المضرب يمين وشمال - متخليش الكورة تعدي منك 🏓<br>اللي يوصل 5 الأول يكسب!</div>
<div id="game-wrap"><div id="game-container"><div class="watermark">أحمد عبدالعزيز</div><canvas id="gameCanvas"></canvas><div id="overlay"><h2>🏓 بينج بونج</h2><p>أنت المضرب اللي تحت - الأخضر<br>الكمبيوتر المضرب اللي فوق - الأحمر<br>اللي يجيب 5 الأول يكسب!</p><button class="btn-start" id="startBtn">▶ ابدأ اللعب</button></div></div></div>
<div class="controls"><button class="ctrl-btn" id="leftBtn">◀ شمال</button><button class="ctrl-btn" id="rightBtn">يمين ▶</button></div>
<button id="startBtn2">▶ ابدأ / العب تاني</button>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const myEl=document.getElementById('myScore'),cpuEl=document.getElementById('cpuScore'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),startBtn2=document.getElementById('startBtn2'),leftBtn=document.getElementById('leftBtn'),rightBtn=document.getElementById('rightBtn');
let W=0,H=0,running=false,myScore=0,cpuScore=0;
let best=parseInt(localStorage.getItem('pingBest')||'0');bestEl.textContent=best;
let player={x:0,w:90,h:12,y:0},cpu={x:0,w:90,h:12,y:0},ball={x:0,y:0,dx:1.8,dy:1.8,r:9};
let audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function beep(f,d=0.08,type='square',v=0.1){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d);}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
function resize(){const r=canvas.parentElement.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;player.x=W/2-45;player.y=H-22;cpu.x=W/2-45;cpu.y=10;if(!running){ball.x=W/2;ball.y=H/2;}draw();}
function resetGame(){myScore=0;cpuScore=0;myEl.textContent=0;cpuEl.textContent=0;resetBall(1);running=true;overlay.style.display='none';loop();}
function resetBall(dir){ball.x=W/2;ball.y=H/2;ball.dx=(Math.random()>0.5?1:-1)*1.8;ball.dy=dir*1.8;}
function moveLeft(){player.x=Math.max(4,player.x-48);if(!running)draw();}
function moveRight(){player.x=Math.min(W-player.w-4,player.x+48);if(!running)draw();}
function update(){
ball.x+=ball.dx;ball.y+=ball.dy;
if(ball.x-ball.r<0||ball.x+ball.r>W){ball.dx*=-1;beep(400,0.05);}
if(ball.y+ball.r>player.y&&ball.y-ball.r<player.y+player.h&&ball.x>player.x&&ball.x<player.x+player.w&&ball.dy>0){ball.dy*=-1;ball.y=player.y-ball.r-1;beep(600,0.08);ball.dx+= (ball.x-(player.x+player.w/2))/60;}
if(ball.y-ball.r<cpu.y+cpu.h&&ball.y+ball.r>cpu.y&&ball.x>cpu.x&&ball.x<cpu.x+cpu.w&&ball.dy<0){ball.dy*=-1;ball.y=cpu.y+cpu.h+ball.r+1;beep(500,0.08);}
let cpuCenter=cpu.x+cpu.w/2;
if(cpuCenter<ball.x-8)cpu.x+=2.2;
else if(cpuCenter>ball.x+8)cpu.x-=2.2;
cpu.x=Math.max(4,Math.min(W-cpu.w-4,cpu.x));
if(ball.y<-20){myScore++;myEl.textContent=myScore;beep(900,0.15,'sine');if(myScore>=5)return endGame(true);resetBall(1);}
if(ball.y>H+20){cpuScore++;cpuEl.textContent=cpuScore;beep(150,0.2,'sawtooth');if(cpuScore>=5)return endGame(false);resetBall(-1);}
}
function draw(){
ctx.fillStyle='#052e16';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='rgba(255,255,255,0.07)';ctx.font='900 24px Tahoma';ctx.textAlign='center';ctx.fillText('أحمد عبدالعزيز',W/2,H/2-8);
ctx.fillStyle='#ef4444';ctx.fillRect(cpu.x,cpu.y,cpu.w,cpu.h);
ctx.fillStyle='#22c55e';ctx.fillRect(player.x,player.y,player.w,player.h);
ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x-3,ball.y-3,3,0,Math.PI*2);ctx.fill();
}
function loop(){if(!running)return;update();draw();requestAnimationFrame(loop);}
function endGame(win){running=false;let diff=myScore-cpuScore;if(win&&diff>best){best=diff;localStorage.setItem('pingBest',best);bestEl.textContent=best;}overlay.style.display='flex';overlay.innerHTML=win?`<div style="font-size:32px">🏆</div><h2 style="color:#22c55e">كسبت يا بطل!</h2><p>النتيجة <b>${myScore} - ${cpuScore}</b><br>أنت أحسن من الكمبيوتر!</p><button class="btn-start" id="againBtn">🔄 العب تاني</button>`:`<div style="font-size:32px">😢</div><h2 style="color:#ef4444">الكمبيوتر كسب</h2><p>النتيجة <b>${myScore} - ${cpuScore}</b><br>جرب تاني يا بطل!</p><button class="btn-start" id="againBtn">🔄 العب تاني</button>`;document.getElementById('againBtn').onclick=resetGame;}
leftBtn.addEventListener('touchstart',e=>{e.preventDefault();initAudio();moveLeft();},{passive:false});
rightBtn.addEventListener('touchstart',e=>{e.preventDefault();initAudio();moveRight();},{passive:false});
leftBtn.addEventListener('click',()=>{initAudio();moveLeft();});
rightBtn.addEventListener('click',()=>{initAudio();moveRight();});
canvas.addEventListener('touchmove',e=>{e.preventDefault();let x=e.touches[0].clientX-canvas.getBoundingClientRect().left;player.x=Math.max(4,Math.min(W-player.w-4,x-player.w/2));if(running)draw();},{passive:false});
canvas.addEventListener('touchstart',e=>{e.preventDefault();initAudio();let x=e.touches[0].clientX-canvas.getBoundingClientRect().left;player.x=Math.max(4,Math.min(W-player.w-4,x-player.w/2));},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')moveLeft();if(e.code==='ArrowRight')moveRight();});
startBtn.addEventListener('click',()=>{initAudio();resetGame();});
startBtn2.addEventListener('click',()=>{initAudio();resetGame();});
window.addEventListener('resize',()=>{resize();if(!running)draw();});
resize();draw();
</script>
</body>
</html>
