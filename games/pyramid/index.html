<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ahmed TV - بناء الهرم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;touch-action:manipulation}
html,body{overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:#F5DEB3;display:flex;justify-content:center;padding:3px 6px}
.game{width:100%;max-width:500px;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF8DC 0%,#F5DEB3 50%,#DEB887 100%);border:4px solid #8B4513;border-radius:38px 38px 18px 18px;padding:5px 7px;position:relative}
header{padding:1px 0 2px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-img{width:88px;height:88px;border-radius:50%;border:4px solid #8B4513;object-fit:cover;background:#fff}
.brand{font-size:22px;font-weight:900;color:#8B4513}
.names{font-size:22px;font-weight:900;color:#8B4513}
.names small{display:block;font-size:16px;color:#A0522D;font-weight:900}
.stats{display:flex;gap:4px;width:100%;margin:2px 0}
.stat{flex:1;background:#fff;border:1.5px solid #8B4513;border-radius:9px;padding:2px 1px;text-align:center;line-height:1.1}
.stat b{display:block;font-size:14px;color:#8B4513}
.stat span{font-size:9px;font-weight:800;color:#666}
#view{width:100%;height:320px;background:linear-gradient(180deg,#87CEEB 0%,#FFE4B5 65%,#DEB887 100%);border:2px solid #8B4513;border-radius:16px;overflow:hidden;position:relative}
@media(min-width:700px){#view{height:400px}}
#ground{position:absolute;bottom:0;left:0;width:100%;height:22px;background:#C68A3A;border-top:3px solid #8B4513;z-index:1}
#tower{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;z-index:2}
.row{display:flex;justify-content:center}
.block{width:42px;height:28px;background:linear-gradient(180deg,#FFE4B5,#DEB887);border:2px solid #8B4513;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;margin:1px 1px}
.block.gold{background:linear-gradient(180deg,#FFD700,#FFA500)}
#moving{position:absolute;top:10px;left:10px;width:42px;height:28px;background:linear-gradient(180deg,#FFE4B5,#DEB887);border:2px solid #8B4513;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:5}
#falling{position:absolute;width:42px;height:28px;background:linear-gradient(180deg,#FFE4B5,#DEB887);border:2px solid #8B4513;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:5;display:none}
#msg{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#8B4513;font-weight:900;font-size:12px;padding:4px 12px;border-radius:20px;z-index:6;white-space:nowrap}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:10;text-align:center;padding:10px}
#overlay h2{color:#fff;font-size:22px}
#overlay p{color:#FFE4B5;font-size:13px;font-weight:800;line-height:1.6}
#startBtn{font-family:inherit;font-weight:900;border:0;border-radius:18px;padding:12px 28px;background:#FFD700;color:#8B4513;cursor:pointer;font-size:16px}
.controls{display:flex;gap:6px;width:100%;margin-top:5px}
.cbtn{flex:1;height:56px;border-radius:14px;border:0;background:#8B4513;color:#fff;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
.cbtn:active{background:#A0522D}
footer{text-align:center;color:#8B4513;font-size:10px;margin-top:2px;padding-bottom:2px}
footer a{color:#8B4513;text-decoration:none;font-weight:700}
</style></head>
<body oncontextmenu="return false"><div class="game">
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">بناء الهرم</div><div class="names">أحمد عبدالعزيز<small>Ahmed TV</small></div></header>
<div class="stats"><div class="stat"><b id="level">الدور 1 / 5</b><span>بتبني فين</span></div><div class="stat"><b id="score">0</b><span>الحجارة</span></div><div class="stat"><b id="best">0</b><span>أعلى سكور</span></div></div>
<div id="view"><div id="msg">دوس نزل الحجر في مكانه!</div><div id="ground"></div><div id="tower"></div><div id="moving">🧱</div><div id="falling">🧱</div>
<div id="overlay"><h2>🗼 بناء الهرم 🗼</h2><p>الحجر بيتحرك فوق<br>دوس في الوقت الصح - ونزله مكانه<br>ابني 5 أدوار - وحط التاج 👑</p><button id="startBtn" onclick="startGame()">ابدأ البناء</button></div></div>
<div class="controls"><button class="cbtn" onclick="dropBlock()">⬇ نزل الحجر ⬇</button></div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
var moving=document.getElementById('moving'), falling=document.getElementById('falling'), tower=document.getElementById('tower'), msg=document.getElementById('msg'), overlay=document.getElementById('overlay');
var playing=false, mx=10, dir=1, moveTimer=null, need=[5,4,3,2,1], curRow=0, curCount=0, score=0, best=+(localStorage.getItem('ahmed_pyramid_best')||0);
document.getElementById('best').textContent=best;
function renderTower(){ tower.innerHTML=''; for(var r=0;r<curRow;r++){ var row=document.createElement('div'); row.className='row'; for(var i=0;i<need[r];i++){ var b=document.createElement('div'); b.className='block'; b.textContent='🧱'; row.appendChild(b); } tower.appendChild(row); } if(curCount>0){ var row2=document.createElement('div'); row2.className='row'; for(var j=0;j<curCount;j++){ var b2=document.createElement('div'); b2.className='block'; b2.textContent='🧱'; row2.appendChild(b2); } tower.appendChild(row2); } }
function startGame(){ curRow=0; curCount=0; score=0; mx=10; dir=1; playing=true; document.getElementById('score').textContent='0'; document.getElementById('level').textContent='الدور 1 / 5'; renderTower(); overlay.style.display='none'; moving.style.display='flex'; msg.textContent='الدور الأول - عايز 5 حجارة'; clearInterval(moveTimer); moveTimer=setInterval(function(){ if(!playing) return; mx+=dir*2.5; if(mx>88){dir=-1;} if(mx<2){dir=1;} moving.style.left=mx+'%'; },30); }
function dropBlock(){ if(!playing) return; var startX=mx; moving.style.display='none'; falling.style.display='flex'; falling.style.left=startX+'%'; falling.style.top='10px'; var y=10; var fall=setInterval(function(){ y+=8; falling.style.top=y+'px'; if(y>235){ clearInterval(fall); falling.style.display='none'; checkDrop(startX); } },20); }
function checkDrop(x){ var towerCenter=50; var targetWidth=need[curRow]*44; var leftEdge=towerCenter-(targetWidth/2)/3.5; var rightEdge=towerCenter+(targetWidth/2)/3.5; var ok = (x>18 && x<78); if(ok){ curCount++; score++; document.getElementById('score').textContent=score; renderTower(); msg.textContent='عاش! حجر صح! 👏'; if(curCount>=need[curRow]){ curRow++; curCount=0; if(curRow>=5){ winGame(); return; } document.getElementById('level').textContent='الدور '+(curRow+1)+' / 5'; msg.textContent='الدور اللي بعده - عايز '+need[curRow]+' حجارة'; } moving.style.display='flex'; } else { loseGame(); } }
function winGame(){ playing=false; clearInterval(moveTimer); if(score>best){ best=score; localStorage.setItem('ahmed_pyramid_best',best); document.getElementById('best').textContent=best; } tower.innerHTML=tower.innerHTML+'<div class="row"><div class="block gold">👑</div></div>'; overlay.style.display='flex'; overlay.innerHTML='<h2>بنيت الهرم! 👑</h2><p>خلصت 5 أدوار - وحطيت التاج<br>حطيت '+score+' حجرة</p><button id="startBtn" onclick="startGame()">ابني هرم تاني</button>'; }
function loseGame(){ playing=false; clearInterval(moveTimer); overlay.style.display='flex'; overlay.innerHTML='<h2>الحجر وقع! 😢</h2><p>وصلت للدور '+(curRow+1)+' - وجمعت '+score+' حجرة</p><button id="startBtn" onclick="startGame()">حاول تاني</button>'; }
renderTower();
</script>
</body></html>
