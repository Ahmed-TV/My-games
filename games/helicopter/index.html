<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>لعبة الهليكوبتر | Ahmed TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;touch-action:manipulation}
html,body{height:100%!important;height:100svh!important;max-height:100svh!important;overflow:hidden!important}
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 8px;height:100svh!important;overflow:hidden!important}
.header{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;padding-bottom:2px}
.logo-img{width:64px;height:64px;border-radius:50%;border:4px solid #facc15;object-fit:cover;background:#fff;box-shadow:0 0 22px rgba(250,204,21,.5)}
.header-text{text-align:center}
.header-text h1{font-size:20px;color:#facc15;margin:0}
.header-text .names{font-size:18px;color:#fff;font-weight:900}
.header-text .names small{display:block;font-size:14px;color:#facc15;font-weight:900}
.stats{display:flex;gap:8px;justify-content:center;margin-bottom:4px;flex-shrink:0}
.stat{background:#1e293b;border-radius:6px;padding:1px 8px;min-width:60px;text-align:center;border:1px solid #334155}
.stat b{display:block;font-size:14px;color:#facc15}
.stat span{font-size:9px;color:#94a3b8}
#game-container{width:100%;max-width:600px;flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:#1e293b;border:3px solid #f59e0b;border-radius:12px;overflow:hidden;padding:5px}
.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,0.05);font-size:30px;font-weight:900;pointer-events:none;z-index:0;white-space:nowrap}
canvas{width:100%;height:100%;display:block;z-index:1;border-radius:8px;background:#38bdf8}
.controls{display:flex;gap:10px;justify-content:center;padding:6px 0 0 0;z-index:3;flex-shrink:0;width:100%;max-width:600px}
.ctrl-btn{background:#f59e0b;color:#fff;border:2px solid #b45309;border-radius:12px;font-size:22px;font-weight:900;width:110px;height:52px;display:flex;justify-content:center;align-items:center;cursor:pointer;user-select:none;box-shadow:0 4px 0 #b45309;touch-action:none}
.ctrl-btn:active{transform:translateY(4px);box-shadow:0 0 0 #b45309;background:#d97706}
#overlay{position:absolute;inset:0;background:rgba(15,23,42,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;gap:10px;z-index:10}
#overlay h2{font-size:24px;margin-bottom:5px;color:#facc15}
#overlay p{line-height:1.6;font-size:14px;color:#e2e8f0;margin-bottom:10px}
.btn-start{background:#f59e0b;color:#000;border:none;padding:12px 25px;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;width:80%;max-width:200px}
.btn-start:active{transform:scale(0.95)}
.footer{font-size:11px;color:#94a3b8;text-align:center;margin-top:4px;padding-bottom:2px;flex-shrink:0}
.footer a{color:#facc15;text-decoration:none}
</style></head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false" onmousedown="return false">
<div class="header">
<img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
<div class="header-text"><h1>لعبة الهليكوبتر</h1><div class="names">أحمد عبدالعزيز<small>Ahmed TV</small></div></div>
</div>
<div class="stats"><div class="stat"><b id="score">0</b><span>النقاط</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div><div class="stat"><b id="speed">1x</b><span>السرعة</span></div></div>
<div id="game-container">
<div class="watermark">Ahmed TV</div>
<canvas id="gameCanvas"></canvas>
<div id="overlay"><h2>لعبة الهليكوبتر</h2><p><b>Ahmed TV</b> - طير وتفادى العقبات!<br>استخدم الأزرار عشان تطير</p><button class="btn-start" id="startBtn">ابدأ الطيران</button></div>
</div>
<div class="controls"><button class="ctrl-btn" id="upBtn">فوق</button><button class="ctrl-btn" id="downBtn">تحت</button></div>
<div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">كل ألعابي</a></div>
<script>
// ===== منع بحث جوجل =====
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');const speedEl=document.getElementById('speed');const overlay=document.getElementById('overlay');const startBtn=document.getElementById('startBtn');const upBtn=document.getElementById('upBtn');const downBtn=document.getElementById('downBtn');
let W=0,H=0,running=false,score=0;let best=parseInt(localStorage.getItem('helicopterBest')||'0');bestEl.textContent=best;
let player={x:0,y:0,width:60,height:35,speed:7};let obstacles=[];let baseSpeed=1.5;let currentSpeed=baseSpeed;let upPressed=false,downPressed=false;let spawnTimer=null,rafId=null;
// ===== صوتك بدل الصفافير =====
let soundOn=true, _audioCache={}, _ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
function playSound(type){ if(type==='score'){ playAhmedVoice('sah'); } else if(type==='crash'){ playAhmedVoice('khesert'); } }
function resize(){const rect=canvas.getBoundingClientRect();if(rect.width===0)return;canvas.width=rect.width;canvas.height=rect.height;W=canvas.width;H=canvas.height;if(!running){player.x=50;player.y=H/2-player.height/2;draw();}}
function createObstacle(){if(!running)return;const laneHeight=H/3;const lane=Math.floor(Math.random()*3);const y=lane*laneHeight+(laneHeight-player.height)/2;obstacles.push({x:W+50,y:y,width:50,height:80,speed:currentSpeed,passed:false});}
function draw(){ctx.fillStyle='#38bdf8';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(W*0.2,H*0.2,30,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(W*0.7,H*0.7,40,0,Math.PI*2);ctx.fill();ctx.font='40px Arial';ctx.textAlign='center';ctx.fillText('🚁',player.x+player.width/2,player.y+player.height/2+10);obstacles.forEach(e=>{ctx.font='40px Arial';ctx.textAlign='center';ctx.fillText('🏢',e.x+e.width/2,e.y+e.height/2+10);});}
function update(){if(!running)return;if(upPressed){player.y-=player.speed;if(player.y<0)player.y=0;}if(downPressed){player.y+=player.speed;if(player.y+player.height>H)player.y=H-player.height;}for(let i=obstacles.length-1;i>=0;i--){let e=obstacles[i];e.x-=e.speed;if(e.x+e.width<0){obstacles.splice(i,1);if(!e.passed){score++;scoreEl.textContent=score;playSound('score');if(score%10===0){currentSpeed+=0.2;speedEl.textContent=currentSpeed.toFixed(1)+'x';}}continue;}if(player.x<e.x+e.width&&player.x+player.width>e.x&&player.y<e.y+e.height&&player.y+player.height>e.y){endGame();return;}}}
function loop(){update();draw();if(running)rafId=requestAnimationFrame(loop);}
function setupControls(){
  blockGoogle(upBtn); blockGoogle(downBtn);
  function bind(btn,setVal){
    btn.addEventListener('pointerdown',function(e){ e.preventDefault(); setVal(true); },{passive:false});
    btn.addEventListener('pointerup',function(e){ e.preventDefault(); setVal(false); },{passive:false});
    btn.addEventListener('pointerleave',function(){ setVal(false); });
    btn.addEventListener('pointercancel',function(){ setVal(false); });
    btn.addEventListener('contextmenu',function(e){ e.preventDefault(); return false; });
  }
  bind(upBtn,function(v){ upPressed=v; });
  bind(downBtn,function(v){ downPressed=v; });
  document.addEventListener('keydown',(e)=>{if(e.key==='ArrowUp')upPressed=true;if(e.key==='ArrowDown')downPressed=true;});
  document.addEventListener('keyup',(e)=>{if(e.key==='ArrowUp')upPressed=false;if(e.key==='ArrowDown')downPressed=false;});
}
setupControls();
function startGame(){playAhmedVoice('ebda');overlay.style.display='none';score=0;scoreEl.textContent=0;currentSpeed=baseSpeed;speedEl.textContent='1.5x';obstacles=[];player.y=H/2-player.height/2;running=true;if(spawnTimer)clearInterval(spawnTimer);spawnTimer=setInterval(()=>{if(running)createObstacle();},2500);if(rafId)cancelAnimationFrame(rafId);loop();}
function endGame(){running=false;if(spawnTimer)clearInterval(spawnTimer);playSound('crash');if(score>best){best=score;localStorage.setItem('helicopterBest',best);bestEl.textContent=best;}overlay.style.display='flex';overlay.innerHTML='<div style="font-size:35px">💥</div><h2>خبطت!</h2><p>جبت <b style="color:#facc15;font-size:22px">'+score+' نقطة</b><br>أعلى نتيجة: '+best+'<br>حاول تاني!</p><button class="btn-start" id="againBtn">العب تاني</button>';var ab=document.getElementById('againBtn'); blockGoogle(ab); ab.addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false}); ab.addEventListener('contextmenu',function(e){e.preventDefault();return false;});}
blockGoogle(startBtn); startBtn.addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false}); startBtn.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
blockGoogle(canvas); canvas.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
window.addEventListener('resize',()=>{resize();if(!running)draw();});
resize();draw();
</script>
</body></html>
