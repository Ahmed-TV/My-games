<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>السلم والثعبان | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout:none!important; -webkit-user-select:none!important; user-select:none!important; -moz-user-select:none!important; -ms-user-select:none!important; touch-action:manipulation; }
  html, body { height: 100%!important; height: 100svh!important; max-height:100svh!important; overflow: hidden!important; }
  body { font-family: Tahoma, Arial, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top, 4px) 8px env(safe-area-inset-bottom, 4px) 8px; overflow:hidden!important; }
  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 3px; }
  .logo-img{width:50px;height:50px;border-radius:50%;border:3px solid #facc15;object-fit:cover;background:#000;flex-shrink:0}
  h1 { font-size: 20px; line-height: 1.2; }
  h1 small { display: block; font-size: 11px; color: #facc15; letter-spacing: 1px; margin-top: 2px; }
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 4px; }
  .names b { color: #fff; }
  #game-container { width: 100%; max-width: 500px; flex:1; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 8px; }
  .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: rgba(255, 255, 255, 0.03); font-size: 40px; font-weight: 900; pointer-events: none; z-index: 0; white-space: nowrap; }
  .board-container { flex:1; min-height:0; width: 100%; background: #1e293b; border: 3px solid #f59e0b; border-radius: 16px; position: relative; padding: 5px; overflow: hidden; }
  .board { display: grid; grid-template-columns: repeat(10, 1fr); width: 100%; height: 100%; gap: 2px; }
  .tile { background: #0f172a; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 10px; color: #64748b; position: relative; }
  .tile.alt { background: #162032; }
  .tile.ladder { border: 2px solid #22c55e; color: #22c55e; font-weight: bold; }
  .tile.snake { border: 2px solid #ef4444; color: #ef4444; font-weight: bold; }
  .player-token { width: 70%; height: 70%; border-radius: 50%; background: #facc15; box-shadow: 0 0 10px #facc15; border: 2px solid #fff; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; color: #000; z-index: 5; transition: all 0.3s ease-in-out; position: absolute; }
  .controls { display: flex; flex-direction: column; gap: 6px; align-items: center; flex-shrink: 0; padding-bottom: 3px; }
  .dice-box { display: flex; align-items: center; gap: 15px; background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 6px 20px; }
  .dice { width: 50px; height: 50px; background: #fff; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #000; font-weight: bold; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); transition: transform 0.5s; }
  .dice.rolling { animation: roll 0.5s infinite; }
  @keyframes roll { 0% { transform: rotate(0deg); } 25% { transform: rotate(90deg); } 50% { transform: rotate(180deg); } 75% { transform: rotate(270deg); } 100% { transform: rotate(360deg); } }
  #rollBtn { background: #f59e0b; color: #000; border: none; padding: 10px 30px; border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer; width: 100%; max-width: 300px; }
  #rollBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #rollBtn:active:not(:disabled) { transform: scale(0.95); }
  #message { font-size: 14px; font-weight: bold; min-height: 20px; color: #facc15; text-align:center; }
  #overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 15px; gap: 10px; border-radius: 16px; z-index: 10; pointer-events:auto; }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; }
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn { background: #f59e0b; color: #000; border: none; padding: 12px 25px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 250px; pointer-events:auto!important; position:relative; z-index:20; }
  .btn:active { transform: scale(0.95); }
  .btn:hover { background: #d97706; }
  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 4px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body oncontextmenu="return false">
  <div class="header"><div class="top-row"><img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img"><h1>السلم والثعبان<small>AHMED TV SNAKES & LADDERS</small></h1></div><div class="names">أحمد عبد العزيز • <b>Ahmed Abdelaziz</b></div></div>
  <div id="game-container"><div class="watermark">أحمد عبد العزيز<br>Ahmed TV</div><div class="board-container"><div class="board" id="board"></div></div><div class="controls"><div id="message">اضغط على الزر لكي تبدأ</div><div class="dice-box"><div class="dice" id="dice">🎲</div></div><button id="rollBtn">ارمي الزهر</button></div><div id="overlay"><h2>مرحبا بك يا بطل!</h2><p><b>Ahmed TV</b> - العب مع نفسك أو مع صديقك!<br>صل إلى الخانة 100 لكي تفوز<br>السلم يصعد بك إلى الأعلى .. والثعبان ينزلك إلى الأسفل!</p><button class="btn" id="startBtn">ابدأ اللعب</button></div></div>
  <div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">كل ألعابي</a></div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
var soundOn=true,_audioCache={},_ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
</script>
<script>
const boardEl = document.getElementById('board');
const diceEl = document.getElementById('dice');
const rollBtn = document.getElementById('rollBtn');
const messageEl = document.getElementById('message');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
let playerPos = 1;
let isRolling = false;
let gameActive = false;
const LADDERS = { 3: 22, 8: 30, 28: 84, 58: 77, 75: 86, 80: 100, 90: 91 };
const SNAKES = { 17: 7, 54: 34, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 79 };
blockGoogle(startBtn); blockGoogle(rollBtn); blockGoogle(diceEl); blockGoogle(boardEl);
function playSound(type){ if(type==='roll') playAhmedVoice('hawel'); else if(type==='ladder') playAhmedVoice('sah'); else if(type==='snake') playAhmedVoice('ghalat'); else if(type==='win') playAhmedVoice('kesebt'); }
function buildBoard() {
  boardEl.innerHTML = '';
  for (let i = 100; i >= 1; i--) {
    let tile = document.createElement('div');
    tile.className = 'tile';
    if (Math.floor((i - 1) / 10) % 2 === 0) { if (i % 2 === 0) tile.classList.add('alt'); } else { if (i % 2 !== 0) tile.classList.add('alt'); }
    tile.id = 'tile-' + i;
    if (LADDERS[i]) { tile.classList.add('ladder'); tile.innerHTML = `<span style="font-size:12px;">🪜</span>`; } else if (SNAKES[i]) { tile.classList.add('snake'); tile.innerHTML = `<span style="font-size:12px;">🐍</span>`; } else { tile.innerHTML = i; }
    blockGoogle(tile);
    boardEl.appendChild(tile);
  }
  updatePlayerPosition(1);
}
function updatePlayerPosition(pos) {
  document.querySelectorAll('.player-token').forEach(el => el.remove());
  const tile = document.getElementById('tile-' + pos);
  if (tile) { const token = document.createElement('div'); token.className = 'player-token'; token.innerHTML = '👤'; tile.appendChild(token); }
}
function rollDice() {
  if (isRolling || !gameActive) return;
  playSound('roll');
  isRolling = true;
  rollBtn.disabled = true;
  messageEl.textContent = "جاري رمي الزهر...";
  let rollCount = 0;
  const rollInterval = setInterval(() => {
    diceEl.textContent = Math.floor(Math.random() * 6) + 1;
    rollCount++;
    if (rollCount > 10) { clearInterval(rollInterval); finishRoll(parseInt(diceEl.textContent)); }
  }, 50);
}
function finishRoll(roll) {
  let newPos = playerPos + roll;
  if (newPos > 100) { messageEl.textContent = `رميت ${roll}، تحتاج رقما أصغر لكي تصل إلى 100 بالضبط.`; endTurn(); return; }
  playerPos = newPos;
  updatePlayerPosition(playerPos);
  if (LADDERS[playerPos]) {
    setTimeout(() => { playSound('ladder'); messageEl.textContent = `أحسنت! صعدت بالسلم إلى الخانة ${LADDERS[playerPos]}! 🪜`; playerPos = LADDERS[playerPos]; updatePlayerPosition(playerPos); checkWin(); }, 500);
  } else if (SNAKES[playerPos]) {
    setTimeout(() => { playSound('snake'); messageEl.textContent = `انتبه! ثعبان أنزلك إلى الخانة ${SNAKES[playerPos]}! 🐍`; playerPos = SNAKES[playerPos]; updatePlayerPosition(playerPos); endTurn(); }, 500);
  } else { messageEl.textContent = `رميت ${roll}، الآن أنت في الخانة ${playerPos}`; checkWin(); }
}
function checkWin() {
  if (playerPos === 100) {
    gameActive = false;
    playSound('win');
    messageEl.textContent = "مبروك! وصلت إلى 100! 🎉";
    overlay.style.display = 'flex';
    overlay.innerHTML = `<div style="font-size:35px">🏆</div><h2 style="color:#10b981">مبروك يا بطل!</h2><p>وصلت إلى الخانة 100<br>Ahmed TV يقول لك: أنت أسطورة!</p><button class="btn" id="againBtn">العب مرة أخرى</button>`;
    var ab=document.getElementById('againBtn'); blockGoogle(ab);
    ab.addEventListener('click', onStartBtn); ab.addEventListener('pointerdown', onStartBtn, {passive:false}); ab.addEventListener('touchstart', onStartBtn, {passive:false});
  } else { endTurn(); }
}
function endTurn() { isRolling = false; rollBtn.disabled = false; }
var _starting=false;
function onStartBtn(e){ if(e){ try{ e.preventDefault(); }catch(err){} } if(_starting) return; _starting=true; startGame(); setTimeout(function(){ _starting=false; }, 800); }
function startGame() {
  overlay.style.display = 'none';
  playerPos = 1;
  gameActive = true;
  isRolling = false;
  rollBtn.disabled = false;
  messageEl.textContent = "دورك! ارم الزهر لكي تتحرك.";
  try{ playAhmedVoice('ebda'); }catch(e){}
  buildBoard();
}
startBtn.addEventListener('click', onStartBtn); startBtn.addEventListener('pointerdown', onStartBtn, {passive:false}); startBtn.addEventListener('touchstart', onStartBtn, {passive:false});
function onRollBtn(e){ if(e){ try{ e.preventDefault(); }catch(err){} } rollDice(); }
rollBtn.addEventListener('click', onRollBtn); rollBtn.addEventListener('pointerdown', onRollBtn, {passive:false}); rollBtn.addEventListener('touchstart', onRollBtn, {passive:false});
buildBoard();
</script>
</body>
</html>
