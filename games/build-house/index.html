<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>بناء منزل | أحمد عبدالعزيز</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
html, body { overflow-y: auto; overflow-x: hidden; }
body { font-family: Tahoma, Arial, sans-serif; background: #0a001a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 4px 4px 4px 4px; }
.header { width: 100%; max-width: 500px; text-align: center; }
.top-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2px; }
.logo-wrap { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; border: 4px solid #facc15; background: #000; flex-shrink: 0; }
.logo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
h1 { font-size: 26px; color: #ff2d95; line-height: 1.2; }
h1 small { display: block; font-size: 13px; color: #00e5ff; }
.names { text-align: center; line-height: 1.3; margin-bottom: 6px; }
.names .ar { display: block; font-size: 22px; color: #facc15; font-weight: 900; }
.names .en { display: block; font-size: 16px; color: #fff; font-weight: 900; }
.stats { display: flex; gap: 8px; justify-content: center; margin: 4px 0 6px; }
.stat { background: #1a0033; border: 2px solid #ff2d95; border-radius: 10px; padding: 3px 12px; min-width: 85px; text-align: center; }
.stat b { display: block; font-size: 16px; color: #00e5ff; }
.stat span { font-size: 9px; color: #c4b5fd; }
.how { width: 100%; max-width: 500px; background: #facc15; color: #000; border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; font-weight: 900; line-height: 1.4; margin-bottom: 6px; }
#game-container { width: 100%; max-width: 500px; height: 320px; position: relative; background: #38bdf8; border: 3px solid #f59e0b; border-radius: 16px; overflow: hidden; }
@media (max-width: 600px) {
  #game-container { height: 400px; }
}
.watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,0.08); font-size: 28px; font-weight: 900; pointer-events: none; white-space: nowrap; z-index: 0; }
.build-area { position: absolute; inset: 0; overflow: hidden; z-index: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.ground { width: 100%; height: 25px; background: #22c55e; border-top: 5px solid #16a34a; z-index: 2; flex-shrink: 0; }
.floor { height: 35px; background: linear-gradient(to bottom, #fcd34d, #f59e0b); border: 2px solid #b45309; border-radius: 4px; position: absolute; display: flex; justify-content: center; align-items: center; font-size: 20px; z-index: 1; }
.floor .window-icon { font-size: 16px; color: #fff; }
.floor.roof { background: linear-gradient(to bottom, #ef4444, #b91c1c); border-color: #7f1d1d; border-radius: 10px 10px 0 0; height: 25px; }
.moving-floor { position: absolute; height: 35px; background: linear-gradient(to bottom, #fcd34d, #f59e0b); border: 2px solid #b45309; border-radius: 4px; z-index: 5; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
.moving-floor .window-icon { font-size: 16px; color: #fff; }
/* الزرار بره اللعبة - وتحت - مش مخفي */
.controls { width: 100%; max-width: 500px; margin-top: 6px; }
.btn { width: 100%; background: linear-gradient(90deg,#f59e0b,#ff2d95); color: #fff; border: 2px solid #fff; padding: 12px; border-radius: 10px; font-size: 20px; font-weight: 900; cursor: pointer; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
#overlay { position: absolute; inset: 0; background: rgba(10,0,26,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px; gap: 8px; z-index: 10; }
#overlay h2 { font-size: 22px; color: #facc15; }
#overlay p { line-height: 1.5; font-size: 13px; color: #fff; }
.btn-start { background: linear-gradient(90deg,#f59e0b,#ff2d95); color: #fff; border: 2px solid #fff; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 200px; }
#game-wrap { position: relative; width: 100%; max-width: 500px; }
.footer { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 6px; }
.footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body oncontextmenu="return false">
<div class="header">
<div class="top-row"><div class="logo-wrap"><img src="../../logo.png" alt="أحمد عبدالعزيز"></div><h1>بناء منزل<small>AHMED TV BUILDER</small></h1></div>
<div class="names"><span class="ar">أحمد عبدالعزيز</span><span class="en">Ahmed TV</span></div>
<div class="stats"><div class="stat"><b id="floors">0</b><span>الطوابق 🏠</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div></div>
</div>
<div class="how">ابنِ أطول منزل 🏠 - ركز وحط الطابق فوق اللي تحته بالظبط<br>وصل لـ 10 طوابق عشان تكسب</div>
<div id="game-wrap"><div id="game-container"><div class="watermark">أحمد عبدالعزيز</div><div class="build-area" id="buildArea"><div class="ground"></div></div><div id="overlay"><h2>🏠 بناء منزل</h2><p><b>Ahmed TV</b> - ابنِ أطول منزل!<br>ركز عشان تحط الطوابق فوق بعض بالظبط</p><button class="btn-start" id="startBtn">▶ ابدأ البناء</button></div></div></div>
<div class="controls"><button class="btn" id="placeBtn" disabled>🎯 ركز وحط الطابق</button></div>
<div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a></div>
<script>
const buildArea=document.getElementById('buildArea'),placeBtn=document.getElementById('placeBtn'),floorsEl=document.getElementById('floors'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');
let floorCount=0,running=false;
let best=parseInt(localStorage.getItem('houseBest')||'0');let audioCtx=null;
let movingFloor=null,moveInterval=null,posX=0,direction=1,lastFloorLeft=0,lastFloorWidth=60,currentFloorY=25;
bestEl.textContent=best;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function playSound(type){if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);if(type==='build'){osc.type='sine';osc.frequency.setValueAtTime(300,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(500,audioCtx.currentTime+0.1);gain.gain.setValueAtTime(0.15,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2);osc.start();osc.stop(audioCtx.currentTime+0.2);}else if(type==='fail'){osc.type='sawtooth';osc.frequency.setValueAtTime(200,audioCtx.currentTime);gain.gain.setValueAtTime(0.2,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);osc.start();osc.stop(audioCtx.currentTime+0.3);}else if(type==='win'){osc.type='triangle';osc.frequency.setValueAtTime(600,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(1200,audioCtx.currentTime+0.4);gain.gain.setValueAtTime(0.2,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);osc.start();osc.stop(audioCtx.currentTime+0.5);}}
function createMovingFloor(){
movingFloor=document.createElement('div');movingFloor.className='moving-floor';movingFloor.style.width=lastFloorWidth+'%';movingFloor.style.left=posX+'%';movingFloor.style.bottom=(currentFloorY)+'px';
if(floorCount===0)movingFloor.innerHTML='🚪';else movingFloor.innerHTML='<span class="window-icon">🪟</span>';
buildArea.appendChild(movingFloor);posX=0;direction=1;
moveInterval=setInterval(()=>{posX+=direction*1.2;if(posX>(100-lastFloorWidth)){posX=100-lastFloorWidth;direction=-1;}if(posX<0){posX=0;direction=1;}movingFloor.style.left=posX+'%';},16);
placeBtn.disabled=false;
}
function placeFloor(){
if(!running||!movingFloor)return;
clearInterval(moveInterval);placeBtn.disabled=true;
let diff=Math.abs(posX-lastFloorLeft);
if(diff>(lastFloorWidth*0.5)){
playSound('fail');movingFloor.style.background='#ef4444';running=false;
setTimeout(()=>{overlay.style.display='flex';overlay.innerHTML=`<div style="font-size:35px">💥</div><h2>البناء وقع!</h2><p>بنيت <b style="color:#facc15;font-size:22px">${floorCount}</b> طوابق<br>أعلى نتيجة: ${best}<br>أحمد TV بيقولك: حاول تاني، ركز في النص!</p><button class="btn-start" id="againBtn">🔄 ابنِ تاني</button>`;document.getElementById('againBtn').onclick=startGame;},500);return;
}
playSound('build');movingFloor.className='floor';lastFloorLeft=posX;
if(floorCount===0)movingFloor.innerHTML='🚪';else movingFloor.innerHTML='<span class="window-icon">🪟</span>';
floorCount++;floorsEl.textContent=floorCount;currentFloorY+=35;
if(floorCount>=10){
running=false;playSound('win');
if(best===0||floorCount>best){best=floorCount;localStorage.setItem('houseBest',best);bestEl.textContent=best;}
setTimeout(()=>{let roof=document.createElement('div');roof.className='floor roof';roof.style.width=lastFloorWidth+'%';roof.style.left=lastFloorLeft+'%';roof.style.bottom=currentFloorY+'px';buildArea.appendChild(roof);},200);
setTimeout(()=>{overlay.style.display='flex';overlay.innerHTML=`<div style="font-size:35px">🏠</div><h2>مبروك! بنيت المنزل!</h2><p>بنيت <b style="color:#facc15;font-size:22px">${floorCount}</b> طوابق<br>أحمد TV بيقولك: إنت مهندس معماري!</p><button class="btn-start" id="againBtn">🔄 ابنِ تاني</button>`;document.getElementById('againBtn').onclick=startGame;},600);return;
}
setTimeout(createMovingFloor,300);
}
function startGame(){
initAudio();overlay.style.display='none';
buildArea.innerHTML='<div class="ground"></div>';
floorCount=0;floorsEl.textContent=0;lastFloorLeft=0;lastFloorWidth=60;currentFloorY=25;running=true;
createMovingFloor();
}
placeBtn.addEventListener('touchstart',e=>{e.preventDefault();initAudio();placeFloor();},{passive:false});
placeBtn.addEventListener('click',()=>{initAudio();placeFloor();});
startBtn.onclick=startGame;
document.body.addEventListener('touchstart',initAudio,{once:true});
document.body.addEventListener('click',initAudio,{once:true});
</script>

</a>
<script>
(function(){
var wa=document.getElementById('waBtn');
var dragging=false,startX=0,startY=0,startLeft=0,startTop=0,moved=false;
function startDrag(x,y){ dragging=true;moved=false;startX=x;startY=y;startLeft=wa.offsetLeft;startTop=wa.offsetTop; wa.style.transition='none'; }
function moveDrag(x,y){
  if(!dragging) return;
  var dx=x-startX,dy=y-startY;
  if(Math.abs(dx)>6||Math.abs(dy)>6) moved=true;
  if(moved){
    var nx=startLeft+dx,ny=startTop+dy;
    nx=Math.max(0,Math.min(window.innerWidth-60,nx));
    ny=Math.max(0,Math.min(window.innerHeight-80,ny));
    wa.style.left=nx+'px';wa.style.top=ny+'px';
    wa.style.right='auto';wa.style.bottom='auto';
  }
}
function endDrag(){ if(moved){ setTimeout(function(){moved=false},80); } dragging=false; }
wa.addEventListener('touchstart',function(e){ if(e.touches.length===1){ startDrag(e.touches[0].clientX,e.touches[0].clientY); } },{passive:true});
document.addEventListener('touchmove',function(e){ if(!dragging) return; if(e.cancelable) e.preventDefault(); if(e.touches.length===1){ moveDrag(e.touches[0].clientX,e.touches[0].clientY); } },{passive:false});
document.addEventListener('touchend',function(){ endDrag(); });
wa.addEventListener('mousedown',function(e){ startDrag(e.clientX,e.clientY); });
document.addEventListener('mousemove',function(e){ moveDrag(e.clientX,e.clientY); });
document.addEventListener('mouseup',function(){ endDrag(); });
wa.addEventListener('click',function(e){ if(moved) e.preventDefault(); });
})();
</script>
</body>
