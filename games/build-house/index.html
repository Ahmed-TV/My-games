<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>بناء منزل | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px; }
  
  .logo {
    width: 60px; height: 60px; flex-shrink: 0;
    background: linear-gradient(135deg, #f59e0b, #ef4444); 
    border: 4px solid #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; line-height: 1;
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
  }
  .logo b { font-size: 12px; }
  .logo span { font-size: 8px; font-weight: 900; margin-top: 2px; }
  
  h1 { font-size: 20px; line-height: 1.2; color: #facc15;}
  h1 small { display: block; font-size: 11px; color: #fff; letter-spacing: 1px; margin-top: 2px; }
  
  .names { font-size: 14px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold;}
  .names b { color: #facc15; font-size: 16px;}

  .stats { display: flex; gap: 10px; justify-content: center; margin: 5px 0; flex-wrap: wrap; }
  .stat {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 5px 15px; min-width: 80px; text-align: center;
  }
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #38bdf8; 
    border: 4px solid #f59e0b; border-radius: 16px;
    overflow: hidden;
    padding: 10px;
  }

  .watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255, 255, 255, 0.1);
    font-size: 40px;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  /* منطقة البناء */
  .build-area {
    flex-grow: 1; position: relative; display: flex; flex-direction: column;
    justify-content: flex-end; /* يبدأ من تحت */
    align-items: center; z-index: 1; overflow: hidden;
    padding-bottom: 20px; /* مساحة للأرضية */
  }

  /* الارضية */
  .ground {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 20px;
    background: #22c55e; z-index: 2;
  }

  /* الطابق الحالي (المتحرك) */
  .moving-floor {
    position: absolute;
    height: 30px;
    background: #f59e0b;
    border: 2px solid #b45309;
    border-radius: 4px;
    z-index: 5;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  /* الطوابق المستقرة */
  .placed-floor {
    width: 60%; height: 30px;
    background: #f59e0b;
    border: 2px solid #b45309;
    border-radius: 4px;
    margin-bottom: 2px;
    display: flex; justify-content: center; align-items: center;
    font-size: 16px;
    position: relative;
    z-index: 1;
  }

  .placed-floor.door::before { content: '🚪'; }
  .placed-floor.window::before { content: '🪟'; font-size: 14px;}
  
  .placed-floor.roof {
    background: #ef4444;
    border-color: #991b1b;
    height: 25px;
    border-radius: 10px 10px 0 0;
    width: 65%; /* السقف أعرض شوية */
  }

  /* الأزرار */
  .controls {
    display: flex; gap: 10px; justify-content: center; padding: 10px;
    background: #1e293b; border-radius: 10px; z-index: 2;
    flex-shrink: 0;
  }
  .btn {
    background: #f59e0b; color: #000; border: none; padding: 15px 25px;
    border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer;
    flex-grow: 1;
    box-shadow: 0 4px 0 #d97706;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d97706; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 5px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="top-row">
      <div class="logo"><b>Ahmed</b><span>TV 📺</span></div>
      <h1>بناء منزل<small>AHMED TV BUILDER</small></h1>
    </div>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>

    <div class="stats">
      <div class="stat"><b id="floors">0</b><span>الطوابق</span></div>
      <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    </div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    
    <div class="build-area" id="buildArea">
      <div class="ground"></div>
    </div>

    <div class="controls">
      <button class="btn" id="placeBtn" disabled>🎯 ركز وحط الطابق</button>
    </div>

    <div id="overlay">
      <h2>لعبة بناء منزل</h2>
      <p>
        <b>Ahmed TV</b> - ابنِ أطول منزل!<br>
        ركز عشان تحط الطوابق فوق بعض بالظبط
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ البناء</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const buildArea = document.getElementById('buildArea');
const placeBtn = document.getElementById('placeBtn');
const floorsEl = document.getElementById('floors');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let floorCount = 0;
let running = false;
let best = parseInt(localStorage.getItem('houseBest') || '0');
let audioCtx = null;

// المتغيرات بتاعة الحركة
let movingFloor = null;
let floorDirection = 1;
let floorPosition = 0; // من 0 لـ 100 (نسبة مئوية)
let moveInterval = null;
let baseFloorWidth = 60; // عرض الطابق الأساسي

// إحداثيات الطوابق المستقرة
let placedFloors = []; 
let lastFloorLeft = 0;
let lastFloorWidth = 60;

bestEl.textContent = best;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'build') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'fail') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'win') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  }
}

// إنشاء الطابق المتحرك
function createMovingFloor() {
  movingFloor = document.createElement('div');
  movingFloor.className = 'moving-floor';
  movingFloor.style.width = lastFloorWidth + '%';
  movingFloor.style.bottom = (floorCount * 32) + 20 + 'px'; // فوق الطوابق اللي قبلها
  movingFloor.style.left = '0%';
  buildArea.appendChild(movingFloor);
  
  floorPosition = 0;
  floorDirection = 1;
  
  // حركة الطابق
  moveInterval = setInterval(() => {
    floorPosition += floorDirection * 1.5;
    
    // حدود الحركة (من 0 لـ 100 - عرض الطابق)
    if (floorPosition > (100 - lastFloorWidth)) {
      floorPosition = 100 - lastFloorWidth;
      floorDirection = -1;
    }
    if (floorPosition < 0) {
      floorPosition = 0;
      floorDirection = 1;
    }
    
    movingFloor.style.left = floorPosition + '%';
  }, 16); // ~60 fps
  
  placeBtn.disabled = false;
}

// وضع الطابق
function placeFloor() {
  if (!running || !movingFloor) return;
  
  clearInterval(moveInterval);
  placeBtn.disabled = true;
  
  // حساب الفرق بين مكان الطابق الجديد والطابق اللي تحته
  let diff = Math.abs(floorPosition - lastFloorLeft);
  
  // لو الفرق كبير، اللعبة بتخلص
  if (diff > (lastFloorWidth / 2)) {
    // خسر
    playSound('fail');
    movingFloor.style.background = '#ef4444';
    running = false;
    
    setTimeout(() => {
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div style="font-size:35px">💥</div>
        <h2>البناء وقع!</h2>
        <p>بنيت <b style="color:#facc15;font-size:22px">${floorCount}</b> طوابق<br>
        أعلى نتيجة: ${best}<br>
        Ahmed TV بيقولك: حاول تاني، ركز في النص!</p>
        <button class="btn-start" id="againBtn">🔄 ابنِ تاني</button>
      `;
      document.getElementById('againBtn').onclick = startGame;
    }, 500);
    return;
  }
  
  // الطابق لزق صح
  playSound('build');
  
  // نحوله لطابق ثابت
  movingFloor.className = 'placed-floor';
  movingFloor.style.left = floorPosition + '%'; // تثبيت المكان
  movingFloor.style.bottom = (floorCount * 32) + 20 + 'px';
  
  // نحسب المكان الجديد للطابق اللي بعده
  lastFloorLeft = floorPosition;
  
  // لو الطابق الجديد أوسع شوية، بنخليه يبقى فيه شباك
  if (floorCount === 0) {
    movingFloor.classList.add('door');
  } else {
    movingFloor.classList.add('window');
  }
  
  floorCount++;
  floorsEl.textContent = floorCount;
  
  // لو وصلنا لعدد طوابق كبير، نفوز
  if (floorCount >= 10) {
    running = false;
    playSound('win');
    
    if (best === 0 || floorCount > best) {
      best = floorCount;
      localStorage.setItem('houseBest', best);
      bestEl.textContent = best;
    }
    
    // نحط السقف
    let roof = document.createElement('div');
    roof.className = 'placed-floor roof';
    roof.style.bottom = (floorCount * 32) + 20 + 'px';
    roof.style.left = (lastFloorLeft + (lastFloorWidth - 65) / 2) + '%'; // في النص
    buildArea.appendChild(roof);
    
    setTimeout(() => {
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div style="font-size:35px">🏠</div>
        <h2>مبروك! بنيت المنزل!</h2>
        <p>بنيت <b style="color:#facc15;font-size:22px">${floorCount}</b> طوابق<br>
        Ahmed TV بيقولك: إنت مهندس معماري!</p>
        <button class="btn-start" id="againBtn">🔄 ابنِ تاني</button>
      `;
      document.getElementById('againBtn').onclick = startGame;
    }, 500);
    
    return;
  }
  
  // نجهز الطابق اللي بعده
  setTimeout(createMovingFloor, 300);
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  
  // تنظيف الساحة
  buildArea.innerHTML = '<div class="ground"></div>';
  
  floorCount = 0;
  floorsEl.textContent = 0;
  lastFloorLeft = 0;
  lastFloorWidth = baseFloorWidth;
  running = true;
  
  // نبدأ الطابق الأول
  createMovingFloor();
}

placeBtn.onclick = placeFloor;
startBtn.onclick = startGame;

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
