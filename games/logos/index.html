var idx=0;var score=0;var levels=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateLevels(){levels=[];var pool=shuffle(clubs.slice());for(var i=0;i<80;i++){if(pool.length===0){var lastClub=levels.length>0?levels[levels.length-1].name:'';do{pool=shuffle(clubs.slice());}while(pool[pool.length-1].name===lastClub);}var club=pool.pop();if(levels.length>0){var prev=levels[levels.length-1];if(club.name===prev.name||club.country===prev.country){for(var k=pool.length-1;k>=0;k--){if(pool[k].name!==prev.name&&pool[k].country!==prev.country){var temp=pool[k];pool[k]=club;club=temp;break;}}}}var wrongs=clubs.filter(function(c){return c.name!==club.name;});wrongs=shuffle(wrongs).slice(0,3);var opts=shuffle([club.name].concat(wrongs.map(function(c){return c.name;})));levels.push({name:club.name,flag:club.flag,letters:club.letters,country:club.country,year:club.year,nick:club.nick,titles:club.titles,extra:club.extra,opts:opts});}}
generateLevels();
function render(){var cur=levels[idx];document.getElementById('qn').textContent=(idx+1)+' / '+levels.length;document.getElementById('sc').textContent=score+' نقطة';document.getElementById('fill').style.width=(idx/levels.length*100)+'%';document.getElementById('logoFlag').textContent=cur.flag;document.getElementById('logoLetters').textContent=cur.letters;document.getElementById('specCountry').textContent=cur.country;document.getElementById('specYear').textContent=cur.year;document.getElementById('specNick').textContent=cur.nick;document.getElementById('specTitles').textContent=cur.titles;document.getElementById('hintBox').textContent='';document.getElementById('h1').disabled=false;document.getElementById('h2').disabled=false;document.getElementById('h3').disabled=false;var optsEl=document.getElementById('opts');optsEl.innerHTML='';cur.opts.forEach(function(t){var b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=function(){handleAnswer(t,b);};optsEl.appendChild(b);});}
function handleAnswer(selected,btn){var allBtns=document.querySelectorAll('.opt');allBtns.forEach(function(b){b.disabled=true;});var cur=levels[idx];if(selected===cur.name){score+=20;document.getElementById('sc').textContent=score+' نقطة';btn.style.background='#7ED321';btn.style.color='#000';btn.style.borderColor='#fff';document.getElementById('hintBox').textContent='✅ إجابة صحيحة! +20';speak('صح');setTimeout(function(){idx++;if(idx<levels.length)render();else endGame();},800);}else{btn.style.background='#ff4444';btn.style.color='#fff';btn.style.borderColor='#ff4444';allBtns.forEach(function(b){if(b.textContent===cur.name){b.style.background='#7ED321';b.style.color='#000';b.style.borderColor='#fff';}});document.getElementById('hintBox').textContent='❌ خطأ! الصح: '+cur.name;speak('غلط');setTimeout(function(){idx++;if(idx<levels.length)render();else endGame();},1500);}}
function hintClear(){if(document.getElementById('h1').disabled)return;score=Math.max(0,score-5);document.getElementById('sc').textContent=score+' نقطة';document.getElementById('h1').disabled=true;document.getElementById('hintBox').textContent='🔍 '+levels[idx].extra;speak('حاول');}
function hintText(){if(document.getElementById('h2').disabled)return;score=Math.max(0,score-5);document.getElementById('sc').textContent=score+' نقطة';document.getElementById('h2').disabled=true;document.getElementById('hintBox').textContent='💡 اللقب: '+levels[idx].nick+' - تأسس '+levels[idx].year;speak('حاول');}
function hintDel(){if(document.getElementById('h3').disabled)return;score=Math.max(0,score-10);document.getElementById('sc').textContent=score+' نقطة';document.getElementById('h3').disabled=true;var cur=levels[idx];var allBtns=Array.from(document.querySelectorAll('.opt'));var removed=0;allBtns.forEach(function(b){if(b.textContent!==cur.name&&removed<2){b.disabled=true;b.style.opacity='0.2';removed++;}});document.getElementById('hintBox').textContent='❌ تم حذف إجابتين خاطئتين';speak('حاول');}
function skipLevel(){speak('حاول');idx++;if(idx<levels.length)render();else endGame();}
function endGame(){speak('كسبت');var container=document.getElementById('mainContainer');var endScreen=document.createElement('div');endScreen.className='end-screen';endScreen.innerHTML='<h2>🏆 انتهت اللعبة!</h2><p>لقد جمعت <b>'+score+'</b> نقطة<br>من أصل '+(levels.length*20)+' نقطة</p><button class="end-btn" onclick="location.reload()">العب تاني 🔄</button>';container.appendChild(endScreen);}
