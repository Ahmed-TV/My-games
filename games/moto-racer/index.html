<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لعبة الموتوسيكلات | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  /* قفل الشاشة بالكامل */
  html, body { 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
    position: fixed; 
    width: 100%;
  }
  
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 5px) 5px env(safe-area-inset-bottom, 5px) 5px;
  }

  /* الهيدر */
  .header { width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; padding-bottom: 2px;}
  .logo-img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #facc15; object-fit: cover;}
  .header-text { text-align: right; }
  .header-text h1 { font-size: 14px; color: #facc15; margin: 0;}
  .header-text .names { font-size: 9px; color: #cbd5e1; font-weight: bold;}
  .header-text .names b { color: #facc15;}

  /* الإحصائيات */
  .stats { display: flex; gap: 8px; justify-content: center; margin-bottom: 3px;}
  .stat { background: #1e293b; border-radius: 6px; padding: 1px 8px; min-width: 50px; text-align: center; border: 1px solid #334155;}
  .stat b { display: block; font-size: 12px; color: #facc15; }
  .stat span { font-size: 8px; color: #94a3b8; }

  /* الحاوية الرئيسية */
  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 3px solid #f59e0b; border-radius: 12px;
    overflow: hidden;
    padding: 5px;
  }

  .watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255, 255, 255, 0.05); font-size: 30px; font-weight: 900;
    pointer-events: none; z-index: 0; white-space: nowrap;
  }

  /* الكانفس ياخد مساحة مرنة */
  canvas { 
    width: 100%; 
    flex-grow: 1; 
    display: block; 
    z-index: 1; 
    min-height: 0;
  }

  /* أزرار التحكم (كبيرة وثابتة) */
  .controls {
    display: flex; gap: 10px; justify-content: space-between; padding: 5px 0 0 0;
    z-index: 3; flex-shrink: 0;
  }
  .ctrl-btn {
    background: #334155; color: #fff; border: 2px solid #475569; border-radius: 10px;
    font-size: 35px; width: 48%; height: 65px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; user-select: none;
    box-shadow: 0 4px 0 #1e293b;
  }
  .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1e293b; background: #475569; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 8px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <div class="header-text">
        <h1>لعبة الموتوسيكلات</h1>
        <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>النقاط</span></div>
    <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    <div class="stat"><b id="speed">1x</b><span>السرعة</span></div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
      <button class="ctrl-btn" id="leftBtn">⬅️</button>
      <button class="ctrl-btn" id="rightBtn">➡️</button>
    </div>

    <div id="overlay">
      <h2>لعبة الموتوسيكلات</h2>
      <p>
        <b>Ahmed TV</b> - تفادى العربيات!<br>
        استخدم الأزرار عشان تتحرك
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ القيادة</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const speedEl = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');

let W = 0, H = 0;
let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('motoBest') || '0');
bestEl.textContent = best;
let audioCtx = null;

let player = { x: 0, y: 0, width: 60, height: 35, speed: 8 }; // عرض الموتوسيكل
let enemies = [];
let roadOffset = 0;
let baseSpeed = 1.5; 
let currentSpeed = baseSpeed;

let leftPressed = false;
let rightPressed = false;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'score') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

// ضبط أبعاد الكانفس
function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
  
  if(!running) {
    player.x = W / 2 - player.width / 2;
    player.y = H - player.height - 20;
    draw();
  }
}

function createEnemy() {
  const laneWidth = W / 3;
  const lane = Math.floor(Math.random() * 3); 
  const x = lane * laneWidth + (laneWidth - 60) / 2;
  
  enemies.push({
    x: x,
    y: -50,
    width: 60,
    height: 35,
    speed: currentSpeed,
    passed: false
  });
}

function draw() {
  ctx.fillStyle = '#334155';
  ctx.fillRect(0, 0, W, H);
  
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -roadOffset;
  
  ctx.beginPath(); ctx.moveTo(W/3, 0); ctx.lineTo(W/3, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*2/3, 0); ctx.lineTo(W*2/3, H); ctx.stroke();
  ctx.setLineDash([]);

  // اللاعب
  ctx.font = '40px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('🏍️', player.x + player.width/2, player.y + player.height/2 + 12);

  // الأعداء
  enemies.forEach(e => {
    ctx.font = '40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🚗', e.x + e.width/2, e.y + e.height/2 + 12);
  });
}

function update() {
  if (!running) return;

  roadOffset += currentSpeed * 2;
  if (roadOffset > 40) roadOffset = 0;

  if (leftPressed) {
    player.x -= player.speed;
    if (player.x < 0) player.x = 0;
  }
  if (rightPressed) {
    player.x += player.speed;
    if (player.x + player.width > W) player.x = W - player.width;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    e.y += e.speed;

    if (e.y > H) {
      enemies.splice(i, 1);
      if (!e.passed) {
        score++;
        scoreEl.textContent = score;
        playSound('score');
        if (score % 10 === 0) {
          currentSpeed += 0.2;
          speedEl.textContent = currentSpeed.toFixed(1) + 'x';
        }
      }
      continue;
    }

    if (
      player.x < e.x + e.width &&
      player.x + player.width > e.x &&
      player.y < e.y + e.height &&
      player.y + player.height > e.y
    ) {
      endGame();
      return;
    }
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function setupControls() {
  leftBtn.addEventListener('mousedown', () => leftPressed = true);
  leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; }, {passive: false});
  leftBtn.addEventListener('mouseup', () => leftPressed = false);
  leftBtn.addEventListener('touchend', () => leftPressed = false);
  leftBtn.addEventListener('mouseleave', () => leftPressed = false);
  
  rightBtn.addEventListener('mousedown', () => rightPressed = true);
  rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; }, {passive: false});
  rightBtn.addEventListener('mouseup', () => rightPressed = false);
  rightBtn.addEventListener('touchend', () => rightPressed = false);
  rightBtn.addEventListener('mouseleave', () => rightPressed = false);
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') leftPressed = true;
    if (e.key === 'ArrowRight') rightPressed = true;
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') leftPressed = false;
    if (e.key === 'ArrowRight') rightPressed = false;
  });
}
setupControls();

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  score = 0;
  scoreEl.textContent = 0;
  currentSpeed = baseSpeed;
  speedEl.textContent = '1.5x';
  enemies = [];
  player.x = W / 2 - player.width / 2;
  running = true;
  
  // توليد العربيات
  setInterval(() => {
    if (running) createEnemy();
  }, 2000);

  loop();
}

function endGame() {
  running = false;
  playSound('crash');
  
  if (score > best) {
    best = score;
    localStorage.setItem('motoBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">💥</div>
    <h2>خبطت!</h2>
    <p>جبت <b style="color:#facc15;font-size:22px">${score} نقطة</b><br>
    أعلى نتيجة: ${best}<br>
    أحمد TV بيقولك: حاول تاني!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

startBtn.onclick = startGame;

window.addEventListener('resize', () => { resize(); if(!running) draw(); });

resize();
draw();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
