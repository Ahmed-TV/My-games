<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لعبة المطعم | Ahmed TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{height:100%!important;height:100svh!important;max-height:100svh!important;overflow:hidden!important;overscroll-behavior:none}
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 8px;touch-action:manipulation}
.header{width:100%;max-width:500px;text-align:center;flex-shrink:0}
.top-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px}
.logo-wrap{width:52px;height:52px;flex-shrink:0;border-radius:50%;overflow:hidden;border:3px solid #facc15;background:#000}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:22px;color:#facc15;line-height:1.2}
h1 small{display:block;font-size:11px;color:#fff;letter-spacing:1px;margin-top:2px}
.names{font-size:13px;color:#cbd5e1;font-weight:bold;margin-bottom:4px}
.names b{color:#facc15;font-size:15px}
.score{display:flex;gap:10px;justify-content:center;margin:3px 0 6px}
.stat{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:4px 14px;min-width:85px;text-align:center}
.stat b{display:block;font-size:18px;color:#facc15}
.stat span{font-size:10px;color:#94a3b8}
#game{width:100%;max-width:500px;flex:1;min-height:0;background:#1e293b;border:4px solid #f59e0b;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
#order{font-size:18px;font-weight:900;background:#fff;color:#0f172a;border-radius:12px;padding:10px;width:100%;text-align:center}
#foods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:340px}
.food{background:#f59e0b;border:3px solid #facc15;border-radius:14px;height:84px;font-size:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.food:active{transform:scale(.94)}
.food span{font-size:11px;font-weight:900;color:#000;margin-top:2px}
#msg{font-size:16px;font-weight:900;min-height:24px;text-align:center;color:#facc15}
#timer{font-size:14px;background:#ef4444;padding:4px 12px;border-radius:20px;font-weight:900}
.btn{background:#f59e0b;color:#000;border:none;padding:12px 22px;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;width:80%;max-width:240px}
.btn:active{transform:scale(.95)}
#overlay{position:absolute;inset:0;background:rgba(15,23,42,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;gap:10px;z-index:10}
#overlay h2{font-size:24px;color:#facc15}
#overlay p{font-size:14px;line-height:1.7;color:#e2e8f0}
.footer{font-size:10px;color:#94a3b8;text-align:center;margin-top:4px;flex-shrink:0}
.footer a{color:#facc15;text-decoration:none}
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
<div class="header">
<div class="top-row">
<div class="logo-wrap"><img src="../../logo.png" alt="أحمد عبدالعزيز"></div>
<h1>لعبة المطعم<small>AHMED TV RESTAURANT</small></h1>
</div>
<div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div>
<div class="score">
<div class="stat"><b id="score">0</b><span>النقط</span></div>
<div class="stat"><b id="timeEl">30</b><span>الوقت</span></div>
<div class="stat"><b id="orders">0</b><span>الطلبات</span></div>
</div>
</div>
<div id="game">
<div id="overlay">
<h2>لعبة المطعم 🍔</h2>
<p><b>Ahmed TV</b> - انت الشيف!<br>الزبون بيطلب أكل - دوس على الأكل الصح بسرعة!<br>كل طلب صح = 10 نقط - معاك 30 ثانية!</p>
<button class="btn" id="startBtn">▶ افتح المطعم</button>
</div>
<div id="timer">⏰ 30 ثانية</div>
<div id="order">الزبون عايز: ...</div>
<div id="foods"></div>
<div id="msg">دوس على الأكل الصح بسرعة!</div>
</div>
<div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a></div>
<script>
var score=0,orders=0,timeLeft=30,timer=null,current='',locked=false;
var scoreEl=document.getElementById('score'),timeEl=document.getElementById('timeEl'),ordersEl=document.getElementById('orders'),orderEl=document.getElementById('order'),foodsEl=document.getElementById('foods'),msgEl=document.getElementById('msg'),timerEl=document.getElementById('timer'),overlay=document.getElementById('overlay');
var FOODS=[{e:'🍔',n:'برجر'},{e:'🍕',n:'بيتزا'},{e:'🍟',n:'بطاطس'},{e:'🌭',n:'هوت دوج'},{e:'🍦',n:'آيس كريم'},{e:'🧃',n:'عصير'}];
var soundOn=true,_ahmedAudio=null,_ahlaPlayed=false;
function getAhmedAudio(){if(!_ahmedAudio){_ahmedAudio=new Audio();_ahmedAudio.preload='auto';}return _ahmedAudio;}
function playAhmedVoice(n){try{if(!soundOn)return;var a=getAhmedAudio();try{a.pause();}catch(e){}a.src='../../sounds/'+n+'.mp3';a.currentTime=0;a.volume=1;var p=a.play();if(p)p.catch(function(){});}catch(e){}}
document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
document.addEventListener('click',function(){if(!_ahlaPlayed){_ahlaPlayed=true;playAhmedVoice('ahla');}});
function newOrder(){
current=FOODS[Math.floor(Math.random()*FOODS.length)];
orderEl.textContent='الزبون عايز: '+current.e+' '+current.n;
foodsEl.innerHTML='';
FOODS.forEach(function(f){
var d=document.createElement('div');d.className='food';d.innerHTML=f.e+'<span>'+f.n+'</span>';
d.onpointerdown=function(e){e.preventDefault();if(locked)return;if(f.n===current.n){score+=10;orders++;scoreEl.textContent=score;ordersEl.textContent=orders;msgEl.textContent='✅ صح! الزبون مبسوط!';playAhmedVoice('sah');newOrder();}else{msgEl.textContent='❌ غلط! ده مش اللي طلبه!';playAhmedVoice('ghalat');}};
foodsEl.appendChild(d);
});
}
function startTimer(){
if(timer)clearInterval(timer);
timeLeft=30;timeEl.textContent='30';timerEl.textContent='⏰ 30 ثانية';
timer=setInterval(function(){timeLeft--;timeEl.textContent=timeLeft;timerEl.textContent='⏰ '+timeLeft+' ثانية';if(timeLeft<=0){clearInterval(timer);endGame();}},1000);
}
function endGame(){
locked=true;
if(score>0)playAhmedVoice('kesebt');else playAhmedVoice('khesert');
overlay.style.display='flex';
overlay.innerHTML='<div style="font-size:40px">🏆</div><h2>قفلنا المطعم!</h2><p>جبت <b style="color:#facc15;font-size:22px">'+score+'</b> نقطة<br>وخلصت <b style="color:#facc15">'+orders+'</b> طلب صح!</p><button class="btn" id="againBtn">🔄 افتح تاني</button>';
document.getElementById('againBtn').onclick=startGame;
}
function startGame(){
playAhmedVoice('ebda');
score=0;orders=0;locked=false;scoreEl.textContent='0';ordersEl.textContent='0';
overlay.style.display='none';newOrder();startTimer();
}
document.getElementById('startBtn').onclick=startGame;
</script>
</body>
</html>
