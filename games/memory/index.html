<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 لعبة الذاكرة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; color: #e94560; }
  .stats { margin-bottom: 20px; color: #a0a0b0; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 440px; width: 100%;
  }
  .card {
    aspect-ratio: 1;
    background: #0f3460;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
    user-select: none;
    border: 2px solid transparent;
  }
  .card.flipped { background: #e94560; transform: rotateY(180deg); }
  .card.matched { background: #2ecc71; cursor: default; opacity: 0.6; }
  .btn {
    margin-top: 20px; padding: 12px 30px;
    background: #e94560; color: #fff;
    border: none; border-radius: 10px;
    font-size: 1rem; cursor: pointer;
  }
  .btn:hover { background: #c73650; }
  a.back { margin-top: 15px; color: #a0a0b0; text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>🧠 لعبة الذاكرة</h1>
  <div class="stats">الحركات: <span id="moves">0</span> | الأزواج: <span id="pairs">0</span>/8</div>
  <div class="board" id="board"></div>
  <button class="btn" onclick="init()">إعادة اللعب</button>
  <a class="back" href="../../index.html">← رجوع للرئيسية</a>

<script>
const emojis = ['🍎','🍌','🍇','🍓','🍒','🥝','🍑','🍍'];
let cards = [], flipped = [], matched = 0, moves = 0, lock = false;

function init() {
  cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
  flipped = []; matched = 0; moves = 0; lock = false;
  document.getElementById('moves').textContent = 0;
  document.getElementById('pairs').textContent = 0;
  const board = document.getElementById('board');
  board.innerHTML = '';
  cards.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.dataset.emoji = emoji;
    card.addEventListener('click', () => flip(card));
    board.appendChild(card);
  });
}

function flip(card) {
  if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.textContent = card.dataset.emoji;
  card.classList.add('flipped');
  flipped.push(card);
  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
      flipped.forEach(c => c.classList.add('matched'));
      matched++;
      document.getElementById('pairs').textContent = matched;
      flipped = []; lock = false;
      if (matched === 8) setTimeout(() => alert('🎉 مبروك! خلصت اللعبة في ' + moves + ' حركة'), 300);
    } else {
      setTimeout(() => {
        flipped.forEach(c => { c.classList.remove('flipped'); c.textContent = ''; });
        flipped = []; lock = false;
      }, 800);
    }
  }
}
init();
</script>
</body>
</html>
