function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
let soundOn=true,audioCtx=null;
function getCtx(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
document.addEventListener('pointerdown',()=>{getCtx();});
document.addEventListener('touchstart',()=>{getCtx();});
function tone(f,dur,vol,type,delay,slideTo){if(!soundOn)return;const ctx=getCtx();if(!ctx)return;try{const t0=ctx.currentTime+(delay||0);const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.02);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.08);}catch(e){}}
function playCorrect(){tone(523,0.15,0.25,'triangle',0);tone(659,0.15,0.25,'triangle',0.15);tone(784,0.4,0.28,'triangle',0.3);}
function playWrong(){tone(220,0.35,0.25,'square',0);tone(180,0.5,0.25,'square',0.35);}
function playSkip(){tone(600,0.2,0.2,'sine',0,900);}
let curType='الكل',qs=[],idx=0,score=0,correct=0,locked=false;
function build(){qs=[];let seen=new Set();
DATA.forEach(c=>{
let types=curType==='الكل'?['حرف-اول','حرف-ناقص','معنى','عكس','جمع','كلمة-بالحرف']:(curType==='حرف'?['حرف-اول','حرف-ناقص','كلمة-بالحرف']:(curType==='كلمة'?['معنى','جمع']:['عكس']));
types.forEach(t=>{
let q='',corr='',pool=[],icon=c.emoji;
if(t==='حرف-اول'){q='كلمة "'+c.w+'" بتبدأ بحرف إيه؟';corr=c.letter;pool=["أ","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","ه","و","ي"];}
if(t==='حرف-ناقص'){let miss=c.w.slice(1);q='كمّل الكلمة: '+c.letter+' _ '+miss+' - إيه الحرف الناقص؟';corr=c.w[1]||c.letter;pool=["ا","ب","ت","ج","ح","خ","د","ر","س","ش","ع","ف","ق","ك","ل","م","ن","و","ي"];icon='❓';}
if(t==='معنى'){q='كلمة "'+c.w+'" معناها إيه؟';corr=c.meaning;pool=DATA.map(x=>x.meaning);}
if(t==='عكس'){q='عكس كلمة "'+c.w+'" إيه؟';corr=c.opp;pool=DATA.map(x=>x.opp);}
if(t==='جمع'){q='جمع كلمة "'+c.w+'" إيه؟';corr=c.plural;pool=DATA.map(x=>x.plural);}
if(t==='كلمة-بالحرف'){q='إيه الكلمة اللي بتبدأ بحرف "'+c.letter+'"؟';corr=c.w;pool=DATA.filter(x=>x.letter===c.letter).map(x=>x.w);if(pool.length<4)pool=DATA.map(x=>x.w);}
let key=q+'|'+corr;if(seen.has(key))return;seen.add(key);
let others=shuffle([...new Set(pool.filter(x=>x!==corr))]).slice(0,3);
if(new Set([corr,...others]).size<4)return;
qs.push({q:q,correct:corr,opts:shuffle([corr,...others]),icon:icon,name:c.w});
});
});
qs=shuffle(qs).slice(0,200);
}
function loadQ(){if(idx>=qs.length){document.getElementById('qText').textContent='خلصت الـ '+qs.length+' سؤال!';document.getElementById('feedback').textContent='نتيجتك: '+score+' - صح: '+correct;document.getElementById('answers').innerHTML='';return;}locked=false;let it=qs[idx];document.getElementById('qicon').textContent=it.icon;document.getElementById('qText').textContent=it.q;document.getElementById('prog').style.width=((idx+1)/qs.length*100)+'%';document.getElementById('progText').textContent='السؤال '+(idx+1)+' / '+qs.length;document.getElementById('feedback').textContent='السؤال '+(idx+1)+' من '+qs.length;let ans=document.getElementById('answers');ans.innerHTML='';it.opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>choose(o===it.correct,b,it);ans.appendChild(b);});document.getElementById('nextBtn').disabled=true;}
function choose(ok,btn,it){if(locked)return;locked=true;[...document.getElementById('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===it.correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');});if(ok){playCorrect();score+=10;correct++;document.getElementById('feedback').textContent='صح! +10';}else{playWrong();document.getElementById('feedback').textContent='غلط - الصح: '+it.correct;}document.getElementById('nextBtn').disabled=false;}
function skipQ(){playSkip();if(idx>=qs.length){build();idx=0;loadQ();return;}document.getElementById('feedback').textContent='تخطيت - الصح: '+qs[idx].correct;idx++;setTimeout(loadQ,600);}
function setType(t,btn){document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');curType=t;idx=0;score=0;correct=0;build();loadQ();}

document.getElementById('soundBtn').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'الصوت: شغال':'الصوت: مطفي';if(soundOn)getCtx();};
build();loadQ();
</script>

<script>
(function(){

function startDrag(x,y){dragging=true;moved=false;startX=x;startY=y;startLeft=wa.offsetLeft;startTop=wa.offsetTop;}
function moveDrag(x,y){if(!dragging)return;var dx=x-startX,dy=y-startY;if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;if(moved){var nx=startLeft+dx,ny=startTop+dy;nx=Math.max(0,Math.min(window.innerWidth-60,nx));ny=Math.max(0,Math.min(window.innerHeight-80,ny));wa.style.left=nx+'px';wa.style.top=ny+'px';wa.style.right='auto';wa.style.bottom='auto';}}
function endDrag(){if(moved){setTimeout(function(){moved=false},80);}dragging=false;}
wa.addEventListener('touchstart',function(e){if(e.touches.length===1){startDrag(e.touches[0].clientX,e.touches[0].clientY);}}, {passive:true});
document.addEventListener('touchmove',function(e){if(!dragging)return;if(e.cancelable)e.preventDefault();if(e.touches.length===1){moveDrag(e.touches[0].clientX,e.touches[0].clientY);}}, {passive:false});
document.addEventListener('touchend',function(){endDrag();});
wa.addEventListener('mousedown',function(e){startDrag(e.clientX,e.clientY);});
document.addEventListener('mousemove',function(e){moveDrag(e.clientX,e.clientY);});
document.addEventListener('mouseup',function(){endDrag();});
wa.addEventListener('click',function(e){if(moved)e.preventDefault();});
})();
