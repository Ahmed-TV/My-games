<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ahmed TV - لعبة رمضان</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important;touch-action:none}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:#1A0B2E;height:100vh;height:100dvh;display:flex;justify-content:center;padding:3px 6px;overflow:hidden}
.game{width:100%;max-width:500px;height:100%;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#2D1B4E 0%,#4A1D6B 35%,#FF9A3D 70%,#FFD93D 100%);border:4px solid #FFD600;border-radius:38px 38px 18px 18px;padding:5px 7px;overflow:hidden;position:relative}
header{padding:1px 0 2px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0;position:relative;z-index:2}
.logo-img{width:64px;height:64px;border-radius:50%;border:3px solid #FF1744;object-fit:contain;background:#FF8A80;margin-bottom:1px;padding:5px;box-shadow:0 0 18px #FF1744, 0 0 30px #FF5252}
.brand{font-size:18px;font-weight:900;color:#FFD600;text-shadow:1px 1px 0 #7B1FA2}
.names{font-size:11px;font-weight:700;color:#FFE066}
.cats{display:flex;gap:4px;width:100%;margin:3px 0;position:relative;z-index:2}
.cat{flex:1;font-family:inherit;font-weight:900;border:2px solid #FFD600;border-radius:12px;padding:6px 1px;background:#fff;color:#6D28D9;font-size:12px;cursor:pointer}
.cat.active{background:#FFD600;color:#4A148C!important}
.stats{display:flex;gap:4px;width:100%;margin:2px 0;position:relative;z-index:2}
.stat{flex:1;background:#fff;border:1.5px solid #FFD600;border-radius:9px;padding:2px 1px;text-align:center;line-height:1.1}
.stat b{display:block;font-size:13px;color:#6D28D9}
.stat span{font-size:9px;font-weight:800;color:#666}
#view{width:100%;flex:1;min-height:0;background:#1A0B2E;border:2px solid #FFD600;border-radius:16px;overflow:hidden;position:relative}
#view canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,11,46,.68);color:#fff;text-align:center;padding:12px;z-index:5}
#overlay h2{font-size:24px;margin-bottom:4px}
#overlay p{font-size:13px;line-height:1.7;font-weight:800}
#overlay button{margin-top:10px;font-family:inherit;font-weight:900;border:0;border-radius:20px;padding:11px 24px;background:#FFD600;color:#4A148C;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #B45309}
.feedback{height:16px;font-size:11px;font-weight:800;color:#FFD600;text-align:center;margin:3px 0 2px 0;text-shadow:1px 1px 0 #4A148C}
.controls{display:flex;gap:6px;width:100%;margin-top:2px}
.cbtn{flex:1;font-family:inherit;font-weight:900;border:2px solid #FFD600;border-radius:16px;padding:12px 2px;background:#fff;color:#6D28D9;font-size:16px;cursor:pointer}
.cbtn.jump{flex:1.2;background:#FFD600;color:#4A148C!important}
.btn-row{display:flex;gap:6px;width:100%;margin-top:4px}
.mainbtn{flex:2;font-family:inherit;font-weight:900;border:0;border-radius:18px;padding:7px 10px;background:#FFD600;color:#4A148C!important;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #FFD600;border-radius:18px;padding:7px 6px;background:#fff;color:#6D28D9;cursor:pointer;font-size:13px}
footer{text-align:center;color:#FFE066;font-size:10px;margin-top:2px}
footer a{color:#FFE066;text-decoration:none;font-weight:700}
</style></head>
<body><div class="game">
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">🌙 لعبة رمضان 🕌</div><div class="names">أحمد عبدالعزيز • Ahmed TV</div><button id="soundBtn" style="margin:3px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #FFD600;border-radius:20px;padding:3px 14px;background:#fff;color:#6D28D9;cursor:pointer;font-size:11px">🎵 موسيقى رمضان: شغالة</button></header>
<div class="cats"><button class="cat active" onclick="pickCat('fanous',this)">🏮 فوانيس</button><button class="cat" onclick="pickCat('hilal',this)">🌙 هلال</button><button class="cat" onclick="pickCat('star',this)">⭐ نجوم</button></div>
<div class="stats"><div class="stat"><b id="score">0</b><span>النقط</span></div><div class="stat"><b id="coins">0</b><span id="coinLabel">فوانيس 🏮</span></div><div class="stat"><b id="best">0</b><span>أعلى سكور</span></div></div>
<div id="view"><canvas id="cv"></canvas>
<div id="inGameName" style="position:absolute;top:6px;left:0;right:0;text-align:center;pointer-events:none;z-index:3;line-height:1.2">
<div style="font-size:19px;font-weight:900;color:#FFD600;text-shadow:2px 2px 0 #4A148C, -1px -1px 0 #4A148C">أحمد عبدالعزيز</div>
<div style="font-size:15px;font-weight:900;color:#fff;text-shadow:2px 2px 0 #FF6B00, -1px -1px 0 #FF6B00">🌙 رمضان كريم 🌙</div>
</div>
<div id="overlay"><h2>🌙 رمضان كريم 🕌</h2><p>اجري في شارع رمضان<br>لم الفوانيس والهلال 🏮🌙<br>واهرب من الحواجز 🧱<br>واسمع موسيقى رمضان 🎵</p><button onclick="startGame()">ابدأ اللعب ▶️</button></div></div>
<div class="feedback" id="feedback">🌙 بص - اللعبة بتتحرك لوحدها! دوس ابدأ والعب!</div>
<div class="controls"><button class="cbtn" id="btnLeft">◀️ شمال</button><button class="cbtn jump" id="btnJump">⬆️ نط!</button><button class="cbtn" id="btnRight">يمين ▶️</button></div>
<div class="btn-row"><button class="skipbtn" onclick="location.reload()">🔄 من الأول</button><button class="mainbtn" onclick="startGame()">لعبة جديدة 🌙</button></div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
let cat='fanous';
function pickCat(c,el){ cat=c; document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active')); el.classList.add('active'); document.getElementById('coinLabel').textContent=c==='fanous'?'فوانيس 🏮':c==='hilal'?'هلال 🌙':'نجوم ⭐'; document.getElementById('feedback').textContent=c==='fanous'?'🏮 هتلم فوانيس رمضان!':c==='hilal'?'🌙 هتلم هلال رمضان!':'⭐ هتلم نجوم رمضان!'; }
let soundOn=true, actx=null, musicTimer=null, noteIdx=0;
function act(){ if(!actx){ try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
document.addEventListener('pointerdown',()=>{ act(); startMusic(); });
function tone(f,d=.18,v=.16,t='triangle',dl=0){ if(!soundOn) return; let c=act(); if(!c) return; try{ let o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+dl; o.type=t; o.frequency.value=f; g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(v,t0+.03); g.gain.exponentialRampToValueAtTime(.001,t0+d); o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+d+.05);}catch(e){} }
function drum(){ if(!soundOn) return; let c=act(); if(!c) return; try{ let o=c.createOscillator(),g=c.createGain(),t0=c.currentTime; o.type='sine'; o.frequency.setValueAtTime(120,t0); o.frequency.exponentialRampToValueAtTime(50,t0+.18); g.gain.setValueAtTime(.3,t0); g.gain.exponentialRampToValueAtTime(.001,t0+.2); o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+.22);}catch(e){} }
let melody=[261,293,311,349,392,440,466,392,349,311,293,261,349,392,466,523,466,392,349,293];
function startMusic(){ if(musicTimer) return; musicTimer=setInterval(()=>{ if(!soundOn||!playing) return; let f=melody[noteIdx%melody.length]; tone(f,.35,.14,'triangle',0); if(noteIdx%4===0) drum(); noteIdx++; }, 380); }
function sndCoin(){ tone(880,.12,.2,'sine',0); tone(1320,.18,.2,'sine',.08); tone(1760,.2,.15,'sine',.16); }
function sndJump(){ tone(300,.15,.18,'sine',0); tone(600,.15,.18,'sine',.06); }
function sndHit(){ tone(200,.3,.25,'square',0); tone(100,.3,.25,'square',.1); }
document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🎵 موسيقى رمضان: شغالة':'🔇 الموسيقى: مطفية'; if(soundOn){ act(); startMusic(); } };
const cv=document.getElementById('cv'), ctx2=cv.getContext('2d');
let W=0,H=0, score=0, coins=0, best=+(localStorage.getItem('ahmed_ramadan_best')||0);
document.getElementById('best').textContent=best;
let playing=false, over=false, px=0.5, py=0, vy=0, speed=1.2, tick=0, objs=[], stars=[], lamps=[];
for(let i=0;i<50;i++) stars.push({x:Math.random(), y:Math.random()*0.5, r:Math.random()*1.5+0.5, tw:Math.random()*6});
for(let i=0;i<8;i++) lamps.push({x:i/8+0.05, y:0.55+Math.random()*0.1});
function resize(){ let r=cv.parentElement.getBoundingClientRect(); W=cv.width=r.width*devicePixelRatio; H=cv.height=r.height*devicePixelRatio; cv.style.width=r.width+'px'; cv.style.height=r.height+'px'; }
window.addEventListener('resize',resize); resize();
function spawn(){ let lane=Math.random(); let isCoin=Math.random()<0.55; objs.push({x:0.30+lane*0.4, y:-0.1, isCoin:isCoin}); }
function draw(){
  let w=W,h=H;
  let g=ctx2.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1A0B2E'); g.addColorStop(0.4,'#4A1D6B'); g.addColorStop(0.7,'#FF9A3D'); g.addColorStop(1,'#FFD93D'); ctx2.fillStyle=g; ctx2.fillRect(0,0,w,h);
  let mx=w*0.82, my=h*0.14, mr=h*0.06;
  ctx2.fillStyle='rgba(255,214,0,.25)'; ctx2.beginPath(); ctx2.arc(mx,my,mr*1.6,0,7); ctx2.fill();
  ctx2.fillStyle='#FFD600'; ctx2.beginPath(); ctx2.arc(mx,my,mr,0,7); ctx2.fill();
  ctx2.fillStyle='#1A0B2E'; ctx2.beginPath(); ctx2.arc(mx+mr*0.4,my-mr*0.15,mr*0.85,0,7); ctx2.fill();
  stars.forEach(s=>{ s.tw+=0.05; let a=0.4+Math.abs(Math.sin(s.tw))*0.6; ctx2.fillStyle='rgba(255,255,255,'+a+')'; ctx2.beginPath(); ctx2.arc(s.x*w,s.y*h,s.r*devicePixelRatio,0,7); ctx2.fill(); });
  ctx2.fillStyle='#FF9A3D'; ctx2.fillRect(w*0.05,h*0.52,w*0.28,h*0.12);
  ctx2.fillStyle='#FFD600'; ctx2.fillRect(w*0.05,h*0.52,w*0.28,h*0.02);
  ctx2.fillStyle='#FF9A3D'; ctx2.fillRect(w*0.67,h*0.52,w*0.28,h*0.12);
  ctx2.fillStyle='#FFD600'; ctx2.fillRect(w*0.67,h*0.52,w*0.28,h*0.02);
  ctx2.fillStyle='#FFD600'; ctx2.beginPath(); ctx2.arc(w*0.19,h*0.52,h*0.05,Math.PI,0); ctx2.fill(); ctx2.beginPath(); ctx2.arc(w*0.81,h*0.52,h*0.05,Math.PI,0); ctx2.fill();
  ctx2.font=(h*0.07)+'px Arial'; ctx2.fillText('🕌', w*0.19, h*0.60); ctx2.fillText('🕌', w*0.81, h*0.60);
  ctx2.fillStyle='#FFD600'; ctx2.font=(h*0.06)+'px Arial'; ctx2.textAlign='center'; ctx2.fillText('🕌', w*0.5, h*0.62);
  ctx2.fillStyle='#6D28D9'; ctx2.beginPath(); ctx2.moveTo(w*0.08,h); ctx2.lineTo(w*0.42,h*0.62); ctx2.lineTo(w*0.58,h*0.62); ctx2.lineTo(w*0.92,h); ctx2.closePath(); ctx2.fill();
  ctx2.strokeStyle='#FFD600'; ctx2.lineWidth=3*devicePixelRatio; ctx2.setLineDash([16*devicePixelRatio,12*devicePixelRatio]); ctx2.lineDashOffset=-(tick*1.5)%28; ctx2.beginPath(); ctx2.moveTo(w*0.5,h*0.62); ctx2.lineTo(w*0.5,h); ctx2.stroke(); ctx2.setLineDash([]);
  lamps.forEach(l=>{ l.y+=0.0015; if(l.y>1.05) l.y=0.55; let ly=l.y*h; ctx2.font=(h*0.06)+'px Arial'; ctx2.fillText('🏮', l.x*w, ly); });
  objs.forEach(o=>{ let oy=o.y*h, sc=0.5+o.y*0.8; ctx2.font=(h*0.06*sc)+'px Arial'; let em = o.isCoin ? (cat==='fanous'?'🏮':cat==='hilal'?'🌙':'⭐') : '🧱'; ctx2.fillText(em, o.x*w, oy); });
  let bx=px*w, by=h*0.88 - py*h*0.3, bs=1+py*0.2;
  ctx2.font=(h*0.11*bs)+'px Arial'; ctx2.fillText(Math.floor(tick/8)%2===0?'🏮':'🏃', bx, by);
  ctx2.fillStyle='rgba(0,0,0,.25)'; ctx2.beginPath(); ctx2.ellipse(bx, h*0.9, w*0.06*bs, h*0.01, 0,0,7); ctx2.fill();
}
function update(){
  tick++;
  if(playing&&!over){
    if(moveL) px=Math.max(0.30,px-0.02);
    if(moveR) px=Math.min(0.70,px+0.02);
    if(vy!==0||py>0){ py+=vy; vy-=0.008; if(py<=0){py=0;vy=0;} }
    if(tick%140===0) spawn();
    speed=Math.min(2.2,1.2+score/4000);
    for(let i=objs.length-1;i>=0;i--){ let o=objs[i]; o.y+=0.0016+speed*0.0003; if(o.y>1){ objs.splice(i,1); continue; }
      let dx=Math.abs(o.x-px), dy=Math.abs(o.y-0.88+py*0.3);
      if(dx<0.09 && dy<0.12){
        if(o.isCoin){ objs.splice(i,1); coins++; score+=50; sndCoin(); updateHUD(); }
        else if(py<0.25){ gameOver(); }
      }
    }
    score+=1; updateHUD();
  } else {
    if(tick%160===0) spawn();
    for(let i=objs.length-1;i>=0;i--){ objs[i].y+=0.0012; if(objs[i].y>1) objs.splice(i,1); }
  }
  draw(); requestAnimationFrame(update);
}
function updateHUD(){ document.getElementById('score').textContent=score; document.getElementById('coins').textContent=coins; }
function gameOver(){
  over=true; playing=false; sndHit();
  if(score>best){ best=score; localStorage.setItem('ahmed_ramadan_best',best); document.getElementById('best').textContent=best; }
  let ov=document.getElementById('overlay'); ov.style.display='flex';
  ov.innerHTML='<h2>💥 خبطت!</h2><p>سكورك: '+score+'<br>'+(cat==='fanous'?'فوانيس 🏮':cat==='hilal'?'هلال 🌙':'نجوم ⭐')+': '+coins+'<br>أعلى سكور: '+best+'</p><button onclick="startGame()">العب تاني 🔄</button>';
}
function startGame(){
  objs=[]; score=0; coins=0; px=0.5; py=0; vy=0; speed=1.2; over=false; playing=true;
  document.getElementById('overlay').style.display='none';
  document.getElementById('feedback').textContent='🌙 اجري ولم '+(cat==='fanous'?'الفوانيس 🏮':cat==='hilal'?'الهلال 🌙':'النجوم ⭐');
  updateHUD(); startMusic();
}
function jump(){ if(!playing||over) return; if(py===0){ vy=0.18; sndJump(); } }
let moveL=false, moveR=false;
document.getElementById('btnLeft').addEventListener('pointerdown',()=>moveL=true);
document.getElementById('btnLeft').addEventListener('pointerup',()=>moveL=false);
document.getElementById('btnLeft').addEventListener('pointerleave',()=>moveL=false);
document.getElementById('btnRight').addEventListener('pointerdown',()=>moveR=true);
document.getElementById('btnRight').addEventListener('pointerup',()=>moveR=false);
document.getElementById('btnRight').addEventListener('pointerleave',()=>moveR=false);
document.getElementById('btnJump').addEventListener('pointerdown',()=>jump());
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') moveL=true; if(e.key==='ArrowRight') moveR=true; if(e.key===' '||e.key==='ArrowUp') jump(); });
document.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft') moveL=false; if(e.key==='ArrowRight') moveR=false; });
let sx=0;
cv.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; }, {passive:true});
cv.addEventListener('touchmove',e=>{ let dx=e.touches[0].clientX-sx; if(dx>20){ px=Math.min(0.70,px+0.2); sx=e.touches[0].clientX; } if(dx<-20){ px=Math.max(0.30,px-0.2); sx=e.touches[0].clientX; } }, {passive:true});
cv.addEventListener('touchend',()=>{ if(playing) jump(); });
update();
</script></body></html>
