<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>جري الأبطال - بنك الألعاب</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none !important;user-select:none !important;-webkit-touch-callout:none !important;-webkit-tap-highlight-color:transparent}
  html,body{overflow:hidden!important;height:100%!important;height:100svh!important;max-height:100svh!important;overscroll-behavior:none}
  body{background:linear-gradient(to bottom,#00c853 0%,#ffe600 20%,#ff9600 40%,#ff0000 60%,#0064ff 80%,#9600ff 100%);background-attachment:fixed;font-family:'Segoe UI',Tahoma,sans-serif;text-align:center;color:#fff;padding:6px 8px 4px 8px;touch-action:manipulation;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
  .top-box{background:#fff;border:3px solid #c40000;border-radius:18px;max-width:520px;width:100%;margin:0 auto;padding:5px 6px 5px;box-shadow:0 0 15px rgba(0,0,0,.4);flex-shrink:0}
  .logo{width:82px;height:82px;border-radius:50%;border:3px solid #c40000;object-fit:cover}
  .game-title{font-size:21px;font-weight:900;color:#c40000;margin:1px 0 0}
  .my-name{font-size:21px;font-weight:900;color:#c40000}
  .my-name small{display:block;font-size:15px;color:#FF0000;font-weight:900}
  .bank{font-size:17px;font-weight:900;color:#FF0000;-webkit-text-stroke:1px #FFD700;text-shadow:0 0 8px rgba(255,215,0,.8);margin:0}
  .board{background:rgba(255,0,0,0.45);border:3px solid #FFD700;border-radius:16px;max-width:520px;width:100%;margin:6px auto 0;padding:8px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .game-area{position:relative;width:100%;flex:1;min-height:0;background:linear-gradient(to bottom,#87CEEB 0%,#E0F7FF 70%,#8BC34A 70%,#4CAF50 100%);border-radius:12px;overflow:hidden;touch-action:manipulation;border:3px solid #fff;direction:ltr}
  .ground{position:absolute;bottom:0;left:0;width:100%;height:30px;background:#4CAF50;border-top:3px solid #2E7D32}
  .player{position:absolute;bottom:30px;left:40px;width:50px;height:50px;font-size:42px;display:flex;align-items:center;justify-content:center;transform:scaleX(-1);direction:ltr}
  .obs{position:absolute;bottom:30px;width:40px;height:50px;font-size:36px;display:flex;align-items:center;justify-content:center;direction:ltr}
  .coin{position:absolute;width:34px;height:34px;font-size:28px;display:flex;align-items:center;justify-content:center;direction:ltr}
  .controls{display:flex;justify-content:center;gap:6px;margin:6px 0;direction:ltr;flex-shrink:0}
  .btn{background:#FFD700;color:#000;border:none;padding:12px 18px;font-size:18px;font-weight:900;border-radius:10px;cursor:pointer;flex:1;max-width:180px;touch-action:manipulation}
  .sound-btn{background:#fff;color:#c40000;border:2px solid #c40000;padding:7px 14px;font-size:14px;font-weight:900;border-radius:20px;cursor:pointer;margin:3px}
  #msg{font-size:16px;font-weight:900;min-height:22px;margin:4px 0;color:#fff;line-height:1.2}
  .score{font-weight:bold;font-size:14px;margin-top:4px;color:#fff}
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false">
<div class="top-box">
  <img class="logo" src="../../logo.png">
  <div class="game-title">جري الأبطال</div>
  <div class="my-name">أحمد عبدالعزيز<small>Ahmed TV</small></div>
  <div class="bank">بنك الألعاب</div>
</div>
<div class="board">
  <div id="msg">دوس نط عشان تنط من الحواجز - واجمع العملات!</div>
  <div class="game-area" id="area">
    <div class="ground"></div>
    <div class="player" id="player">🏃‍♂️</div>
  </div>
  <div class="controls">
    <button class="btn" onclick="startGame()">ابدأ</button>
    <button class="btn" onclick="jump()">نط!</button>
  </div>
  <button class="sound-btn" id="soundBtn" onclick="toggleSound()">الصوت: شغال</button>
  <div class="score">النقط: <span id="score">0</span> | العملات: <span id="coins">0</span> | أحسن نتيجة: <span id="best">0</span></div>
  <button class="btn" style="max-width:160px;font-size:15px;margin:4px auto 0;" onclick="location.reload()">لعبة جديدة</button>
  <div style="font-size:12px;margin-top:4px;">دوس نط أو دوس على الشاشة - لو خبطت في حاجز تخسر!</div>
</div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
document.addEventListener('selectstart',function(e){e.preventDefault();return false;});
document.addEventListener('dragstart',function(e){e.preventDefault();return false;});
var soundOn=true;
var _ahmedAudio=null;
var _ahlaPlayed=false;
function getAhmedAudio(){ if(!_ahmedAudio){ _ahmedAudio=new Audio(); _ahmedAudio.preload='auto'; } return _ahmedAudio; }
function playAhmedVoice(name){ try{ if(!soundOn) return; var a=getAhmedAudio(); try{a.pause();}catch(e){} a.src='../../sounds/'+name+'.mp3'; a.currentTime=0; a.volume=1; var pr=a.play(); if(pr) pr.catch(function(){}); }catch(e){} }
document.addEventListener('click',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').textContent = soundOn ? 'الصوت: شغال' : 'الصوت: مقفول'; if(soundOn) playAhmedVoice('sah'); }
function soundJump(){ }
function soundCoin(){ playAhmedVoice('sah'); }
function soundHit(){ playAhmedVoice('khesert'); }
</script>
<script>
var playing=false, over=false, score=0, coins=0, best=0, speed=1.6, playerY=30, vy=0, jumping=false, obs=[], coinItems=[], spawnTimer=null, animId=null, frame=0;
function startGame(){
  if(playing) return;
  playAhmedVoice('ebda');
  playing=true; over=false; score=0; coins=0; speed=1.6; playerY=30; vy=0; jumping=false; obs=[]; coinItems=[]; frame=0;
  document.getElementById('score').textContent='0';
  document.getElementById('coins').textContent='0';
  document.getElementById('msg').textContent='يلا اجري!';
  var area=document.getElementById('area');
  var olds=area.querySelectorAll('.obs,.coin');
  for(var i=0;i<olds.length;i++) olds[i].remove();
  document.getElementById('player').style.bottom='30px';
  document.getElementById('player').textContent='🏃‍♂️';
  spawnTimer=setInterval(spawnObs, 1900);
  animate();
}
function jump(){
  if(!playing || jumping) return;
  jumping=true; vy=24; soundJump();
  document.getElementById('player').textContent='🦘';
}
function spawnObs(){
  if(!playing) return;
  var area=document.getElementById('area');
  var isCoin = Math.random()<0.4;
  if(isCoin){
    var c=document.createElement('div');
    c.className='coin'; c.textContent='🪙';
    var y = 60 + Math.random()*90;
    c.style.left=area.clientWidth+'px'; c.style.bottom=y+'px';
    area.appendChild(c);
    coinItems.push({el:c, x:area.clientWidth, y:y});
  } else {
    var o=document.createElement('div');
    o.className='obs';
    var types=['🌵','🧱','🚧','🪨'];
    o.textContent=types[Math.floor(Math.random()*types.length)];
    o.style.left=area.clientWidth+'px';
    area.appendChild(o);
    obs.push({el:o, x:area.clientWidth});
  }
}
function animate(){
  if(!playing) return;
  frame++;
  score++;
  if(frame%500===0) speed+=0.1;
  document.getElementById('score').textContent=Math.floor(score/10);
  var p=document.getElementById('player');
  if(jumping){
    playerY+=vy; vy-=0.9;
    if(playerY<=30){ playerY=30; jumping=false; vy=0; p.textContent='🏃‍♂️'; }
    p.style.bottom=playerY+'px';
  }
  for(var i=obs.length-1;i>=0;i--){
    var o=obs[i];
    o.x-=speed;
    o.el.style.left=o.x+'px';
    if(o.x>35 && o.x<70 && playerY<55){ hit(); return; }
    if(o.x<-50){ o.el.remove(); obs.splice(i,1); }
  }
  for(var j=coinItems.length-1;j>=0;j--){
    var co=coinItems[j];
    co.x-=speed;
    co.el.style.left=co.x+'px';
    if(co.x>30 && co.x<90 && playerY+40>co.y && playerY<co.y+34){
      coins++; soundCoin();
      document.getElementById('coins').textContent=coins;
      document.getElementById('msg').textContent='عاش! خدت عملة! +10';
      co.el.remove(); coinItems.splice(j,1);
      score+=100;
    } else if(co.x<-50){ co.el.remove(); coinItems.splice(j,1); }
  }
  animId=requestAnimationFrame(animate);
}
function hit(){
  playing=false; over=true;
  clearInterval(spawnTimer); cancelAnimationFrame(animId);
  soundHit();
  var finalScore=Math.floor(score/10);
  if(finalScore>best){ best=finalScore; document.getElementById('best').textContent=best; }
  document.getElementById('player').textContent='😵';
  document.getElementById('msg').textContent='خبطت! النقط: '+finalScore+' - العملات: '+coins+' - دوس ابدأ تاني!';
}
document.getElementById('area').addEventListener('pointerdown', function(){ if(playing) jump(); else startGame(); });
document.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='ArrowUp'){ e.preventDefault(); if(!playing) startGame(); else jump(); } });
</script>
</body>
</html>
