<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>تحضير البرجر | Ahmed TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;touch-action:manipulation}
html,body{height:100% !important;height:100svh !important;max-height:100svh !important;overflow:hidden !important}
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 8px;overflow:hidden !important}
.header{width:100%;max-width:500px;text-align:center;flex-shrink:0}
.top-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:3px}
.logo-img{width:68px;height:68px;flex-shrink:0;border-radius:50%;border:4px solid #facc15;object-fit:cover;background:#fff;box-shadow:0 0 22px rgba(250,204,21,.5)}
h1{font-size:22px;line-height:1.2;color:#facc15}
h1 small{display:block;font-size:13px;color:#fff;letter-spacing:1px;margin-top:2px}
.names{font-size:20px;color:#fff;margin-bottom:4px;font-weight:900}
.names small{display:block;font-size:14px;color:#facc15;font-weight:900}
.stats{display:flex;gap:8px;justify-content:center;margin:4px 0 6px;flex-wrap:wrap}
.stat{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:4px 12px;min-width:78px;text-align:center}
.stat b{display:block;font-size:17px;color:#facc15}
.stat span{font-size:10px;color:#94a3b8}
#game-container{width:100%;max-width:500px;flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:#1e293b;border:4px solid #f59e0b;border-radius:16px;overflow:hidden;padding:8px}
.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,0.05);font-size:40px;font-weight:900;pointer-events:none;z-index:0;white-space:nowrap}
.order-panel{background:#0f172a;border-radius:12px;padding:6px;text-align:center;margin-bottom:6px;flex-shrink:0;z-index:1}
.order-title{font-size:14px;color:#94a3b8;margin-bottom:2px}
.order-items{display:flex;flex-direction:column-reverse;align-items:center;gap:1px}
.order-item{font-size:20px;line-height:1.1}
.build-area{flex:1;min-height:0;background:#e2e8f0;border-radius:12px;display:flex;flex-direction:column-reverse;justify-content:center;align-items:center;margin-bottom:6px;padding:6px;position:relative;z-index:1;border:2px dashed #94a3b8;overflow:hidden}
.build-item{font-size:30px;animation:pop .2s ease-out;line-height:1.1}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.ingredients{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;z-index:1;flex-shrink:0}
.ing-btn{background:#334155;border-radius:10px;padding:8px;font-size:26px;text-align:center;cursor:pointer;transition:transform .1s,background .2s;user-select:none;border:2px solid #475569}
.ing-btn:active{transform:scale(.9);background:#475569}
#overlay{position:absolute;inset:0;background:rgba(15,23,42,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;gap:10px;z-index:10}
#overlay h2{font-size:24px;margin-bottom:5px;color:#facc15}
#overlay p{line-height:1.6;font-size:14px;color:#e2e8f0;margin-bottom:10px}
.btn-start{background:#f59e0b;color:#000;border:none;padding:12px 25px;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;width:80%;max-width:200px}
.btn-start:active{transform:scale(.95)}
.footer{font-size:11px;color:#94a3b8;text-align:center;flex-shrink:0;margin-top:4px;padding-bottom:4px}
.footer a{color:#facc15;text-decoration:none}
</style></head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false" onmousedown="return false">
<div class="header">
<div class="top-row">
<img src="../../logo.png" alt="Ahmed TV" class="logo-img">
<h1>تحضير البرجر<small>AHMED TV BURGER</small></h1>
</div>
<div class="names">أحمد عبد العزيز<small>Ahmed TV</small></div>
<div class="stats">
<div class="stat"><b id="score">0</b><span>الطلبات</span></div>
<div class="stat"><b id="best">0</b><span>الأفضل</span></div>
</div>
</div>
<div id="game-container">
<div class="watermark">Ahmed TV</div>
<div class="order-panel"><div class="order-title">حضّر هذا البرجر:</div><div class="order-items" id="orderItems"></div></div>
<div class="build-area" id="buildArea"></div>
<div class="ingredients" id="ingredients"></div>
<div id="overlay"><h2>لعبة تحضير البرجر</h2><p><b>Ahmed TV</b> - جهّز البرجر بالترتيب الصحيح!<br>انظر إلى الطلب في الأعلى، واضغط على المكونات بالترتيب</p><button class="btn-start" id="startBtn">ابدأ الطهي</button></div>
</div>
<div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ جميع ألعابي</a></div>
<script>
// ===== منع بحث جوجل =====
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('mousedown',function(e){if(e.button===2)e.preventDefault();},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
// ===== صوتك بدل الصفافير =====
var soundOn=true,_audioCache={},_ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
function playSound(type){ if(type==='click') playAhmedVoice('sah'); else if(type==='success') playAhmedVoice('kesebt'); else if(type==='fail') playAhmedVoice('ghalat'); }
</script>
<script>
const orderItemsEl=document.getElementById('orderItems');const buildArea=document.getElementById('buildArea');const ingredientsEl=document.getElementById('ingredients');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');const overlay=document.getElementById('overlay');const startBtn=document.getElementById('startBtn');
let score=0;let best=parseInt(localStorage.getItem('burgerBest')||'0');bestEl.textContent=best;
let currentOrder=[];let currentBuild=[];let isRunning=false;
const INGREDIENTS={'خبز':'🍞','لحمة':'🥩','جبنة':'🧀','خس':'🥬','طماطم':'🍅'};
function buildIngredients(){ingredientsEl.innerHTML='';for(let key in INGREDIENTS){let btn=document.createElement('div');btn.className='ing-btn';btn.textContent=INGREDIENTS[key];blockGoogle(btn);btn.addEventListener('pointerdown',function(e){e.preventDefault();addIngredient(key);},{passive:false});ingredientsEl.appendChild(btn);}}
function newOrder(){currentOrder=[];currentOrder.push('خبز');let middleKeys=Object.keys(INGREDIENTS).filter(k=>k!=='خبز');let count=2+Math.floor(Math.random()*3);for(let i=0;i<count;i++){currentOrder.push(middleKeys[Math.floor(Math.random()*middleKeys.length)]);}currentOrder.push('خبز');orderItemsEl.innerHTML='';currentOrder.forEach(ing=>{let span=document.createElement('div');span.className='order-item';span.textContent=INGREDIENTS[ing];orderItemsEl.appendChild(span);});currentBuild=[];buildArea.innerHTML='';}
function addIngredient(key){if(!isRunning)return;playSound('click');currentBuild.push(key);let item=document.createElement('div');item.className='build-item';item.textContent=INGREDIENTS[key];buildArea.appendChild(item);let currentIndex=currentBuild.length-1;if(currentBuild[currentIndex]!==currentOrder[currentIndex]){playSound('fail');isRunning=false;setTimeout(()=>{endGame('خطأ! الترتيب غير صحيح');},500);return;}if(currentBuild.length===currentOrder.length){playSound('success');score++;scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem('burgerBest',best);bestEl.textContent=best;}isRunning=false;setTimeout(()=>{isRunning=true;newOrder();},800);}}
function endGame(msg){isRunning=false;overlay.style.display='flex';overlay.innerHTML='<div style="font-size:35px">🍔</div><h2>'+msg+'</h2><p>جهّزت <b style="color:#facc15;font-size:22px">'+score+'</b> طلب<br>أعلى نتيجة: '+best+'<br>حاول مرة أخرى!</p><button class="btn-start" id="againBtn">العب مرة أخرى</button>';var ab=document.getElementById('againBtn'); blockGoogle(ab); ab.addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false});}
function startGame(){playAhmedVoice('ebda');overlay.style.display='none';score=0;scoreEl.textContent=score;isRunning=true;buildIngredients();newOrder();}
blockGoogle(startBtn);
startBtn.addEventListener('pointerdown',function(e){e.preventDefault();startGame();},{passive:false});
</script>
</body></html>
