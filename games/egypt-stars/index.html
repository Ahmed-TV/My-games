<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ahmed TV - تحدي نجوم مصر 80</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',Tahoma,system-ui;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:10px;overflow-y:auto;overflow-x:hidden}
.container{width:100%;max-width:680px;background:#111;border-radius:24px;border:2px solid #222;overflow:visible;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,0.8);position:relative;}
.header{background:linear-gradient(135deg,#8FFF00,#5cb71a 60%,#4CAF50);padding:22px 16px;text-align:center;border-bottom:4px solid #000;border-radius:22px 22px 0 0}
.logo{width:80px;height:80px;margin:0 auto 10px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;color:#7ED321;font-weight:900;font-size:16px;line-height:1.1;box-shadow:0 0 20px rgba(0,0,0,0.5)}
.main-title{color:#000;font-weight:900;font-size:24px;letter-spacing:1px}
.sub-title{color:#111;font-weight:800;font-size:15px;margin-top:8px;background:rgba(255,255,255,0.4);display:inline-block;padding:6px 14px;border-radius:20px}
.progress{padding:14px 18px;background:#1a1a1a;display:flex;justify-content:space-between;font-size:18px;color:#7ED321;font-weight:900;border-bottom:2px solid #222}
.bar{height:12px;background:#333;margin:0 18px;border-radius:6px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#7ED321,#5cb71a);width:0%;transition:.4s;border-radius:6px}

.card{padding:20px 16px}

.fifa-card{background:linear-gradient(145deg, #1a1a1a, #0a0a0a);width:100%;border-radius:20px;border:3px solid #333;position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,0.8);margin-bottom:20px}
.fifa-top{background:linear-gradient(90deg, transparent, rgba(126,211,33,0.2), transparent);padding:15px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.fifa-num{font-size:70px;font-weight:900;color:#7ED321;line-height:1;text-shadow:0 0 30px rgba(126,211,33,0.5)}
.fifa-pos{background:#7ED321;color:#000;padding:6px 16px;border-radius:12px;font-size:16px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
.fifa-name{text-align:center;font-size:28px;font-weight:900;color:#fff;padding:0 20px;margin-bottom:15px;letter-spacing:2px;border-bottom:2px solid #333;padding-bottom:15px;transition:0.3s}
.fifa-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 20px}
.stat{display:flex;justify-content:space-between;background:#222;padding:10px 15px;border-radius:10px;font-size:16px;font-weight:800;border:1px solid #333}
.stat span:first-child{color:#aaa}
.stat span:last-child{color:#7ED321}

.hints{display:flex;gap:8px;margin-top:10px}
.hbtn{flex:1;background:#1e1e1e;border:2px solid #333;border-radius:12px;padding:14px 4px;font-size:14px;font-weight:900;color:#aaa;cursor:pointer;font-family:inherit;transition:all 0.2s}
.hbtn:not(:disabled):hover{background:#2a2a2a;color:#fff;border-color:#7ED321}
.hbtn:disabled{opacity:0.3}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:#1e1e1e;border:2px solid #333;border-radius:14px;padding:18px 8px;text-align:center;font-size:18px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;transition:all 0.2s}
.opt:hover{border-color:#7ED321;background:#2a2a2a}
.opt:active{transform:scale(0.96)}
.opt:disabled{opacity:0.3;cursor:default}

.skipBtn{width:100%;margin-top:12px;background:#333;border:2px solid #444;border-radius:14px;padding:16px;font-size:16px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;transition:background 0.2s}
.skipBtn:hover{background:#444}

.hintBox{text-align:center;margin-top:16px;color:#7ED321;font-weight:900;font-size:16px;min-height:40px;background:rgba(126,211,33,0.1);border-radius:12px;padding:10px;transition:0.3s;border:1px dashed #444;display:flex;align-items:center;justify-content:center}
.hintBox:empty{background:transparent;border:none}

.footer{text-align:center;padding:12px;font-size:12px;color:#666;font-weight:600}

.end-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:22px;z-index:100;text-align:center;padding:20px}
.end-screen h2{color:#7ED321;font-size:36px;margin-bottom:15px}
.end-screen p{font-size:22px;font-weight:800;margin-bottom:30px;line-height:1.6}
.end-btn{background:#7ED321;color:#000;border:none;padding:16px 40px;border-radius:30px;font-size:22px;font-weight:900;font-family:inherit;cursor:pointer}

@keyframes shake{0%, 100% { transform: translateX(0); }25% { transform: translateX(-10px); }50% { transform: translateX(10px); }75% { transform: translateX(-10px); }}
.shake{animation:shake 0.4s ease-in-out}
@keyframes pop{0% { transform: scale(1); }50% { transform: scale(1.02); }100% { transform: scale(1); }}
.pop{animation:pop 0.3s ease-in-out}

@media(max-width:500px){
  .header{padding:16px 12px}
  .logo{width:70px;height:70px;font-size:14px}
  .main-title{font-size:20px}
  .sub-title{font-size:13px}
  .fifa-num{font-size:60px}
  .fifa-name{font-size:22px}
  .stat{font-size:14px;padding:8px 10px}
  .opt{font-size:16px;padding:16px 6px}
  .hbtn{font-size:12px;padding:12px 2px}
  .skipBtn{font-size:15px;padding:14px}
  .hintBox{font-size:14px}
}
@media(max-width:380px){
  .fifa-num{font-size:50px}
  .fifa-name{font-size:20px}
  .opt{font-size:15px;padding:14px 4px}
}
</style>

  {num:'9', pos:'مهاجم', name:'عمرو زكي', opts:['عمرو زكي','ميدو','حسام حسن','متعب'], hint:'الرجل العنكبوت - الزمالك والمنتخب', extra:'إنجلترا 🇬🇧 - اعتزل - رأس حربة', spd:78, sho:85, pas:65, dri:72}
];

// دالة الخلط العشوائي
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

// توليد 80 سؤال من غير تكرار متتالي
var levels = [];
var pool = [];

for (var i = 0; i < 80; i++) {
  if (pool.length === 0) {
    pool = shuffle(baseLevels.slice());
  }
  levels.push(pool.pop());
}

var idx = 0;
var score = 0;
var currentAnswer = "";

function render() {
  var cur = levels[idx];
  currentAnswer = cur.name;

  document.getElementById('qn').textContent = (idx + 1) + ' / ' + levels.length;
  document.getElementById('sc').textContent = score + ' نقطة';
  document.getElementById('fill').style.width = (idx / levels.length * 100) + '%';
  
  document.getElementById('pNum').textContent = cur.num;
  document.getElementById('pPos').textContent = cur.pos;
  document.getElementById('pName').textContent = '؟ ؟ ؟';
  document.getElementById('pName').style.color = '#fff';
  document.getElementById('pSpd').textContent = cur.spd;
  document.getElementById('pSho').textContent = cur.sho;
  document.getElementById('pPas').textContent = cur.pas;
  document.getElementById('pDri').textContent = cur.dri;
  
  document.getElementById('fifaCard').classList.remove('shake');
  document.getElementById('fifaCard').classList.add('pop');
  setTimeout(function(){ document.getElementById('fifaCard').classList.remove('pop'); }, 300);

  document.getElementById('hintBox').textContent = '';
  document.getElementById('h1').disabled = false;
  document.getElementById('h2').disabled = false;
  document.getElementById('h3').disabled = false;

  var optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  var opts = shuffle(cur.opts.slice());
  
  opts.forEach(function(t) {
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = t;
    b.onclick = function() { handleAnswer(t, b); };
    optsEl.appendChild(b);
  });
}

function handleAnswer(selected, btn) {
  var allBtns = document.querySelectorAll('.opt');
  allBtns.forEach(function(b) { b.disabled = true; });

  if (selected === currentAnswer) {
    score += 20;
    document.getElementById('sc').textContent = score + ' نقطة';
    btn.style.background = '#7ED321';
    btn.style.color = '#000';
    btn.style.borderColor = '#fff';
    document.getElementById('hintBox').textContent = '✅ إجابة صحيحة! +20';
    document.getElementById('pName').textContent = currentAnswer;
    document.getElementById('pName').style.color = '#7ED321';
    
    setTimeout(function() {
      idx++;
      if (idx < levels.length) render();
      else endGame();
    }, 1000);
  } else {
    btn.style.background = '#ff4444';
    btn.style.color = '#fff';
    btn.style.borderColor = '#ff4444';
    
    allBtns.forEach(function(b) {
      if (b.textContent === currentAnswer) {
        b.style.background = '#7ED321';
        b.style.color = '#000';
        b.style.borderColor = '#fff';
      }
    });
    
    document.getElementById('hintBox').textContent = '❌ خطأ! الصح: ' + currentAnswer;
    document.getElementById('pName').textContent = currentAnswer;
    document.getElementById('pName').style.color = '#ff4444';
    document.getElementById('fifaCard').classList.add('shake');
    
    setTimeout(function() {
      idx++;
      if (idx < levels.length) render();
      else endGame();
    }, 2000);
  }
}

function hintClear() {
  if (document.getElementById('h1').disabled) return;
  score = Math.max(0, score - 5);
  document.getElementById('sc').textContent = score + ' نقطة';
  document.getElementById('h1').disabled = true;
  document.getElementById('hintBox').textContent = '🔍 ' + levels[idx].extra;
}

function hintText() {
  if (document.getElementById('h2').disabled) return;
  score = Math.max(0, score - 5);
  document.getElementById('sc').textContent = score + ' نقطة';
  document.getElementById('h2').disabled = true;
  document.getElementById('hintBox').textContent = '💡 ' + levels[idx].hint;
}

function hintDel() {
  if (document.getElementById('h3').disabled) return;
  score = Math.max(0, score - 10);
  document.getElementById('sc').textContent = score + ' نقطة';
  document.getElementById('h3').disabled = true;
  
  var allBtns = Array.from(document.querySelectorAll('.opt'));
  var removed = 0;
  
  allBtns.forEach(function(b) {
    if (b.textContent !== currentAnswer && removed < 2) {
      b.disabled = true;
      b.style.opacity = '0.2';
      removed++;
    }
  });
  
  document.getElementById('hintBox').textContent = '❌ تم حذف إجابتين خاطئتين';
}

function skipLevel() {
  idx++;
  if (idx < levels.length) render();
  else endGame();
}

function endGame() {
  var container = document.getElementById('mainContainer');
  var endScreen = document.createElement('div');
  endScreen.className = 'end-screen';
  endScreen.innerHTML = `
    <h2>🏆 انتهت اللعبة!</h2>
    <p>لقد جمعت <b>${score}</b> نقطة<br>من أصل ${levels.length * 20} نقطة</p>
    <button class="end-btn" onclick="location.reload()">العب تاني 🔄</button>
  `;
  container.appendChild(endScreen);
}

render();
</script>
