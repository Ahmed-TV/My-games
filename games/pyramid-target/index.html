<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ahmed TV - بناء الهرم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;touch-action:manipulation}
html,body{overflow:hidden;height:100%}
body{font-family:Tahoma,Arial,sans-serif;background:#14532D;display:flex;justify-content:center;padding:3px 6px}
.game{width:100%;max-width:500px;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFFFFF 0%,#DCFCE7 50%,#FFEDD5 100%);border:4px solid #166534;border-radius:38px 38px 18px 18px;padding:5px 7px;position:relative}
header{padding:1px 0 2px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-img{width:110px!important;height:110px!important;min-width:110px;min-height:110px;max-width:110px;max-height:110px;border-radius:50%;border:4px solid #166534;object-fit:cover;background:#fff}
.brand{font-size:22px!important;font-weight:900;color:#166534;line-height:1.2}
.names{font-size:22px!important;font-weight:900;color:#166534;line-height:1.3;text-align:center}
.name-en{display:block;font-size:18px!important;font-weight:900;color:#166534;line-height:1.2}
.names small{display:block;font-size:16px!important;color:#EA580C;font-weight:900;line-height:1.2}
.modes{display:flex;gap:5px;width:100%;margin:2px 0}
.mode{flex:1;padding:6px 2px;border-radius:10px;border:2px solid #166534;background:#fff;color:#166534;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit}
.mode.active{background:#166534;color:#fff}
.stats{display:flex;gap:4px;width:100%;margin:2px 0}
.stat{flex:1;background:#fff;border:1.5px solid #166534;border-radius:9px;padding:2px 1px;text-align:center;line-height:1.1}
.stat b{display:block;font-size:14px;color:#166534}
.stat span{font-size:9px;font-weight:800;color:#666}
#view{width:100%;height:320px;background:linear-gradient(180deg,#86EFAC 0%,#BBF7D0 30%,#FDE68A 70%,#FB923C 100%);border:2px solid #166534;border-radius:16px;overflow:hidden;position:relative}
@media(min-width:700px){#view{height:400px}}
#ground{position:absolute;bottom:0;left:0;width:100%;height:22px;background:#EA580C;border-top:3px solid #166534;z-index:1}
#target{position:absolute;bottom:22px;left:30%;width:64px;height:34px;background:rgba(255,255,255,.8);border:3px dashed #EA580C;border-radius:10px;z-index:2;display:flex;align-items:center;justify-content:center;font-size:20px;animation:blink 0.8s infinite}
@keyframes blink{0%,100%{border-color:#EA580C;background:rgba(255,255,255,.8)}50%{border-color:#166534;background:rgba(255,255,255,.95)}}
#pyramid{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;z-index:3;width:100%}
.py-row{display:flex;justify-content:center;gap:3px;margin:1px 0}
.py-block{width:36px;height:26px;background:linear-gradient(180deg,#FEF3C7,#FB923C);border:2px solid #166534;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.py-block.top{background:linear-gradient(180deg,#FEF08A,#EA580C)}
#moving{position:absolute;top:10px;left:10px;width:42px;height:28px;background:linear-gradient(180deg,#FEF3C7,#FB923C);border:2px solid #166534;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#falling{position:absolute;width:42px;height:28px;background:linear-gradient(180deg,#FEF3C7,#FB923C);border:2px solid #166534;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:5;display:none}
#msg{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#166534;font-weight:900;font-size:12px;padding:4px 12px;border-radius:20px;z-index:6;white-space:nowrap}
#overlay{position:absolute;inset:0;background:rgba(20,83,45,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;z-index:10;text-align:center;padding:12px;overflow-y:auto}
#overlay h2{color:#fff;font-size:22px}
#overlay p{color:#DCFCE7;font-size:12px;font-weight:800;line-height:1.7}
.how{background:#fff;border-radius:12px;padding:8px 10px;text-align:right;width:100%;max-width:320px}
.how b{color:#166534;font-size:13px}
.how div{color:#333;font-size:11px;font-weight:700;line-height:1.7}
#startBtn{font-family:inherit;font-weight:900;border:0;border-radius:18px;padding:12px 28px;background:#EA580C;color:#fff;cursor:pointer;font-size:16px}
.controls{display:flex;gap:6px;width:100%;margin-top:5px}
.cbtn{flex:1;height:56px;border-radius:14px;border:0;background:#166534;color:#fff;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
footer{text-align:center;color:#166534;font-size:10px;margin-top:2px;padding-bottom:2px}
footer a{color:#166534;text-decoration:none;font-weight:700}
</style></head>
<body oncontextmenu="return false"><div class="game">
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">بناء الهرم</div><div class="names">أحمد عبدالعزيز<span class="name-en">Ahmed Abdelaziz</span><small>Ahmed TV</small></div></header>
<div class="modes"><button class="mode active" id="soundBtn" onclick="toggleSound()">🔊 الصوت: شغال</button><button class="mode" onclick="showHow()">❓ شرح اللعبة</button></div>
<div class="stats"><div class="stat"><b id="score">0 / 15</b><span>حجارة الهرم</span></div><div class="stat"><b id="lives">❤️❤️❤️</b><span>القلوب</span></div></div>
<div id="view"><div id="msg">نزل الحجر جوه المربع وابني هرم!</div><div id="ground"></div><div id="target">🔺</div><div id="pyramid"></div><div id="moving">🧱</div><div id="falling">🧱</div>
<div id="overlay"><h2>🔺 بناء الهرم 🔺</h2><div class="how"><b>ازاي تلعب؟</b><div>شايف المربع المنور 🔺؟ نزل الحجر جواه<br>معاك 3 قلوب - لو نزلت بره تخسر قلب<br>كمل 15 حجرة وابني الهرم كله!</div><div style="text-align:center;font-size:20px;line-height:1.3;margin-top:4px">🧱<br>🧱🧱<br>🧱🧱🧱<br>🧱🧱🧱🧱<br>🧱🧱🧱🧱🧱</div></div><button id="startBtn" onclick="startGame()">ابدأ البناء</button></div></div>
<div class="controls"><button class="cbtn" onclick="dropBlock()">⬇ نزل الحجر جوه المربع ⬇</button></div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
var moving=document.getElementById('moving'), falling=document.getElementById('falling'), target=document.getElementById('target'), msg=document.getElementById('msg'), overlay=document.getElementById('overlay'), pyramid=document.getElementById('pyramid');
var playing=false, mx=10, dir=1, moveTimer=null, score=0, lives=3, targetX=30, targetW=64;
var soundOn=true, actx=null;
function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').textContent = soundOn ? '🔊 الصوت: شغال' : '🔇 الصوت: مقفول'; if(soundOn) playBeep(600); }
function playBeep(f,d){ if(!soundOn) return; try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); var o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.3,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+(d||0.18)); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+(d||0.18)); }catch(e){} }
function playWin(){ playBeep(523,0.15); setTimeout(function(){playBeep(659,0.15);},150); setTimeout(function(){playBeep(784,0.3);},300); }
function playLose(){ playBeep(300,0.2); setTimeout(function(){playBeep(180,0.4);},180); }
function speak(t){ if(!soundOn) return; try{ if('speechSynthesis' in window){ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='ar-EG'; u.rate=1; window.speechSynthesis.speak(u); } }catch(e){} }
function showHow(){ overlay.style.display='flex'; overlay.innerHTML='<h2>❓ شرح اللعبة</h2><div class="how"><b>ازاي تلعب؟</b><div>نزل الحجر جوه المربع المنور 🔺 - معاك 3 قلوب - كل حجر صح بيبني الهرم</div></div><button id="startBtn" onclick="startGame()">فهمت - ابدأ</button>'; }
function moveTarget(){ targetW=64; targetX=5+Math.random()*70; target.style.left=targetX+'%'; target.style.width=targetW+'px'; msg.textContent='المربع اتنقل! نزل الحجر جواه!'; }
function renderPyramid(){ pyramid.innerHTML=''; var needs=[5,4,3,2,1]; var left=score; for(var r=0;r<needs.length;r++){ if(left<=0) break; var count=Math.min(left, needs[r]); var row=document.createElement('div'); row.className='py-row'; for(var i=0;i<count;i++){ var b=document.createElement('div'); b.className='py-block'+(r===4?' top':''); b.textContent='🧱'; row.appendChild(b); } pyramid.appendChild(row); left-=count; } }
function startGame(){ score=0; lives=3; mx=10; dir=1; playing=true; document.getElementById('score').textContent='0 / 15'; document.getElementById('lives').textContent='❤️❤️❤️'; renderPyramid(); overlay.style.display='none'; moving.style.display='flex'; moveTarget(); speak('ابني الهرم'); clearInterval(moveTimer); moveTimer=setInterval(function(){ if(!playing) return; mx+=dir*2.2; if(mx>88){dir=-1;} if(mx<2){dir=1;} moving.style.left=mx+'%'; },30); }
function dropBlock(){ if(!playing) return; playBeep(400,0.1); var startX=mx; moving.style.display='none'; falling.style.display='flex'; falling.style.left=startX+'%'; falling.style.top='10px'; var y=10; var fall=setInterval(function(){ y+=9; falling.style.top=y+'px'; if(y>235){ clearInterval(fall); falling.style.display='none'; checkDrop(startX); } },20); }
function checkDrop(x){ var stoneCenter=x+4; var targetLeft=targetX; var targetRight=targetX + (targetW/300*100); var ok = (stoneCenter>=targetLeft-2 && stoneCenter<=targetRight+2); if(ok){ score++; document.getElementById('score').textContent=score+' / 15'; renderPyramid(); msg.textContent='عاش! حجر في الهرم! 🔺 +1'; playBeep(900,0.25); speak('صح جوه المربع'); if(score>=15){ winGame(); return; } moveTarget(); moving.style.display='flex'; } else { lives--; document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives)); msg.textContent='بره المربع! خسرت قلب! 😢'; playLose(); speak('بره المربع'); if(lives<=0){ loseGame(); return; } moving.style.display='flex'; } }
function winGame(){ playing=false; clearInterval(moveTimer); playWin(); pyramid.innerHTML=pyramid.innerHTML+'<div class="py-row"><div class="py-block top">👑</div></div>'; overlay.style.display='flex'; overlay.innerHTML='<h2>بطل! بنيت الهرم! 🔺👑</h2><p>خلصت الهرم كله - 15 حجرة</p><button id="startBtn" onclick="startGame()">العب تاني</button>'; }
function loseGame(){ playing=false; clearInterval(moveTimer); playLose(); overlay.style.display='flex'; overlay.innerHTML='<h2>خسرت! 😢</h2><p>جمعت '+score+' حجرة من 15</p><button id="startBtn" onclick="startGame()">حاول تاني</button>'; }
renderPyramid();
</script>
</body></html>
