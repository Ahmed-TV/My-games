<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تقطيع الفواكه - بنك الألعاب</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none !important;user-select:none !important;-webkit-touch-callout:none !important;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(to bottom,#00c853 0%,#ffe600 20%,#ff9600 40%,#ff0000 60%,#0064ff 80%,#9600ff 100%);background-attachment:fixed;font-family:'Segoe UI',Tahoma,sans-serif;text-align:center;color:#fff;padding:8px 8px 20px 8px;touch-action:manipulation;overflow-x:hidden}
  .top-box{background:#fff;border:3px solid #c40000;border-radius:18px;max-width:520px;margin:0 auto;padding:6px 6px 7px;box-shadow:0 0 15px rgba(0,0,0,.4)}
  .logo{width:62px;height:62px;border-radius:50%;border:3px solid #c40000;object-fit:cover}
  .game-title{font-size:22px;font-weight:900;color:#c40000;margin:2px 0 1px}
  .my-name{font-size:15px;font-weight:900;color:#c40000}
  .bank{font-size:18px;font-weight:900;color:#FF0000;-webkit-text-stroke:1px #FFD700;text-shadow:0 0 8px rgba(255,215,0,.8);margin:1px 0 0}
  .board{background:rgba(255,0,0,0.45);border:3px solid #FFD700;border-radius:16px;max-width:520px;margin:8px auto 0;padding:10px;width:100%}
  .game-area{position:relative;width:100%;height:340px;background:linear-gradient(to bottom,#87CEEB,#E0F7FF);border-radius:12px;overflow:hidden;touch-action:none;border:3px solid #fff}
  .fruit{position:absolute;width:62px;height:62px;font-size:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.1s}
  .fruit.cut{transform:scale(1.4) rotate(45deg);opacity:0.3}
  .slice{position:absolute;font-size:32px;pointer-events:none;animation:pop 0.5s forwards}
  @keyframes pop{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5) translateY(-20px);opacity:0}}
  .controls{display:flex;justify-content:center;gap:6px;margin:8px 0}
  .btn{background:#FFD700;color:#000;border:none;padding:12px 18px;font-size:17px;font-weight:900;border-radius:10px;cursor:pointer;flex:1;max-width:160px}
  .sound-btn{background:#fff;color:#c40000;border:2px solid #c40000;padding:8px 14px;font-size:14px;font-weight:900;border-radius:20px;cursor:pointer;margin:4px}
  #msg{font-size:17px;font-weight:900;min-height:24px;margin:6px 0;color:#fff}
  .score{font-weight:bold;font-size:15px;margin-top:6px;color:#fff}
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false">
<div class="top-box">
  <img class="logo" src="../../logo.png">
  <div class="game-title">🍉 تقطيع الفواكه 🍉</div>
  <div class="my-name">Ahmed TV • أحمد عبدالعزيز</div>
  <div class="bank">بنك الألعاب</div>
</div>
<div class="board">
  <div id="msg">دوس على الفاكهة عشان تقطعها - اوعى تقطع القنبلة! 💣</div>
  <div class="game-area" id="area"></div>
  <div class="controls">
    <button class="btn" onclick="startGame()">ابدأ ▶️</button>
    <button class="btn" onclick="location.reload()">لعبة جديدة 🔁</button>
  </div>
  <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊 الصوت: شغال</button>
  <div class="score">النقط: <span id="score">0</span> | اللي فاتك: <span id="miss">0</span> / 10 | الوقت: <span id="time">60</span> ثانية</div>
  <div style="font-size:13px;margin-top:6px;">اقطع الفاكهة قبل ما تقع - لو فاتتك 10 - تخسر! لو قطعت قنبلة - تخسر!</div>
</div>

<script>
var audioCtx=null, soundOn=true;
function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').textContent = soundOn ? '🔊 الصوت: شغال' : '🔇 الصوت: مقفول'; }
function beep(f,d,t){ if(!soundOn) return; try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); var o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=t||'sine'; o.frequency.value=f; g.gain.value=0.25; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }catch(e){} }
function soundCut(){ beep(900,0.1,'sawtooth'); setTimeout(function(){beep(1200,0.1,'sawtooth');},50); }
function soundBomb(){ beep(200,0.4,'sawtooth'); }
function soundWin(){ beep(523,0.2,'sine'); setTimeout(function(){beep(659,0.2,'sine');},200); setTimeout(function(){beep(784,0.2,'sine');},400); setTimeout(function(){beep(1046,0.4,'sine');},600); }
function soundLose(){ beep(400,0.3,'sawtooth'); setTimeout(function(){beep(300,0.4,'sawtooth');},300); }
</script>

<script>
var fruits=['🍎','🍊','🍋','🍉','🍇','🍓','🍑','🍒','🥝','🍍'];
var score=0, miss=0, timeLeft=60, playing=false, over=false, spawnTimer=null, timeTimer=null, animId=null;
var items=[];
function startGame(){
  if(playing) return;
  score=0; miss=0; timeLeft=60; playing=true; over=false; items=[];
  document.getElementById('score').textContent='0';
  document.getElementById('miss').textContent='0';
  document.getElementById('time').textContent='60';
  document.getElementById('msg').textContent='يلا قطّع! 🍉';
  document.getElementById('area').innerHTML='';
  spawnTimer=setInterval(spawnFruit, 800);
  timeTimer=setInterval(function(){
    timeLeft--;
    document.getElementById('time').textContent=timeLeft;
    if(timeLeft<=0) endGame(true);
  },1000);
  animate();
}
function spawnFruit(){
  if(!playing) return;
  var area=document.getElementById('area');
  var isBomb = Math.random()<0.15;
  var el=document.createElement('div');
  el.className='fruit';
  el.textContent = isBomb ? '💣' : fruits[Math.floor(Math.random()*fruits.length)];
  var x = 20 + Math.random()*(area.clientWidth-90);
  var y = area.clientHeight + 10;
  el.style.left=x+'px'; el.style.top=y+'px';
  var vy = -(7 + Math.random()*4);
  var vx = (Math.random()-0.5)*2;
  var item={el:el, x:x, y:y, vx:vx, vy:vy, bomb:isBomb, cut:false};
  el.addEventListener('pointerdown', function(e){ e.preventDefault(); cutFruit(item); });
  area.appendChild(el);
  items.push(item);
}
function cutFruit(item){
  if(!playing || item.cut) return;
  item.cut=true;
  if(item.bomb){
    soundBomb();
    endGame(false, 'قطعت قنبلة! 💣💥');
    return;
  }
  soundCut();
  score+=10;
  document.getElementById('score').textContent=score;
  item.el.classList.add('cut');
  showSlice(item.x, item.y);
  document.getElementById('msg').textContent='عاش! قطعتها! +10 🎉 - النقط: '+score;
  setTimeout(function(){ if(item.el.parentNode) item.el.parentNode.removeChild(item.el); },200);
  items = items.filter(function(i){ return i!==item; });
}
function showSlice(x,y){
  var area=document.getElementById('area');
  var s=document.createElement('div');
  s.className='slice'; s.textContent='💥';
  s.style.left=x+'px'; s.style.top=y+'px';
  area.appendChild(s);
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },500);
}
function animate(){
  if(!playing) return;
  var area=document.getElementById('area');
  for(var i=items.length-1;i>=0;i--){
    var it=items[i];
    if(it.cut) continue;
    it.vy+=0.3;
    it.x+=it.vx; it.y+=it.vy;
    it.el.style.left=it.x+'px'; it.el.style.top=it.y+'px';
    if(it.y > area.clientHeight+20){
      if(it.el.parentNode) it.el.parentNode.removeChild(it.el);
      items.splice(i,1);
      if(!it.bomb){
        miss++;
        // العداد فوق بيعد دلوقتي - 1 - 2 - 3 ... 10
        document.getElementById('miss').textContent=miss;
        document.getElementById('msg').textContent='فاتتك '+miss+' من 10 😢 - فاضل '+(10-miss)+' وتخسر!';
        if(miss>=10){ endGame(false, 'فاتتك 10 فواكه!'); return; }
      }
    }
  }
  animId=requestAnimationFrame(animate);
}
function endGame(win, reason){
  if(!playing) return;
  playing=false; over=true;
  clearInterval(spawnTimer); clearInterval(timeTimer);
  cancelAnimationFrame(animId);
  if(win){ soundWin(); document.getElementById('msg').textContent='خلص الوقت! كسبت! 🏆 النقط: '+score; }
  else { soundLose(); document.getElementById('msg').textContent=(reason||'خسرت!')+' النقط: '+score+' - دوس لعبة جديدة!'; }
}
</script>
 
</body>
</html>
