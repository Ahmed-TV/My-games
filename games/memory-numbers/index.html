<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ذاكرة الأرقام | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout:none!important; -webkit-user-select:none!important; user-select:none!important; -moz-user-select:none!important; -ms-user-select:none!important; touch-action:manipulation; }
  html, body { height: 100%!important; height: 100svh!important; max-height:100svh!important; overflow: hidden!important; }
  body { font-family: Tahoma, Arial, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top, 4px) 8px env(safe-area-inset-bottom, 4px) 8px; overflow:hidden!important; }
  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0;}
  .top-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 3px; }
  .logo-img{width:50px;height:50px;border-radius:50%;border:3px solid #facc15;object-fit:cover;background:#000;flex-shrink:0;box-shadow:0 0 20px rgba(59,130,246,0.5)}
  h1 { font-size: 20px; line-height: 1.2; color: #facc15;}
  h1 small { display: block; font-size: 11px; color: #fff; letter-spacing: 1px; margin-top: 2px; }
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold;}
  .names b { color: #facc15; font-size: 14px;}
  .stats { display: flex; gap: 10px; justify-content: center; margin: 4px 0 6px; flex-wrap: wrap; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 4px 15px; min-width: 80px; text-align: center; }
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }
  #game-container { width: 100%; max-width: 500px; flex:1; min-height: 0; position: relative; display: flex; flex-direction: column; background: #1e293b; border: 4px solid #f59e0b; border-radius: 16px; overflow: hidden; justify-content: center; align-items: center; padding: 15px; }
  .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: rgba(255, 255, 255, 0.05); font-size: 40px; font-weight: 900; pointer-events: none; z-index: 0; white-space: nowrap; }
  #numberDisplay { font-size: 72px; font-weight: 900; color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.5); z-index: 2; text-align: center; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 340px; z-index: 2; }
  .num-btn { background: #334155; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: bold; color: #fff; height: 62px; cursor: pointer; transition: background 0.2s, transform 0.1s; }
  .num-btn:active { transform: scale(0.95); }
  .num-btn.correct { background: #22c55e; }
  .num-btn.wrong { background: #ef4444; }
  #overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 15px; gap: 10px; z-index: 10; border-radius: 12px; pointer-events:auto; }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start { background: #f59e0b; color: #000; border: none; padding: 12px 30px; border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer; width: 80%; max-width: 200px; pointer-events:auto!important; position:relative; z-index:20; }
  .btn-start:active { transform: scale(0.95); }
  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 4px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body oncontextmenu="return false">
  <div class="header"><div class="top-row"><img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img"><h1>ذاكرة الأرقام<small>AHMED TV MEMORY</small></h1></div><div class="names">أحمد عبد العزيز • <b>Ahmed Abdelaziz</b></div><div class="stats"><div class="stat"><b id="level">1</b><span>المستوى</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div></div></div>
  <div id="game-container"><div class="watermark">Ahmed TV</div><div id="numberDisplay" style="display:none;">123</div><div id="grid" style="display:none;"></div><div id="overlay"><h2>لعبة ذاكرة الأرقام</h2><p><b>Ahmed TV</b> - اختبر ذاكرتك!<br>سيظهر لك رقم .. احفظه .. وبعد ذلك اضغط عليه</p><button class="btn-start" id="startBtn">ابدأ اللعب</button></div></div>
  <div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">كل ألعابي</a></div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
var soundOn=true,_audioCache={},_ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
</script>
<script>
const numberDisplay = document.getElementById('numberDisplay');
const gridEl = document.getElementById('grid');
const levelEl = document.getElementById('level');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
let running = false;
let level = 1;
let best = parseInt(localStorage.getItem('memoryNumBest') || '0');
bestEl.textContent = best;
let currentNumber = "";
let userInput = "";
blockGoogle(startBtn); blockGoogle(gridEl); blockGoogle(numberDisplay);
function playSound(type){ if(type==='correct') playAhmedVoice('sah'); else if(type==='wrong') playAhmedVoice('ghalat'); }
function generateNumber(length) { let num = ""; for (let i = 0; i < length; i++) { num += Math.floor(Math.random() * 10); } return num; }
function startLevel() {
  userInput = "";
  currentNumber = generateNumber(level);
  gridEl.style.display = 'none';
  numberDisplay.style.display = 'block';
  numberDisplay.textContent = currentNumber;
  let displayTime = 1000 + (level * 500);
  setTimeout(() => { numberDisplay.style.display = 'none'; buildGrid(); }, displayTime);
}
function buildGrid() {
  gridEl.innerHTML = '';
  gridEl.style.display = 'grid';
  for (let i = 0; i < 10; i++) {
    let btn = document.createElement('div');
    btn.className = 'num-btn';
    btn.textContent = i;
    btn.dataset.val = i;
    blockGoogle(btn);
    btn.addEventListener('pointerdown', function(e){ e.preventDefault(); handleNumberClick(i, btn); }, {passive:false});
    gridEl.appendChild(btn);
  }
  // زرار مسح آخر رقم - مضاف بعد 0-9، مش بدال 9
  let clearBtn = document.createElement('div');
  clearBtn.className = 'num-btn';
  clearBtn.style.background = '#ef4444';
  clearBtn.style.fontSize = '22px';
  clearBtn.textContent = '⌫';
  blockGoogle(clearBtn);
  clearBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); userInput = userInput.slice(0, -1); }, {passive:false});
  gridEl.appendChild(clearBtn);
  // زرار مسح الكل - عشان اللوحة تبقى 12 زرار (4 × 3) ومفيش مكان فاضي
  let clearAllBtn = document.createElement('div');
  clearAllBtn.className = 'num-btn';
  clearAllBtn.style.background = '#b45309';
  clearAllBtn.style.fontSize = '22px';
  clearAllBtn.textContent = 'مسح';
  blockGoogle(clearAllBtn);
  clearAllBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); userInput = ''; }, {passive:false});
  gridEl.appendChild(clearAllBtn);
}
function handleNumberClick(num, btn) {
  if (!running) return;
  playSound('correct');
  userInput += num;
  btn.classList.add('correct');
  setTimeout(() => btn.classList.remove('correct'), 200);
  if (userInput === currentNumber) {
    setTimeout(() => { level++; levelEl.textContent = level; if (level > best) { best = level; localStorage.setItem('memoryNumBest', best); bestEl.textContent = best; } startLevel(); }, 500);
  } else if (!currentNumber.startsWith(userInput)) {
    playSound('wrong');
    btn.classList.add('wrong');
    setTimeout(() => { endGame(); }, 500);
  }
}
function endGame() {
  running = false;
  playAhmedVoice('khesert');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div style="font-size:35px">🧠</div><h2>انتهت المحاولة!</h2><p>وصلت للمستوى <b style="color:#facc15;font-size:22px">${level}</b><br>أعلى مستوى: ${best}<br>أحمد TV يقول لك: ذاكرتك ممتازة!</p><button class="btn-start" id="againBtn">العب مرة أخرى</button>`;
  var ab=document.getElementById('againBtn'); blockGoogle(ab);
  ab.addEventListener('click', onStartBtn); ab.addEventListener('pointerdown', onStartBtn, {passive:false}); ab.addEventListener('touchstart', onStartBtn, {passive:false});
}
var _starting=false;
function onStartBtn(e){ if(e){ try{ e.preventDefault(); }catch(err){} } if(_starting) return; _starting=true; startGame(); setTimeout(function(){ _starting=false; }, 800); }
function startGame() {
  overlay.style.display = 'none';
  running = true;
  level = 1;
  levelEl.textContent = level;
  try{ playAhmedVoice('ebda'); }catch(e){}
  startLevel();
}
startBtn.addEventListener('click', onStartBtn); startBtn.addEventListener('pointerdown', onStartBtn, {passive:false}); startBtn.addEventListener('touchstart', onStartBtn, {passive:false});
</script>
</body>
</html>
