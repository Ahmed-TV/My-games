];
function renderQuestion() {
  isLocked = false;
  const q = QUESTIONS[currentRound];
  roundEl.textContent = currentRound + 1;
  questionEl.textContent = q.q;
  feedbackEl.textContent = '';
  optionsEl.innerHTML = '';
  q.o.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = option;
    btn.onclick = () => checkAnswer(index, btn);
    optionsEl.appendChild(btn);
  });
}
function checkAnswer(selected, btn) {
  if (isLocked) return; isLocked = true;
  const q = QUESTIONS[currentRound];
  const allBtns = optionsEl.querySelectorAll('.opt-btn');
  if (selected === q.a) { btn.classList.add('correct'); score += 10; scoreEl.textContent = score; feedbackEl.textContent = "✅ إجابة صحيحة!"; feedbackEl.style.color = "#22c55e"; }
  else { btn.classList.add('wrong'); allBtns[q.a].classList.add('correct'); feedbackEl.textContent = "❌ الإجابة الصحيحة: " + q.o[q.a]; feedbackEl.style.color = "#ef4444"; }
  setTimeout(() => { currentRound++; if (currentRound < QUESTIONS.length) { renderQuestion(); } else { endGame(); } }, 1500);
}
function endGame() {
  if (score > best) { best = score; localStorage.setItem('pharaohsBest', best); bestEl.textContent = best; }
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div style="font-size:35px">🏺</div><h2>خلصت أسئلة الفراعنة!</h2><p>جمعت <b style="color:#facc15;font-size:22px">${score} نقطة</b><br>أعلى نتيجة: ${best}<br>أحمد TV بيقولك: انت فرعون أصلي!</p><button class="btn-start" id="againBtn">🔄 العب تاني</button>`;
  document.getElementById('againBtn').onclick = startGame;
}
function startGame() { overlay.style.display = 'none'; score = 0; currentRound = 0; scoreEl.textContent = 0; renderQuestion(); }
startBtn.onclick = startGame;
</script>
