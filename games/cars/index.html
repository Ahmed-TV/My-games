<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#111,#FF6D00);height:100vh;height:100dvh;display:flex;justify-content:center;padding:4px 8px;overflow:hidden}
.game{width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;background:#fff;border:3px solid #FF6D00;border-radius:20px;padding:8px;overflow:hidden;position:relative}
header{padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.logo-img{width:72px;height:72px;border-radius:50%;border:3px solid #FF6D00;object-fit:cover;background:#fff;margin-bottom:4px}
.brand{font-size:22px;font-weight:900;color:#E65100}
.names{font-size:13px;font-weight:700;color:#FF6D00}
.type-row{display:flex;gap:5px;width:100%;margin:6px 0;flex-shrink:0}
.type-btn{flex:1;padding:8px 2px;border-radius:10px;border:2px solid #FF6D00;background:#fff;color:#E65100;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit}
.type-btn.active{background:#FF6D00;color:#fff}
.progress-wrap{width:100%;height:8px;background:#FFE0B2;border-radius:10px;margin:2px 0;overflow:hidden;flex-shrink:0}
.progress{height:100%;background:linear-gradient(90deg,#FF6D00,#FFA726);width:0%;transition:width .3s}
.prog-text{text-align:center;font-size:12px;font-weight:800;color:#E65100;margin-bottom:4px;flex-shrink:0}
.qbox{background:linear-gradient(180deg,#FFF3E0,#fff);border:2px solid #FFCC80;border-radius:14px;padding:8px;text-align:center;flex-shrink:0;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.qicon{font-size:52px}
.qtext{font-size:19px;font-weight:800;color:#E65100;margin-top:6px;line-height:1.4}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex-shrink:0;height:102px}
.answer{font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FF6D00,#FFA726);border:0;border-radius:12px;padding:10px 5px;min-height:44px;cursor:pointer;overflow:hidden}
.answer.correct{background:#2E7D32}
.answer.wrong{background:#333}
.answer:disabled{opacity:.9}
.feedback{height:20px;font-size:12px;font-weight:700;color:#E65100;text-align:center;margin:4px 0;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-row{display:flex;gap:7px;flex-shrink:0;position:absolute;bottom:0;left:0;right:0;background:#fff;padding:6px 8px;border-top:2px solid #FFCC80}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:20px;padding:11px 10px;background:#FF6D00;color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #FF6D00;border-radius:20px;padding:11px 6px;background:#fff;color:#E65100;cursor:pointer;font-size:13px}
footer{text-align:center;color:#FF6D00;font-size:11px;margin-top:4px;flex-shrink:0}
footer a{color:#FF6D00;text-decoration:none;font-weight:700}
</style></head>

:"كوريا الجنوبية",model:"G80",logo:"جناحين"},{n:"جيلي",country:"الصين",model:"كولراي",logo:"حرف أزرق"},{n:"بي واي دي",country:"الصين",model:"دولفين",logo:"حروف BYD"},{n:"شيري",country:"الصين",model:"تيجو",logo:"حرف ماسي"},{n:"إم جي",country:"الصين",model:"ZS",logo:"حروف MG"},{n:"سيات",country:"إسبانيا",model:"ليون",logo:"حرف S"},{n:"سكودا",country:"التشيك",model:"أوكتافيا",logo:"سهم طائر"},{n:"ميني",country:"بريطانيا",model:"كوبر",logo:"جناحين MINI"},{n:"سمارت",country:"ألمانيا",model:"فورتو",logo:"حرف C"},{n:"أستون مارتن",country:"بريطانيا",model:"DB11",logo:"جناحين"},{n:"مازيراتي",country:"إيطاليا",model:"جيبلي",logo:"شوكة ثلاثية"},{n:"ألفا روميو",country:"إيطاليا",model:"جوليا",logo:"ثعبان وصليب"},{n:"دودج",country:"أمريكا",model:"تشارجر",logo:"خطين"},{n:"كرايسلر",country:"أمريكا",model:"300",logo:"جناحين"},{n:"رام",country:"أمريكا",model:"1500",logo:"رأس كبش"},{n:"كاديلاك",country:"أمريكا",model:"إسكاليد",logo:"تاج ودرع"},{n:"جي إم سي",country:"أمريكا",model:"سييرا",logo:"حروف GMC"},{n:"هummer",country:"أمريكا",model:"H2",logo:"حروف HUMMER"}];
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
let soundOn=true, audioCtx=null;
function getCtx(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
document.addEventListener('pointerdown',()=>{ getCtx(); },{once:false});
document.addEventListener('touchstart',()=>{ getCtx(); },{once:false});
function tone(f,dur,vol,type,delay,slideTo){ if(!soundOn) return; const ctx=getCtx(); if(!ctx) return; try{ const t0=ctx.currentTime+(delay||0); const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t0); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur); g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol,t0+0.02); g.gain.exponentialRampToValueAtTime(0.001,t0+dur); o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+dur+0.08); }catch(e){} }
function noise(dur,vol,delay){ if(!soundOn) return; const ctx=getCtx(); if(!ctx) return; try{ const t0=ctx.currentTime+(delay||0); const len=ctx.sampleRate*dur; const buf=ctx.createBuffer(1,len,ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; const src=ctx.createBufferSource(); src.buffer=buf; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; const g=ctx.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur); src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t0); }catch(e){} }
function playCorrect(){ tone(880,0.15,0.28,'square',0); tone(880,0.15,0.28,'square',0.18); tone(200,0.35,0.20,'sawtooth',0.35,700); tone(523,0.15,0.25,'triangle',0.7); tone(659,0.15,0.25,'triangle',0.85); tone(784,0.4,0.28,'triangle',1.0); }
function playWrong(){ noise(0.45,0.22,0); tone(500,0.45,0.22,'sawtooth',0,120); tone(180,0.5,0.25,'sawtooth',0.45,70); tone(70,0.4,0.28,'sine',0.5); }
function playSkip(){ tone(250,0.35,0.20,'sine',0,1000); }
let curType='الكل', qs=[], idx=0, score=0, correct=0, locked=false;
function build(){ qs=[]; DATA.forEach(c=>{ let types = curType==='الكل' ? ['بلد','موديل','شعار','عكس'] : [curType]; types.forEach(t=>{ let q='', corr='', pool=[], icon=''; if(t==='بلد'){ q='عربية '+c.n+' من بلد إيه؟'; corr=c.country; pool=DATA.map(x=>x.country); icon='🌍'; } if(t==='موديل'){ q='أشهر موديل لـ '+c.n+' إيه؟'; corr=c.model; pool=DATA.map(x=>x.model); icon='⭐'; } if(t==='شعار'){ q='شعار '+c.n+' إيه؟'; corr=c.logo; pool=DATA.map(x=>x.logo); icon='🔰'; } if(t==='عكس'){ q='عربية '+c.model+' تبع ماركة إيه؟'; corr=c.n; pool=DATA.map(x=>x.n); icon='🚗'; } let others = shuffle([...new Set(pool.filter(x=>x!==corr))]).slice(0,3); qs.push({q:q, correct:corr, opts:shuffle([...new Set([corr,...others])]), icon:icon}); }); }); qs=shuffle(qs); }
function loadQ(){ if(idx>=qs.length){ document.getElementById('qText').textContent='خلصت الـ '+qs.length+' سؤال! 🏆'; document.getElementById('feedback').textContent='نتيجتك: '+score+' • صح: '+correct; document.getElementById('answers').innerHTML=''; return; } locked=false; let it=qs[idx]; document.getElementById('qicon').textContent=it.icon; document.getElementById('qText').textContent=it.q; document.getElementById('prog').style.width=((idx+1)/qs.length*100)+'%'; document.getElementById('progText').textContent='السؤال '+(idx+1)+' / '+qs.length; document.getElementById('feedback').textContent='🚗 السؤال '+(idx+1)+' من '+qs.length; let ans=document.getElementById('answers'); ans.innerHTML=''; it.opts.forEach(o=>{ let b=document.createElement('button'); b.className='answer'; b.textContent=o; b.onclick=()=>choose(o===it.correct,b,it); ans.appendChild(b); }); document.getElementById('nextBtn').disabled=true; }
function choose(ok,btn,it){ if(locked) return; locked=true; [...document.getElementById('answers').children].forEach(b=>{ b.disabled=true; if(b.textContent===it.correct) b.classList.add('correct'); else if(b===btn) b.classList.add('wrong'); }); if(ok){ playCorrect(); score+=10; correct++; document.getElementById('feedback').textContent='✅ صح! +10 🚗'; } else { playWrong(); document.getElementById('feedback').textContent='❌ غلط - الصح: '+it.correct; } document.getElementById('nextBtn').disabled=false; }
function skipQ(){ playSkip(); if(idx>=qs.length){ build(); idx=0; loadQ(); return; } document.getElementById('feedback').textContent='⏭️ تخطيت - الصح: '+qs[idx].correct; idx++; setTimeout(loadQ,600); }
function setType(t,btn){ document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); curType=t; idx=0; score=0; correct=0; build(); loadQ(); }
document.getElementById('nextBtn').onclick=()=>{ if(!locked && idx<qs.length) return; idx++; loadQ(); };
document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊 الصوت: شغال':'🔇 الصوت: مطفي'; if(soundOn) getCtx(); };
build(); loadQ();

<script>
var wa = document.getElementById('waBtn');
var dragging = false, startX=0, startY=0, startLeft=0, startTop=0, moved=false;
function startDrag(x,y){ dragging=true; moved=false; startX=x; startY=y; startLeft=wa.offsetLeft; startTop=wa.offsetTop; }
function moveDrag(x,y){ if(!dragging) return; var dx=x-startX, dy=y-startY; if(Math.abs(dx)>5||Math.abs(dy)>5){ moved=true; } if(moved){ wa.style.left=(startLeft+dx)+'px'; wa.style.top=(startTop+dy)+'px'; wa.style.right='auto'; wa.style.bottom='auto'; } }
function endDrag(){ if(moved){ setTimeout(function(){moved=false},50); } dragging=false; }
wa.addEventListener('mousedown',function(e){ startDrag(e.clientX,e.clientY); });
document.addEventListener('mousemove',function(e){ moveDrag(e.clientX,e.clientY); });
document.addEventListener('mouseup',function(){ endDrag(); });
wa.addEventListener('touchstart',function(e){ startDrag(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
document.addEventListener('touchmove',function(e){ if(dragging){ moveDrag(e.touches[0].clientX,e.touches[0].clientY); } },{passive:true});
document.addEventListener('touchend',function(){ endDrag(); });
wa.addEventListener('click',function(e){ if(moved){ e.preventDefault(); } });
</script>
