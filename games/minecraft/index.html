<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ahmed TV - لعبة البناء والتكسير</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#87CEEB,#6BCB77);height:100vh;height:100dvh;display:flex;justify-content:center;padding:4px 8px;overflow:hidden}
.game{width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF9C4,#FFECB3,#E1BEE7,#BBDEFB);border:4px solid #7B1FA2;border-radius:50px 50px 20px 20px;padding:8px;overflow:hidden;position:relative;box-shadow:0 0 0 6px #fff, 0 0 0 9px #7B1FA2, 0 10px 30px rgba(0,0,0,.25)}
header{padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.logo-img{width:72px;height:72px;border-radius:50%;border:3px solid #D32F2F;object-fit:cover;background:#fff;margin-bottom:4px}
.brand{font-size:22px;font-weight:900;color:#B71C1C}
.names{font-size:13px;font-weight:700;color:#D32F2F}
.stats{display:flex;gap:6px;width:100%;margin:6px 0}
.stat{flex:1;background:#fff;border:2px solid #D32F2F;border-radius:12px;padding:6px 2px;text-align:center}
.stat b{display:block;font-size:16px;color:#B71C1C}
.stat span{font-size:11px;font-weight:800;color:#666}
.modes{display:flex;gap:6px;width:100%;margin-bottom:6px}
.mode{flex:1;padding:9px 2px;border-radius:12px;border:2px solid #D32F2F;background:#fff;color:#B71C1C;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit}
.mode.active{background:#D32F2F;color:#fff}
.board{background:#87CEEB;border:2px solid #5D4037;border-radius:14px;padding:4px;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;flex-shrink:0}
.cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:rgba(255,255,255,.4);border:1px solid rgba(0,0,0,.08)}
.inv{display:flex;gap:4px;width:100%;margin-top:6px}
.inv-item{flex:1;background:#fff;border:2px solid #ccc;border-radius:10px;padding:4px 1px;text-align:center;cursor:pointer}
.inv-item.sel{border-color:#D32F2F;background:#FFEBEE}
.inv-item div{font-size:22px}
.inv-item span{font-size:10px;font-weight:800;color:#333}
.feedback{height:20px;font-size:13px;font-weight:800;color:#B71C1C;text-align:center;margin:6px 0}
.btn-row{display:flex;gap:7px;flex-shrink:0;position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);padding:6px 8px;border-top:2px dashed #7B1FA2}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:20px;padding:11px 10px;background:#D32F2F;color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:11px 6px;background:#fff;color:#B71C1C;cursor:pointer;font-size:13px}
footer{text-align:center;color:#D32F2F;font-size:11px;margin-top:4px}
footer a{color:#D32F2F;text-decoration:none;font-weight:700}
</style></head>
<body><div class="game">
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">🧱 لعبة البناء والتكسير 🧱</div><div class="names">أحمد عبدالعزيز • Ahmed TV</div><button id="soundBtn" style="margin:5px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:6px 18px;background:#fff;color:#B71C1C;cursor:pointer;font-size:12px">🔊 الصوت: شغال</button></header>
<div style="flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:62px;position:relative">
<div class="stats"><div class="stat"><b id="score">0</b><span>النقط</span></div><div class="stat"><b id="broken">0</b><span>كسرت</span></div><div class="stat"><b id="built">0</b><span>بنيت</span></div></div>
<div class="modes"><button class="mode active" id="modeBreak" onclick="setMode('break')">⛏️ تكسير</button><button class="mode" id="modeBuild" onclick="setMode('build')">🧱 بناء</button></div>
<div class="board" id="board"></div>
<div class="inv" id="inv"></div>
<div class="feedback" id="feedback">⛏️ دوس على أي بلوك عشان تكسره!</div>
<div class="btn-row"><button class="skipbtn" onclick="newWorld()">🌍 عالم جديد</button><button class="mainbtn" onclick="newWorld()">لعبة جديدة 🔄</button></div>
</div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
const BLOCKS={grass:"🟩",dirt:"🟫",stone:"⬜",wood:"🟧",leaf:"🌳",sand:"🟨",brick:"🧱",glass:"🩵"};
const NAMES={grass:"عشب",dirt:"تراب",stone:"حجر",wood:"خشب",leaf:"ورق شجر",sand:"رمل",brick:"طوب",glass:"إزاز"};
let grid=[], mode='break', selected='brick', score=0, broken=0, built=0, inv={grass:5,dirt:5,stone:5,wood:5,leaf:3,sand:5,brick:10,glass:5};
let soundOn=true, audioCtx=null;
function getCtx(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
document.addEventListener('pointerdown',()=>getCtx());
function tone(f,d=0.12,v=0.2,t='triangle',delay=0){ if(!soundOn) return; const ctx=getCtx(); if(!ctx) return; try{ const t0=ctx.currentTime+delay; const o=ctx.createOscillator(), g=ctx.createGain(); o.type=t; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+0.02); g.gain.exponentialRampToValueAtTime(0.001,t0+d); o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+d+0.05);}catch(e){} }
function playBreak(){ tone(180,.15,.25,'square',0); tone(120,.2,.2,'square',.1); }
function playBuild(){ tone(400,.1,.2,'triangle',0); tone(600,.15,.2,'triangle',.08); }
function newWorld(){ score=0; broken=0; built=0; inv={grass:5,dirt:5,stone:5,wood:5,leaf:3,sand:5,brick:10,glass:5}; grid=[]; for(let r=0;r<8;r++){ grid[r]=[]; for(let c=0;c<10;c++){ let b=null; if(r===0) b=null; else if(r===1) b=null; else if(r===2){ b='leaf'; if(c===2||c===7) b=null; } else if(r===3){ if(c===2||c===7) b='wood'; else b='grass'; } else if(r===4) b='dirt'; else if(r===5) b='dirt'; else if(r===6) b='stone'; else b='stone'; if(r>=4&&Math.random()<0.12) b='sand'; if(r===3&&c>7) b='sand'; grid[r][c]=b; } }
 grid[2][4]='leaf'; grid[2][5]='leaf'; grid[3][4]='wood'; grid[3][5]='wood'; grid[1][4]=null; grid[1][5]=null;
 updateStats(); render(); document.getElementById('feedback').textContent='⛏️ دوس على أي بلوك عشان تكسره!'; }
function updateStats(){ document.getElementById('score').textContent=score; document.getElementById('broken').textContent=broken; document.getElementById('built').textContent=built; }
function render(){ const b=document.getElementById('board'); b.innerHTML=''; for(let r=0;r<8;r++) for(let c=0;c<10;c++){ let d=document.createElement('div'); d.className='cell'; d.textContent=grid[r][c]?BLOCKS[grid[r][c]]:''; d.onclick=()=>clickCell(r,c); b.appendChild(d); } const invEl=document.getElementById('inv'); invEl.innerHTML=''; Object.keys(BLOCKS).forEach(k=>{ let it=document.createElement('div'); it.className='inv-item'+(selected===k?' sel':''); it.innerHTML='<div>'+BLOCKS[k]+'</div><span>'+NAMES[k]+' ('+inv[k]+')</span>'; it.onclick=()=>{ selected=k; setMode('build'); render(); }; invEl.appendChild(it); }); }
function clickCell(r,c){ getCtx(); if(mode==='break'){ if(!grid[r][c]){ document.getElementById('feedback').textContent='❌ دي فاضية - اختار بلوك فيه حاجة'; return; } let t=grid[r][c]; inv[t]=(inv[t]||0)+1; grid[r][c]=null; broken++; score+=10; playBreak(); document.getElementById('feedback').textContent='✅ كسرت '+NAMES[t]+' +10 ⛏️'; } else { if(grid[r][c]){ document.getElementById('feedback').textContent='❌ دي مش فاضية - كسرها الأول'; return; } if(!inv[selected]||inv[selected]<=0){ document.getElementById('feedback').textContent='❌ خلص '+NAMES[selected]+' - كسر شوية عشان تجمع'; return; } inv[selected]--; grid[r][c]=selected; built++; score+=10; playBuild(); document.getElementById('feedback').textContent='🧱 بنيت '+NAMES[selected]+' +10'; } updateStats(); render(); }
function setMode(m){ mode=m; document.getElementById('modeBreak').classList.toggle('active',m==='break'); document.getElementById('modeBuild').classList.toggle('active',m==='build'); document.getElementById('feedback').textContent=m==='break'?'⛏️ دوس على أي بلوك عشان تكسره!':'🧱 اختار بلوك من تحت ودوس على مكان فاضي عشان تبني!'; }
document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊 الصوت: شغال':'🔇 الصوت: مطفي'; if(soundOn) getCtx(); };
newWorld();
</script></body></html>
