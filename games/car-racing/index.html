<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>سباق السيارات 3D | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
    position: fixed; 
    width: 100%;
  }
  
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 5px) 5px env(safe-area-inset-bottom, 5px) 5px;
  }

  .header { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; flex-shrink: 0; padding-bottom: 3px;}
  .logo-img { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #facc15; object-fit: cover; box-shadow: 0 0 10px rgba(250,204,21,0.5);}
  .header-text { text-align: center; }
  .header-text h1 { font-size: 16px; color: #facc15; margin: 0;}
  .header-text .names { font-size: 11px; color: #cbd5e1; font-weight: bold; margin-top: 2px;}
  .header-text .names b { color: #facc15; font-size: 13px;}

  .stats { display: flex; gap: 8px; justify-content: center; margin-bottom: 3px;}
  .stat { background: #1e293b; border-radius: 6px; padding: 1px 8px; min-width: 50px; text-align: center; border: 1px solid #334155;}
  .stat b { display: block; font-size: 12px; color: #facc15; }
  .stat span { font-size: 8px; color: #94a3b8; }

  #game-container {
    width: 100%; max-width: 600px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 3px solid #f59e0b; border-radius: 12px;
    overflow: hidden;
    padding: 5px;
  }

  .watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255, 255, 255, 0.1); font-size: 40px; font-weight: 900;
    pointer-events: none; z-index: 0; white-space: nowrap;
    letter-spacing: 2px;
  }

  #canvas-container { 
    width: 100%; 
    flex-grow: 1; 
    display: block; 
    z-index: 1; 
    min-height: 0;
    border-radius: 8px;
    overflow: hidden;
  }

  .controls {
    display: flex; gap: 10px; justify-content: center; padding: 8px 0 0 0;
    z-index: 3; flex-shrink: 0;
  }
  .ctrl-btn {
    background: #f59e0b; color: #fff; border: 2px solid #b45309; border-radius: 12px;
    font-size: 35px; width: 100px; height: 60px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; user-select: none;
    box-shadow: 0 4px 0 #b45309;
  }
  .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b45309; background: #d97706; }

  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }

  .footer { font-size: 8px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <div class="header-text">
        <h1>سباق السيارات 3D</h1>
        <div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>النقاط</span></div>
    <div class="stat"><b id="best">0</b><span>الأفضل</span></div>
    <div class="stat"><b id="speed">1x</b><span>السرعة</span></div>
  </div>

  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    <div id="canvas-container"></div>
    
    <div class="controls">
      <button class="ctrl-btn" id="leftBtn">⬅️</button>
      <button class="ctrl-btn" id="rightBtn">➡️</button>
    </div>

    <div id="overlay">
      <h2>سباق السيارات 3D</h2>
      <p>
        <b>Ahmed TV</b> - تفادى العربيات!<br>
        استخدم الأزرار عشان تتحرك
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ السباق</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<!-- استدعاء مكتبة Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const speedEl = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const container = document.getElementById('canvas-container');

let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('car3dBest') || '0');
bestEl.textContent = best;
let audioCtx = null;

// --- إعداد Three.js ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x38bdf8);
scene.fog = new THREE.Fog(0x38bdf8, 20, 80);

const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
camera.position.set(0, 5, 10);
camera.lookAt(0, 0, -20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

// إضاءة
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// --- الطريق ---
const roadWidth = 10;
const roadLength = 100;
const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
const roadMat = new THREE.MeshPhongMaterial({ color: 0x334155 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.z = -roadLength / 2 + 10;
scene.add(road);

// خطوط الطريق (بتتحرك)
const lineGeo = new THREE.PlaneGeometry(0.3, 3);
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
let lines = [];
for (let i = 0; i < 20; i++) {
  let line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.01, 10 - i * 5);
  scene.add(line);
  lines.push(line);
}

// --- اللاعب (سيارة) ---
const playerGeo = new THREE.BoxGeometry(1.5, 0.8, 2.5);
const playerMat = new THREE.MeshPhongMaterial({ color: 0xf59e0b });
const player = new THREE.Mesh(playerGeo, playerMat);
player.position.set(0, 0.4, 5);
scene.add(player);

// --- الأعداء (سيارات تانية) ---
let enemies = [];
const enemyGeo = new THREE.BoxGeometry(1.5, 0.8, 2.5);
const enemyColors = [0xef4444, 0x3b82f6, 0x8b5cf6, 0xec4899];

function spawnEnemy() {
  const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
  const xPos = lane * 3.5;
  
  const enemyMat = new THREE.MeshPhongMaterial({ color: enemyColors[Math.floor(Math.random() * enemyColors.length)] });
  const enemy = new THREE.Mesh(enemyGeo, enemyMat);
  enemy.position.set(xPos, 0.4, -80);
  scene.add(enemy);
  enemies.push(enemy);
}

// إضاءة السيارة
const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(0, 2, 5);
scene.add(pointLight);

// متغيرات الحركة
let targetX = 0;
let currentSpeed = 1;
let roadOffset = 0;
let spawnTimer = 0;

// --- الأصوات ---
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'score') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

// --- التحكم ---
leftBtn.addEventListener('mousedown', () => { if(running) targetX = -3.5; });
leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(running) targetX = -3.5; });
leftBtn.addEventListener('mouseup', () => { if(running) targetX = 0; });
leftBtn.addEventListener('touchend', () => { if(running) targetX = 0; });

rightBtn.addEventListener('mousedown', () => { if(running) targetX = 3.5; });
rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(running) targetX = 3.5; });
rightBtn.addEventListener('mouseup', () => { if(running) targetX = 0; });
rightBtn.addEventListener('touchend', () => { if(running) targetX = 0; });

// كيبورد
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') targetX = -3.5;
  if (e.key === 'ArrowRight') targetX = 3.5;
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') targetX = 0;
});

// --- حلقة اللعبة ---
function animate() {
  if (!running) {
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
    return;
  }

  player.position.x += (targetX - player.position.x) * 0.15;
  
  roadOffset += currentSpeed * 0.5;
  lines.forEach((line, i) => {
    line.position.z += currentSpeed * 0.5;
    if (line.position.z > 10) {
      line.position.z = -80;
    }
  });

  spawnTimer++;
  if (spawnTimer > 60) {
    spawnEnemy();
    spawnTimer = 0;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    let enemy = enemies[i];
    enemy.position.z += currentSpeed;
    
    if (enemy.position.z > 10) {
      scene.remove(enemy);
      enemies.splice(i, 1);
      score++;
      scoreEl.textContent = score;
      playSound('score');
      
      if (score % 5 === 0) {
        currentSpeed += 0.3;
        speedEl.textContent = Math.floor(currentSpeed) + 'x';
      }
      continue;
    }

    if (
      Math.abs(player.position.x - enemy.position.x) < 1.5 &&
      Math.abs(player.position.z - enemy.position.z) < 2.5
    ) {
      endGame();
      return;
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// --- بدء اللعبة ---
function startGame() {
  initAudio();
  overlay.style.display = 'none';
  
  score = 0;
  scoreEl.textContent = 0;
  currentSpeed = 1;
  speedEl.textContent = '1x';
  targetX = 0;
  player.position.x = 0;
  
  enemies.forEach(e => scene.remove(e));
  enemies = [];
  
  running = true;
}

function endGame() {
  running = false;
  playSound('crash');
  
  if (score > best) {
    best = score;
    localStorage.setItem('car3dBest', best);
    bestEl.textContent = best;
  }

  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div style="font-size:35px">💥</div>
    <h2>خبطت!</h2>
    <p>جبت <b style="color:#facc15;font-size:22px">${score} نقطة</b><br>
    أعلى نتيجة: ${best}<br>
    أحمد TV بيقولك: حاول تاني!</p>
    <button class="btn-start" id="againBtn">🔄 العب تاني</button>
  `;
  document.getElementById('againBtn').onclick = startGame;
}

startBtn.onclick = startGame;

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();

document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
