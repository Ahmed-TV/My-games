<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لعبة الشطرنج | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
  }

  .header { width: 100%; max-width: 500px; text-align: center; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px;}
  
  /* اللوجو */
  .logo-img {
    width: 55px; height: 55px;
    border-radius: 50%;
    border: 3px solid #facc15;
    object-fit: cover;
    box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
    margin-bottom: 5px;
  }
  
  h1 { font-size: 20px; line-height: 1.2; color: #facc15;}
  .names { font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold;}
  .names b { color: #facc15; font-size: 15px;}

  #turn-indicator {
    font-size: 16px; font-weight: bold; color: #38bdf8; margin: 5px 0;
  }

  #game-container {
    width: 100%; max-width: 500px; flex-grow: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
    background: #1e293b; 
    border: 4px solid #f59e0b; border-radius: 16px;
    overflow: hidden;
    justify-content: center; align-items: center;
    padding: 10px;
  }

  /* رقعة الشطرنج */
  #board {
    width: 100%; max-width: 400px;
    aspect-ratio: 1/1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border: 4px solid #b45309;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .square {
    display: flex; justify-content: center; align-items: center;
    font-size: 40px; /* حجم القطع */
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
    position: relative;
  }

  /* ألوان الرقعة */
  .light { background: #f0d9b5; }
  .dark { background: #b58863; }

  /* القطع */
  .piece-white { color: #fff; text-shadow: 0 0 2px #000, 1px 1px 2px #000; }
  .piece-black { color: #000; text-shadow: 0 0 2px #fff; }

  /* التحديد */
  .square.selected { background: #facc15 !important; box-shadow: inset 0 0 10px #d97706; }
  .square.valid-move { box-shadow: inset 0 0 0 4px #22c55e; }

  .footer { font-size: 10px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 5px;}
  .footer a { color: #facc15; text-decoration: none; }

  /* شاشة النهاية */
  #overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 15px; gap: 10px; z-index: 10;
  }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start {
    background: #f59e0b; color: #000; border: none; padding: 12px 25px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
    width: 80%; max-width: 200px;
  }
  .btn-start:active { transform: scale(0.95); }
</style>
</head>
<body>

  <div class="header">
    <!-- اللوجو بتاعك -->
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    
    <h1>لعبة الشطرنج</h1>
    <div class="names">أحمد عبدالعزيز • <b>Ahmed Abdelaziz</b></div>
  </div>

  <div id="turn-indicator">دور الأبيض ♔</div>

  <div id="game-container">
    <div id="board"></div>
    
    <div id="overlay">
      <h2>لعبة الشطرنج</h2>
      <p>
        <b>Ahmed TV</b> - العب مع صاحبك!<br>
        دوس على القطعة، وبعدين على المربع
      </p>
      <button class="btn-start" id="startBtn">▶ ابدأ اللعب</button>
    </div>
  </div>

  <div class="footer">
    <b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a>
  </div>

<script>
const boardEl = document.getElementById('board');
const turnIndicator = document.getElementById('turn-indicator');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let board = [];
let selectedPiece = null;
let turn = 'white';
let running = false;
let audioCtx = null;

// رموز الشطرنج
const PIECES = {
  white: { king: '♔', queen: '♕', rook: '♖', bishop: '♗', knight: '♘', pawn: '♙' },
  black: { king: '♚', queen: '♛', rook: '♜', bishop: '♝', knight: '♞', pawn: '♟' }
};

// إعداد اللوحة الأولية
function initBoard() {
  board = [
    ['♜','♞','♝','♛','♚','♝','♞','♜'],
    ['♟','♟','♟','♟','♟','♟','♟','♟'],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['♙','♙','♙','♙','♙','♙','♙','♙'],
    ['♖','♘','♗','♕','♔','♗','♘','♖']
  ];
}

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'move') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'select') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  } else if (type === 'win') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  }
}

// رسم اللوحة
function drawBoard() {
  boardEl.innerHTML = '';
  const isWhite = (piece) => ['♔','♕','♖','♗','♘','♙'].includes(piece);
  
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      let square = document.createElement('div');
      square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
      square.dataset.row = row;
      square.dataset.col = col;
      
      let piece = board[row][col];
      if (piece) {
        square.textContent = piece;
        if (isWhite(piece)) {
          square.classList.add('piece-white');
        } else {
          square.classList.add('piece-black');
        }
      }
      
      if (selectedPiece && selectedPiece.row === row && selectedPiece.col === col) {
        square.classList.add('selected');
      }
      
      square.onclick = () => handleSquareClick(row, col);
      boardEl.appendChild(square);
    }
  }
}

function handleSquareClick(row, col) {
  if (!running) return;
  
  let piece = board[row][col];
  const isWhitePiece = ['♔','♕','♖','♗','♘','♙'].includes(piece);
  const isBlackPiece = ['♚','♛','♜','♝','♞','♟'].includes(piece);

  // لو مفيش قطعة مختارة، بنختار
  if (!selectedPiece) {
    if ((turn === 'white' && isWhitePiece) || (turn === 'black' && isBlackPiece)) {
      selectedPiece = { row, col, piece };
      playSound('select');
      drawBoard();
    }
  } else {
    // لو فيه قطعة مختارة، بنحاول نحرك
    if (row === selectedPiece.row && col === selectedPiece.col) {
      // إلغاء التحديد
      selectedPiece = null;
      drawBoard();
      return;
    }

    // التحقق من صحة الحركة (تبسيط: ممكن نحرك لأي مكان فاضي أو نقتل الخصم)
    let targetPiece = board[row][col];
    let isTargetEmpty = targetPiece === '';
    let isEnemy = (turn === 'white' && isBlackPiece) || (turn === 'black' && isWhitePiece);

    if (isTargetEmpty || isEnemy) {
      // ننقل القطعة
      board[row][col] = selectedPiece.piece;
      board[selectedPiece.row][selectedPiece.col] = '';
      
      playSound('move');
      
      // تغيير الدور
      turn = turn === 'white' ? 'black' : 'white';
      turnIndicator.textContent = turn === 'white' ? 'دور الأبيض ♔' : 'دور الأسود ♚';
      turnIndicator.style.color = turn === 'white' ? '#38bdf8' : '#ef4444';
      
      selectedPiece = null;
      drawBoard();
    } else {
      // اختيار قطعة تانية من نفس اللون
      if ((turn === 'white' && isWhitePiece) || (turn === 'black' && isBlackPiece)) {
        selectedPiece = { row, col, piece };
        playSound('select');
        drawBoard();
      }
    }
  }
}

function startGame() {
  initAudio();
  overlay.style.display = 'none';
  initBoard();
  turn = 'white';
  selectedPiece = null;
  running = true;
  turnIndicator.textContent = 'دور الأبيض ♔';
  turnIndicator.style.color = '#38bdf8';
  drawBoard();
}

startBtn.onclick = startGame;
document.body.addEventListener('touchstart', initAudio, { once: true });
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
