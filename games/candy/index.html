<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>Ahmed TV - لعبة الحلوى</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;touch-action:manipulation}
html,body{height:100%!important;height:100svh!important;max-height:100svh!important;overflow:hidden!important}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#FF6B6B,#FFD93D,#6BCB77,#4D96FF,#9B5DE5);display:flex;justify-content:center;padding:4px 8px;overflow:hidden!important}
.game{width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF9C4,#FFECB3,#E1BEE7,#BBDEFB);border:4px solid #7B1FA2;border-radius:50px 50px 20px 20px;padding:8px;overflow:hidden;position:relative;box-shadow:0 0 0 6px #fff, 0 0 0 9px #7B1FA2, 0 10px 30px rgba(0,0,0,.25)}
header{padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.logo-img{width:50px;height:50px;border-radius:50%;border:3px solid #D32F2F;object-fit:cover;background:#fff;margin-bottom:2px}
.brand{font-size:20px;font-weight:900;color:#B71C1C}
.names{font-size:12px;font-weight:700;color:#D32F2F}
.stats{display:flex;gap:6px;width:100%;margin:5px 0}
.stat{flex:1;background:#fff;border:2px solid #D32F2F;border-radius:12px;padding:4px 2px;text-align:center}
.stat b{display:block;font-size:16px;color:#B71C1C}
.stat span{font-size:11px;font-weight:800;color:#666}
.board{background:#fff;border:2px solid #EF9A9A;border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;flex:1;min-height:0}
.cell{aspect-ratio:1;border-radius:10px;background:#FFF3E0;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;min-height:0}
.cell.sel{border-color:#D32F2F;background:#FFEBEE;transform:scale(1.1)}
.cell.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.feedback{height:20px;font-size:13px;font-weight:800;color:#B71C1C;text-align:center;margin:5px 0;flex-shrink:0}
.btn-row{display:flex;gap:7px;flex-shrink:0;background:rgba(255,255,255,.95);padding:6px 8px;border-top:2px dashed #7B1FA2}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:20px;padding:11px 10px;background:#D32F2F;color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:11px 6px;background:#fff;color:#B71C1C;cursor:pointer;font-size:13px}
footer{text-align:center;color:#D32F2F;font-size:11px;margin-top:4px;flex-shrink:0}
footer a{color:#D32F2F;text-decoration:none;font-weight:700}
</style></head>
<body oncontextmenu="return false"><div class="game">
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">🍬 لعبة الحلوى 🍬</div><div class="names">أحمد عبد العزيز • Ahmed TV</div><button id="soundBtn" style="margin:4px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:6px 18px;background:#fff;color:#B71C1C;cursor:pointer;font-size:12px">الصوت: يعمل</button></header>
<div style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative">
<div class="stats"><div class="stat"><b id="score">0</b><span>النقاط</span></div><div class="stat"><b id="moves">30</b><span>حركة</span></div><div class="stat"><b id="best">0</b><span>أفضل نتيجة</span></div></div>
<div class="board" id="board"></div>
<div class="feedback" id="feedback">🍬 اضغط على حلوى وبعد ذلك التي بجانبها لكي تبدلهما!</div>
</div>
<div class="btn-row"><button class="skipbtn" id="shuffleBtn">خلط</button><button class="mainbtn" id="newBtn">لعبة جديدة</button></div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
function blockGoogle(el){ if(!el) return; el.oncontextmenu=function(){return false;}; el.onselectstart=function(){return false;}; el.ondragstart=function(){return false;}; el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true); }
var _audioCache={},_ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
</script>
<script>
const CANDIES=["🍬","🍭","🍫","🍩","🍒","🍓","🍇","🍊"];
let board=[], score=0, moves=30, sel=null, locked=false, soundOn=true, best=+(localStorage.getItem('candyBest')||0);
document.getElementById('best').textContent=best;
const soundBtn=document.getElementById('soundBtn'); const shuffleBtn=document.getElementById('shuffleBtn'); const newBtn=document.getElementById('newBtn');
blockGoogle(soundBtn); blockGoogle(shuffleBtn); blockGoogle(newBtn);
function playOk(){ if(!soundOn) return; playAhmedVoice('sah'); }
function playBad(){ if(!soundOn) return; playAhmedVoice('ghalat'); }
function newGame(){ score=0; moves=30; sel=null; locked=false; document.getElementById('score').textContent=0; document.getElementById('moves').textContent=30; document.getElementById('feedback').textContent='🍬 هيا! وصل 3 مثل بعض'; playAhmedVoice('ebda'); buildBoard(); render(); }
function buildBoard(){ board=[]; for(let r=0;r<8;r++){ board[r]=[]; for(let c=0;c<8;c++){ let v; do{ v=CANDIES[Math.floor(Math.random()*6)]; }while((c>=2&&board[r][c-1]===v&&board[r][c-2]===v)||(r>=2&&board[r-1][c]===v&&board[r-2][c]===v)); board[r][c]=v; } } }
function render(){ const b=document.getElementById('board'); b.innerHTML=''; for(let r=0;r<8;r++) for(let c=0;c<8;c++){ let d=document.createElement('div'); d.className='cell'+(sel&&sel[0]===r&&sel[1]===c?' sel':''); d.textContent=board[r][c]; blockGoogle(d); d.addEventListener('pointerdown',function(e){e.preventDefault();clickCell(r,c);},{passive:false}); b.appendChild(d); } }
function clickCell(r,c){ if(locked||moves<=0) return; if(!sel){ sel=[r,c]; render(); return; } let [sr,sc]=sel; if(sr===r&&sc===c){ sel=null; render(); return; } if(Math.abs(sr-r)+Math.abs(sc-c)!==1){ sel=[r,c]; render(); return; }
 let tmp=board[sr][sc]; board[sr][sc]=board[r][c]; board[r][c]=tmp; sel=null;
 let m=findMatches(); if(m.length===0){ let t2=board[sr][sc]; board[sr][sc]=board[r][c]; board[r][c]=t2; playBad(); document.getElementById('feedback').textContent='لا يوجد 3 مثل بعض - جرب مرة أخرى'; render(); return; }
 moves--; document.getElementById('moves').textContent=moves; resolveMatches();
}
function findMatches(){ let set=new Set(); for(let r=0;r<8;r++) for(let c=0;c<6;c++){ if(board[r][c]&&board[r][c]===board[r][c+1]&&board[r][c]===board[r][c+2]){ set.add(r+'-'+c); set.add(r+'-'+(c+1)); set.add(r+'-'+(c+2)); } } for(let c=0;c<8;c++) for(let r=0;r<6;r++){ if(board[r][c]&&board[r][c]===board[r+1][c]&&board[r][c]===board[r+2][c]){ set.add(r+'-'+c); set.add((r+1)+'-'+c); set.add((r+2)+'-'+c); } } return [...set]; }
async function resolveMatches(){ locked=true; let total=0; while(true){ let m=findMatches(); if(m.length===0) break; playOk(); total+=m.length;
 document.querySelectorAll('.cell').forEach((el,i)=>{ let r=Math.floor(i/8), c=i%8; if(m.includes(r+'-'+c)) el.classList.add('pop'); });
 await new Promise(r=>setTimeout(r,300));
 m.forEach(k=>{ let [r,c]=k.split('-').map(Number); board[r][c]=null; });
 score+=m.length*10; document.getElementById('score').textContent=score; if(score>best){ best=score; localStorage.setItem('candyBest',best); document.getElementById('best').textContent=best; }
 document.getElementById('feedback').textContent='أحسنت! +'+(m.length*10)+' 🍬';
 for(let c=0;c<8;c++){ let col=[]; for(let r=7;r>=0;r--) if(board[r][c]) col.push(board[r][c]); for(let r=7;r>=0;r--){ board[r][c]=col[7-r]||CANDIES[Math.floor(Math.random()*6)]; } }
 render(); await new Promise(r=>setTimeout(r,250));
 }
 locked=false; render();
 if(moves<=0){ playAhmedVoice('kesebt'); document.getElementById('feedback').textContent='انتهت اللعبة! نتيجتك: '+score+' 🍬'; }
 else if(total>0) document.getElementById('feedback').textContent='🍬 أكمل! تبقى '+moves+' حركة';
}
function shuffleBoard(){ if(locked) return; buildBoard(); render(); document.getElementById('feedback').textContent='تم الخلط! هيا أكمل'; }
function onShuffle(e){ if(e) e.preventDefault(); shuffleBoard(); }
function onNew(e){ if(e) e.preventDefault(); newGame(); }
shuffleBtn.addEventListener('click', onShuffle); shuffleBtn.addEventListener('pointerdown', onShuffle, {passive:false}); shuffleBtn.addEventListener('touchstart', onShuffle, {passive:false});
newBtn.addEventListener('click', onNew); newBtn.addEventListener('pointerdown', onNew, {passive:false}); newBtn.addEventListener('touchstart', onNew, {passive:false});
soundBtn.addEventListener('pointerdown',function(e){ e.preventDefault(); soundOn=!soundOn; this.textContent=soundOn?'الصوت: يعمل':'الصوت: متوقف'; if(soundOn) playAhmedVoice('ahla'); },{passive:false});
newGame();
</script>
</body></html>
