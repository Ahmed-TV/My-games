<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ahmed TV - لعبة الحلوى</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#FF6B6B,#FFD93D,#6BCB77,#4D96FF,#9B5DE5);height:100vh;height:100dvh;display:flex;justify-content:center;padding:4px 8px;overflow:hidden}
.game{width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF9C4,#FFECB3,#E1BEE7,#BBDEFB);border:4px solid #7B1FA2;border-radius:50px 50px 20px 20px;padding:8px;overflow:hidden;position:relative;box-shadow:0 0 0 6px #fff, 0 0 0 9px #7B1FA2, 0 10px 30px rgba(0,0,0,.25)}
header{padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.logo-img{width:72px;height:72px;border-radius:50%;border:3px solid #D32F2F;object-fit:cover;background:#fff;margin-bottom:4px}
.brand{font-size:22px;font-weight:900;color:#B71C1C}
.names{font-size:13px;font-weight:700;color:#D32F2F}
.stats{display:flex;gap:6px;width:100%;margin:6px 0}
.stat{flex:1;background:#fff;border:2px solid #D32F2F;border-radius:12px;padding:6px 2px;text-align:center}
.stat b{display:block;font-size:16px;color:#B71C1C}
.stat span{font-size:11px;font-weight:800;color:#666}
.board{background:#fff;border:2px solid #EF9A9A;border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;flex-shrink:0}
.cell{aspect-ratio:1;border-radius:10px;background:#FFF3E0;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border:2px solid transparent}
.cell.sel{border-color:#D32F2F;background:#FFEBEE;transform:scale(1.1)}
.cell.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.feedback{height:20px;font-size:13px;font-weight:800;color:#B71C1C;text-align:center;margin:6px 0}
.btn-row{display:flex;gap:7px;flex-shrink:0;position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);padding:6px 8px;border-top:2px dashed #7B1FA2}
.mainbtn{flex:2;font-family:inherit;font-weight:800;border:0;border-radius:20px;padding:11px 10px;background:#D32F2F;color:#fff;cursor:pointer;font-size:13px}
.skipbtn{flex:1;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:11px 6px;background:#fff;color:#B71C1C;cursor:pointer;font-size:13px}
footer{text-align:center;color:#D32F2F;font-size:11px;margin-top:4px}
footer a{color:#D32F2F;text-decoration:none;font-weight:700}
</style></head>
<body><div class="game">
<header><img src="../../logo.png" alt="Ahmed TV" class="logo-img"><div class="brand">🍬 لعبة الحلوى 🍬</div><div class="names">أحمد عبدالعزيز • Ahmed TV</div><button id="soundBtn" style="margin:5px auto 0 auto;display:block;font-family:inherit;font-weight:800;border:2px solid #D32F2F;border-radius:20px;padding:6px 18px;background:#fff;color:#B71C1C;cursor:pointer;font-size:12px">🔊 الصوت: شغال</button></header>
<div style="flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:62px;position:relative">
<div class="stats"><div class="stat"><b id="score">0</b><span>النقط</span></div><div class="stat"><b id="moves">30</b><span>حركة</span></div><div class="stat"><b id="best">0</b><span>أحسن نتيجة</span></div></div>
<div class="board" id="board"></div>
<div class="feedback" id="feedback">🍬 دوس على حلوى وبعدين اللي جنبها عشان تبدلهم!</div>
<div class="btn-row"><button class="skipbtn" onclick="shuffleBoard()">🔀 لخبط</button><button class="mainbtn" onclick="newGame()">لعبة جديدة 🔄</button></div>
</div>
<footer><a href="../../index.html">Ahmed TV - كل ألعابي</a></footer></div>
<script>
const CANDIES=["🍬","🍭","🍫","🍩","🍒","🍓","🍇","🍊"];
let board=[], score=0, moves=30, sel=null, locked=false, soundOn=true, audioCtx=null, best=+(localStorage.getItem('candyBest')||0);
document.getElementById('best').textContent=best;
function getCtx(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
document.addEventListener('pointerdown',()=>getCtx());
function tone(f,d=0.15,v=0.2,t='triangle',delay=0){ if(!soundOn) return; const ctx=getCtx(); if(!ctx) return; try{ const t0=ctx.currentTime+delay; const o=ctx.createOscillator(), g=ctx.createGain(); o.type=t; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+0.02); g.gain.exponentialRampToValueAtTime(0.001,t0+d); o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+d+0.05);}catch(e){} }
function playOk(){ tone(523,.12,.25,'triangle',0); tone(659,.12,.25,'triangle',.1); tone(784,.3,.25,'triangle',.2); }
function playBad(){ tone(200,.2,.2,'square',0); }
function newGame(){ score=0; moves=30; sel=null; locked=false; document.getElementById('score').textContent=0; document.getElementById('moves').textContent=30; document.getElementById('feedback').textContent='🍬 يلا! وصل 3 زي بعض'; buildBoard(); render(); }
function buildBoard(){ board=[]; for(let r=0;r<8;r++){ board[r]=[]; for(let c=0;c<8;c++){ let v; do{ v=CANDIES[Math.floor(Math.random()*6)]; }while((c>=2&&board[r][c-1]===v&&board[r][c-2]===v)||(r>=2&&board[r-1][c]===v&&board[r-2][c]===v)); board[r][c]=v; } } }
function render(){ const b=document.getElementById('board'); b.innerHTML=''; for(let r=0;r<8;r++) for(let c=0;c<8;c++){ let d=document.createElement('div'); d.className='cell'+(sel&&sel[0]===r&&sel[1]===c?' sel':''); d.textContent=board[r][c]; d.onclick=()=>clickCell(r,c); b.appendChild(d); } }
function clickCell(r,c){ if(locked||moves<=0) return; getCtx(); if(!sel){ sel=[r,c]; render(); return; } let [sr,sc]=sel; if(sr===r&&sc===c){ sel=null; render(); return; } if(Math.abs(sr-r)+Math.abs(sc-c)!==1){ sel=[r,c]; render(); return; }
 let tmp=board[sr][sc]; board[sr][sc]=board[r][c]; board[r][c]=tmp; sel=null;
 let m=findMatches(); if(m.length===0){ let t2=board[sr][sc]; board[sr][sc]=board[r][c]; board[r][c]=t2; playBad(); document.getElementById('feedback').textContent='❌ مفيش 3 زي بعض - جرب تاني'; render(); return; }
 moves--; document.getElementById('moves').textContent=moves; resolveMatches();
}
function findMatches(){ let set=new Set(); for(let r=0;r<8;r++) for(let c=0;c<6;c++){ if(board[r][c]&&board[r][c]===board[r][c+1]&&board[r][c]===board[r][c+2]){ set.add(r+'-'+c); set.add(r+'-'+(c+1)); set.add(r+'-'+(c+2)); } } for(let c=0;c<8;c++) for(let r=0;r<6;r++){ if(board[r][c]&&board[r][c]===board[r+1][c]&&board[r][c]===board[r+2][c]){ set.add(r+'-'+c); set.add((r+1)+'-'+c); set.add((r+2)+'-'+c); } } return [...set]; }
async function resolveMatches(){ locked=true; let total=0; while(true){ let m=findMatches(); if(m.length===0) break; playOk(); total+=m.length;
 document.querySelectorAll('.cell').forEach((el,i)=>{ let r=Math.floor(i/8), c=i%8; if(m.includes(r+'-'+c)) el.classList.add('pop'); });
 await new Promise(r=>setTimeout(r,300));
 m.forEach(k=>{ let [r,c]=k.split('-').map(Number); board[r][c]=null; });
 score+=m.length*10; document.getElementById('score').textContent=score; if(score>best){ best=score; localStorage.setItem('candyBest',best); document.getElementById('best').textContent=best; }
 document.getElementById('feedback').textContent='✅ برافو! +'+(m.length*10)+' 🍬';
 for(let c=0;c<8;c++){ let col=[]; for(let r=7;r>=0;r--) if(board[r][c]) col.push(board[r][c]); for(let r=7;r>=0;r--){ board[r][c]=col[7-r]||CANDIES[Math.floor(Math.random()*6)]; } }
 render(); await new Promise(r=>setTimeout(r,250));
 }
 locked=false; render();
 if(moves<=0){ document.getElementById('feedback').textContent='🏆 خلصت! نتيجتك: '+score+' 🍬'; }
 else if(total>0) document.getElementById('feedback').textContent='🍬 كمل! فاضل '+moves+' حركة';
}
function shuffleBoard(){ if(locked) return; let flat=board.flat(); flat.sort(()=>Math.random()-.5); for(let r=0;r<8;r++) for(let c=0;c<8;c++) board[r][c]=flat[r*8+c]; buildBoard(); render(); document.getElementById('feedback').textContent='🔀 اتلخبطت! يلا كمل'; }
document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊 الصوت: شغال':'🔇 الصوت: مطفي'; if(soundOn) getCtx(); };
newGame();
</script><a id="waBtn" href="https://wa.me/201551668092?text=أهلا%20Ahmed%20TV%20عايز%20ألعب" target="_blank" style="position:fixed;top:20px;left:20px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;touch-action:none;cursor:grab;">
<span style="width:58px;height:58px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);pointer-events:none;">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" style="width:36px;height:36px;pointer-events:none;" alt="واتساب">
</span>
<span style="color:#fff;font-family:Tahoma,Arial;font-size:14px;font-weight:bold;white-space:nowrap;text-shadow:1px 1px 3px #000;pointer-events:none;">كلمنا واتساب</span>
</a>

<script>
var wa = document.getElementById('waBtn');
var dragging = false, startX=0, startY=0, startLeft=0, startTop=0, moved=false;
function startDrag(x,y){ dragging=true; moved=false; startX=x; startY=y; startLeft=wa.offsetLeft; startTop=wa.offsetTop; }
function moveDrag(x,y){ if(!dragging) return; var dx=x-startX, dy=y-startY; if(Math.abs(dx)>5||Math.abs(dy)>5){ moved=true; } if(moved){ wa.style.left=(startLeft+dx)+'px'; wa.style.top=(startTop+dy)+'px'; wa.style.right='auto'; wa.style.bottom='auto'; } }
function endDrag(){ if(moved){ setTimeout(function(){moved=false},50); } dragging=false; }
wa.addEventListener('mousedown',function(e){ startDrag(e.clientX,e.clientY); });
document.addEventListener('mousemove',function(e){ moveDrag(e.clientX,e.clientY); });
document.addEventListener('mouseup',function(){ endDrag(); });
wa.addEventListener('touchstart',function(e){ startDrag(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
document.addEventListener('touchmove',function(e){ if(dragging){ moveDrag(e.touches[0].clientX,e.touches[0].clientY); } },{passive:true});
document.addEventListener('touchend',function(){ endDrag(); });
wa.addEventListener('click',function(e){ if(moved){ e.preventDefault(); } });
</script>
</body></html>
