<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>كون الكلمة | Ahmed TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%!important;height:100svh!important;max-height:100svh!important;overflow:hidden!important;overscroll-behavior:none}
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 8px;touch-action:manipulation}
.header{width:100%;max-width:500px;text-align:center;flex-shrink:0}
.top-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px}
.logo-wrap{width:52px;height:52px;flex-shrink:0;border-radius:50%;overflow:hidden;border:3px solid #facc15;background:#000}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:22px;color:#facc15;line-height:1.2}
h1 small{display:block;font-size:11px;color:#fff;letter-spacing:1px;margin-top:2px}
.names{font-size:13px;color:#cbd5e1;font-weight:bold;margin-bottom:4px}
.names b{color:#facc15;font-size:15px}
.score{display:flex;gap:10px;justify-content:center;margin:3px 0 6px}
.stat{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:4px 14px;min-width:85px;text-align:center}
.stat b{display:block;font-size:18px;color:#facc15}
.stat span{font-size:10px;color:#94a3b8}
#game{width:100%;max-width:500px;flex:1;min-height:0;background:#1e293b;border:4px solid #f59e0b;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
#hint{font-size:14px;color:#facc15;font-weight:900;background:#0f172a;padding:6px 14px;border-radius:20px}
#answer{font-size:30px;font-weight:900;min-height:48px;background:#fff;color:#0f172a;border-radius:12px;padding:8px 14px;width:100%;text-align:center;letter-spacing:2px}
#letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.letter{background:#f59e0b;color:#000;border:none;border-radius:12px;font-size:24px;font-weight:900;width:52px;height:52px;cursor:pointer}
.letter:disabled{opacity:.25}
.letter:active{transform:scale(.92)}
.btn{background:#f59e0b;color:#000;border:none;padding:12px 22px;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;width:80%;max-width:240px}
.btn2{background:#334155;color:#fff}
.btn:active{transform:scale(.95)}
#msg{font-size:16px;font-weight:900;min-height:24px;text-align:center;color:#facc15}
#overlay{position:absolute;inset:0;background:rgba(15,23,42,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;gap:10px;z-index:10}
#overlay h2{font-size:24px;color:#facc15}
#overlay p{font-size:14px;line-height:1.7;color:#e2e8f0}
.footer{font-size:10px;color:#94a3b8;text-align:center;margin-top:4px;flex-shrink:0}
.footer a{color:#facc15;text-decoration:none}
</style>
</head>
<body>
<div class="header">
<div class="top-row">
<div class="logo-wrap"><img src="../../logo.png" alt="أحمد عبدالعزيز"></div>
<h1>كون الكلمة<small>AHMED TV WORDS</small></h1>
</div>
<div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div>
<div class="score">
<div class="stat"><b id="score">0</b><span>النقط</span></div>
<div class="stat"><b id="roundEl">كلمة 1</b><span>الكلمة</span></div>
<div class="stat"><b id="lives">❤️❤️❤️</b><span>المحاولات</span></div>
</div>
</div>
<div id="game">
<div id="overlay">
<h2>كون الكلمة ✍️</h2>
<p><b>Ahmed TV</b> - رتب الحروف وكون الكلمة الصح!<br>عندك أكتر من <b style="color:#facc15">170 كلمة</b> - مصر، كورة، حيوانات، أكل، مهن وأكتر!<br>ليك 3 محاولات غلط بس!</p>
<button class="btn" id="startBtn">▶ ابدأ اللعب</button>
</div>
<div id="hint">💡 رتب الحروف</div>
<div id="answer">؟</div>
<div id="letters"></div>
<div id="msg">دوس على الحروف بالترتيب الصح!</div>
<div style="display:flex;gap:8px;width:100%;justify-content:center">
<button class="btn btn2" id="clearBtn" style="width:45%">🗑️ امسح</button>
<button class="btn" id="checkBtn" style="width:45%">✅ اتأكد</button>
</div>
<button class="btn btn2" id="skipBtn">⏭️ كلمة تانية</button>
</div>
<div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a></div>
<script>
var WORDS = ["أحمد", "مصر", "القاهرة", "الأهلي", "الزمالك", "كرة", "ملعب", "هدف", "حارس", "مدرب", "جمهور", "كأس", "دوري", "نصر", "فوز", "بطل", "مدرسة", "معلم", "كتاب", "قلم", "باب", "بيت", "شارع", "مدينة", "قرية", "نهر", "بحر", "سماء", "شمس", "قمر", "نجمة", "ليل", "نهار", "صباح", "مساء", "وردة", "شجرة", "تفاح", "موز", "عنب", "برتقال", "مانجو", "ليمون", "خبز", "لبن", "جبن", "عسل", "سكر", "ملح", "ماء", "طعام", "فطور", "غداء", "عشاء", "قطة", "كلب", "أسد", "نمر", "فيل", "حصان", "جمل", "بقرة", "دجاجة", "عصفور", "سمكة", "فراشة", "نحلة", "أرنب", "قرد", "ثعلب", "ذئب", "دب", "غزال", "طبيب", "مهندس", "طيار", "شرطي", "جندي", "فلاح", "عامل", "تاجر", "طباخ", "رسام", "مغني", "لاعب", "صحفي", "محامي", "قاضي", "ممرض", "سائق", "خباز", "نجار", "حداد", "خياط", "مزارع", "صياد", "مطعم", "مستشفى", "مسجد", "كنيسة", "متحف", "سينما", "مسرح", "حديقة", "سوق", "مطار", "قطار", "طائرة", "سيارة", "دراجة", "سفينة", "قارب", "هاتف", "حاسوب", "تلفاز", "راديو", "كاميرا", "ساعة", "نظارة", "حقيبة", "حذاء", "قميص", "بنطلون", "فستان", "قبعة", "مفتاح", "شباك", "كرسي", "طاولة", "سرير", "مصباح", "مرآة", "صورة", "لعبة", "دمية", "مكعب", "بالون", "طباشير", "دفتر", "ممحاة", "مسطرة", "ألوان", "فرشاة", "ورق", "مقص", "لاصق", "خيط", "إبرة", "زر", "سحاب", "حبل", "سلسلة", "خاتم", "قلادة", "سوار", "تاج", "علم", "خريطة", "بوصلة", "منظار", "مظلة", "مروحة", "ثلاجة", "غسالة", "مكواة", "مكنسة", "فرن", "قدر", "صحن", "كوب", "ملعقة", "شوكة", "سكين", "منشفة", "صابون", "شامبو", "معجون", "عطر", "كريم", "شمعة", "ولاعة", "بطارية", "شاحن", "سماعة", "مكبر", "ميكروفون", "قصة", "رواية", "شعر", "مسرحية", "أغنية", "رقصة", "فيلم", "مسلسل", "برنامج", "إذاعة", "جريدة", "مجلة", "رسالة", "ظرف", "طابع", "ختم", "توقيع", "عقد", "فاتورة", "نقود", "دينار", "درهم", "ريال", "جنيه", "دولار", "يورو", "ذهب", "فضة", "حديد", "نحاس", "خشب", "حجر", "رمل", "طين", "زجاج", "بلاستيك", "قماش", "جلد", "صوف", "قطن", "حرير"];
var used=[],current='',answer='',score=0,lives=3,roundNum=1;
var scoreEl=document.getElementById('score'),roundEl=document.getElementById('roundEl'),livesEl=document.getElementById('lives'),hintEl=document.getElementById('hint'),answerEl=document.getElementById('answer'),lettersEl=document.getElementById('letters'),msgEl=document.getElementById('msg'),overlay=document.getElementById('overlay');
var soundOn=true,_ahmedAudio=null,_ahlaPlayed=false;
function getAhmedAudio(){if(!_ahmedAudio){_ahmedAudio=new Audio();_ahmedAudio.preload='auto';}return _ahmedAudio;}
function playAhmedVoice(n){try{if(!soundOn)return;var a=getAhmedAudio();try{a.pause();}catch(e){}a.src='../../sounds/'+n+'.mp3';a.currentTime=0;a.volume=1;var p=a.play();if(p)p.catch(function(){});}catch(e){}}
document.addEventListener('click',function(){if(!_ahlaPlayed){_ahlaPlayed=true;playAhmedVoice('ahla');}});
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickWord(){
if(used.length>=WORDS.length)used=[];
var w;do{w=WORDS[Math.floor(Math.random()*WORDS.length)];}while(used.indexOf(w)!==-1);
used.push(w);return w;
}
function newWord(){
current=pickWord();answer='';
answerEl.textContent='؟';msgEl.textContent='دوس على الحروف بالترتيب الصح!';
var letters=shuffle(current.split(''));
lettersEl.innerHTML='';
letters.forEach(function(ch){
var b=document.createElement('button');b.className='letter';b.textContent=ch;
b.onclick=function(){if(b.disabled)return;answer+=ch;answerEl.textContent=answer;b.disabled=true;};
lettersEl.appendChild(b);
});
hintEl.textContent='💡 الكلمة فيها '+current.length+' حروف - أول حرف: '+current[0];
roundEl.textContent='كلمة '+roundNum;
}
function updateLives(){livesEl.textContent='❤️'.repeat(Math.max(0,lives));}
function check(){
if(!answer){msgEl.textContent='⚠️ كون الكلمة الأول!';playAhmedVoice('hawel');return;}
if(answer===current){
score+=10;scoreEl.textContent=score;msgEl.textContent='✅ صح! برافو!';playAhmedVoice('sah');
setTimeout(function(){roundNum++;newWord();},900);
}else{
lives--;updateLives();msgEl.textContent='❌ غلط! حاول تاني - الكلمة مش دي';playAhmedVoice('ghalat');
answer='';answerEl.textContent='؟';
var btns=lettersEl.querySelectorAll('.letter');btns.forEach(function(b){b.disabled=false;});
if(lives<=0){endGame();}
}
}
function endGame(){
playAhmedVoice('khesert');
overlay.style.display='flex';
overlay.innerHTML='<div style="font-size:40px">💔</div><h2>خلصت المحاولات!</h2><p>جبت <b style="color:#facc15;font-size:22px">'+score+'</b> نقطة<br>ووصلت للكلمة رقم <b style="color:#facc15">'+roundNum+'</b><br>الكلمة الصح كانت: <b style="color:#facc15">'+current+'</b></p><button class="btn" id="againBtn">🔄 العب تاني</button>';
document.getElementById('againBtn').onclick=startGame;
}
function startGame(){
playAhmedVoice('ebda');
score=0;lives=3;roundNum=1;used=[];
scoreEl.textContent='0';updateLives();
overlay.style.display='none';newWord();
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('checkBtn').onclick=check;
document.getElementById('clearBtn').onclick=function(){answer='';answerEl.textContent='؟';var btns=lettersEl.querySelectorAll('.letter');btns.forEach(function(b){b.disabled=false;});};
document.getElementById('skipBtn').onclick=function(){playAhmedVoice('hawel');roundNum++;newWord();};
</script>
</body>
</html>
