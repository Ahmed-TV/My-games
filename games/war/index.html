<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لعبة حرب | Ahmed TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select:none!important; user-select:none!important; -moz-user-select:none!important; -ms-user-select:none!important; -webkit-touch-callout:none!important; touch-action:manipulation; }
  html, body { height: 100%!important; height: 100svh!important; max-height: 100svh!important; overflow: hidden!important; width: 100%; }
  body { font-family: Tahoma, Arial, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top, 5px) 5px env(safe-area-inset-bottom, 5px) 5px; height:100svh!important; overflow:hidden!important; }
  .header { width: 100%; max-width: 600px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; padding-bottom: 5px;}
  .logo-img { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #facc15; object-fit: cover; box-shadow: 0 0 10px rgba(250,204,21,0.5);}
  .header-text { text-align: right; }
  .header-text h1 { font-size: 18px; color: #facc15; margin: 0;}
  .header-text .names { font-size: 11px; color: #cbd5e1; font-weight: bold; margin-top: 2px;}
  .header-text .names b { color: #facc15; font-size: 13px;}
  .stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px; flex-shrink:0;}
  .stat { background: #1e293b; border-radius: 6px; padding: 2px 15px; min-width: 80px; text-align: center; border: 1px solid #334155;}
  .stat b { display: block; font-size: 18px; color: #facc15; }
  .stat span { font-size: 10px; color: #94a3b8; }
  #game-container { width: 100%; max-width: 600px; flex:1; min-height: 0; position: relative; display: flex; flex-direction: column; background: #1e293b; border: 3px solid #f59e0b; border-radius: 12px; overflow: hidden; padding: 5px; }
  .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: rgba(255, 255, 255, 0.1); font-size: 40px; font-weight: 900; pointer-events: none; z-index: 0; white-space: nowrap; letter-spacing: 2px; }
  canvas { width: 100%; flex:1; display: block; z-index: 1; min-height: 0; border-radius: 8px; background: #0f172a; touch-action: none; cursor: crosshair; }
  #overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 15px; gap: 10px; z-index: 10; }
  #overlay h2 { font-size: 24px; margin-bottom: 5px; color: #facc15;}
  #overlay p { line-height: 1.6; font-size: 14px; color: #e2e8f0; margin-bottom: 10px;}
  .btn-start { background: #ef4444; color: #fff; border: none; padding: 12px 25px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; width: 80%; max-width: 200px; box-shadow: 0 4px 0 #b91c1c; }
  .btn-start:active { transform: translateY(4px); box-shadow: 0 0 0 #b91c1c; }
  .footer { font-size: 8px; color: #94a3b8; text-align: center; flex-shrink: 0; margin-top: 2px;}
  .footer a { color: #facc15; text-decoration: none; }
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false" onmousedown="return false">
  <div class="header">
    <img src="../../logo.png" alt="Ahmed TV Logo" class="logo-img">
    <div class="header-text"><h1>لعبة حرب</h1><div class="names">أحمد عبدالعزيز • <b>Ahmed TV</b></div></div>
  </div>
  <div class="stats"><div class="stat"><b id="score">0</b><span>النقاط</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div></div>
  <div id="game-container">
    <div class="watermark">Ahmed TV</div>
    <canvas id="gameCanvas"></canvas>
    <div id="overlay"><h2>⚔️ لعبة حرب</h2><p><b>Ahmed TV</b> - دمر الأعداء!<br>دوس على الأعداء عشان تفجرهم</p><button class="btn-start" id="startBtn">▶ ابدأ الحرب</button></div>
  </div>
  <div class="footer"><b>Ahmed TV</b> - <a href="../../index.html">⬅ كل ألعابي</a></div>
<script>
// ===== منع بحث جوجل =====
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
document.addEventListener('selectstart',function(e){e.preventDefault();return false;},true);
document.addEventListener('dragstart',function(e){e.preventDefault();return false;},true);
window.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;},true);
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
let W = 0, H = 0;
let running = false;
let score = 0;
let best = parseInt(localStorage.getItem('warBest') || '0');
bestEl.textContent = best;
// ===== صوتك بدل الصفافير =====
let soundOn=true, _audioCache={}, _ahlaPlayed=false;
function _preload(){ ['sah','kesebt','ebda','khesert','ghalat','hawel','ahla'].forEach(function(f){ try{ var a=new Audio(); a.preload='auto'; a.src='../../sounds/'+f+'.mp3'; a.load(); _audioCache[f]=a; }catch(e){} }); }
_preload();
function playAhmedVoice(n){ try{ if(!soundOn) return; var base=_audioCache[n]; var a=base?base.cloneNode():new Audio('../../sounds/'+n+'.mp3'); if(base) a.src=base.src; a.currentTime=0; a.volume=1; var p=a.play(); if(p) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown',function(){ if(!_ahlaPlayed){ _ahlaPlayed=true; playAhmedVoice('ahla'); } });
function playSound(type){ if(type==='explosion'){ playAhmedVoice('sah'); } else if(type==='shoot'){ /* دوسة - من غير صوت كل مرة */ } }
let enemies = [];
let explosions = [];
let animFrame;
let spawnInterval;
let gameSpeed = 1.5;
function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height; W = canvas.width; H = canvas.height;
  if(!running) draw();
}
function spawnEnemy() {
  if (!running) return;
  const size = 40;
  const x = Math.random() * (W - size);
  const types = ['🚁', '✈️', '🚀', '💣', '🛸'];
  const emoji = types[Math.floor(Math.random() * types.length)];
  enemies.push({ x: x, y: -50, size: size, speed: 1 + Math.random() * 2, emoji: emoji });
}
function draw() {
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  for(let i=0; i<30; i++){ ctx.beginPath(); ctx.arc((i*50)%W, (i*80)%H, 2, 0, Math.PI*2); ctx.fill(); }
  enemies.forEach(e => { ctx.font = e.size + 'px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.emoji, e.x + e.size/2, e.y + e.size/2); });
  explosions.forEach(ex => { ctx.font = ex.size + 'px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💥', ex.x, ex.y); });
}
function update() {
  if (!running) return;
  for (let i = enemies.length - 1; i >= 0; i--) { let e = enemies[i]; e.y += e.speed; if (e.y > H) { enemies.splice(i, 1); } }
  for (let i = explosions.length - 1; i >= 0; i--) { explosions[i].size += 5; explosions[i].life--; if (explosions[i].life <= 0) { explosions.splice(i, 1); } }
  draw();
}
function loop() { update(); animFrame = requestAnimationFrame(loop); }
function shoot(x, y) {
  if (!running) return;
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    if (x > e.x && x < e.x + e.size && y > e.y && y < e.y + e.size) {
      enemies.splice(i, 1); explosions.push({ x: x, y: y, size: 40, life: 10 }); score += 10; scoreEl.textContent = score; playSound('explosion'); return;
    }
  }
}
function startGame() {
  playAhmedVoice('ebda');
  overlay.style.display = 'none'; score = 0; scoreEl.textContent = 0; running = true; enemies = []; explosions = [];
  if (spawnInterval) clearInterval(spawnInterval);
  spawnInterval = setInterval(spawnEnemy, 800);
  loop();
}
function endGame() {
  running = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  if (spawnInterval) clearInterval(spawnInterval);
  if (score > best) { best = score; localStorage.setItem('warBest', best); bestEl.textContent = best; }
  playAhmedVoice('kesebt');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div style="font-size:35px">💥</div><h2>انتهت الحرب!</h2><p>دمرت <b style="color:#facc15;font-size:22px">${score} عدو</b><br>أعلى نتيجة: ${best}</p><button class="btn-start" id="againBtn">🔄 العب تاني</button>`;
  var ab=document.getElementById('againBtn'); ab.onclick=startGame; ab.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
}
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); const rect = canvas.getBoundingClientRect(); shoot(e.clientX - rect.left, e.clientY - rect.top); }, { passive: false });
canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); return false; }, true);
startBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startGame(); }, {passive:false});
startBtn.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });
window.addEventListener('resize', () => { resize(); if(!running) draw(); });
resize(); draw();
</script>
</body>
</html>
