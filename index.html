<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed TV - الألعاب</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #fff;
    min-height: 100vh;
    padding: 30px 20px;
    text-align: center;
  }
  
  /* تنسيق اسمك */
  .profile-section {
    margin-bottom: 30px;
  }
  .profile-section h1 {
    font-size: 2.5rem;
    color: #f5a623;
    margin-bottom: 5px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(245, 166, 35, 0.4);
  }
  .profile-section h2 {
    font-size: 1.2rem;
    color: #a0a0b0;
    font-weight: normal;
  }

  /* تنسيق عنوان الموقع */
  .site-header {
    margin-bottom: 40px;
  }
  .site-header h3 {
    font-size: 1.5rem;
    color: #e94560;
  }

  /* تنسيق كروت الألعاب */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 25px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .game-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(233,69,96,0.3);
    border-color: #e94560;
  }
  .game-thumb {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    background: linear-gradient(135deg, #e94560, #0f3460);
  }
  .game-info { padding: 16px; }
  .game-info h4 { font-size: 1.2rem; margin-bottom: 6px; }
  .game-info p { font-size: 0.85rem; color: #a0a0b0; }
  
  footer { text-align: center; margin-top: 50px; color: #666; font-size: 0.85rem; }
</style>
</head>
<body>

  <!-- هنا اسمك -->
  <div class="profile-section">
    <h1>Ahmed TV</h1>
    <h2>أحمد عبدالعزيز</h2>
  </div>

  <!-- عنوان موقعك -->
  <div class="site-header">
    <h3>🎮 أهلاً بك في موقع الألعاب</h3>
  </div>

  <!-- الألعاب -->
  <div class="games-grid">
    
    <!-- لعبة الذاكرة -->
    <a class="game-card" href="games/memory/index.html">
      <div class="game-thumb">🧠</div>
      <div class="game-info">
        <h4>لعبة الذاكرة</h4>
        <p>قلّب الكروت وطابق الأزواج</p>
      </div>
    </a>

    <!-- لعبة الثعبان -->
    <a class="game-card" href="games/snake/index.html">
      <div class="game-thumb">🐍</div>
      <div class="game-info">
        <h4>الثعبان</h4>
        <p>كل التفاح وابعد عن الحيطان</p>
      </div>
    </a>

  <!-- لعبة يويو وحازم -->
<a class="game-card" href="games/yoyo-hazem/index.html">
  <div class="game-thumb">🎮</div>
  <div class="game-info">
    <h4>yoy and hazem</h4>
    <p>لعبة تحدي بين يويو وحازم</p>
  </div>
</a>  <!-- اللعبة الجديدة اللي إنت ضفتها -->
    
     
   

  </div>

  <footer>© 2024 Ahmed TV — جميع الحقوق محفوظة</footer>
</body>
</html>
